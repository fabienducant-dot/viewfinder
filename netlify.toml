[build]
  command = "node scripts/build-sdz-logo-asset.js && node scripts/verify-index-integrity.js"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Sharp contient un module natif : Netlify doit le copier sans l'inliner. Le logo officiel est
# construit UNE FOIS pendant le build puis embarqué tel quel ; aucune segmentation n'est exécutée
# dans les fonctions de production.
[functions."process-image-job-background"]
  external_node_modules = ["sharp", "opentype.js", "@fontsource/cormorant-garamond", "@fontsource/manrope"]
  included_files = [
    "assets/sdz-logo-compositor.png",
    "node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff",
    "node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-ext-600-normal.woff",
    "node_modules/@fontsource/manrope/files/manrope-latin-500-normal.woff",
    "node_modules/@fontsource/manrope/files/manrope-latin-ext-500-normal.woff",
    "node_modules/@fontsource/manrope/files/manrope-latin-600-normal.woff",
    "node_modules/@fontsource/manrope/files/manrope-latin-ext-600-normal.woff"
  ]

[functions."recompose-image-job"]
  external_node_modules = ["sharp", "opentype.js", "@fontsource/cormorant-garamond", "@fontsource/manrope"]
  included_files = [
    "assets/sdz-logo-compositor.png",
    "node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff",
    "node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-ext-600-normal.woff",
    "node_modules/@fontsource/manrope/files/manrope-latin-500-normal.woff",
    "node_modules/@fontsource/manrope/files/manrope-latin-ext-500-normal.woff",
    "node_modules/@fontsource/manrope/files/manrope-latin-600-normal.woff",
    "node_modules/@fontsource/manrope/files/manrope-latin-ext-600-normal.woff"
  ]

[functions."check-scheduled-posts"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/img/*"
  to = "/.netlify/functions/serve-image?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/logo.png"
  to = "/.netlify/functions/serve-logo"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
