[build]
  command = "node scripts/verify-index-integrity.js"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Sharp contient un module natif : Netlify doit le copier sans l'inliner dans l'artefact de la
# Background Function qui réalise la composition exacte du logo et des textes.
[functions."process-image-job-background"]
  external_node_modules = ["sharp", "opentype.js", "@fontsource/cinzel"]

[functions."check-scheduled-posts"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/img/*"
  to = "/.netlify/functions/serve-image?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/logo.png"
  to = "/.netlify/functions/serve-logo"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
