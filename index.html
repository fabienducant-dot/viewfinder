      setPostImageId(id);
      confirmMsg.textContent = logoRequiredFor(platform)
        ? (logoApplied ? "Image importée, logo réel appliqué ✓" : "Image importée — aucun logo marqué comme actif de marque dans la Bibliothèque, rien n'a été ajouté.")
        : "Image ajoutée à ta bibliothèque ✓";
      imgFileInput.value = "";
      renderMain();
    });
    frag.appendChild(imgFileInput);
    frag.appendChild(el("button",{class:"btn-secondary", onclick:()=>imgFileInput.click()}, [svgIcon(ICONS.upload,14), el("span",{},"Importer l'image générée")]));
    frag.appendChild(confirmMsg);


    if(state.textPrompt){
      frag.appendChild(el("h2",{class:"section"}, state.viewMode==="production" ? "Texte à copier dans ChatGPT" : "Prompt texte"));
      frag.appendChild(vfWrap(el("div",{class:"card", style:"margin-bottom:6px;"},[el("pre",{}, state.textPrompt)])));
      frag.appendChild(copyBtnFor(()=>state.textPrompt));

      {
        const availableProviders = state.apiProviders.length ? state.apiProviders : [DEFAULT_OPENAI_PROVIDER];
        const providerSelect = el("select",{style:"margin:8px 0;"}, availableProviders.map(p=> el("option",{value:p.id}, p.label)));
        providerSelect.value = state.selectedProviderId || availableProviders[0].id;
        providerSelect.addEventListener("change", e=>{ state.selectedProviderId = e.target.value; renderMain(); });
        frag.appendChild(providerSelect);

        const apiStatus = el("p",{style:"font-size:12px;color:var(--muted2);min-height:16px;margin:4px 0 8px;"},"");
        const apiBtn = el("button",{class:"btn-secondary", style:"margin-bottom:10px;"}, [svgIcon(ICONS.sparkles,14), el("span",{},"Générer via l'API (remplace le copier/coller)")]);
        apiBtn.addEventListener("click", ()=> runTextApiGeneration(apiStatus));
        frag.appendChild(apiBtn);
        frag.appendChild(apiStatus);
      }

      const pastedArea = el("textarea",{rows:"5", placeholder:"Colle ici la réponse texte de ChatGPT (ou récupère-la automatiquement via l'API ci-dessus)..."}, state.textPasted);
      pastedArea.addEventListener("input", e=>{ state.textPasted = e.target.value; });
      frag.appendChild(el("div",{style:"margin:10px 0;"}, pastedArea));

      frag.appendChild(el("button",{class:"btn-secondary", style:"margin-bottom:10px;", onclick: ()=>{
        sendToAudit({
          platform, missionKey: state.mission, topic: state.topic,
          imagePrompt: state.imagePrompt, textPrompt: state.textPrompt,
          textMods: textModulesFor(platform), imageMods: imageModulesFor(),
          prestation: getSelectedPrestationInfo(), style: getSelectedStyle(),
          antiRepeatTextNote: buildAntiRepeatNote(platform,"texte"), antiRepeatImageNote: buildAntiRepeatNote(platform,"image"),
          textPasted: state.textPasted,
        });
      }}, [svgIcon(ICONS.sparkles,14), el("span",{},"Analyser avec ChatGPT")]));
    } else {
      frag.appendChild(el("p",{class:"sublabel", style:"margin-top:10px;"}, "Aucun texte séparé pour ce format : l'accroche fait partie intégrante de l'image générée ci-dessus."));
    }

  }


  /* ============================================================
     APERÇU + VALIDATION + PUBLICATION — composant UNIQUE, partagé par les deux modes.
     Affiché dès qu'une image est retenue pour le post (state.postImageId, alimenté par
     la génération API du moteur créatif ET par l'import manuel) ou qu'un prompt manuel
     existe (comportement historique du mode manuel conservé). Les deux modes ne diffèrent
     que par la provenance de l'image ; tout l'aval est identique. Ce bloc vivait
     auparavant DANS if(state.imagePrompt) — dépendance historique au mode manuel qui
     rendait l'aperçu inatteignable après une génération API pure.
  ============================================================ */
  const previewImgForPost = state.images.find(i=>i.id===state.postImageId);
  vfTrace("9-previewImgForPost", { postImageId: state.postImageId, trouve: !!previewImgForPost, sectionAffichee: !!(previewImgForPost || state.imagePrompt) });
  if(VF_TRACE){
    frag.appendChild(el("button",{class:"btn-ghost", style:"margin:4px 0 10px;", onclick: async (e)=>{
      const txt = JSON.stringify(window.__VF_TRACE, null, 1);
      try{ await navigator.clipboard.writeText(txt); e.target.textContent = "✓ Trace copiée ("+window.__VF_TRACE.length+" étapes)"; }
      catch(err){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); e.target.textContent = "✓ Trace copiée"; }
    }}, "🧪 Copier la trace d'exécution (diagnostic)"));
  }
  if(previewImgForPost || state.imagePrompt){
  if(previewImgForPost){
    frag.appendChild(el("p",{class:"label", style:"margin-top:14px;"},"Aperçu de l'image retenue pour ce post"));
    frag.appendChild(vfWrap(el("div",{style:"max-width:280px;margin:0 auto 10px;border-radius:12px;overflow:hidden;"},[
      el("img",{src:previewImgForPost.dataUrl, style:"width:100%;display:block;"}),
    ])));

    /* Ne propose jamais une seconde signature sur une image déjà finalisée par Canvas. */
    if(previewImgForPost.logoApplied){
      frag.appendChild(el("p",{style:"font-size:12px;color:var(--green);margin:0 0 10px;text-align:center;"},
        "Signature officielle déjà appliquée ✓"));
    }else{
      const logoMsg = el("p",{style:"font-size:12px;color:var(--green);min-height:16px;margin:0 0 10px;text-align:center;"},"");
      frag.appendChild(el("button",{class:"btn-secondary", style:"margin-bottom:10px;", onclick: async ()=>{
        logoMsg.style.color = "var(--muted2)"; logoMsg.textContent = "Ajout du logo en cours...";
        try{
          const composited = await compositeBrandSignature(previewImgForPost.dataUrl, platform, {
            withLogo:true, headline:"", brief:previewImgForPost.creativeBrief||null
          });
          if(!composited.applied || (composited.layoutReport&&composited.layoutReport.blockingError)){
            throw new Error(composited.layoutReport&&composited.layoutReport.blockingError || "Signature officielle indisponible");
          }
          const newDataUrl = composited.dataUrl;
          const id = uid();
          state.images.push({ id, name:`${previewImgForPost.name.replace(/\.png$/,"")}-logo.png`, dataUrl:newDataUrl,
            tags:[platform,"logo-ajouté"], favorite:false, logoApplied:true, layoutReport:composited.layoutReport||null });
          LS.set("vf-images", state.images);
          updateCount();
          setPostImageId(id);
          logoMsg.style.color = "var(--green)"; logoMsg.textContent = "Logo ajouté ✓ — nouvelle image créée dans la bibliothèque.";
          renderMain();
        }catch(err){
          logoMsg.style.color = "var(--coral)"; logoMsg.textContent = `Échec (${err.message||err}).`;
        }
      }}, [svgIcon(ICONS.sparkles,14), el("span",{},"Ajouter mon logo sur cette image")]));
      frag.appendChild(logoMsg);
      frag.appendChild(el("p",{style:"font-size:11px;color:var(--muted2);margin:-4px 0 10px;text-align:center;"},
        "Canvas choisit automatiquement une zone calme et sûre. Une nouvelle image est créée ; l'originale reste intacte."));
    }
  }

  const dlBtnHost = el("div",{style:"text-align:center;margin:-2px 0 10px;"});
  if(previewImgForPost){
    dlBtnHost.appendChild(el("button",{class:"btn-ghost", onclick:()=>{
      const link = document.createElement("a");
      link.href = previewImgForPost.dataUrl; link.download = previewImgForPost.name || "image.png";
      link.click();
    }}, [svgIcon(ICONS.download,13), el("span",{},"Télécharger l'image")]));
  }
  frag.appendChild(dlBtnHost);
  /* Prompt réellement associé à l'image analysée, résolu de façon déterministe et durable :
     une image générée par l'API possède TOUJOURS son entrée dans state.imageHistory (promptImage,
     imageId — persisté), une image importée manuellement n'en a jamais -> state.imagePrompt.
     Jamais un ancien prompt manuel attaché à une image API, même après rechargement. */
  const feedbackImagePrompt = (previewImgForPost && (state.imageHistory||[]).find(e=> e.imageId===previewImgForPost.id)?.promptImage) || state.imagePrompt;
  frag.appendChild(buildFeedbackBlock({
    platform, topic: state.topic, imagePrompt: feedbackImagePrompt, textPrompt: state.textPrompt,
    getTextResult: ()=>state.textPasted,
    hasImage: !!previewImgForPost, logoApplied: !!(previewImgForPost && previewImgForPost.logoApplied),
    prestationName: (state.prestationName && state.prestationName!=="Tous sujets") ? state.prestationName : null, missionKey: state.mission,
    schedulable: platform !== "Article Blog Wix" && platform !== "Story",
  }));

  const isSchedulable = platform !== "Article Blog Wix" && platform !== "Story";
  const requiresTextForSchedule = !!state.textPrompt;
  const contentReady = previewImgForPost && (!requiresTextForSchedule || state.textPasted.trim());
  if(contentReady){
    if(isSchedulable){
      frag.appendChild(el("h2",{class:"section"},"Programmer la publication"));
      frag.appendChild(el("p",{class:"sublabel"},"Texte et image validés ? Choisis une date et une heure — Make ne sera déclenché qu'à ce moment précis, jamais avant."));
      const dateInput = el("input",{type:"datetime-local", value: state.scheduleDate || "", style:"width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:10px;"});
      dateInput.addEventListener("input", e=>{ state.scheduleDate = e.target.value; });
      frag.appendChild(dateInput);
      const schedMsg = el("p",{style:"font-size:12px;color:var(--green);min-height:16px;"},"");
      frag.appendChild(el("button",{class:"btn-primary", style:"margin-bottom:10px;", onclick: async ()=>{
       try{
        if(!state.scheduleDate){ schedMsg.style.color="var(--coral)"; schedMsg.textContent="Choisis une date et une heure d'abord."; return; }
        if(!previewImgForPost || !previewImgForPost.dataUrl){ schedMsg.style.color="var(--coral)"; schedMsg.textContent="Erreur : aucune image valide sélectionnée pour ce post."; return; }
        const scheduledAt = new Date(state.scheduleDate).getTime();
        if(isNaN(scheduledAt)){ schedMsg.style.color="var(--coral)"; schedMsg.textContent="Date invalide, réessaie."; return; }
        const newPost = {
          id: uid(), platform, mission: state.mission, topic: state.topic,
          textFinal: state.textPasted, altText: state.pendingAltText || null, imageDataUrl: previewImgForPost.dataUrl, schedulable: true,
          scheduledAt, status: "programmé", createdAt: Date.now(), sentAt: null, error: null,
        };
        state.scheduled.push(newPost);
        const savedLocally = LS.set("vf-scheduled", state.scheduled);
        if(!savedLocally){
          state.scheduled.pop(); // annule l'ajout en mémoire : rien n'a réellement été enregistré
          schedMsg.style.color = "var(--coral)";
          schedMsg.textContent = "Échec : stockage du téléphone plein (trop de photos enregistrées). Supprime d'anciens posts envoyés ou des images de la bibliothèque, puis réessaie.";
          renderMain();
          return;
        }
        state.scheduleDate = "";
        schedMsg.style.color = "var(--muted2)";
        schedMsg.textContent = "Post programmé — synchronisation avec le serveur...";
        const ok = await pushToServerSilent();
        if(ok){
          schedMsg.style.color = "var(--green)";
          schedMsg.textContent = "Post programmé ✓ — envoyé au serveur, visible dans l'onglet Calendrier.";
        } else {
          schedMsg.style.color = "var(--coral)";
          schedMsg.textContent = "Post programmé localement, mais la synchro serveur a échoué — va dans Réglages → \"Sauvegarder sur serveur\" avant de fermer l'appli.";
        }
       }catch(e){
          schedMsg.style.color = "var(--coral)";
          schedMsg.textContent = "Erreur inattendue : " + String(e && e.message || e);
       }
      }}, [svgIcon(ICONS.sparkles,16), el("span",{},"Programmer ce post")]));
      frag.appendChild(el("button",{class:"btn-ghost", style:"margin-bottom:10px;", onclick:()=>{
        state.scheduled.push({
          id: uid(), platform, mission: state.mission, topic: state.topic,
          textFinal: state.textPasted, altText: state.pendingAltText || null, imageDataUrl: previewImgForPost.dataUrl, schedulable: true,
          scheduledAt: null, status: "brouillon", createdAt: Date.now(), sentAt: null, error: null,
        });
        LS.set("vf-scheduled", state.scheduled);
        schedMsg.style.color = "var(--green)";
        schedMsg.textContent = "Enregistré comme brouillon ✓ — tu pourras lui donner une date plus tard.";
      }}, "Enregistrer comme brouillon (sans date pour l'instant)"));
      frag.appendChild(schedMsg);
    } else {
      frag.appendChild(el("h2",{class:"section"},"Publication manuelle"));
      const manualHint = platform==="Story"
        ? "Story non automatisable via Make — télécharge l'image et publie-la toi-même en story sur Instagram et/ou Facebook."
        : `${platform} n'est pas automatisable via Make — copie le texte (s'il y en a) et télécharge l'image, puis publie-les toi-même.`;
      frag.appendChild(el("p",{class:"sublabel"}, manualHint));
      const manualMsg = el("p",{style:"font-size:12px;color:var(--green);min-height:16px;"},"");
      if(requiresTextForSchedule) frag.appendChild(copyBtnFor(()=>state.textPasted));
      frag.appendChild(el("button",{class:"btn-secondary", style:"margin:6px 0;", onclick:()=>{
        const link = document.createElement("a");
        link.download = `${platform.toLowerCase().replace(/\s+/g,"-")}-${uid()}.jpg`;
        link.href = previewImgForPost.dataUrl;
        link.click();
      }}, [svgIcon(ICONS.download,14), el("span",{},"Télécharger l'image")]));
      frag.appendChild(el("button",{class:"btn-ghost", style:"margin:6px 0;display:block;", onclick:()=>{
        state.scheduled.push({
          id: uid(), platform, mission: state.mission, topic: state.topic,
          textFinal: state.textPasted, altText: state.pendingAltText || null, imageDataUrl: previewImgForPost.dataUrl, schedulable: false,
          scheduledAt: null, status: "validé", createdAt: Date.now(), sentAt: null, error: null,
        });
        LS.set("vf-scheduled", state.scheduled);
        manualMsg.textContent = "Archivé dans le Calendrier ✓ (statut Validé, pour garder une trace).";
        renderMain();
      }}, "Garder une trace dans le Calendrier"));
      frag.appendChild(manualMsg);
    }
  }
  }

  return frag;
}

/* ============================================================
   ONGLET CALENDRIER — programmation et archive des publications
============================================================ */
const SCHEDULE_STATUS_LABEL = { "brouillon":"📝 Brouillon", "validé":"☑️ Validé", "programmé":"⏳ Programmé", "envoyé":"✅ Envoyé", "erreur":"⚠️ Erreur" };
function buildCalendarCard(item, inCampaign){
  const card = el("div",{class:"history-card"});
  card.appendChild(el("div",{class:"history-top"},[
    el("span",{}, `${item.platform} · ${item.mission||"—"}`),
    el("span",{}, SCHEDULE_STATUS_LABEL[item.status]||item.status),
  ]));
  card.appendChild(el("div",{style:"font-size:13px;color:var(--muted);margin-bottom:6px;"}, item.topic));
  if(item.scheduledAt) card.appendChild(el("div",{style:"font-size:12px;color:var(--muted2);"}, `Programmé pour : ${new Date(item.scheduledAt).toLocaleString("fr-FR")}`));
  if(item.sentAt) card.appendChild(el("div",{style:"font-size:12px;color:var(--green);"}, `Envoyé le : ${new Date(item.sentAt).toLocaleString("fr-FR")}`));
  if(item.error) card.appendChild(el("div",{style:"font-size:12px;color:var(--coral);"}, `Erreur : ${item.error}`));

  const requiresText = !!item.textPrompt;
  const needsContent = inCampaign && ((requiresText && (!item.textFinal || !item.textFinal.trim())) || !item.imageDataUrl);
  if(needsContent){
    card.appendChild(el("p",{class:"label", style:"margin-top:10px;"}, "Prompt image"));
    card.appendChild(vfWrap(el("div",{class:"card", style:"margin-bottom:6px;"},[el("pre",{}, item.imagePrompt)])));
    card.appendChild(copyBtnFor(()=>item.imagePrompt));

    const imgApiStatus = el("p",{style:"font-size:12px;color:var(--muted2);min-height:16px;margin:4px 0;"},"");
    const openaiProvider = state.apiProviders.find(p=>p.kind==="openai-compatible" && (p.baseUrl||"").includes("api.openai.com")) || DEFAULT_OPENAI_PROVIDER;
    if(openaiProvider){
      const imgApiBtn = el("button",{class:"btn-secondary", style:"margin:6px 0;"}, [svgIcon(ICONS.wand,14), el("span",{},"Générer l'image via l'API")]);
      const imgCancelBtn = el("button",{class:"btn-secondary", style:"margin:6px 0 6px 8px;display:none;"}, "Annuler le suivi");
      let activeCancelToken = null;
      imgCancelBtn.addEventListener("click", ()=>{
        if(activeCancelToken) activeCancelToken.cancelled = true;
      });
      imgApiBtn.addEventListener("click", async ()=>{
        if(item.blockingError){
          imgApiStatus.textContent = "Génération bloquée : " + item.blockingError;
          return;
        }
        if(!confirm("Lancer la génération d'image via OpenAI ? Ceci consomme du crédit API.")) return;
        imgApiBtn.disabled = true; // évite une double génération pour cette même déclinaison
        imgCancelBtn.style.display = "inline-block";
        const t0 = Date.now();
        const size = API_IMAGE_SIZE_BY_PLATFORM[item.platform] || "1024x1024";
        const cancelToken = { cancelled:false };
        activeCancelToken = cancelToken;
        try{
          /* V1.0 — Facebook réutilise EXACTEMENT l'image Instagram de la même campagne : aucune
             seconde génération, aucune seconde facturation. Même format (4:5), image identique. */
          if(item.platform==="Facebook"){
            const twin = getCampaignSiblingImage(item.campaignId, item.id, "Instagram");
            if(!twin){
              imgApiStatus.textContent = "Génère d'abord l'image Instagram de cette campagne : Facebook réutilise exactement la même image.";
              imgApiBtn.disabled = false; imgCancelBtn.style.display = "none"; activeCancelToken = null;
              return;
            }
            item.imageDataUrl = twin; item.usedReference = false; item.referenceFallbackReason = null;
            item.reusedFrom = "Instagram";
            const okSave = LS.set("vf-scheduled", state.scheduled);
            imgApiStatus.textContent = okSave ? "Image Instagram réutilisée à l'identique ✓ (aucun crédit consommé)"
                                              : "Image réutilisée, mais échec d'enregistrement (stockage plein ?).";
            imgApiBtn.disabled = false; imgCancelBtn.style.display = "none"; activeCancelToken = null;
            renderMain();
            return;
          }
          const referenceSelections = await resolveReferenceSelectionsByIds(item.referenceSelectionIds||[]);
          const phaseB = await confirmAndGenerateImage({
            phase:"prepared",
            inputs:{ mission:item.mission, platform:item.platform, prestation:state.prestationName,
              topic:item.topic, size, aspectKey:PLATFORM_ASPECT[item.platform], isCampaign:true },
            brief:item.creativeBrief, imagePrompt:item.imagePrompt, referenceSelections,
          }, (label)=>{ imgApiStatus.textContent = label; }, cancelToken);
          if(!phaseB.ok) throw new Error(phaseB.error || "Échec de la génération");
          const { usedReference, referenceFallbackReason } = phaseB;
          /* Post-traitement : MÊME fonction que la génération unitaire (format officiel, accroche,
             logo) — aucun code dupliqué, aucun chemin parallèle. */
          const finalizedItem = await finalizeGeneratedImage({
            inputs:{ platform:item.platform }, dataUrl: phaseB.dataUrl,
            logoSentAsReference:false, usedReference, content: phaseB.content || item.contentData || null,
            brief:item.creativeBrief,
          });
          let dataUrl = finalizedItem.dataUrl;
          const logoApplied = finalizedItem.logoApplied;
          item.imageDataUrl = dataUrl; item.logoApplied = logoApplied; item.usedReference = usedReference; item.referenceFallbackReason = referenceFallbackReason;
          item.layoutReport = finalizedItem.layoutReport||null;
          item.analysis = phaseB.analysis || null; item.analysisError = phaseB.analysisError || null;
          item.contentData = phaseB.content || item.contentData || null; item.textError = phaseB.textError || null;
          if(item.contentData && item.platform!=="Story"){
            const hashtagsText = (item.contentData.hashtags||[]).map(x=>x.startsWith("#")?x:"#"+x).slice(0,5).join(" ");
            item.textFinal = [item.contentData.caption||"", hashtagsText].filter(Boolean).join("\n\n");
            item.altText = item.contentData.altText || "";
          }
          item.headlineApplied = !!finalizedItem.headlineApplied; // texte déjà présent : accroche posée dès la génération
          const saved = LS.set("vf-scheduled", state.scheduled);
          logToLab({ provider:"OpenAI", model:"gpt-image-1-mini", type:"image", prompt:item.imagePrompt, promptHash:hashPrompt(item.imagePrompt), cost:null, durationMs:Date.now()-t0, status:"accepted" });
          let referenceLabel;
          if(usedReference) referenceLabel = "Référence visuelle utilisée ✓";
          else if(referenceFallbackReason) referenceLabel = "Référence non utilisée — génération standard de secours.";
          else referenceLabel = "Génération standard — aucune référence visuelle fournie.";
          imgApiStatus.textContent = (!saved ? "Générée, mais échec d'enregistrement (stockage plein ?)."
            : logoRequiredFor(item.platform) ? (logoApplied ? "Image générée, logo réel appliqué ✓" : "Image générée — aucun logo marqué comme actif de marque, rien n'a été ajouté.")
            : "Image générée ✓") + " — " + referenceLabel +
            (finalizedItem.layoutReport&&!finalizedItem.layoutReport.skipped
              ? ` — Canvas premium ✓ (${finalizedItem.layoutReport.textZone||"sans texte"} / ${finalizedItem.layoutReport.logoZone||"sans logo"})` : "");
          renderMain();
        }catch(err){
          const cancelled = String(err.message||err)==="__CANCELLED__";
          imgApiStatus.textContent = cancelled ? "Suivi annulé (la génération continue peut-être côté serveur)." : `Échec (${err.message||err}) — utilise l'import manuel ci-dessous.`;
        }
        imgApiBtn.disabled = false;
        imgCancelBtn.style.display = "none";
        activeCancelToken = null;
      });
      card.appendChild(imgApiBtn);
      card.appendChild(imgCancelBtn);
    }
    const imgFileInput = el("input",{type:"file", accept:"image/*", style:"display:none"});
    imgFileInput.addEventListener("change", async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      let dataUrl = await normalizeToPlatformFormat(await resizeImageFile(file), item.platform); // V1.0 : format officiel
      let logoApplied = false;
      if(logoRequiredFor(item.platform)){
        const composited = await compositeBrandSignature(dataUrl, item.platform, {
          brief:item.creativeBrief||null, analysis:item.analysis||null
        });
        if(composited.layoutReport&&composited.layoutReport.blockingError) throw new Error(composited.layoutReport.blockingError);
        dataUrl = composited.dataUrl; logoApplied = composited.applied;
        item.layoutReport = composited.layoutReport||null;
      }
      item.imageDataUrl = dataUrl; item.logoApplied = logoApplied;
      const saved = LS.set("vf-scheduled", state.scheduled);
      imgApiStatus.textContent = !saved ? "Importée, mais échec d'enregistrement (stockage plein ?)."
        : logoRequiredFor(item.platform) ? (logoApplied ? "Image importée, logo réel appliqué ✓" : "Image importée — aucun logo marqué comme actif de marque, rien n'a été ajouté.")
        : "Image importée ✓";
      renderMain();
    });
    card.appendChild(imgFileInput);
    card.appendChild(el("button",{class:"btn-secondary", style:"margin:6px 0;", onclick:()=>imgFileInput.click()}, [svgIcon(ICONS.upload,14), el("span",{},"Importer une image")]));
    card.appendChild(imgApiStatus);

    /* P1 — Le texte d'une campagne passe désormais par le MÊME appel structuré que la génération
       unitaire (generateContentFromBrief) : même schéma, même imageHeadline, même résultat visuel.
       Le copier-coller manuel reste disponible en secours, inchangé. */
    if(item.creativeBrief && item.platform!=="Story"){
      const textApiStatus = el("p",{style:"font-size:12px;color:var(--muted2);margin:4px 0;min-height:14px;"}, item.contentData ? "Texte généré ✓" : "");
      const textApiBtn = el("button",{class:"btn-secondary", style:"margin:6px 0;"}, [svgIcon(ICONS.sparkles,14), el("span",{},"Générer le texte (API)")]);
      textApiBtn.addEventListener("click", async ()=>{
        textApiBtn.disabled = true; textApiStatus.textContent = "Génération du texte...";
        try{
          const content = await generateContentFromBrief(item.creativeBrief, item.analysis || null, item.platform, item.mission);
          item.contentData = content;
          const hashtagsText = (content.hashtags||[]).map(x=> x.startsWith("#") ? x : "#"+x).slice(0,5).join(" ");
          item.textFinal = [content.caption||"", hashtagsText].filter(Boolean).join("\n\n");
          item.altText = content.altText || "";
          const headlineDone = await applyHeadlineToItem(item);
          const saved = LS.set("vf-scheduled", state.scheduled);
          textApiStatus.textContent = (!saved ? "Texte généré, mais échec d'enregistrement (stockage plein ?)."
            : headlineDone ? "Texte généré ✓ — accroche incrustée sur l'image"
            : item.imageDataUrl ? "Texte généré ✓ — aucune accroche pour cette publication (image sans texte)"
            : "Texte généré ✓ — génère l'image pour appliquer l'éventuelle accroche");
          renderMain();
        }catch(err){ textApiStatus.textContent = "Échec : " + (err.message||err); }
        textApiBtn.disabled = false;
      });
      card.appendChild(textApiBtn); card.appendChild(textApiStatus);
    }

    if(item.textPrompt){
      card.appendChild(el("p",{class:"label", style:"margin-top:10px;"}, "Prompt texte"));
      card.appendChild(vfWrap(el("div",{class:"card", style:"margin-bottom:6px;"},[el("pre",{}, item.textPrompt)])));
      card.appendChild(copyBtnFor(()=>item.textPrompt));
      const pastedArea = el("textarea",{rows:"4", placeholder:"Colle ici la réponse texte de ChatGPT...", style:"margin:6px 0;"}, item.textFinal);
      pastedArea.addEventListener("input", e=>{ item.textFinal = e.target.value; LS.set("vf-scheduled", state.scheduled); });
      card.appendChild(pastedArea);
    }

    const checklist = buildValidationChecklist({
      platform: item.platform, textPrompt: item.textPrompt, getTextResult: ()=>item.textFinal,
      hasImage: !!item.imageDataUrl, logoApplied: !!item.logoApplied, prestationName: null,
      missionKey: item.mission, schedulable: item.schedulable,
    });
    if(checklist.total>0){
      card.appendChild(el("p",{class:"label", style:"margin-top:10px;"}, "Checklist"));
      checklist.checks.forEach(c=>{
        card.appendChild(el("div",{class:"learning-row", style:`color:${c.ok?"var(--green)":"var(--coral)"};font-size:12px;`}, `${c.ok?"✅":"⚠️"} ${c.label}`));
      });
    }

    const validateMsg = el("p",{style:"font-size:12px;color:var(--coral);min-height:14px;margin:4px 0;"},"");
    card.appendChild(el("button",{class:"btn-secondary", style:"margin-bottom:6px;", onclick: async ()=>{
      if((requiresText && (!item.textFinal || !item.textFinal.trim())) || !item.imageDataUrl){
        validateMsg.textContent = requiresText ? "Texte et image requis avant de valider." : "Image requise avant de valider.";
        return;
      }
      item.status = "validé";
      const ok = pushToServerSilentSafe();
      LS.set("vf-scheduled", state.scheduled);
      validateMsg.style.color = "var(--green)";
      validateMsg.textContent = "Validé ✓";
      renderMain();
    }}, "☑️ Valider ce contenu"));
    card.appendChild(validateMsg);
  }

  const row = el("div",{style:"display:flex;gap:10px;align-items:flex-start;margin-top:8px;"});
  if(item.imageDataUrl) row.appendChild(el("img",{src:item.imageDataUrl, style:"width:70px;height:70px;object-fit:cover;border-radius:8px;flex-shrink:0;"}));
  row.appendChild(el("div",{style:"font-size:12px;color:var(--muted);flex:1;white-space:pre-wrap;"}, (item.textFinal||"").slice(0,180)+((item.textFinal||"").length>180?"...":"")));
  card.appendChild(row);

  const actionsRow = el("div",{style:"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;"});
  const isSchedulable = item.schedulable !== false;
  if(isSchedulable){
    if(item.status==="brouillon" || item.status==="validé" || item.status==="erreur"){
      const dt = el("input",{type:"datetime-local", style:"flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px;"});
      dt.addEventListener("change", e=>{
        item.scheduledAt = new Date(e.target.value).getTime();
        item.status = "programmé"; item.error = null;
        LS.set("vf-scheduled", state.scheduled);
        pushToServerSilentSafe();
        renderMain();
      });
      actionsRow.appendChild(dt);
    }
    if(item.status==="programmé"){
      actionsRow.appendChild(el("button",{class:"btn-small", onclick:()=>{
        item.status="brouillon"; item.scheduledAt=null;
        LS.set("vf-scheduled", state.scheduled); renderMain();
      }}, "Retirer la date"));
    }
  } else {
    const hint = item.platform==="Story"
      ? "Story non programmable — télécharge l'image et publie-la toi-même en story sur Instagram et/ou Facebook."
      : "Article non programmable — copie le texte et télécharge l'image, puis publie-les toi-même dans Wix.";
    card.appendChild(el("p",{class:"sublabel", style:"margin:6px 0;"}, hint));
    if(item.textFinal) actionsRow.appendChild(copyBtnFor(()=>item.textFinal||""));
    if(item.imageDataUrl){
      actionsRow.appendChild(el("button",{class:"btn-small", onclick:()=>{
        const link = document.createElement("a");
        link.download = `${(item.platform||"blog").toLowerCase().replace(/\s+/g,"-")}-${item.id}.jpg`;
        link.href = item.imageDataUrl;
        link.click();
      }}, "Télécharger l'image"));
    }
  }
  actionsRow.appendChild(el("button",{class:"btn-small", onclick:()=>{
    if(!confirm("Supprimer définitivement ce post de l'archive ?")) return;
    state.scheduled = state.scheduled.filter(s=>s.id!==item.id);
    LS.set("vf-scheduled", state.scheduled); renderMain();
  }}, svgIcon(ICONS.trash,12)));
  card.appendChild(actionsRow);

  return card;
}

/* Pousse en arrière-plan sans bloquer l'UI ni exiger un await partout ; ignore silencieusement l'échec
   (l'auto-sync debouncée prendra quand même le relais dans la foulée). */
function pushToServerSilentSafe(){
  pushToServerSilent().catch(()=>{});
  return true;
}

function buildCalendarTab(){
  const frag = el("div",{});

  frag.appendChild(el("p",{class:"label"},"Webhook Make"));
  frag.appendChild(el("p",{class:"sublabel"},"L'URL de ton scénario Make (déclenchement webhook). À la date programmée, SDZ App l'appelle automatiquement — une seule fois par post, comme ton run manuel actuel."));
  const webhookInput = el("input",{type:"text", value: state.makeWebhook, placeholder:"https://hook.eu2.make.com/..."});
  webhookInput.addEventListener("input", e=>{ state.makeWebhook = e.target.value; LS.set("vf-make-webhook", e.target.value); });
  frag.appendChild(el("div",{style:"margin-bottom:12px;"}, webhookInput));

  const actionMsg = el("p",{style:"font-size:12px;color:var(--muted2);min-height:16px;margin:0 0 10px;"},"");
  const actionsRow = el("div",{class:"pillrow", style:"margin-bottom:16px;"});

  actionsRow.appendChild(el("button",{class:"btn-small", onclick: async ()=>{
    actionMsg.style.color="var(--muted2)"; actionMsg.textContent="Actualisation depuis le serveur...";
    try{
      const res = await fetch("/.netlify/functions/load-data", { method:"GET", headers: syncHeaders() });
      const result = await res.json();
      if(result && result.data && result.data["vf-scheduled"]){
        state.scheduled = result.data["vf-scheduled"];
        localStorage.setItem("vf-scheduled", JSON.stringify(state.scheduled));
        actionMsg.style.color="var(--green)"; actionMsg.textContent="Statuts actualisés depuis le serveur ✓";
      } else {
        actionMsg.style.color="var(--amber)"; actionMsg.textContent="Aucune donnée de calendrier trouvée côté serveur.";
      }
    }catch(e){ actionMsg.style.color="var(--coral)"; actionMsg.textContent="Échec de l'actualisation : "+String(e.message||e); }
    renderMain();
  }}, "🔄 Actualiser les statuts"));

  actionsRow.appendChild(el("button",{class:"btn-small", onclick: async ()=>{
    if(!state.makeWebhook){ actionMsg.style.color="var(--coral)"; actionMsg.textContent="Renseigne d'abord l'URL du webhook Make ci-dessus."; return; }
    actionMsg.style.color="var(--muted2)"; actionMsg.textContent="Test du webhook en cours...";
    try{
      const res = await fetch(state.makeWebhook, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ test:true, source:"Viewfinder - test manuel" }) });
      actionMsg.style.color = res.ok ? "var(--green)" : "var(--coral)";
      actionMsg.textContent = `Make a répondu HTTP ${res.status}${res.ok ? " ✓" : " — vérifie que le scénario est actif"}.`;
    }catch(e){ actionMsg.style.color="var(--coral)"; actionMsg.textContent="Échec de connexion au webhook : "+String(e.message||e); }
  }}, "🧪 Tester le webhook"));

  actionsRow.appendChild(el("button",{class:"btn-small", onclick: async ()=>{
    actionMsg.style.color="var(--muted2)"; actionMsg.textContent="Déclenchement de l'envoi en cours...";
    try{
      const res = await fetch("/.netlify/functions/check-scheduled-posts");
      const result = await res.json();
      actionMsg.style.color="var(--green)";
      actionMsg.textContent = `Vérifié : ${result.checked||0} post(s) au total, ${result.due||0} éligible(s), ${result.sent||0} envoyé(s), ${result.errors||0} erreur(s).`;
    }catch(e){ actionMsg.style.color="var(--coral)"; actionMsg.textContent="Échec : "+String(e.message||e); }
    renderMain();
  }}, "🚀 Envoyer maintenant"));

  actionsRow.appendChild(el("button",{class:"btn-small", onclick:()=>{
    let count = 0;
    state.scheduled.forEach(p=>{
      if(p.status!=="brouillon") return;
      const requiresText = !!p.textPrompt;
      const ready = (!requiresText || (p.textFinal && p.textFinal.trim())) && p.imageDataUrl;
      if(ready){ p.status="validé"; count++; }
    });
    LS.set("vf-scheduled", state.scheduled);
    pushToServerSilentSafe();
    actionMsg.style.color = count ? "var(--green)" : "var(--amber)";
    actionMsg.textContent = count ? `${count} contenu(s) validé(s) ✓` : "Aucun contenu prêt à valider (image requise partout, texte requis sauf pour les Stories).";
    renderMain();
  }}, "☑️ Valider la campagne"));

  frag.appendChild(actionsRow);
  frag.appendChild(actionMsg);

  if(!state.scheduled.length){
    frag.appendChild(el("p",{class:"hint"},"Aucun post programmé ou en brouillon pour l'instant. Génère un post dans \"Créer un post\" (seul ou en campagne complète), valide le texte et l'image, puis programme-le."));
    return frag;
  }

  const campaignIds = [...new Set(state.scheduled.filter(p=>p.campaignId).map(p=>p.campaignId))]
    .sort((a,b)=>{
      const ca = state.scheduled.find(p=>p.campaignId===a) || {};
      const cb = state.scheduled.find(p=>p.campaignId===b) || {};
      return (cb.createdAt||0)-(ca.createdAt||0);
    });

  campaignIds.forEach(cid=>{
    const items = state.scheduled.filter(p=>p.campaignId===cid);
    const topic = items[0].campaignTopic || items[0].topic || "(sans thème)";
    frag.appendChild(el("h2",{class:"section"}, `📦 Campagne — ${topic.length>60 ? topic.slice(0,60)+"..." : topic}`));
    items.forEach(item=> frag.appendChild(buildCalendarCard(item, true)));
  });

  const standalone = state.scheduled.filter(p=>!p.campaignId);
  if(standalone.length){
    if(campaignIds.length) frag.appendChild(el("h2",{class:"section"},"Posts individuels"));
    const sorted = standalone.slice().sort((a,b)=>{
      const order = {"programmé":0, "validé":1, "brouillon":2, "erreur":3, "envoyé":4};
      if(order[a.status]!==order[b.status]) return order[a.status]-order[b.status];
      return (a.scheduledAt||Infinity) - (b.scheduledAt||Infinity);
    });
    sorted.forEach(item=> frag.appendChild(buildCalendarCard(item, false)));
  }

  return frag;
}

function scoreRow(label, val){
  const pct = val==null ? 0 : val*10;
  const color = val==null ? "var(--muted2)" : pct>=70 ? "var(--green)" : pct>=45 ? "var(--amber)" : "var(--coral)";
  return el("div",{style:"margin-bottom:8px;"},[
    el("div",{style:"display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px;"},
      [el("span",{},label), el("span",{style:`color:${color};font-weight:600;`}, val!=null? `${val}/10` : "—")]),
    el("div",{style:"height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;"},[
      el("div",{style:`height:100%;width:${pct}%;background:${color};`}),
    ]),
  ]);
}
function renderAuditReport(report){
  const frag = el("div",{class:"card", style:"margin-bottom:16px;"});
  frag.appendChild(el("div",{style:"text-align:center;margin-bottom:14px;"},[
    el("div",{style:"font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;"},"Score global"),
    el("div",{style:"font-size:32px;font-weight:700;color:var(--lime);"}, report.global!=null?`${report.global}/10`:"—"),
  ]));
  [["Respect de la charte",report.charte],["Cohérence marque",report.coherence],["Respect plateforme",report.plateforme],
   ["SEO",report.seo],["Conversion",report.conversion],["Clarté",report.clarte],
   ["Qualité rédactionnelle",report.redaction],["Qualité direction artistique",report.da],
   ["Originalité",report.originalite],["Risque de répétition",report.repetition]]
   .forEach(([label,val])=> frag.appendChild(scoreRow(label,val)));

  if(report.pointsForts.length){
    frag.appendChild(el("p",{class:"label", style:"margin-top:14px;"},"Points forts"));
    report.pointsForts.forEach(p=> frag.appendChild(el("div",{class:"learning-row", style:"color:var(--green);"}, `+ ${p}`)));
  }
  if(report.pointsFaibles.length){
    frag.appendChild(el("p",{class:"label", style:"margin-top:10px;"},"Points faibles"));
    report.pointsFaibles.forEach(p=> frag.appendChild(el("div",{class:"learning-row", style:"color:var(--coral);"}, `− ${p}`)));
  }
  if(report.recommandations.length){
    frag.appendChild(el("p",{class:"label", style:"margin-top:10px;"},"Recommandations"));
    report.recommandations.forEach(p=> frag.appendChild(el("div",{class:"learning-row"}, `→ ${p}`)));
  }
  return frag;
}
function buildAuditTab(){
  const frag = el("div",{});
  const ctx = state.lastGenerated;

  if(!ctx){
    frag.appendChild(el("p",{class:"hint"},"Génère d'abord un contenu depuis l'onglet \"Créer un post\", puis clique sur \"Analyser avec ChatGPT\"."));
  } else {
    frag.appendChild(el("h2",{class:"section"},"Contenu à analyser"));
    frag.appendChild(el("p",{class:"sublabel"}, `${ctx.campaignLabel || ctx.platform} · Mission : ${ctx.missionKey || "non spécifiée"} · Sujet : ${ctx.topic}`));

    frag.appendChild(el("button",{class:"btn-primary", style:"margin-bottom:14px;", onclick: ()=>{
      state.auditPrompt = buildAuditPromptText(ctx);
      renderMain();
    }}, [svgIcon(ICONS.sparkles,16), el("span",{},"Générer le prompt d'audit")]));

    if(state.auditPrompt){
      frag.appendChild(vfWrap(el("div",{class:"card", style:"margin-bottom:6px;"},[el("pre",{}, state.auditPrompt)])));
      frag.appendChild(copyBtnFor(()=>state.auditPrompt));
      frag.appendChild(el("p",{class:"sublabel"},"Colle ce prompt dans ChatGPT (dans la conversation où l'image a été générée si possible), puis colle sa réponse ci-dessous."));

      const pastedArea = el("textarea",{rows:"6", placeholder:"Colle ici le rapport structuré de ChatGPT..."}, state.auditPasted);
      pastedArea.addEventListener("input", e=>{ state.auditPasted = e.target.value; });
      frag.appendChild(el("div",{style:"margin:10px 0;"}, pastedArea));

      frag.appendChild(el("button",{class:"btn-primary", style:"margin-bottom:20px;", onclick: ()=>{
        if(!state.auditPasted.trim()) return;
        const report = parseAuditReport(state.auditPasted);
        const entry = { id: uid(), date: nowStr(), platform: ctx.platform, missionKey: ctx.missionKey, topic: ctx.topic, ...report };
        state.auditHistory.push(entry);
        LS.set("vf-audit", state.auditHistory);
        state.auditPasted = ""; state.auditPrompt = "";
        renderMain();
      }}, "Importer le rapport dans l'historique d'audit"));
    }

    const last = state.auditHistory[state.auditHistory.length-1];
    if(last){
      frag.appendChild(el("h2",{class:"section"},"Dernier audit importé"));
      frag.appendChild(renderAuditReport(last));
      if(last.recommandations && last.recommandations.length){
        frag.appendChild(el("button",{class:"btn-secondary", style:"margin-bottom:24px;", onclick: ()=>{
          last.recommandations.forEach(r=>{
            state.modules.push({ id: uid(), category:"Leçons apprises",
              title: `Recommandation audit ${last.platform} — ${last.date}`, content:r, enabled:true });
          });
          LS.set("vf-modules", state.modules);
          alert("Recommandations ajoutées à la base de connaissances (catégorie Leçons apprises).");
        }}, "Ajouter ces recommandations à la base de connaissances"));
      }

  frag.appendChild(el("h2",{class:"section"},"Historique des audits"));
  const filterRow = el("div",{class:"pillrow", style:"margin-bottom:14px;"});
  ["Toutes",...PLATFORMS].forEach(p=>{
    filterRow.appendChild(el("button",{class:"pill"+(state.auditFilter===p?" active":""), onclick:()=>{ state.auditFilter=p; renderMain(); }}, p));
  });
  frag.appendChild(filterRow);

  const list = state.auditHistory.filter(a=> state.auditFilter==="Toutes" || a.platform===state.auditFilter).slice().reverse();
  if(list.length===0){
    frag.appendChild(el("p",{class:"hint"},"Aucun audit enregistré pour l'instant."));
  } else {
    list.forEach(a=>{
      const details = el("details",{class:"history-card"});
      details.appendChild(el("summary",{style:"cursor:pointer;display:flex;justify-content:space-between;font-size:13px;"},[
        el("span",{}, `${a.platform} · ${a.date}`),
        el("span",{style:"color:var(--lime);font-weight:600;"}, a.global!=null?`${a.global}/10`:"—"),
      ]));
      details.appendChild(renderAuditReport(a));
      frag.appendChild(details);
    });
  }

  return frag;
}

      baseInput.addEventListener("input", e=>{ p.baseUrl = e.target.value; LS.set("vf-api-providers", state.apiProviders); });

    const priceRow = el("div",{style:"display:flex;gap:8px;margin-bottom:8px;"});
    const priceIn = el("input",{type:"text", value:String(p.priceIn||""), placeholder:"$/1K tokens entrée"});
    priceIn.addEventListener("input", e=>{ p.priceIn = parseFloat(e.target.value)||0; LS.set("vf-api-providers", state.apiProviders); });
    const priceOut = el("input",{type:"text", value:String(p.priceOut||""), placeholder:"$/1K tokens sortie"});
    priceOut.addEventListener("input", e=>{ p.priceOut = parseFloat(e.target.value)||0; LS.set("vf-api-providers", state.apiProviders); });
    priceRow.appendChild(priceIn); priceRow.appendChild(priceOut);
    card.appendChild(priceRow);
    card.appendChild(el("p",{style:"font-size:11px;color:var(--muted2);"},"Tarifs approximatifs saisis manuellement — aucune API de pricing en temps réel. Laisse à 0 si tu ne connais pas le tarif exact."));

  return frag;
}

/* Hash déterministe de l'état des règles : deux runs au même hash = strictement les mêmes règles.
   Couvre : modules (contenu+état), UNIVERS_SDZ, charte condensée, garde-fou sécurité. */
function computeModulesHash(){

/* ---- Contrats génériques (documentation d'interface — objets simples, pas de classes imposées) ----
   TestCase   : { caseId, executorId, params:{...libres pour l'exécuteur...}, sujet?, labels? }
   TestSuite  : { suiteId, label, mode:"smoke"|"standard"|"complet", cases:[TestCase], topicBankVersion }
   TestResult : { caseId, status:"ok"|"erreur"|"ignore", startedAt, durationMs, costEstimated,
                  artefacts:{...libres : brief, prompt, imageId, rapports...}, error? }
   TestExecutor : { id, label, estimateCost(testCase)->number|null, async execute(testCase, ctx)->TestResult }
     ctx : { mode, benchMode:true, onStatus(label), storage } — l'exécuteur N'ÉCRIT JAMAIS dans les
     données de production (isolation lecture+écriture : il reçoit son contexte, il ne lit pas l'état de prod).
   QualityScorer : { id, label, async score(testResult, testCase)->{ total, grille:{...}, scorerId } }
     Implémentations prévues : HumanScorer (B4), VisionScorer (post-T3). */
const BENCH_EXECUTORS = new Map();
function registerBenchExecutor(executor){
  if(!executor || !executor.id || typeof executor.execute!=="function") throw new Error("TestExecutor invalide : { id, execute() } requis.");
  BENCH_EXECUTORS.set(executor.id, executor);

  BENCH_SCORERS.set(scorer.id, scorer);

/* ---- BenchStorage : abstraction de stockage (le Banc ne dépend jamais d'IndexedDB directement) ----
   Contrat async : saveRun(run) / getRun(runId) / listRuns() / deleteRun(runId)
                   saveCaseImage(imageId, blob) / getCaseImage(imageId) / deleteCaseImage(imageId)
                   exportRun(runId) -> objet JSON auto-suffisant (images en dataUrl)
   Règles : un run "terminé" est gelé (seules ses notations `scores` peuvent s'ajouter) ;
            un run épinglé (pinnedAsReference) refuse la suppression. */
class MemoryBenchStorage {
  constructor(){ this.runs = new Map(); this.images = new Map(); this.kind = "memory"; }
  async saveRun(run){
    const existing = this.runs.get(run.runId);
    if(existing && existing.status==="terminé" && run.status==="terminé"){
      // run gelé : seule la clé scores peut évoluer
      const a = JSON.stringify({ ...existing, scores: null, pinnedAsReference: null, imagesPurged: null }), b = JSON.stringify({ ...run, scores: null, pinnedAsReference: null, imagesPurged: null });
      if(a!==b) throw new Error("Run terminé : objet gelé — seules la notation (scores), l'épinglage (pinnedAsReference) et le marqueur de purge (imagesPurged) peuvent évoluer.");
    }
    this.runs.set(run.runId, JSON.parse(JSON.stringify(run)));
    return run.runId;
  }
  async getRun(runId){ const r = this.runs.get(runId); return r ? JSON.parse(JSON.stringify(r)) : null; }
  async listRuns(){ return [...this.runs.values()].map(r=>({ runId:r.runId, startedAt:r.startedAt, finishedAt:r.finishedAt||null, mode:r.mode, status:r.status, appVersion:r.appVersion, modulesHash:r.modulesHash, pinnedAsReference:!!r.pinnedAsReference, nbCases:(r.cases||[]).length })); }
  async deleteRun(runId){
    const r = this.runs.get(runId);
    if(r && r.pinnedAsReference) throw new Error("Run épinglé comme Référence officielle : suppression refusée.");
    this.runs.delete(runId); return true;
  }
  async saveCaseImage(imageId, blob){ this.images.set(imageId, blob); return imageId; }
  async getCaseImage(imageId){ return this.images.get(imageId) || null; }
  async deleteCaseImage(imageId){ this.images.delete(imageId); return true; }
  async exportRun(runId, options){ return exportRunWithStorage(this, runId, options); }
}
class IndexedDBBenchStorage {
  constructor(){ this.kind = "indexeddb"; this._db = null; }
  async _open(){
    if(this._db) return this._db;
    this._db = await new Promise((res, rej)=>{
      const req = indexedDB.open("vf-bench", 1);
      req.onupgradeneeded = ()=>{ const db = req.result;
        if(!db.objectStoreNames.contains("runs")) db.createObjectStore("runs", { keyPath:"runId" });
        if(!db.objectStoreNames.contains("images")) db.createObjectStore("images", { keyPath:"imageId" });
      };
      req.onsuccess = ()=> res(req.result);
      req.onerror = ()=> rej(req.error || new Error("Ouverture IndexedDB impossible"));
    });
    return this._db;
  }
  async _tx(store, mode, fn){
    const db = await this._open();
    return new Promise((res, rej)=>{
      const tx = db.transaction(store, mode); const st = tx.objectStore(store);
      const out = fn(st);
      tx.oncomplete = ()=> res(out && out.result !== undefined ? out.result : out);
      tx.onerror = ()=> rej(tx.error || new Error("Transaction IndexedDB échouée"));
    });
  }
  async saveRun(run){
    const existing = await this.getRun(run.runId);
    if(existing && existing.status==="terminé" && run.status==="terminé"){
      const a = JSON.stringify({ ...existing, scores: null, pinnedAsReference: null, imagesPurged: null }), b = JSON.stringify({ ...run, scores: null, pinnedAsReference: null, imagesPurged: null });
      if(a!==b) throw new Error("Run terminé : objet gelé — seules la notation (scores), l'épinglage (pinnedAsReference) et le marqueur de purge (imagesPurged) peuvent évoluer.");
    }
    await this._tx("runs", "readwrite", st=> st.put(run));
    return run.runId;
  }
  async getRun(runId){
    const db = await this._open();
    return new Promise((res, rej)=>{
      const req = db.transaction("runs").objectStore("runs").get(runId);
      req.onsuccess = ()=> res(req.result || null); req.onerror = ()=> rej(req.error);
    });
  }
  async listRuns(){
    const db = await this._open();
    return new Promise((res, rej)=>{
      const out = []; const req = db.transaction("runs").objectStore("runs").openCursor();
      req.onsuccess = ()=>{ const c = req.result;
        if(c){ const r = c.value; out.push({ runId:r.runId, startedAt:r.startedAt, finishedAt:r.finishedAt||null, mode:r.mode, status:r.status, appVersion:r.appVersion, modulesHash:r.modulesHash, pinnedAsReference:!!r.pinnedAsReference, nbCases:(r.cases||[]).length }); c.continue(); }
        else res(out);
      };
      req.onerror = ()=> rej(req.error);
    });
  }
  async deleteRun(runId){
    const r = await this.getRun(runId);
    if(r && r.pinnedAsReference) throw new Error("Run épinglé comme Référence officielle : suppression refusée.");
    await this._tx("runs", "readwrite", st=> st.delete(runId));
    return true;
  }
  async saveCaseImage(imageId, blob){ await this._tx("images", "readwrite", st=> st.put({ imageId, blob })); return imageId; }
  async getCaseImage(imageId){
    const db = await this._open();
    return new Promise((res, rej)=>{
      const req = db.transaction("images").objectStore("images").get(imageId);
      req.onsuccess = ()=> res(req.result ? req.result.blob : null); req.onerror = ()=> rej(req.error);
    });
  }
  async deleteCaseImage(imageId){ await this._tx("images", "readwrite", st=> st.delete(imageId)); return true; }
  async exportRun(runId, options){ return exportRunWithStorage(this, runId, options); }
}
/* Export d'un run — les images sont embarquées UNIQUEMENT à la demande (Golden Run archivable ou
   transférable vers un autre appareil). Implémentation partagée par les deux stockages. */
async function exportRunWithStorage(storage, runId, options){
  const r = await storage.getRun(runId); if(!r) return null;
  const out = { format:"vf-bench-run", exportedAt:new Date().toISOString(), withImages:false, run:r };
  if(options && options.withImages){
    const images = {};
    for(const slot of (r.cases||[])){
      const id = slot.result && slot.result.outputs && slot.result.outputs.imageId;
      if(!id) continue;
      try{
        const blob = await storage.getCaseImage(id);
        if(blob) images[id] = await new Promise((res,rej)=>{ const fr = new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
      }catch(e){ /* image manquante : export poursuivi, absence visible */ }
    }
    out.images = images; out.withImages = true;
  }
  return out;
}
function createBenchStorage(){
  try{ if(typeof indexedDB!=="undefined") return new IndexedDBBenchStorage(); }catch(e){}
  return new MemoryBenchStorage(); // repli (tests, environnements sans IndexedDB)
}
/* Stockage durable : demandé une fois, au premier run (B2 l'appellera). */
async function ensurePersistentBenchStorage(){
  try{
    if(navigator.storage && navigator.storage.persist){
      const already = await navigator.storage.persisted();
      if(already) return true;
      return await navigator.storage.persist();
    }
  }catch(e){}
  return false;
}

   Le framework reste générique : tout ce qui connaît le moteur SDZ vit dans
   l'executor "creative-image-sdz" et le constructeur de suite — jamais dans

/* ---- Table tarifaire VERSIONNÉE ($ par 1M tokens) : archivée avec chaque run pour que les
   coûts restent auditables même après un changement de prix. Les tokens restent la vérité terrain. */
const BENCH_PRICE_TABLE = Object.freeze({
  version: "1.1.0",
  perMTokens: Object.freeze({
    "gpt-4o-mini": { in: 0.15, out: 0.60 },
    "gpt-4o": { in: 2.50, out: 10.00 },
    "gpt-5-mini": { in: 0.25, out: 2.00 },
    "gpt-5-nano": { in: 0.05, out: 0.40 },
  }),
  // Images gpt-image-1 : trois types de tokens ($ / 1M) — entrée texte, entrée image, sortie image.
  imagePerMTokens: Object.freeze({
    "gpt-image-1": { textIn: 5.00, imageIn: 10.00, imageOut: 40.00 },
  }),
});
/* Coût MESURÉ depuis les tokens réels — retourne null (jamais un chiffre inventé) si les tokens
   ou le tarif du modèle sont inconnus. Toujours distinct du coût estimé. */
function computeMeasuredTextCost(usage){
  if(!usage || usage.promptTokens==null || usage.completionTokens==null) return null;
  const price = BENCH_PRICE_TABLE.perMTokens[usage.model];
  if(!price) return null;
  return +( (usage.promptTokens/1e6)*price.in + (usage.completionTokens/1e6)*price.out ).toFixed(6);
}

/* Coût image MESURÉ depuis les tokens réels du job — null si tokens ou tarif inconnus. */
function computeMeasuredImageCost(imageUsage, model){
  if(!imageUsage || imageUsage.output_tokens==null) return null;
  const p = BENCH_PRICE_TABLE.imagePerMTokens[model||"gpt-image-1"];
  if(!p) return null;
  const det = imageUsage.input_tokens_details || {};
  const textIn = det.text_tokens ?? null, imageIn = det.image_tokens ?? 0;
  const textPart = textIn!=null ? (textIn/1e6)*p.textIn : (imageUsage.input_tokens!=null ? (imageUsage.input_tokens/1e6)*p.textIn : null);
  if(textPart==null) return null;
  return +( textPart + (imageIn/1e6)*p.imageIn + (imageUsage.output_tokens/1e6)*p.imageOut ).toFixed(6);
}

/* ---- Versions déclaratives de la connaissance (documentaires, incrémentées à la main)... */
const KNOWLEDGE_VERSIONS = Object.freeze({

  masterCampaign: "1.0.0", promptBuilder: "2.0.0", creativePlanner: "1.0.0",
});
/* ...ET empreintes CALCULÉES par composant : un oubli d'incrément est détecté quand même, et on
   sait QUEL composant a changé. Principe : uniquement des DONNÉES CANONIQUES (contenus de modules,
   system prompts constants, schémas, configuration) — JAMAIS Function.toString() : une mise en forme
   du code ou un changement de runtime ne modifie aucune empreinte ; une modification réelle de la
   logique métier (règle, template, schéma, modèle, paramètre) la modifie immédiatement.
   Limite documentée : la "glue" d'assemblage du constructeur (ordre des blocs, connecteurs) n'est pas
   une donnée canonique — un changement de glue exige l'incrément manuel de promptBuilder. */
function computeKnowledgeFingerprints(){
  const modsByCat = {};
  (state.modules||[]).forEach(m=>{ (modsByCat[m.category||"?"] = modsByCat[m.category||"?"]||[]).push({ id:m.id, t:m.title, c:m.content, e:!!m.enabled, cr:m.criteres||null }); });
  const catHash = {};

    catHash[cat] = hashPrompt(JSON.stringify(modsByCat[cat].sort((a,b)=>String(a.id).localeCompare(String(b.id)))));
  });
  return Object.freeze({
    modulesParCategorie: Object.freeze(catHash),
    universSDZ: hashPrompt(JSON.stringify(MASTER_UNIVERS_SDZ_V0)),
    charte: hashPrompt(CHARTE_SDZ_SYNTHESE),

/* ---- B4 — NOTATION RAPIDE : trois statuts, motifs fermés (exploitables statistiquement).
   Liste dérivée de la spécification V1.0 (qualité visuelle obligatoire). */
const BENCH_SCORE_STATUTS = Object.freeze({ publiable:"⭐ Publiable", retravailler:"🟡 À retravailler", regenerer:"❌ À régénérer" });
const BENCH_REFUS_MOTIFS = Object.freeze([
  "ambiance spa générique","or incorrect","noir bouché","rendu IA visible","composition faible",
  "émotion absente","prestation non reconnaissable","texte illisible","logo incorrect",
  "peau plastique","décor vide","plusieurs idées fortes","autre",
]);
/* Grille détaillée — MODE EXPERT uniquement, facultatif, jamais requis en Golden Run. */
const BENCH_EXPERT_CRITERES = Object.freeze(["fidelite_brief","charte_noir_or","composition","lumiere","emotion","differenciation"]);

/* Scorer humain rapide : enregistré via le contrat QualityScorer de B1 (aucune architecture nouvelle).
   La notation est saisie dans l'écran Banc et stockée dans run.scores — score() ne fait que la relire. */
registerQualityScorer({
  id: "human-rapide", label: "Notation humaine rapide (statut + motifs)",
  async score(testResult, testCase, run){
    const s = run && run.scores ? run.scores[testResult.caseId] : null;
    return s ? { total: s.statut==="publiable"?1:0, grille:{ statut:s.statut, motifs:s.motifs||[] }, scorerId:"human-rapide" } : null;
  },
});

/* Agrégats de notation d'un run (aucun stockage : toujours recalculé depuis run.scores). */
function computeRunScoreStats(run){
  const cases = (run.cases||[]).filter(c=> c.result);
  const okCases = cases.filter(c=> c.result.status==="ok");
  const scores = run.scores || {};
  const notes = okCases.map(c=> scores[c.result.caseId]).filter(Boolean);
  const compte = { publiable:0, retravailler:0, regenerer:0 };
  const motifs = {};
  const parPrestation = {};
  notes.forEach((s,i)=>{
    compte[s.statut] = (compte[s.statut]||0) + 1;
    (s.motifs||[]).forEach(m=>{ motifs[m] = (motifs[m]||0)+1; });
  });
  okCases.forEach(c=>{
    const s = scores[c.result.caseId]; if(!s) return;
    const p = c.testCase.labels.prestation;
    parPrestation[p] = parPrestation[p] || { notes:0, publiables:0 };
    parPrestation[p].notes++; if(s.statut==="publiable") parPrestation[p].publiables++;
  });
  return {
    total: cases.length, ok: okCases.length, erreurs: cases.length - okCases.length,
    notes: notes.length, compte, motifs, parPrestation,
    tauxPubliables: notes.length ? compte.publiable/notes.length : null,
    tauxEchecTechnique: cases.length ? (cases.length-okCases.length)/cases.length : null,
    coutMoyen: run.costMeasuredCases ? run.costMeasuredTotal/run.costMeasuredCases : null,
    dureeMoyenneMs: cases.length ? run.durationTotal/cases.length : null,
  };
}

/* ============================================================
   EXPÉRIENCE experience2_brief_complet — comparaison automatique, fonction pure et additive.
   Ne modifie ni ne lit rien d'autre que les deux runs passés en argument. Ne touche PAS à
   computeRunVerdict/computeRunExplanation (système de notation humaine "publiable/refus"),
   volontairement distinct : ici on compare la FIDÉLITÉ AU BRIEF telle que déjà mesurée par
   l'analyseur visuel existant (Phase B, IMAGE_ANALYSIS_SCHEMA.briefMismatch) — aucune nouvelle
   analyse, aucun nouvel appel API, uniquement une relecture des diagnostics déjà produits.
   Les mots-clés ci-dessous sont un repérage textuel INFORMATIF (pas un classifieur) : la liste
   brute des briefMismatch reste toujours disponible dans `rows` pour vérification manuelle. */
function computeBriefCompletComparison(runComplet, runBaseline){
  const kw = (list, words) => (list||[]).some(m => words.some(w=> String(m||"").toLowerCase().includes(w)));
  const byId = new Map((runBaseline.cases||[]).map(c=> [c.result && c.result.caseId, c]));
  const rows = (runComplet.cases||[]).map(cComplet=>{
    const id = cComplet.result && cComplet.result.caseId;
    const cBase = byId.get(id);
    const labels = cComplet.testCase.labels;
    const analyseComplet = cComplet.result?.diagnostics?.image?.analysis || null;
    const analyseBase = cBase?.result?.diagnostics?.image?.analysis || null;
    /* CORRECTIF : un cas en échec technique (status !== "ok", ou pas d'analyse visuelle produite,
       ex. "Failed to fetch" réseau) ne doit JAMAIS être traité comme "0 mismatch" — ce serait
       compter un crash comme une amélioration parfaite. Un tel cas est explicitement EXCLU du
       calcul et signalé à part (echecTechnique: true), jamais mélangé aux deltas. */
    const echecComplet = !cComplet.result || cComplet.result.status!=="ok" || !analyseComplet;
    const echecBaseline = !cBase || !cBase.result || cBase.result.status!=="ok" || !analyseBase;
    const mismComplet = (analyseComplet && analyseComplet.briefMismatch) || [];
    const mismBase = (analyseBase && analyseBase.briefMismatch) || [];
    return {
      caseId: id, prestation: labels.prestation, platform: labels.platform,
      trouveDansBaseline: !!cBase, echecTechnique: echecComplet || echecBaseline,
      echecDetail: echecComplet ? "brief_complet : "+((cComplet.result && cComplet.result.errors && cComplet.result.errors[0]) || "pas d'analyse visuelle") : (echecBaseline ? "baseline : cas non exploitable" : null),
      baseline: {
        mismatchCount: mismBase.length, mismatchList: mismBase,
        seuilMismatch: kw(mismBase, ["seuil","monument"]),
        profondeurMismatch: kw(mismBase, ["plan ","profondeur","arrière-plan","premier plan","flou"]),
      },
      briefComplet: {
        mismatchCount: mismComplet.length, mismatchList: mismComplet,
        seuilMismatch: kw(mismComplet, ["seuil","monument"]),
        profondeurMismatch: kw(mismComplet, ["plan ","profondeur","arrière-plan","premier plan","flou"]),
        transmissionCheck: cComplet.result?.diagnostics?.transmissionCheck || null,
      },
      delta: (echecComplet || echecBaseline) ? null : mismComplet.length - mismBase.length,
    };
  });
  /* "comp" = cas réellement exploitables des DEUX côtés. Les échecs techniques ne comptent
     JAMAIS dans ameliores/stables/degrades, quelle que soit leur cause. */
  const comp = rows.filter(r=> r.trouveDansBaseline && !r.echecTechnique);
  const echecs = rows.filter(r=> r.echecTechnique);
  const ameliores = comp.filter(r=> r.delta<0).length;
  const stables = comp.filter(r=> r.delta===0).length;
  const degrades = comp.filter(r=> r.delta>0).length;
  const seuilBaseCount = comp.filter(r=> r.baseline.seuilMismatch).length;
  const seuilCorrige = comp.filter(r=> r.baseline.seuilMismatch && !r.briefComplet.seuilMismatch).length;
  const profBaseCount = comp.filter(r=> r.baseline.profondeurMismatch).length;
  const profCorrige = comp.filter(r=> r.baseline.profondeurMismatch && !r.briefComplet.profondeurMismatch).length;
  const transmissionOk = comp.filter(r=> r.briefComplet.transmissionCheck && r.briefComplet.transmissionCheck.plansVisuelsTransmis).length;
  const verdict = echecs.length > 0 ? `non concluant — ${echecs.length}/${rows.length} cas en échec technique, exclus du calcul (voir echecs). Relancer pour obtenir un échantillon complet.`
    : comp.length===0 ? "non concluant — baseline introuvable ou aucun cas commun"
    : transmissionOk < comp.length ? "invalide — plansVisuels non transmis sur au moins un cas exploitable (vérifier avant d'interpréter)"
    : ameliores > degrades && ameliores >= Math.ceil(comp.length*0.5) ? "amélioration nette"
    : ameliores > degrades ? "amélioration partielle"
    : ameliores === degrades ? "gain faible ou nul"
    : "dégradation";
  return {
    generatedAt: new Date().toISOString(),
    runCompletId: runComplet.runId, runBaselineId: runBaseline.runId,
    nbCasComparables: comp.length, nbCasTotal: rows.length, nbCasEchecTechnique: echecs.length,
    transmissionConfirmeeSur: `${transmissionOk}/${comp.length}`,
    ameliores, stables, degrades,
    seuilMonumentalCorrigeSur: `${seuilCorrige}/${seuilBaseCount}`,
    profondeurCorrigeeSur: `${profCorrige}/${profBaseCount}`,
    verdict, rows, echecs,
  };
}

/* VERDICT — 4 états. "non concluant" est OBLIGATOIRE tant que l'écart n'est pas significatif :
   le pipeline est stochastique, un verdict binaire sur quelques images serait trompeur.
   Marge = intervalle de confiance binomial approché (95%) sur la différence de deux proportions. */
function computeRunVerdict(run, refRun){
  const a = computeRunScoreStats(run);
  if(!refRun) return { verdict:"non concluant", raison:"Aucun run de référence épinglé — ce run peut devenir la référence.", stats:a, ref:null };
  const b = computeRunScoreStats(refRun);
  if(run.topicBankVersion !== refRun.topicBankVersion)
    return { verdict:"non concluant", raison:`Banques de sujets différentes (v${run.topicBankVersion} vs v${refRun.topicBankVersion}) : runs non comparables.`, stats:a, ref:b };
  if(a.notes < 10 || b.notes < 10)
    return { verdict:"non concluant", raison:`Notation insuffisante (${a.notes} cas notés contre ${b.notes} sur la référence) : au moins 10 de chaque côté.`, stats:a, ref:b };
  const p1=a.tauxPubliables, n1=a.notes, p2=b.tauxPubliables, n2=b.notes;
  const marge = 1.96*Math.sqrt(Math.max(p1*(1-p1)/n1 + p2*(1-p2)/n2, 1e-9));
  const delta = p1-p2;
  let verdict;
  if(Math.abs(delta) < marge) verdict = "stabilité";
  else verdict = delta>0 ? "amélioration" : "régression";
  return {
    verdict, delta, marge,
    raison: verdict==="stabilité"
      ? `Écart de ${(delta*100).toFixed(1)} pt sur le taux de publiables, sous la marge d'incertitude (±${(marge*100).toFixed(1)} pt).`
      : `Taux de publiables ${delta>0?"en hausse":"en baisse"} de ${Math.abs(delta*100).toFixed(1)} pt (marge ±${(marge*100).toFixed(1)} pt).`,
    stats:a, ref:b,
  };
}

/* Niveau 2 — le "pourquoi" : motifs qui varient le plus, prestations qui bougent, composants modifiés. */
function computeRunExplanation(run, refRun){
  const a = computeRunScoreStats(run), b = refRun ? computeRunScoreStats(refRun) : null;
  const motifsDelta = [];
  if(b){
    new Set([...Object.keys(a.motifs), ...Object.keys(b.motifs)]).forEach(m=>{
      const d = (a.motifs[m]||0) - (b.motifs[m]||0);
      if(d!==0) motifsDelta.push({ motif:m, delta:d, actuel:a.motifs[m]||0, reference:b.motifs[m]||0 });
    });
    motifsDelta.sort((x,y)=> Math.abs(y.delta)-Math.abs(x.delta));
  }
  const prestations = [];
  if(b){
    Object.keys(a.parPrestation).forEach(p=>{
      const pa=a.parPrestation[p], pb=b.parPrestation[p];
      if(!pb || !pa.notes || !pb.notes) return;
      const d = (pa.publiables/pa.notes) - (pb.publiables/pb.notes);
      if(Math.abs(d) >= 0.2) prestations.push({ prestation:p, delta:d });
    });
    prestations.sort((x,y)=> y.delta-x.delta);
  }
  const composants = [];
  if(b && refRun.environment && run.environment){
    if(run.appVersion !== refRun.appVersion) composants.push(`VF_VERSION : ${refRun.appVersion} → ${run.appVersion}`);
    if(run.modulesHash !== refRun.modulesHash) composants.push("Modules (hash global) modifiés");
    const fa=(run.environment.knowledge||{}).fingerprints||{}, fb=(refRun.environment.knowledge||{}).fingerprints||{};
    Object.keys(fa).forEach(k=>{ if(k!=="modulesParCategorie" && fa[k]!==fb[k]) composants.push(`Connaissance modifiée : ${k}`); });
    const ca=fa.modulesParCategorie||{}, cb=fb.modulesParCategorie||{};
    Object.keys(ca).forEach(k=>{ if(ca[k]!==cb[k]) composants.push(`Modules ${k} modifiés`); });
    if(run.environment.modeleTexte !== refRun.environment.modeleTexte) composants.push(`Modèle texte : ${refRun.environment.modeleTexte} → ${run.environment.modeleTexte}`);
    if(run.environment.modeleRedacteur !== refRun.environment.modeleRedacteur) composants.push(`Modèle Rédacteur : ${refRun.environment.modeleRedacteur} → ${run.environment.modeleRedacteur}`);
  }
  /* Usage des modules : toujours utilisés / jamais utilisés (depuis les identifiants archivés). */
  const usage = {}; let casAvecModules = 0;
  (run.cases||[]).forEach(c=>{
    const ids = c.result && c.result.artifacts && c.result.artifacts.moduleIds;
    if(!Array.isArray(ids)) return;
    casAvecModules++;
    ids.forEach(id=>{ usage[id] = (usage[id]||0)+1; });
  });
  return { motifsDelta, prestations, composants, moduleUsage:{ usage, casAvecModules } };
}

/* Construit une TestSuite Smoke : matrice DYNAMIQUE prestations × plateformes (aucune valeur en dur —
   une prestation ou plateforme ajoutée demain entre automatiquement). options: { prestations?, plateformes? } */
function buildSmokeSuite(options){
  const prestations = (options && options.prestations) || KNOWN_PRESTATIONS;
  const plateformes = (options && options.plateformes) || PLATFORMS;
  const registres = (options && options.registres) || ["cinematographie","architecture","fantastique"];
  const cases = [];
  prestations.forEach(prestation=>{
    const t = BENCH_TOPIC_BANK.parPrestation[prestation] || BENCH_TOPIC_BANK.defaut;
    plateformes.forEach(platform=>{
      cases.push({
        caseId: `smoke_${hashPrompt(prestation+"|"+platform+"|"+BENCH_TOPIC_BANK.version)}`,
        executorId: (options && options.executorId) || "creative-image-sdz",
        labels: { prestation, platform },
        params: { mission: t.mission, prestation, platform, topic: t.sujet, topicId: t.id,
                  registres: [...registres], aspectKey: PLATFORM_ASPECT[platform],
                  size: API_IMAGE_SIZE_BY_PLATFORM[platform] || "1024x1024" },
      });
    });
  });
  return { suiteId: "smoke_"+BENCH_TOPIC_BANK.version, label: `Smoke — ${prestations.length} prestations × ${plateformes.length} plateformes`, mode: "smoke", topicBankVersion: BENCH_TOPIC_BANK.version, cases };

/* ---- Runner générique : séquentiel, sauvegarde après CHAQUE cas, reprise exacte, plafonds.
   Ne connaît AUCUN moteur : uniquement les contrats (suite, executors, storage). */
async function runBenchSuite(suite, opts){
  const o = opts || {};
  const storage = o.storage || (window.__benchStorage = window.__benchStorage || createBenchStorage());
  await ensurePersistentBenchStorage();
  const caps = { maxCases: o.maxCases ?? Infinity, maxCostUsd: o.maxCostUsd ?? Infinity, maxDurationMs: o.maxDurationMs ?? Infinity };

  let run;
  if(o.resumeRunId){
    run = await storage.getRun(o.resumeRunId);
    if(!run) throw new Error("Run à reprendre introuvable : "+o.resumeRunId);
    run = JSON.parse(JSON.stringify(run));
    run.status = "en_cours";
  } else {
    run = {
      runId: "run_"+Date.now().toString(36)+"_"+uid().slice(0,6),
      startedAt: new Date().toISOString(), finishedAt: null,
      mode: suite.mode, suiteId: suite.suiteId, suiteLabel: suite.label,
      topicBankVersion: suite.topicBankVersion,
      appVersion: VF_VERSION, modulesHash: computeModulesHash(),
      environment: { ...collectBenchEnvironment(), knowledge: { versions: KNOWLEDGE_VERSIONS, fingerprints: computeKnowledgeFingerprints(), priceTableVersion: BENCH_PRICE_TABLE.version } },
      selection: { nbCases: suite.cases.length },
      status: "en_cours", budgetCap: caps.maxCostUsd===Infinity?null:caps.maxCostUsd,
      costTotal: 0, costMeasuredTotal: 0, costMeasuredCases: 0, costEstimatedTotal: 0, durationTotal: 0,
      cases: suite.cases.map(c=>({ testCase: c, result: null })),
      scores: null, pinnedAsReference: false,
    };
    await storage.saveRun(run);
  }

  /* Contrôle d'espace pré-run (modes image uniquement) : blocage PROPRE avant toute dépense. */
  if(run.mode!=="smoke" && typeof navigator!=="undefined" && navigator.storage && navigator.storage.estimate){
    try{
      const est = await navigator.storage.estimate();
      const remaining = run.cases.filter(c=>!c.result).length;
      const needed = remaining * 2.5 * 1024 * 1024;
      const free = (est.quota||0) - (est.usage||0);
      if(free < needed) throw new Error(`Espace de stockage insuffisant : ~${Math.round(needed/1e6)} Mo nécessaires, ~${Math.round(free/1e6)} Mo disponibles. Libère de l'espace (purge d'images de runs) avant de lancer.`);
    }catch(e){ if(String(e.message||"").includes("insuffisant")) throw e; }
  }
  const keepAwake = o.keepAwake || { async acquire(){}, async release(){} }; // service injecté — no-op par défaut
  try{ await keepAwake.acquire(); }catch(e){}
  try{
  const runStart = Date.now();
  let executedThisSession = 0;
  for(let i=0; i<run.cases.length; i++){
    const slot = run.cases[i];
    if(slot.result) continue; // reprise : les cas déjà résolus ne sont JAMAIS ré-exécutés
    // Plafonds — arrêt PROPRE : statut dédié, sauvegarde immédiate, reprise possible
    let capHit = null;
    if(executedThisSession >= caps.maxCases) capHit = "nombre maximal de générations";
    else if(run.costTotal >= caps.maxCostUsd) capHit = "coût maximal";
    else if(Date.now()-runStart >= caps.maxDurationMs) capHit = "durée maximale";
    if(capHit){
      run.status = "suspendu_plafond"; run.suspendReason = capHit;
      await storage.saveRun(run);
      if(o.onProgress) o.onProgress({ done:i, total:run.cases.length, suspended:capHit });
      return run;
    }
    const executor = BENCH_EXECUTORS.get(slot.testCase.executorId);
    if(!executor){
      slot.result = { caseId: slot.testCase.caseId, status:"erreur", error:"Executor inconnu : "+slot.testCase.executorId, durationMs:0, costEstimated:0 };
    } else {
      if(o.onProgress) o.onProgress({ done:i, total:run.cases.length, current: slot.testCase.labels });
      const ctx = {
        mode: run.mode, benchMode:true, storage, onStatus: o.onStatus||null,
        runId: run.runId, slotState: slot,
        /* savePartial : persistance d'état intermédiaire du cas (ex. pendingJobId) — extension
           GÉNÉRIQUE du contrat, utile à tout futur moteur long (vidéo, campagne). */
        savePartial: async (patch)=>{ Object.assign(slot, patch); await storage.saveRun(run); },
      };
      slot.result = await executor.execute(slot.testCase, ctx);
      executedThisSession++;
    }
    /* Séparation stricte mesuré/estimé : costTotal (plafond) consomme le mesuré quand il existe,
       sinon l'estimé ; les deux cumuls restent archivés séparément. */
    const m = slot.result.metrics || {};
    const measured = (m.totalCostUsd!=null) ? m.totalCostUsd : null;
    const estimated = (m.costEstimated!=null) ? m.costEstimated : (slot.result.costEstimated||0);
    if(measured!=null){ run.costMeasuredTotal = +(run.costMeasuredTotal + measured).toFixed(6); run.costMeasuredCases++; }
    run.costEstimatedTotal = +(run.costEstimatedTotal + estimated).toFixed(6);
    run.costTotal = +(run.costTotal + (measured!=null ? measured : estimated)).toFixed(6);
    run.durationTotal += (slot.result.durationMs||0);
    await storage.saveRun(run); // sauvegarde après CHAQUE cas : la reprise est toujours exacte
  }
  run.status = "terminé"; run.finishedAt = new Date().toISOString();
  await storage.saveRun(run);
  if(o.onProgress) o.onProgress({ done:run.cases.length, total:run.cases.length, finished:true });
  return run;
  } finally { try{ await keepAwake.release(); }catch(e){} }
}

/* Purge des images d'un run (politique validée : métadonnées immortelles, images purgeables,
   références épinglées JAMAIS purgées, jamais de purge silencieuse). */
async function purgeRunImages(storage, runId){
  const run = await storage.getRun(runId);
  if(!run) throw new Error("Run introuvable.");
  if(run.pinnedAsReference) throw new Error("Run épinglé Référence officielle : images protégées.");
  let n = 0;
  for(const slot of (run.cases||[])){
    const id = slot.result && slot.result.outputs && slot.result.outputs.imageId;
    if(id){ await storage.deleteCaseImage(id); n++; }
  }
  run.imagesPurged = true;
  await storage.saveRun(run);
  return n;
}

/* ============================================================
   ONGLET AUDIT DES GÉNÉRATIONS — statistiques en lecture seule sur vf-images,
   vf-scheduled et vf-lab. Logique reprise à l'identique de l'outil d'audit
   externe validé (audit_generations.html) : mêmes règles de périmètre, de
   classification et de dénominateur. Aucune écriture, aucun appel réseau,
   aucun impact sur la production.
============================================================ */
function genAuditParseDateFromName(name){
  const m = String(name||"").match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : null; // ISO pour tri chronologique
}
function genAuditPlatformFromEntry(img){
  if(Array.isArray(img.tags) && img.tags.length && PLATFORMS.includes(img.tags[0])) return img.tags[0];
  const m = String(img.name||"").match(/^(Instagram|Facebook|Google Business|Article Blog Wix|Story)-/);
  return m ? m[1] : "(inconnue)";
}
/* Trois classes exclusives, alignées sur la sémantique exacte du serveur
   (process-image-job-background.js) :
   usedReference===true                       -> référence utilisée
   usedReference===false + fallbackReason     -> FALLBACK (référence attendue, non utilisée)
   tout le reste (false sans raison, undefined) -> sans référence demandée / donnée absente */
function genAuditClassify(entry){
  const used = entry.usedReference===true;
  const fallback = entry.usedReference===false && typeof entry.referenceFallbackReason==="string" && !!entry.referenceFallbackReason;
  return { used, fallback, noRef: !used && !fallback, reason: fallback ? entry.referenceFallbackReason : null };
}
function genAuditCollectRows(){
  /* Périmètre : uniquement les entrées issues d'une génération. Uploads manuels et
     références de bibliothèque (assetType "reference") exclus — ils n'ont jamais appelé OpenAI. */
  const genImages = state.images.filter(img =>
    img.assetType!=="reference" &&
    (img.usedReference!==undefined || img.creativeBrief || /^(Instagram|Facebook|Google Business|Article Blog Wix|Story)-\d{2}\/\d{2}\/\d{4}/.test(img.name||""))
  );
  const genScheduled = (state.scheduled||[]).filter(it => it && (it.usedReference!==undefined || it.imageDataUrl));
  const rows = [];
  genImages.forEach(img=>{
    const c = genAuditClassify(img);
    rows.push({ source:"Post individuel", id:img.id, name:img.name||"", platform:genAuditPlatformFromEntry(img),
      date:genAuditParseDateFromName(img.name), used:c.used, fallback:c.fallback, noRef:c.noRef, reason:c.reason,
      hasUsedRefField: img.usedReference!==undefined });
  });
  genScheduled.forEach(it=>{
    const c = genAuditClassify(it);
    rows.push({ source:"Campagne", id:it.id, name:(it.campaignLabel||"")+" / "+(it.platform||""), platform: it.platform||"(inconnue)",
      date:null, used:c.used, fallback:c.fallback, noRef:c.noRef, reason:c.reason,
      hasUsedRefField: it.usedReference!==undefined });
  });
  return { rows, totalImagesInLibrary: state.images.length, genImagesCount: genImages.length, genScheduledCount: genScheduled.length };
}
