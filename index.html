const KNOWN_REGISTRES = ["cinematographie","architecture","fantastique"];
const REGISTRE_LABELS = {
  cinematographie: "Cin√©matographie",
  architecture: "Architecture",
  fantastique: "Fantastique",
};
/* state.network (libell√©s d'affichage) ‚Üí identifiants techniques utilis√©s dans criteres.plateforme
   des modules MASTER_IMAGE V2 (ex : "story", "google_business"). Garde-fou : une plateforme non
   mapp√©e ne fait pas √©chouer la s√©lection, elle est simplement ignor√©e comme filtre (voir matchesPlatform). */
const CRITERES_PLATEFORME_MAP = {
  "Instagram": "instagram",
  "Facebook": "facebook",
  "Google Business": "google_business",
  "Article Blog Wix": "blog_wix",
  "Story": "story",
};
function platformCriteresId(platform){ return CRITERES_PLATEFORME_MAP[platform] || null; }

const PRIORITE_RANK = { haute:0, normale:1, basse:2 };

const IMAGE_FOUNDATION_BUDGET = 5000;       // Noir & Or
const IMAGE_REGISTRIES_TOTAL_BUDGET = 7000; // enveloppe commune, partag√©e dynamiquement entre registres actifs
const IMAGE_REGISTRY_MIN_BUDGET = 2000;
const IMAGE_REGISTRY_MAX_BUDGET = 4000;
const IMAGE_ADAPTATION_BUDGET = 2500;       // r√©serv√© pour une future couche adaptation/contexte (non exploit√© ici)
const IMAGE_TOTAL_HARD_LIMIT = 18000;       // filet de s√©curit√© final, jamais le m√©canisme principal

/* Compl√®te les crit√®res manquants ou partiels avec les valeurs par d√©faut du contrat :
   un module MASTER_IMAGE V2 sans `criteres`, ou avec des crit√®res incomplets, reste valide
   et se comporte comme un module permanent/toutes plateformes/tous objectifs/priorit√© haute. */
function normalizeCriteres(m){
  const c = m.criteres || {};
  const portee = (c.portee==="permanent" || c.portee==="contextuel") ? c.portee : "permanent";
  const priorite = ["haute","normale","basse"].includes(c.priorite) ? c.priorite : "haute";
  const plateforme = (Array.isArray(c.plateforme) && c.plateforme.length) ? c.plateforme : ["toutes"];
  const objectif = (Array.isArray(c.objectif) && c.objectif.length) ? c.objectif : ["tous"];
  return { portee, priorite, plateforme, objectif };
}

/* D√©termine √† quel registre appartient un module. Utilise en priorit√© un champ explicite
   `m.registre` (√† stamper lors d'un futur import enrichi des packs), et √† d√©faut un pr√©fixe
   d'id ‚Äî c'est la seule information de rattachement disponible dans les 5 fichiers actuels
   tant que l'import n'a pas √©t√© √©tendu pour porter cette donn√©e. Fragile si les ids changent :
   √† remplacer par un champ explicite d√®s que possible. */
const ID_PREFIX_TO_REGISTRE = {
  "constitution_": "constitution_generale",
  "noir_or_": "noir_or",
  "cinema_": "cinematographie",
  "architecture_": "architecture",
  "fantastique_": "fantastique",
};
function moduleRegistre(m){
  if(m.registre) return m.registre;
  const prefix = Object.keys(ID_PREFIX_TO_REGISTRE).find(p=> String(m.id||"").startsWith(p));
  return prefix ? ID_PREFIX_TO_REGISTRE[prefix] : null;
}
/* Num√©ro de bloc (1 √† 4) d√©duit de l'id (ex : "noir_or_c3_..." ‚Üí 3). Les modules de la
   Constitution g√©n√©rale n'ont pas de notion de bloc : ils comptent comme bloc 1. */
function moduleBloc(m){
  const match = String(m.id||"").match(/_c([1-4])_/);
  return match ? Number(match[1]) : 1;
}

/* S√©lectionne, trie et budg√®te les modules d'une couche (fondation ou un registre donn√©)
   selon le contrat : priorit√© d'abord (haute > normale > basse), puis bloc (1‚Üí2‚Üí3‚Üí4),
   puis ordre d'origine. Garantit qu'au moins un module de chaque bloc pr√©sent survit
   si le budget le permet, pour √©viter d'injecter une Constitution sans mise en ≈ìuvre. */
function pickForLayer(entries, budget){
  const sorted = entries.map((x,i)=>({...x, i})).sort((a,b)=>
    (PRIORITE_RANK[a.criteres.priorite]-PRIORITE_RANK[b.criteres.priorite]) || (a.bloc-b.bloc) || (a.i-b.i));
  const kept = []; const keptByBloc = {}; let total = 0;
  sorted.forEach(x=>{
    const len = x.m.content.length;
    if(kept.length===0 || total+len<=budget){ kept.push(x); total+=len; keptByBloc[x.bloc]=(keptByBloc[x.bloc]||0)+1; }
  });
  const blocsPresents = [...new Set(entries.map(x=>x.bloc))];
  blocsPresents.forEach(b=>{
    if(!keptByBloc[b]){
      const candidat = sorted.find(x=>x.bloc===b && !kept.includes(x));
      if(candidat && total+candidat.m.content.length <= budget*1.15){ kept.push(candidat); total+=candidat.m.content.length; }
    }
  });
  return kept.map(x=>x.m);
}

/* Point d'entr√©e du contrat d'orchestration MASTER_IMAGE V2. Ne touche √† rien de l'ancien
   moteur ; renvoie la liste des modules MASTER_IMAGE √† ajouter au prompt image. */
function selectMasterImageModules(platform){
  const all = state.modules.filter(m=> m.enabled && m.category==="MASTER_IMAGE");
  const entries = all.map(m=>({ m, criteres: normalizeCriteres(m), registre: moduleRegistre(m), bloc: moduleBloc(m) }));

  const platformId = platformCriteresId(platform || state.network);
  const matchesPlatform = c => c.plateforme.includes("toutes") || !platformId || c.plateforme.includes(platformId);

  // 1. Permanents (Constitution g√©n√©rale + invariants Noir & Or) : hors budget, toujours entiers
  const permanentEntries = entries.filter(x=> x.criteres.portee==="permanent" && matchesPlatform(x.criteres));

  // 2. Fondation Noir & Or (contextuel) : budget d√©di√©
  const foundationEntries = entries.filter(x=> x.criteres.portee==="contextuel" && x.registre==="noir_or" && matchesPlatform(x.criteres));
  const foundationKept = pickForLayer(foundationEntries, IMAGE_FOUNDATION_BUDGET);

  // 3. Registres contextuels actifs (state.registres) : enveloppe commune dynamique.
  //    Toute valeur inconnue dans state.registres est ignor√©e silencieusement (garde-fou migration).
  const activeRegistres = (state.registres||[]).filter(r=> KNOWN_REGISTRES.includes(r));
  const registryBudget = activeRegistres.length>0
    ? Math.min(IMAGE_REGISTRY_MAX_BUDGET, Math.max(IMAGE_REGISTRY_MIN_BUDGET, Math.floor(IMAGE_REGISTRIES_TOTAL_BUDGET/activeRegistres.length)))
    : 0;
  const registryKept = [];
  activeRegistres.forEach(r=>{
    const regEntries = entries.filter(x=> x.criteres.portee==="contextuel" && x.registre===r && matchesPlatform(x.criteres));
    registryKept.push(...pickForLayer(regEntries, registryBudget));
  });

  let kept = [...permanentEntries.map(x=>x.m), ...foundationKept, ...registryKept];

  // 4. Plafond global de s√©curit√© : dernier recours, retire d'abord les blocs les plus hauts (4‚Üí1)
  //    des couches contextuelles, jamais les modules permanents.
  let total = kept.reduce((s,m)=>s+m.content.length, 0);
  if(total > IMAGE_TOTAL_HARD_LIMIT){
    const reducible = [...registryKept, ...foundationKept]
      .map(m=>({ m, bloc: moduleBloc(m) }))
      .sort((a,b)=> b.bloc - a.bloc);
    for(const x of reducible){
      if(total<=IMAGE_TOTAL_HARD_LIMIT) break;
      const idx = kept.indexOf(x.m);
      if(idx!==-1){ total-=x.m.content.length; kept.splice(idx,1); }
    }
  }
  return kept;
}

   S'ex√©cute une seule fois (verrou vf-cleanup-2026-07) puis ne touche plus rien.

(function runOneTimeCleanup(){
  const FLAG = "vf-cleanup-2026-07";
  if(LS.get(FLAG, false)) return;

  const DELETE_STYLE_NAMES = ["noir & or","editorial","√©ditorial","cin√©matique","refuge",
    "√©nerg√©tique","energetique","nature","montagne","√©t√©","ete","mystique premium"];
  try{
    const styles = LS.get("vf-styles", null);
    if(Array.isArray(styles)){
      const seen = new Set();
      const cleaned = [];
      styles.forEach(s=>{
        const norm = (s.name||"").trim().toLowerCase();
        if(DELETE_STYLE_NAMES.includes(norm)) return;      // style √† supprimer explicitement
        if(seen.has(norm)) return;                          // doublon (ex: "Luxe silencieux" en double)
        seen.add(norm);
        cleaned.push(s);
      });
      if(cleaned.length !== styles.length) LS.set("vf-styles", cleaned);
    }
  }catch(e){ console.error("Nettoyage styles √©chou√© :", e); }

  const DELETE_MODULES = [
    { category:"Charte graphique", title:"Ton & identit√© visuelle" },
    { category:"Interdits", title:"Interdits g√©n√©raux" },
    { category:"R√®gles r√©dactionnelles", title:"Structure g√©n√©rale" },
    { category:"Direction artistique", title:"Style par d√©faut" },
    { category:"Univers de marque", title:"Pr√©sentation de la marque" },
  ];
  try{
    const modules = LS.get("vf-modules", null);
    if(Array.isArray(modules)){
      const cleaned = modules.filter(m =>
        !DELETE_MODULES.some(d => d.category===m.category && d.title===m.title)
      );
      if(cleaned.length !== modules.length) LS.set("vf-modules", cleaned);
    }
  }catch(e){ console.error("Nettoyage modules √©chou√© :", e); }

  LS.set(FLAG, true);
})();

function resizeImageFile(file, maxDim=1600, quality=0.85){
  return new Promise((resolve, reject)=>{

    reader.onload = () => {

      img.onload = () => {
        let {width,height} = img;
        if(width>maxDim || height>maxDim){
          if(width>height){ height = Math.round(height*maxDim/width); width = maxDim; }
          else { width = Math.round(width*maxDim/height); height = maxDim; }
        }
        const c = document.createElement("canvas"); c.width=width; c.height=height;

      img.src = reader.result;
    };

    reader.readAsDataURL(file);

/* L'IA ne doit jamais √™tre charg√©e de dessiner le logo (elle ne peut que l'approximer, jamais le reproduire
   fid√®lement) : on lui demande de laisser une zone d√©gag√©e, puis on incruste ici le vrai fichier logo
   marqu√© comme actif de marque dans la Biblioth√®que, exactement √† la position r√©gl√©e dans state.logoOverlay. */
/* Certains logos fournis ont un vrai fond blanc plein (pas transparent) plut√¥t qu'un PNG
   transparent ‚Äî plut√¥t que d'imposer √† Fabien de refaire le fichier, on d√©tecte ce cas et on
   retire automatiquement le fond blanc avant d'incruster le logo, avec un l√©ger adoucissement
   des bords pour √©viter un contour cr√©nel√©. Mis en cache par image pour ne le calculer qu'une
   fois par session. */
let _autoTransparentLogoCache = null; // { key, canvas }
async function getAutoTransparentLogo(logoAsset){
  const cacheKey = logoAsset.id + ":" + logoAsset.dataUrl.length;
  if(_autoTransparentLogoCache && _autoTransparentLogoCache.key===cacheKey) return _autoTransparentLogoCache.canvas;

  const img = await loadImage(logoAsset.dataUrl);
  const canvas = document.createElement("canvas");
  canvas.width = img.width; canvas.height = img.height;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0);

  // Le fond est-il r√©ellement opaque ? (coins non transparents) ‚Äî sinon on ne touche √† rien.
  const corners = [[0,0],[canvas.width-1,0],[0,canvas.height-1],[canvas.width-1,canvas.height-1]];
  const looksOpaque = corners.every(([x,y])=> ctx.getImageData(x,y,1,1).data[3] >= 250);
  if(!looksOpaque){
    _autoTransparentLogoCache = { key: cacheKey, canvas };
    return canvas;
  }

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imageData.data;

  // La couleur de fond r√©elle est d√©duite des coins (peu importe qu'elle soit blanche, noire, ou autre),
  // plut√¥t que de supposer un fond blanc ‚Äî sinon un fond noir plein (comme ici) n'√©tait jamais d√©tect√©.
  const cornerSamples = corners.map(([x,y])=>{
    const p = ctx.getImageData(x,y,1,1).data;
    return [p[0], p[1], p[2]];
  });
  const bg = [0,1,2].map(ch => Math.round(cornerSamples.reduce((s,c)=>s+c[ch],0) / cornerSamples.length));

  const DIST_THRESHOLD = 40;   // en dessous, consid√©r√© comme faisant partie du fond √† retirer
  const FEATHER_RANGE = 35;    // adoucissement du contour pour √©viter un bord cr√©nel√©
  for(let i=0; i<d.length; i+=4){
    const r=d[i], g=d[i+1], b=d[i+2];
    const dist = Math.sqrt((r-bg[0])**2 + (g-bg[1])**2 + (b-bg[2])**2);
    if(dist <= DIST_THRESHOLD){
      d[i+3] = 0;
    } else if(dist <= DIST_THRESHOLD + FEATHER_RANGE){
      const t = 1 - (dist - DIST_THRESHOLD) / FEATHER_RANGE;
      d[i+3] = Math.round(d[i+3] * (1 - t));
    }
  }
  ctx.putImageData(imageData, 0, 0);
  _autoTransparentLogoCache = { key: cacheKey, canvas };
  return canvas;
}

   lui, est d√©j√† conserv√© s√©par√©ment dans Netlify Blobs et servi par /logo.png : on le r√©cup√®re
   automatiquement pour que le Canvas reste fiable sur tous les appareils. */
let _serverLogoAssetCache = null;
async function getOfficialLogoAsset(){

/* Signature de marque compl√®te et obligatoire apr√®s toute g√©n√©ration : vrai logo + nom de la
   marque + ville, toujours au m√™me endroit, avec le m√™me rendu ‚Äî jamais une signature "imagin√©e"
   par l'IA. C'est la seule signature consid√©r√©e comme valide. */
/* D√©coupe un texte en plusieurs lignes centr√©es qui tiennent dans une largeur maximale donn√©e. */
function wrapText(ctx, text, maxWidth){
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let current = "";
  words.forEach(word=>{
    const test = current ? current + " " + word : word;
    if(ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  });
  if(current) lines.push(current);
  return lines;
}

     cadre √† ce stade (plancher atteint), on continue de r√©duire sans plancher, en pixels, jusqu'√†
     ce que chaque ligne tienne r√©ellement dans maxWidth ‚Äî jamais de d√©bordement, quelle que soit
     la longueur de l'accroche. */
  {
    let guardTitleSize = layout.titleSize, guardSubtitleSize = layout.subtitleSize;
    let guardTitleTracking = layout.titleTracking, guardSubtitleTracking = layout.subtitleTracking;
    let guardTitleLines = layout.titleLines, guardSubtitleLines = layout.subtitleLines;
    let guardFits = layout.titleLines.every(line=>trackedTextWidth(ctx,line,guardTitleTracking)<=maxWidth)
      && layout.subtitleLines.every(line=>trackedTextWidth(ctx,line,guardSubtitleTracking)<=maxWidth);
    while(!guardFits && guardTitleSize>10){
      guardTitleSize -= 2; guardSubtitleSize = Math.max(10, Math.round(guardSubtitleSize*.96));
      guardTitleTracking = Math.max(1,Math.round(guardTitleSize*.15));
      guardSubtitleTracking = Math.max(1,Math.round(guardSubtitleSize*.13));
      ctx.font=`500 ${guardTitleSize}px 'Cinzel', Georgia, 'Times New Roman', serif`;
      guardTitleLines = wrapTrackedText(ctx,title,maxWidth,guardTitleTracking,2);
      ctx.font=`500 ${guardSubtitleSize}px 'Cinzel', Georgia, 'Times New Roman', serif`;
      guardSubtitleLines = subtitle?wrapTrackedText(ctx,subtitle,maxWidth,guardSubtitleTracking,2):[];
      guardFits = guardTitleLines.every(line=>trackedTextWidth(ctx,line,guardTitleTracking)<=maxWidth)
        && guardSubtitleLines.every(line=>trackedTextWidth(ctx,line,guardSubtitleTracking)<=maxWidth);
    }
    if(guardTitleSize!==layout.titleSize){
      layout.titleSize=guardTitleSize; layout.subtitleSize=guardSubtitleSize;
      layout.titleTracking=guardTitleTracking; layout.subtitleTracking=guardSubtitleTracking;
      layout.titleLines=guardTitleLines; layout.subtitleLines=guardSubtitleLines;
      layout.titleLineHeight=guardTitleSize*1.18; layout.subtitleLineHeight=guardSubtitleSize*1.34;
    }
  }

  const l=layout;
  let y=box.y*H+(box.h*H-l.total)/2;
  ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.shadowColor="rgba(0,0,0,.94)"; ctx.shadowBlur=Math.round(W*.012);
  ctx.fillStyle="#F5F2E9";
  ctx.font=`500 ${l.titleSize}px 'Cinzel', Georgia, 'Times New Roman', serif`;
  l.titleLines.forEach((line,index)=>{
    /* Sans sous-ligne s√©par√©e, la seconde ligne devient naturellement le niveau or, comme dans
       les affiches SDZ de r√©f√©rence : une seule phrase, deux niveaux de lecture. */
    ctx.fillStyle=!l.subtitleLines.length&&l.titleLines.length>1&&index===l.titleLines.length-1
      ? officialGoldGradient(ctx,y,y+l.titleLineHeight) : "#F5F2E9";
    drawTrackedText(ctx,line,centerX,y+l.titleSize*.54,l.titleTracking,"center");
    y+=l.titleLineHeight;
  });

  if(l.subtitleLines.length){
    y+=W*.010*l.scale;
    ctx.fillStyle=officialGoldGradient(ctx,y,y+l.subtitleLines.length*l.subtitleLineHeight);
    ctx.font=`500 ${l.subtitleSize}px 'Cinzel', Georgia, 'Times New Roman', serif`;
    l.subtitleLines.forEach(line=>{
      drawTrackedText(ctx,line,centerX,y+l.subtitleSize*.54,l.subtitleTracking,"center");
      y+=l.subtitleLineHeight;
    });
  }

  y+=W*.023*l.scale;
  const ruleH=Math.max(2,W*.0016);
  const ruleGradient=ctx.createLinearGradient(centerX-l.ruleW/2,0,centerX+l.ruleW/2,0);
  ruleGradient.addColorStop(0,"rgba(117,83,12,0)");
  ruleGradient.addColorStop(.36,"rgba(201,162,39,.82)");
  ruleGradient.addColorStop(.5,"rgba(245,242,233,.98)");
  ruleGradient.addColorStop(.64,"rgba(201,162,39,.82)");
  ruleGradient.addColorStop(1,"rgba(117,83,12,0)");
  ctx.shadowColor="rgba(224,197,106,.52)"; ctx.shadowBlur=Math.round(W*.008);
  ctx.fillStyle=ruleGradient;
  ctx.fillRect(centerX-l.ruleW/2,y,l.ruleW,ruleH);
  ctx.shadowBlur=0;
  y+=ruleH+W*.021*l.scale;

  ctx.shadowColor="rgba(224,197,106,.24)"; ctx.shadowBlur=Math.round(W*.014);
  ctx.drawImage(logoImg,centerX-l.logoW/2,y,l.logoW,l.logoH);
  ctx.shadowBlur=0;
  y+=l.logoH+W*.010*l.scale;

  ctx.textBaseline="top"; ctx.shadowColor="rgba(0,0,0,.90)"; ctx.shadowBlur=Math.round(W*.006);
  ctx.fillStyle="#F5F2E9";
  ctx.font=`500 ${l.brandSize}px 'Cinzel', Georgia, 'Times New Roman', serif`;
  drawTrackedText(ctx,"LA SANT√â DES Z√àBRES",centerX,y,Math.max(1,l.brandSize*.09),"center");
  y+=l.brandSize*1.18;
  ctx.fillStyle=officialGoldGradient(ctx,y,y+l.citySize*1.5);
  ctx.font=`500 ${l.citySize}px 'Cinzel', Georgia, 'Times New Roman', serif`;
  drawTrackedText(ctx,"RAISMES",centerX,y,Math.max(1,l.citySize*.24),"center");
  ctx.shadowBlur=0;
  return {
    headline:{titleLines:l.titleLines.length,subtitleLines:l.subtitleLines.length,titleSize:l.titleSize},
    signature:{logoWidth:Math.round(l.logoW),brandSize:l.brandSize},
    composition:"unified-centered-lockup",
  };
}

async function compositeBrandSignature(baseDataUrl, platform, options){
  /* V4.0 ‚Äî composition adaptative fond√©e sur les pixels r√©els. Le Planner ne fait qu'indiquer une
     pr√©f√©rence de zone ; Canvas conserve le dernier mot pour prot√©ger lisibilit√© et sujet. */
  await ensureBrandFontLoaded();
  const opts = options || {};
  const headline = String(opts.headline !== undefined ? opts.headline : (state.visualAccroche || "")).trim();
  const withLogo = opts.withLogo !== false;
  const logoAsset = withLogo ? await getOfficialLogoAsset() : null;
  if(withLogo && !logoAsset) return { applied:false, headlineApplied:false, dataUrl:baseDataUrl,
    layoutReport:{version:"canvas-layout-v4",blockingError:"Logo officiel SDZ indisponible."} };
  if(!withLogo && !headline) return { applied:false, headlineApplied:false, dataUrl:baseDataUrl,
    layoutReport:{version:"canvas-layout-v4",skipped:true} };
  try{
    const img = await loadImage(baseDataUrl);
    const logoImg = logoAsset ? await loadImage(logoAsset.dataUrl) : null; // idem : logo pris tel quel
    const canvas = document.createElement("canvas");
    canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
    /* Story : position forc√©e en bas (demande explicite), qu'importe ce que le Planner a choisi
       pour zoneTexte ‚Äî c'est ce qui la distingue d'Instagram/Facebook, rest√©es adaptatives. */
    const preferredText=platform==="Story" ? "bottom" : (opts.brief && opts.brief.zoneTexte);
    const preferredLogo=opts.brief && opts.brief.zoneLogo;
    const protectedZones=normalizedProtectedZones(opts.analysis,opts.brief);
    const useUnifiedLockup=["Story","Instagram","Facebook"].includes(platform)&&!!headline&&!!logoImg;
    const lockupBox=useUnifiedLockup
      ? selectBrandRegion(pixels,platform,"lockup",preferredText||"bottom",null,protectedZones) : null;
    const pair=!useUnifiedLockup&&headline&&logoImg
      ? selectBrandLayoutPair(pixels,platform,preferredText,preferredLogo,protectedZones) : null;
    const textBox=headline ? (lockupBox||(pair?pair.text:selectBrandRegion(pixels,platform,"text",preferredText,null,protectedZones))) : null;
    const logoBox=logoImg ? (lockupBox||(pair?pair.logo:selectBrandRegion(pixels,platform,"logo",preferredLogo,textBox,protectedZones))) : null;
    const report={version:"canvas-layout-v4",platform,
      textZone:textBox&&textBox.id||null,logoZone:logoBox&&logoBox.id||null,
      composition:useUnifiedLockup?"unified-centered-lockup":"adaptive-separated",
      preferredText:normalizeOverlayZonePreference(preferredText),
      preferredLogo:normalizeOverlayZonePreference(preferredLogo),
      protectedZones:protectedZones.map(z=>z.label),scrimApplied:[],warnings:[]};

    /* Un voile d√©grad√© est local et progressif : il s√©curise la lecture sans fabriquer une carte,
       un bandeau opaque ou une esth√©tique de flyer. */
    if(lockupBox){
      const strength=.36+Math.min(.26,lockupBox.metrics.mean*.28+lockupBox.metrics.edge*.48);
      drawEditorialLockupScrim(ctx,lockupBox,strength); report.scrimApplied.push("lockup-full-width");
    }else if(textBox){
      const strength=.34+Math.min(.28,textBox.metrics.mean*.30+textBox.metrics.edge*.55);
      drawSoftScrim(ctx,textBox,strength); report.scrimApplied.push("text");
    }
    if(logoBox&&!lockupBox){
      const strength=.30+Math.min(.24,logoBox.metrics.mean*.25+logoBox.metrics.edge*.45);
      drawSoftScrim(ctx,logoBox,strength); report.scrimApplied.push("logo");
    }

    let headlineMetrics=null, logoMetrics=null;
    if(lockupBox){
      const metrics=drawPremiumBrandLockup(ctx,headline,logoImg,lockupBox,platform);
      headlineMetrics=metrics.headline;
      logoMetrics=metrics.signature;
    }else if(headline){
      headlineMetrics=drawPremiumHeadline(ctx,headline,textBox,platform);
      if(headlineMetrics.titleSize<canvas.width*.035) report.warnings.push("Accroche trop longue : corps minimal atteint.");
    }
    if(logoImg&&!lockupBox){
      logoMetrics=drawOfficialSignature(ctx,logoImg,logoBox,platform);
    }
    report.headline=headlineMetrics; report.signature=logoMetrics;
    return { dataUrl:canvas.toDataURL("image/png"), applied:!!logoImg,
      headlineApplied:!!headline, layoutReport:report };
  }catch(e){
    return { applied:false, headlineApplied:false, dataUrl:baseDataUrl,
      layoutReport:{version:"canvas-layout-v4",blockingError:`Composition Canvas impossible : ${e.message||e}`} };
  }
}

/* Normalisation finale l√©g√®re : gpt-image-2 g√©n√®re d√©j√† au ratio cible, ce passage ram√®ne seulement
   les quelques pixels d'√©cart aux dimensions officielles de publication, sans recadrage notable. */
async function normalizeToPlatformFormat(dataUrl, platform){
  const target = ASPECTS[PLATFORM_ASPECT[platform]];
  if(!target) return dataUrl;
  try{
    const img = await loadImage(dataUrl);
    if(img.width === target.w && img.height === target.h) return dataUrl;
    const canvas = document.createElement("canvas");
    canvas.width = target.w; canvas.height = target.h;
    const ctx = canvas.getContext("2d");
    const scale = Math.max(target.w/img.width, target.h/img.height);
    const dw = img.width*scale, dh = img.height*scale;
    ctx.drawImage(img, (target.w-dw)/2, (target.h-dh)/2, dw, dh);
    return canvas.toDataURL("image/png");
  }catch(e){ return dataUrl; } // d√©gradation propre : format d'origine conserv√©
}

async function syncOfficialLogoToServer(){
  const logoAsset = state.images.find(i=>i.assetType==="logo");

const PRESTATION_ALIASES = {

function escapeRegExpChar(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
/* Repliement caract√®re par caract√®re : chaque lettre de base couvre ses variantes accentu√©es via
   une classe de caract√®res ‚Äî jamais de d√©composition Unicode qui changerait la longueur du texte. */
const ACCENT_FOLD_CLASSES = { a:"[a√†√¢√§]", e:"[e√©√®√™√´]", i:"[i√Æ√Ø]", o:"[o√¥√∂]", u:"[u√π√ª√º]", c:"[c√ß]", n:"[n√±]", y:"[y√ø]" };
/* Construit un motif insensible √† la casse (flag i) et aux accents (classes ci-dessus), avec des
   espaces tol√©rants (\s+) et le symbole ¬Æ rendu optionnel/ignor√© ‚Äî appliqu√© directement au texte
   ORIGINAL, jamais √† une copie modifi√©e : aucun risque de d√©calage d'index. */
function buildAliasPattern(alias){
  let pattern = "";
  for(const ch of alias){
    if(ch === " "){ pattern += "\\s+"; continue; }
    if(ch === "¬Æ"){ pattern += "¬Æ?"; continue; }
    const lower = ch.toLowerCase();
    pattern += ACCENT_FOLD_CLASSES[lower] || escapeRegExpChar(ch);
  }
  return pattern;
}
/* Recherche ANCR√âE : l'alias ne compte que s'il occupe (espaces de d√©but tol√©r√©s) toute une ligne,
   √©ventuellement suivi d'un s√©parateur de titre (: - ‚Äì ‚Äî) ‚Äî jamais une occurrence au milieu d'une
   phrase (ex : "Reiki" cit√© en passant dans le texte de l'Offre Gold). */
function findAnchoredAliasIndex(text, alias){
  const pattern = buildAliasPattern(alias);
  const re = new RegExp(`^[ \\t]*${pattern}[ \\t]*(?:[:\\-‚Äì‚Äî][ \\t]*)?$`, "im");
  const m = re.exec(text);
  return m ? m.index : -1;
}
/* Fusionne le contenu de tous les modules "Prestations" activ√©s, en √©liminant les doublons exacts
   (si le m√™me texte a √©t√© coll√© dans plusieurs modules). Ne modifie jamais les modules eux-m√™mes. */
function getMergedPrestationsText(){
  const mods = state.modules.filter(m=>m.enabled && m.category==="Prestations");
  const seen = new Set();
  const parts = [];
  mods.forEach(m=>{

  });

}
/* Rep√®re, dans le texte fusionn√©, o√π commence chaque prestation connue (via ses alias, recherche
   ancr√©e en d√©but de ligne) et d√©coupe le texte entre deux noms de prestations cons√©cutifs pour
   isoler le bloc de d√©tails de chacune. Un nom canonique sans entr√©e dans PRESTATION_ALIASES
   retombe sur lui-m√™me (compatibilit√© totale avec l'existant). */
function extractPrestationBlocks(text){
  const found = [];
  KNOWN_PRESTATIONS.forEach(name=>{
    const aliases = (PRESTATION_ALIASES[name] || [name]).slice().sort((a,b)=> b.length - a.length);
    let bestIdx = -1;
    for(const alias of aliases){
      const idx = findAnchoredAliasIndex(text, alias);
      if(idx !== -1){ bestIdx = idx; break; } // d√©j√† tri√© du plus long au plus court : premier trouv√© = le bon
    }
    if(bestIdx !== -1) found.push({name, idx: bestIdx});
  });
  found.sort((a,b)=>a.idx-b.idx);
  const blocks = {};
  found.forEach((f,i)=>{
    const end = i+1<found.length ? found[i+1].idx : text.length;
    blocks[f.name] = text.slice(f.idx, end).trim();
  });
  return blocks;
}

/* ---------- MOTEUR DE CONTEXTE ----------
   S√©lectionne les modules pertinents pour les cat√©gories demand√©es, fusionne les doublons stricts
   (m√™me titre + m√™me contenu dans deux modules), trie selon la hi√©rarchie SDZ, puis applique un
   budget de caract√®res pour ne garder que ce qui a un r√©el impact ‚Äî qualit√© plut√¥t que quantit√©. */
/* ---------- Paliers de priorit√© par cat√©gorie ----------
   "always" : ADN de marque, ton, direction artistique, r√®gles dures, CTA, mission, et cat√©gories d√©j√†
              sp√©cifiques √† la plateforme (via TEXT_MODULE_MAP) ‚Äî jamais sacrifi√©es en premier.
   "rare"   : contenus de fond (glossaire, historique de d√©cisions, exemples, le√ßons) ‚Äî utiles mais
              plafonn√©s en nombre pour √©viter le remplissage syst√©matique.
   "context": tout le reste ‚Äî inclus seulement s'il est r√©ellement pertinent maintenant (voir plus bas). */
function moduleTier(category){
  const ALWAYS = ["MASTER SDZ","CODEX SDZ","Univers de marque","Charte graphique","Direction artistique",
    "R√®gles r√©dactionnelles","CTA","Missions","Interdits","√Ä ne jamais faire","√Ä faire",
    "Vocabulaire autoris√©","Vocabulaire interdit","Logo","Palette","Typographies",
    "Instagram","Facebook","Google Business","Stories","Blog Wix","SEO"];
  const RARE = ["D√©cisions importantes","Glossaire","Erreurs fr√©quentes","Exemples excellents",
    "Exemples valid√©s","Exemples refus√©s","Le√ßons apprises","Biblioth√®que d'id√©es"];
  if(ALWAYS.includes(category)) return "always";
  if(RARE.includes(category)) return "rare";
  return "context";
}
/* Pertinence contextuelle r√©elle, calcul√©e automatiquement (aucun r√©glage manuel ajout√© √† l'interface) :
   une connaissance "context" n'est inject√©e que si elle correspond √† la situation actuelle. */
function isContextRelevantNow(m){
  if(m.category==="Saisonnalit√©"){
    const season = getCurrentSeasonFR().toLowerCase();
    return m.content.toLowerCase().includes(season);
  }
  if(m.category==="Offres"){
    const t = `${state.topic||""} ${state.prestationName||""} ${state.mission||""}`.toLowerCase();
    return t.includes("cadeau") || t.includes("offre") || state.mission==="Vendre des bons cadeaux";
  }
  return true; // Prestations, Psychologie client, Personae, Objections clients : pertinents d√®s qu'ils existent
}
/* Quasi-d√©duplication : au sein d'une m√™me cat√©gorie, deux connaissances au contenu tr√®s proche
   (ex : "Univers SDZ" et "Fondation SDZ" qui disent la m√™me chose) ne sont inject√©es qu'une fois ‚Äî
   on garde la plus compl√®te des deux. Bas√© sur une similarit√© de mots, pas seulement un texte identique. */
function quasiDedup(mods){
  const kept = [];
  let removed = 0;
  mods.forEach(m=>{
    const dupIdx = kept.findIndex(k=> k.category===m.category && textSimilarity(k.content, m.content) > 0.6);
    if(dupIdx===-1){ kept.push(m); return; }
    removed++;
    if(m.content.length > kept[dupIdx].content.length) kept[dupIdx] = m;
  });
  return { kept, removed };
}

function selectModulesOrdered(categories, budgetChars){
  const allCats = [...new Set([...ALWAYS_ON_CATEGORIES, ...categories])];
  let mods = selectModules(allCats);
  const totalAvailable = mods.length;
  const lengthBefore = mods.reduce((s,m)=>s+m.content.length, 0);

  // 1. doublons stricts (contenu identique)
  const seen = new Set();
  let strictDuplicates = 0;
  mods = mods.filter(m=>{
    const key = m.category+"|"+m.title+"|"+m.content.trim();
    if(seen.has(key)){ strictDuplicates++; return false; }
    seen.add(key);
    return true;
  });
  // 2. quasi-doublons (id√©e tr√®s proche exprim√©e deux fois)
  const dedupResult = quasiDedup(mods);
  mods = dedupResult.kept;
  const duplicatesRemoved = strictDuplicates + dedupResult.removed;

  // 3. tri selon la hi√©rarchie SDZ
  const rank = c => { const i = HIERARCHY_ORDER.indexOf(c); return i===-1 ? HIERARCHY_ORDER.length : i; };
  mods = mods.map((m,i)=>({m,i})).sort((a,b)=> rank(a.m.category)-rank(b.m.category) || a.i-b.i).map(x=>x.m);

  // 4. paliers de priorit√© + pertinence contextuelle
  const always = mods.filter(m=> moduleTier(m.category)==="always");
  const contextAll = mods.filter(m=> moduleTier(m.category)==="context");
  const rareAll = mods.filter(m=> moduleTier(m.category)==="rare");
  const contextRelevant = contextAll.filter(isContextRelevantNow);
  const contextSkipped = contextAll.filter(m=>!isContextRelevantNow(m));

  // 5. construction budg√©t√©e : toujours en premier, puis contexte pertinent, puis rare (plafonn√© √† 2)
  const kept = []; const ignored = [];
  let total = 0;
  const tryAdd = (m)=>{
    const len = m.content.length;
    if(kept.length===0 || total+len<=budgetChars){ kept.push(m); total+=len; return true; }
    ignored.push(m); return false;
  };
  always.forEach(tryAdd);
  contextRelevant.forEach(tryAdd);
  let rareAdded = 0;
  rareAll.forEach(m=>{
    if(rareAdded>=2){ ignored.push(m); return; }
    if(tryAdd(m)) rareAdded++;
  });
  ignored.push(...contextSkipped);

  const lengthAfter = kept.reduce((s,m)=>s+m.content.length, 0);
  const gainPercent = lengthBefore>0 ? Math.round((1 - lengthAfter/lengthBefore)*100) : 0;
  const tokensSaved = Math.max(0, Math.round((lengthBefore-lengthAfter)/4));
  // Indice de pertinence : part du contenu inject√© qui est "toujours" ou "contexte pertinent" (par opposition au "rare")
  const highValueCount = always.filter(m=>kept.includes(m)).length + contextRelevant.filter(m=>kept.includes(m)).length;
  const relevanceIndex = kept.length>0 ? Math.round((highValueCount/kept.length)*100) : 100;

  return { kept, ignored, totalAvailable, totalKept: kept.length, duplicatesRemoved,
    lengthBefore, lengthAfter, gainPercent, tokensSaved, relevanceIndex };
}
/* D√©duit la plateforme d'un module "Erreurs fr√©quentes" : champ explicite si pr√©sent (retours cr√©√©s
   apr√®s cette correction), sinon extrait du titre "Retour <plateforme> ‚Äî ..." pour les anciens
   modules d√©j√† existants ‚Äî aucune migration n√©cessaire, aucune compatibilit√© cass√©e. */
function feedbackPlatform(m){
  if(m.platform) return m.platform;
  const match = (m.title||"").match(/^Retour (.+?) ‚Äî/);
  return match ? match[1] : null;
}
/* D√©duit la date de cr√©ation : champ explicite si pr√©sent, sinon extrait de l'id (uid() commence
   toujours par Date.now()) ‚Äî fonctionne aussi sur tous les anciens modules sans champ d√©di√©. */
function feedbackRecency(m){
  if(m.createdAt) return m.createdAt;
  const match = String(m.id||"").match(/^(\d+)-/);
  return match ? Number(match[1]) : 0;
}
/* S√©lection d√©di√©e des retours ("Erreurs fr√©quentes") ‚Äî remplace leur ancien traitement g√©n√©rique
   plafonn√© √† 2 emplacements partag√©s avec 7 autres cat√©gories (voir diagnostic pr√©c√©dent). Priorit√©
   √† la plateforme active, puis aux retours les plus r√©cents ; jusqu'√† 5 retours, jamais bloqu√©s
   ind√©finiment par d'anciens retours. Ne supprime rien du stockage : filtre uniquement √† l'affichage. */
function selectRecentFeedback(platform, maxCount){
  maxCount = maxCount || 5;
  const all = state.modules.filter(m=> m.enabled && m.category==="Erreurs fr√©quentes");
  const withMeta = all.map(m=>({ m, platform: feedbackPlatform(m), recency: feedbackRecency(m) }));
  const matching = withMeta.filter(x=> x.platform===platform).sort((a,b)=> b.recency-a.recency);
  const nonMatching = withMeta.filter(x=> x.platform!==platform).sort((a,b)=> b.recency-a.recency);
  return [...matching, ...nonMatching].slice(0, maxCount).map(x=>x.m);
}

  // state.history et state.scheduled (deux structures distinctes aujourd'hui, non reli√©es par id).
  const recentPool = pool.slice(-10);

  }

function buildUniversSDZBlock(allowed){
  const allowedIds = (allowed||[]).map(a=>a.id);

}

/* state.imageHistory : historique structur√© d√©di√© √† l'image (distinct de state.history, qui reste
   celui du texte). Un tableau d'entr√©es { platform, archetypeId, decor, cadrage, action, presenceSoin,
   createdAt }, aliment√© par recordStructuredImageEntry() apr√®s chaque g√©n√©ration accept√©e. */
function getRecentImageEntries(platform, limit){
  limit = limit || 5;
  return (state.imageHistory||[]).filter(e=>e.platform===platform).slice(-limit);
}
/* typeCreationImpose s√©lectionne le catalogue de d√©part : jamais m√©lang√© entre les deux registres. */
function computeAllowedArchetypes(mission, prestation, platform, typeCreationImpose, recentEntriesOverride){
  const sourceCatalog = typeCreationImpose === "affiche_fantastique" ? ARCHETYPE_CATALOG_FANTASTIQUE : ARCHETYPE_CATALOG;
  const compatible = sourceCatalog.filter(a=>
    (a.missionsCompatibles.includes("toutes") || !mission || a.missionsCompatibles.includes(mission)) &&
    (a.prestationsCompatibles.includes("toutes") || !prestation || a.prestationsCompatibles.includes(prestation))
  );
  const base = compatible.length ? compatible : sourceCatalog; // repli : aucune contrainte ne doit jamais vider le catalogue
  const recentIds = (recentEntriesOverride || getRecentImageEntries(platform, 5)).map(e=>e.archetype);
  const allowed = base.filter(a=> !recentIds.includes(a.id));
  if(allowed.length) return allowed;
  // Repli local d√©terministe (jamais de boucle d'appels) : l'arch√©type compatible le moins r√©cemment
  // utilis√© pour cette plateforme, m√™me s'il appara√Æt dans les 5 derniers.
  const withRecency = base.map(a=>{
    const idx = recentIds.lastIndexOf(a.id);
    return { a, lastUsedRank: idx===-1 ? -1 : idx };
  }).sort((x,y)=> x.lastUsedRank - y.lastUsedRank);
  return [withRecency[0].a];
}
/* Compare aux 3 derni√®res g√©n√©rations de cette plateforme : d√©cor/cadrage/action √† √©viter
   explicitement ‚Äî c'est ce qui emp√™che concr√®tement "personne allong√©e + mains sur le dos"
   de revenir alors qu'aucun champ ne le nommait jusqu'ici. */
function computeRecentCompositionExclusions(platform, recentEntriesOverride){
  const recent = recentEntriesOverride || getRecentImageEntries(platform, 3);
  const exclusions = [];
  recent.forEach(e=>{
    if(e.decor) exclusions.push(e.decor);
    if(e.framing) exclusions.push(e.framing);
    if(e.action) exclusions.push(e.action);
  });
  return [...new Set(exclusions)];
}

  const permanents = all.filter(m=> m.criteres && m.criteres.portee==="permanent");
  const noirOrHaute = all.filter(m=> m.criteres && m.criteres.portee==="contextuel" && m.criteres.priorite==="haute" && moduleRegistre(m)==="noir_or");
  const registresActifs = Array.isArray(registres) ? registres : [];
  const registreHaute = registresActifs.flatMap(r=>
    all.filter(m=> m.criteres && m.criteres.priorite==="haute" && moduleRegistre(m)===r).slice(0,2)
  );
  const picked = [...permanents, ...noirOrHaute.slice(0,3), ...registreHaute];
  let text = picked.map(m=>m.content).join(" ");
  if(text.length > BUDGET) text = text.slice(0, BUDGET) + "‚Ä¶";
  return { text, ids: picked.map(m=>m.id) };

/* Plafond global du bloc fiche prestation dans le prompt du Creative Planner ‚Äî entre 1400 et 1600
   caract√®res demand√©s, 1500 retenu. En cas de d√©passement, d√©gradation dans l'ordre exact demand√© :
   Tarif -> Dur√©e -> Public concern√© -> raccourcissement de Pr√©cautions -> jamais Description ni
   D√©roul√© de la s√©ance, prioritaires. Utilise l'argument `prestation` explicitement transmis au
   flux (jamais state.prestationName directement) ‚Äî ind√©pendant de l'√©tat global de l'interface. */
const PRESTATION_FICHE_PROMPT_BUDGET = 1500;
/* Budget du bloc fiche : ordre de d√©gradation inchang√© (Tarif ‚Üí Dur√©e ‚Üí Public ‚Üí Pr√©cautions
   raccourcies). L'ADN (citable, √©motion, promesse, signature, codes visuels) et la Description /
   le D√©roul√© ne sont JAMAIS retir√©s : ce sont eux qui rendent la prestation reconnaissable. */
function buildPrestationFicheBlock(prestation){
  const info = getSelectedPrestationInfo(prestation);
  if(!info) return `Prestation : ${prestation||"non pr√©cis√©e"}`;
  if(info.generic) return `Prestation : sujet g√©n√©ral ‚Äî ne force pas la mention d'une prestation pr√©cise, ne cite aucun nom de prestation sauf si le sujet l'exige naturellement.`;
  if(!info.block) return `Prestation : ${info.name} (non document√©e dans la base de connaissances ‚Äî utilise uniquement ce nom, n'invente aucun d√©tail).`;

  const f = info.fiche || {};
  const fields = {
    citable: f["caract√©ristique citable"] || "",
    concept: f["concept central"] || "",
    promesse: f["promesse unique"] || "",
    emotion: f["√©motion dominante"] || "",
    signature: f["signature narrative"] || "",
    codesVisuels: f["codes visuels"] || "",
    interditsVisuels: f["interdits visuels"] || "",
    description: f["description"] || "",
    deroule: f["d√©roul√© de la s√©ance"] || "",
    bienfaits: f["bienfaits"] || "",
    publicConcerne: f["public concern√©"] || "",
    precautions: f["pr√©cautions"] || "",
    duree: info.duree || "",
    tarif: info.tarif || "",
  };
  function assemble(includeTarif, includeDuree, includePublic, precautionsMaxLen){
    let out = `FICHE DE LA PRESTATION :\nNom : ${info.name}\n`;
    /* Rubrique prioritaire : si la fiche d√©signe une caract√©ristique citable, le Planner la reprend
       telle quelle ‚Äî il ne choisit plus lui-m√™me quelle phrase citer. Jamais tronqu√©e. */
    if(fields.citable) out += `Caract√©ristique citable (√† reprendre TELLE QUELLE dans "caracteristiqueSourcePrestation") : ${fields.citable}\n`;
    /* ADN de la prestation : ce qui la rend reconnaissable entre toutes. Plac√© avant la description
       car c'est ce qui doit guider la sc√®ne ‚Äî la description ne sert qu'√† v√©rifier les faits. */
    if(fields.concept) out += `Concept central (l'id√©e unique autour de laquelle toute la sc√®ne se construit) : ${fields.concept}\n`;
    if(fields.emotion) out += `√âmotion dominante (une seule, propre √† cette prestation) : ${fields.emotion}\n`;
    if(fields.promesse) out += `Promesse unique : ${fields.promesse}\n`;
    if(fields.signature) out += `Signature narrative : ${fields.signature}\n`;
    if(fields.codesVisuels) out += `Codes visuels propres √† cette prestation : ${fields.codesVisuels}\n`;
    if(fields.interditsVisuels) out += `√Ä ne jamais montrer pour cette prestation : ${fields.interditsVisuels}\n`;
    if(fields.description) out += `Description : ${fields.description}\n`;
    if(fields.deroule) out += `D√©roul√© de la s√©ance : ${fields.deroule}\n`;
    if(fields.bienfaits) out += `Bienfaits : ${fields.bienfaits}\n`;
    if(includePublic && fields.publicConcerne) out += `Public concern√© : ${fields.publicConcerne}\n`;
    if(fields.precautions){
      const p = precautionsMaxLen && fields.precautions.length > precautionsMaxLen
        ? fields.precautions.slice(0, precautionsMaxLen) + "‚Ä¶"
        : fields.precautions;
      out += `Pr√©cautions : ${p}\n`;
    }
    if(includeDuree && fields.duree) out += `Dur√©e : ${fields.duree}\n`;
    if(includeTarif && fields.tarif) out += `Tarif : ${fields.tarif}\n`;
    return out;
  }
  // D√©gradation progressive, dans l'ordre exact demand√© ‚Äî Description et D√©roul√© jamais retir√©s.
  let out = assemble(true, true, true, null);
  if(out.length > PRESTATION_FICHE_PROMPT_BUDGET) out = assemble(false, true, true, null);       // retire Tarif
  if(out.length > PRESTATION_FICHE_PROMPT_BUDGET) out = assemble(false, false, true, null);      // puis Dur√©e
  if(out.length > PRESTATION_FICHE_PROMPT_BUDGET) out = assemble(false, false, false, null);     // puis Public concern√©
  if(out.length > PRESTATION_FICHE_PROMPT_BUDGET) out = assemble(false, false, false, 150);      // puis raccourcit Pr√©cautions
  if(out.length > PRESTATION_FICHE_PROMPT_BUDGET) out = out.slice(0, PRESTATION_FICHE_PROMPT_BUDGET) + "‚Ä¶"; // filet de s√©curit√© ultime
  return out;
}

/* Normalisation utilis√©e uniquement pour v√©rifier qu'une formulation est r√©ellement contenue dans
   la fiche ‚Äî minuscules, accents neutralis√©s, ponctuation neutralis√©e, espaces normalis√©s. Sert
   uniquement √† une comparaison de contenu (pas de recherche positionnelle), la d√©composition
   Unicode est donc sans risque ici. */
function normalizeForContainmentCheck(str){
  return String(str||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[.,;:!?¬´¬ª""''()\-‚Äì‚Äî‚Ä¶]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

   s√©lectionn√©e est pr√©cise ET document√©e (point 1) ‚Äî sinon aucun blocage m√©tier n'est produit. */
/* Provenance d'une caract√©ristique ‚Äî containment TOL√âRANT calibr√© sur donn√©es r√©elles.
   Motif (bug d√©montr√©) : le containment strict rejetait des citations fid√®les pour un mot d'√©cart

   R√®gle : la phrase est accept√©e si elle est contenue telle quelle, OU si une s√©quence d'au moins
   CARAC_NGRAM_MIN mots cons√©cutifs de la caract√©ristique figure dans la fiche. Seuil calibr√© sur le
   run run_mrxy42vl : accepte les citations fid√®les, rejette une phrase √©trang√®re √† la fiche. */
const CARAC_NGRAM_MIN = 8;
function caracVientDeLaFiche(caracNorm, ficheSourceNorm){
  if(!caracNorm || !ficheSourceNorm) return false;
  if(ficheSourceNorm.includes(caracNorm)) return true;
  const mots = caracNorm.split(" ").filter(Boolean);
  if(mots.length < CARAC_NGRAM_MIN) return false; // trop courte pour √™tre v√©rifi√©e autrement
  for(let i=0; i+CARAC_NGRAM_MIN <= mots.length; i++){
    if(ficheSourceNorm.includes(mots.slice(i, i+CARAC_NGRAM_MIN).join(" "))) return true;
  }
  return false;
}

    fixed.pointDeTransformation = "le moment o√π la silhouette s'ouvre face √† l'horizon, symbolisant le l√¢cher-prise obtenu gr√¢ce au soin ‚Äî jamais le soin lui-m√™me";
    fixed.momentCinematographique = "l'instant pr√©cis o√π la silhouette, seule face √† l'immensit√© du paysage, incarne la l√©g√®ret√© retrouv√©e apr√®s le soin ‚Äî jamais une sc√®ne de soin ou de contact corporel";
    fixed.caracteristiquePrestationVisible = "aucune caract√©ristique physique du soin n'est montr√©e ‚Äî seule la silhouette lib√©r√©e dans le paysage exprime le r√©sultat ressenti";
    // Seul le symbole z√®bre/m√©daillon est neutralis√© (d√©clencheur identifi√©) ‚Äî un symbole propre √†
    // LA PRESTATION (ex. "courbe dor√©e √©pousant l'arrondi du ventre, comme un abri" pour la femme
    // enceinte) reste pr√©cieux : c'est justement ce qui diff√©rencie visuellement chaque prestation
    // au lieu que tout se ressemble une fois r√©duit au m√™me "silhouette + paysage". Supprimer TOUT
    // symbole syst√©matiquement avait aussi supprim√© cette diff√©renciation l√©gitime issue des fiches.
    const symboleBrut = String(fixed.symbolePrincipal||"");
    const estSymboleZebre = /z[e√®]bre|m[e√©]daillon|pendentif|embl[e√®]me|sceau|logo/i.test(symboleBrut);
    if(estSymboleZebre || !symboleBrut.trim()){

    }else{
      // Conserv√© et tiss√© dans la lumi√®re dor√©e du paysage, jamais comme objet ou logo pos√© sur le

      fixed.elementOr = `${fixed.elementOr}, la lumi√®re dor√©e du ciel ou du sable √©voquant subtilement ${symboleBrut.toLowerCase()}, jamais comme une forme ou un objet pos√© sur le sujet`;
    }
    // Le mod√®le a √©t√© observ√© en train d'inventer un m√©daillon d√©coratif avec t√™te de z√®bre sur le

    fixed.compositionInterdite = [...new Set([...(fixed.compositionInterdite||[]),

  /* Contrat d√©terministe des soins corporels : pr√©server la sc√®ne con√ßue par le Planner, mais

  if(isBodyContact && fixed.miseEnScene){

    fixed.miseEnScene.cadrage = `${String(fixed.miseEnScene.cadrage||"plan √©ditorial √† plusieurs plans").trim()} ; prestation, geste et mati√®re lisibles au premier regard, sans r√©duire la sc√®ne √† une silhouette isol√©e`;
    fixed.decor = `${String(fixed.decor||"espace de soin premium structur√© en plusieurs plans").trim()} ; d√©cor riche, sp√©cifique √† la prestation et visiblement structur√© par les registres actifs, jamais paysage g√©n√©rique servant de substitut au soin`;
    fixed.presenceSoin = "visible_editoriale";
    if(visibleCharacteristic && !normalizeForContainmentCheck(fixed.miseEnScene.action).includes(normalizeForContainmentCheck(visibleCharacteristic).split(" ")[0])){
      fixed.miseEnScene.action += ` ; caract√©ristique distinctive √† rendre visible : ${visibleCharacteristic}`;
    }
    fixed.compositionInterdite = [...new Set([...(fixed.compositionInterdite||[]),
      "silhouette seule marchant ou ouvrant les bras devant un lac, une montagne ou un coucher de soleil",
      "paysage naturel g√©n√©rique sans geste, mati√®re ni mat√©riel distinctif de la prestation",
      "une seule personne inactive lorsque la prestation exige un praticien et un b√©n√©ficiaire",
      "sc√®ne vide, fond noir uniforme ou d√©cor dor√© sans profondeur ni prestation lisible"] )];
    corrected = true;
  }

  // Vocabulaire √† connotation romantique/sensuelle : √† bannir syst√©matiquement des sc√®nes √†
  // contact corporel, quel que soit le drap√© d√©crit par ailleurs ‚Äî probable d√©clencheur direct du
  // filtre de s√©curit√© OpenAI (safety_violations=[sexual]) observ√© sur plusieurs g√©n√©rations massage.
  // Correction d√©terministe plut√¥t qu'une consigne au r√©dacteur, qui n'a pas suffi jusqu'ici.
  if(isBodyContact){
    const ROMANTIC_WORDS = [
      [/\bla premi√®re caresse\b/gi, "le premier geste du soin"],
      [/\bcaresses?\b/gi, "gestes"],
      [/\bcaress(?:e|er|ant|ante)\b/gi, "masser"],
      [/\bconnexion entre les mains et la peau\b/gi, "pr√©cision du geste sur la zone soign√©e"],
      [/\bvolupt(?:√©|ueux|ueuse)\b/gi, "d√©tente"],
      [/\bsensuel(?:le)?\b/gi, "apaisant"],
      [/\bc√¢lin(?:e)?\b/gi, "geste"],
    ];
    ["action","sujetPrincipal"].forEach(field=>{
      if(fixed.miseEnScene && typeof fixed.miseEnScene[field]==="string"){
        let v = fixed.miseEnScene[field];
        ROMANTIC_WORDS.forEach(([re,repl])=>{ v = v.replace(re, repl); });

    ["decor","momentCinematographique"].forEach(field=>{
      if(typeof fixed[field]==="string"){

        if(v!==fixed[field]){ fixed[field] = v; corrected = true; }

  }

  // Fait de marque permanent : SDZ n'emploie qu'un seul praticien, de genre masculin. Correction
  // d√©terministe (pas seulement une consigne au Planner) : toute mention f√©minine du praticien
  // dans les champs du brief est reformul√©e au masculin.
  ["action","sujetPrincipal"].forEach(field=>{

      fixed.miseEnScene[field] = fixed.miseEnScene[field].replace(/praticienne/gi, "praticien");
      corrected = true;

  if(typeof fixed.caracteristiquePrestationVisible==="string" && /praticienne/i.test(fixed.caracteristiquePrestationVisible)){
    fixed.caracteristiquePrestationVisible = fixed.caracteristiquePrestationVisible.replace(/praticienne/gi, "praticien");
    corrected = true;

  // Pause d√©terministe des automatismes observ√©s pendant les runs officiels. Le brief V2 place
  // d√©sormais la prestation r√©elle au centre et n'impose aucun symbole de substitution.
  if(typeCreationImpose==="affiche_fantastique"){
    fixed.compositionInterdite = [...new Set([...fixed.compositionInterdite, ...V2_MOTIFS_EN_PAUSE])];
    const symboleNorm = normalizeForContainmentCheck(fixed.symbolePrincipal);
    if(symboleNorm && symboleNorm!=="aucun"){

    if(contientMotifV2EnPause(fixed.decor)){
      fixed.decor = "espace noir profond abstrait, compos√© en plusieurs plans autour du sujet, du geste et du mat√©riel distinctif";
      corrected = true;
    }
    if(contientMotifV2EnPause(fixed.lumiere) || /symbole monumental|halo|cercle|axe|rayon vertical/i.test(String(fixed.lumiere||""))){
      fixed.lumiere = (archetypeRetenu && archetypeRetenu.lumieres && archetypeRetenu.lumieres[0])
        || "source chaude unique lat√©rale r√©v√©lant le sujet, le geste et le mat√©riel distinctif";
      corrected = true;
    }
    if(contientMotifV2EnPause(fixed.elementOr) || /particul|debris|d√©bris|etincell|√©tincell/i.test(String(fixed.elementOr||""))){
      fixed.elementOr = "reflets d'or m√©tallique noble sur le geste et le mat√©riel distinctif";
      corrected = true;
    }
    if(contientMotifV2EnPause(fixed.momentCinematographique)){
      fixed.momentCinematographique = getServiceVisualMoment(prestation);
      corrected = true;
    }
    if(contientMotifV2EnPause(fixed.miseEnScene.action)
      || /particul|debris|d√©bris|etincell|√©tincell|effet visuel|transformation physique/i.test(String(fixed.miseEnScene.action||""))){
      fixed.miseEnScene.action = getServiceHeroAction(prestation);
      corrected = true;
    }
    if(/^une adulte\b/i.test(String(fixed.miseEnScene.sujetPrincipal||""))){
      fixed.miseEnScene.sujetPrincipal = String(fixed.miseEnScene.sujetPrincipal)
        .replace(/^une adulte\b/i, "une personne adulte");
      corrected = true;
    }
    if(platform==="Story" && pointDeVueRabatLeSujet(fixed.miseEnScene.pointDeVue)){
      fixed.miseEnScene.pointDeVue = "angle trois-quarts √† hauteur du regard, posture valorisante";
      corrected = true;
    }
    if(platform==="Story" && fixed.niveauLuminosite!=="lumineux_eclatant"){
      fixed.niveauLuminosite = "lumineux_eclatant";
      corrected = true;
    }
    const negative = [String(fixed.negativePrompt||"").trim(),
      "mutation physique, transfiguration du visage, corps fragment√©, ambiance d'horreur, symboles occultes, faux logo, z√®bre d√©coratif"]
      .filter(Boolean).join(", ");
    if(negative !== fixed.negativePrompt){ fixed.negativePrompt = negative; corrected = true; }
  }

  // Contrat de d√©cor des registres actifs (Cin√©matographie/Architecture/Fantastique) : appliqu√©
  // quel que soit le style retenu (affiche fantastique OU luxe silencieux). Auparavant limit√© au
  // seul style "affiche fantastique" ‚Äî des registres coch√©s par l'utilisateur √©taient donc
  // silencieusement ignor√©s d√®s que le style basculait sur "luxe silencieux".
  // Le contrat de d√©cor des registres (architecture/cin√©matographie/fantastique) ne s'applique
  // JAMAIS par-dessus le d√©cor paysage des sc√®nes √† contact corporel : combiner "piliers
  // d'architecture" avec "d√©sert au coucher du soleil" recr√©ait visuellement le motif portail/seuil
  // qu'on a justement banni ailleurs (deux structures encadrant le sujet = une porte).
  const registryDecorContract = buildActiveRegistryDecorContract(fixed.registresActifs, prestation);
  if(registryDecorContract){
    const plannerDecor = String(fixed.decor||"").trim();
    const plannerDecorUtile = plannerDecor

    const decorAvecRegistres = plannerDecorUtile
      ? `${registryDecorContract}. D√©tail sp√©cifique du brief : ${plannerDecor}`
      : registryDecorContract;
    if(fixed.decor!==decorAvecRegistres){ fixed.decor = decorAvecRegistres; corrected = true; }
  }

  if(/transfigur/i.test(String(fixed.momentCinematographique||""))){
    fixed.momentCinematographique = String(fixed.momentCinematographique)
      .replace(/transfigur(?:√©|√©e|√©s|√©es|ation)/gi, "r√©v√©l√© par la lumi√®re sans alt√©ration physique");
    corrected = true;
  }
  if(platform==="Story"){
    const headline = ensureStoryHeadline(fixed.texteImage, prestation);

  // d√©j√† le total √† 6 mots, mais si elle n'est pas suivie, un titre+sous-titre trop long produit

  // ici plut√¥t que de compter uniquement sur le r√©tr√©cissement de Canvas.
  if((PLATFORM_OVERLAY[platform]==="accroche"||PLATFORM_OVERLAY[platform]==="fort") && typeof fixed.texteImage==="string" && fixed.texteImage.includes("|")){
    const [titrePart, ...rest] = fixed.texteImage.split("|").map(s=>s.trim());
    const sousLignePart = rest.join(" ");
    const titreMots = titrePart.split(/\s+/).filter(Boolean);
    const sousLigneMots = sousLignePart.split(/\s+/).filter(Boolean);
    if(titreMots.length>2 || sousLigneMots.length>4){
      const titreCourt = titreMots.slice(0,2).join(" ");
      const sousLigneCourte = sousLigneMots.slice(0,4).join(" ");
      fixed.texteImage = `${titreCourt} | ${sousLigneCourte}`;

     haut sur le visage du praticien, ni s√©parer arbitrairement logo et texte. */
  if(["Instagram","Facebook","Story"].includes(platform) && PLATFORM_OVERLAY[platform]!=="aucun"){
    if(fixed.zoneTexte!=="inf√©rieure"){ fixed.zoneTexte="inf√©rieure"; corrected=true; }
    if(fixed.zoneLogo!=="inf√©rieure"){ fixed.zoneLogo="inf√©rieure"; corrected=true; }
  }

  // 1. Interdits absolus : correction locale d√©terministe pour ne pas condamner tout un item
  //    de campagne sur un seul mot g√©n√©rique ("harmonie" avait bloqu√© Abhyanga au run 2).
  const impactNorm = normalizeForContainmentCheck(fixed.impactEmotionnelRecherche);
  const violationInterdite = VOCABULAIRE_INTERDIT_ABSOLU.find(mot => impactNorm.includes(normalizeForContainmentCheck(mot)));
  if(violationInterdite){
    fixed.impactEmotionnelRecherche = "renaissance lumineuse";
    corrected = true;
  }

  // 2. Ancrage r√©el ‚Äî m√™me contr√¥le que caracteristiqueSourcePrestation en V1, champ renomm√©.
  const info = getSelectedPrestationInfo(prestation);
  const prestationDocumentee = !!(info && !info.generic && info.block);
  let blockingError = null;
  let aucuneRaisonDetre = false;

  if(!prestationDocumentee){
    if(!fixed.ancrageReel) fixed.ancrageReel = "aucune prestation pr√©cise";
  } else {
    const carac = (fixed.ancrageReel || "").trim();
    const caracNorm = normalizeForContainmentCheck(carac);
    const ficheSource = `${(info.fiche && info.fiche["caract√©ristique citable"]) || ""} ${(info.fiche && info.fiche["description"]) || ""} ${(info.fiche && info.fiche["d√©roul√© de la s√©ance"]) || ""}`;
    const ficheSourceNorm = normalizeForContainmentCheck(ficheSource);
    if(!carac){
      blockingError = `Ancrage r√©el manquant ‚Äî le Planner V2 n'a fourni aucune valeur pour "ancrageReel".`;
    } else if(caracVientDeLaFiche(caracNorm, ficheSourceNorm)){

      blockingError = `Ancrage r√©el trop g√©n√©rique : "${carac}" ‚Äî formule g√©n√©rique introuvable dans la fiche de "${prestation}".`;
    } else {
      blockingError = `Ancrage r√©el non v√©rifiable dans la fiche : "${carac}" n'a pas √©t√© retrouv√© dans "${prestation}".`;
    }
  }

  // 3. raisonDetre ‚Äî marqueur distinct de blockingError (spec ¬ß3bis), jamais fondu dans les m√™mes
  //    statistiques qu'un √©chec r√©seau ou un √©chec d'ancrage. Non bloquant pour la g√©n√©ration
  //    d'image (elle continue), mais trac√© s√©par√©ment pour audit.
  const raisonNorm = normalizeForContainmentCheck(fixed.raisonDetre);
  const ancrageNorm = normalizeForContainmentCheck(fixed.ancrageReel);
  if(!raisonNorm || (ancrageNorm && raisonNorm === ancrageNorm)){
    aucuneRaisonDetre = true;
  }

  // 4. Filiation conflit ‚Üí momentCinematographique ‚Äî diagnostic non bloquant (pas de boucle de
  //    relance LLM au niveau Planner, voir note en t√™te de section). Trac√© pour audit uniquement.
  const conflitNorm = normalizeForContainmentCheck(fixed.conflit);
  const momentNorm = normalizeForContainmentCheck(fixed.momentCinematographique);
  const motsConflit = conflitNorm.split(" ").filter(w=>w.length>=5);
  const filiationFaible = motsConflit.length>0 && !motsConflit.some(w=>momentNorm.includes(w));

  return { brief: fixed, corrected, blockingError, aucuneRaisonDetre, filiationConflitMomentFaible: !!filiationFaible };
}

/* Relance r√©seau UNIQUE, distincte de tout contr√¥le de contenu ‚Äî voir note en t√™te de section.
   Ne couvre que l'√©chec brut de la requ√™te (ex. "Failed to fetch"), jamais un contenu invalide. */
async function generateCreativeBriefV2(mission, prestation, platform, topic, typeCreationImpose, registres, recentEntriesOverride, trace){
  const allowed = computeAllowedArchetypes(mission, prestation, platform, typeCreationImpose, recentEntriesOverride||null);
  const exclusions = computeRecentCompositionExclusions(platform, recentEntriesOverride||null);
  const systemPrompt = buildCreativePlannerSystemPromptV2();
  const userPrompt = buildCreativePlannerUserPromptV2(allowed, exclusions, mission, prestation, platform, topic, typeCreationImpose, registres, trace);
  const provider = state.apiProviders.find(p=>p.id===state.selectedProviderId) || DEFAULT_OPENAI_PROVIDER;

  const callOnce = async ()=>{
    const res = await fetch("/.netlify/functions/generate-text", {
      method:"POST", headers:{ "Content-Type":"application/json" },

    });

    const data = await res.json();

  const callAndParseOnce = async ()=>{
    const data = await callOnce();
    let rawBrief;
    try{ rawBrief = JSON.parse(data.text); }
    catch(e){
      throw new Error(`Creative Planner V2 ‚Äî erreur JSON.parse :\n${e.message}\n\nR√©ponse brute :\n${String(data.text||"").slice(0,1500)}`);
    }

  };

  let data, rawBrief, plannerNetworkRetryUsed = false;
  try{
    ({ data, rawBrief } = await callAndParseOnce());

    // si la cause est une surcharge momentan√©e (plusieurs appels Planner partent maintenant en
    // parall√®le pour une m√™me campagne). Quelle que soit la raison du premier √©chec (r√©seau,
    // timeout, ou JSON mal form√©/tronqu√© ‚Äî cause la plus fr√©quente en pratique).
    console.error("[Creative Planner V2] premier essai √©chou√©, nouvelle tentative dans 1.5s ‚Äî", err.message||err);

      await new Promise(r=>setTimeout(r,3000));

    }
  }
  const { brief, corrected, blockingError, aucuneRaisonDetre, filiationConflitMomentFaible } = validateAndFixBriefV2(rawBrief, allowed, exclusions, typeCreationImpose, prestation, platform, registres);
  const usage = data.usage ? { promptTokens: data.usage.prompt_tokens ?? null, completionTokens: data.usage.completion_tokens ?? null, model: provider.model } : null;
  return { brief, corrected, blockingError, aucuneRaisonDetre, filiationConflitMomentFaible, allowed, exclusions, usage, plannerNetworkRetryUsed };
}

/* ---------- CREATIVE PLANNER V1 (inchang√© ci-dessous) ---------- */
function validateAndFixBrief(brief, allowed, exclusions, typeCreationImpose, prestation){
  const allowedIds = allowed.map(a=>a.id);
  const fixed = { ...brief };
  let corrected = false;
  if(!allowedIds.includes(fixed.archetypeNarratif)){
    fixed.archetypeNarratif = allowedIds[0];
    corrected = true;
  }
  const collides = exclusions.some(ex => ex && fixed.decor && fixed.decor.toLowerCase().includes(String(ex).toLowerCase().slice(0,20)));
  if(collides){
    fixed.decor = `${fixed.decor} ‚Äî variante impos√©e localement : un d√©cor concr√®tement diff√©rent des g√©n√©rations r√©centes est requis, sans nouvel appel au concepteur.`;
    corrected = true;
  }
  if(!Array.isArray(fixed.compositionInterdite)) fixed.compositionInterdite = [];
  fixed.compositionInterdite = [...new Set([...fixed.compositionInterdite, ...exclusions])];

  // Type de cr√©ation : correction locale silencieuse (comme pour l'arch√©type), jamais un choix du mod√®le.
  if(fixed.typeCreation !== typeCreationImpose){
    fixed.typeCreation = typeCreationImpose;
    corrected = true;
  }

  const info = getSelectedPrestationInfo(prestation);
  const prestationDocumentee = !!(info && !info.generic && info.block);

  let blockingError = null;
  if(!prestationDocumentee){
    // Pas de prestation pr√©cise/document√©e : aucun contr√¥le m√©tier, une cha√Æne vide est accept√©e.
    if(!fixed.caracteristiqueSourcePrestation) fixed.caracteristiqueSourcePrestation = "aucune prestation pr√©cise";
  } else {
    // Provenance r√©elle v√©rifi√©e contre la fiche, jamais r√©par√©e en inventant une phrase ‚Äî un √©chec
    // ici bloque l'image (voir prepareCreativeBrief).
    const carac = (fixed.caracteristiqueSourcePrestation || "").trim();
    const caracNorm = normalizeForContainmentCheck(carac);
    /* V1.0 ‚Äî ORDRE CORRIG√â (bug d√©montr√© par le Smoke Run run_mrxy42vl) : la v√©rification de
       provenance passe AVANT la liste noire. Une phrase r√©ellement issue de la fiche est par
       d√©finition sp√©cifique √† cette prestation : la liste noire ne doit attraper que les formules
       que le Planner invente, jamais censurer les fiches elles-m√™mes (¬´ massage bien-√™tre sur
       table ¬ª EST le texte officiel de Prestations en entreprise).
       La rubrique ¬´ Caract√©ristique citable ¬ª de la fiche, si elle existe, fait partie des sources
       v√©rifiables au m√™me titre que Description et D√©roul√©. */
    const ficheSource = `${(info.fiche && info.fiche["caract√©ristique citable"]) || ""} ${(info.fiche && info.fiche["description"]) || ""} ${(info.fiche && info.fiche["d√©roul√© de la s√©ance"]) || ""}`;
    const ficheSourceNorm = normalizeForContainmentCheck(ficheSource);
    if(!carac){
      blockingError = `Caract√©ristique de prestation manquante ‚Äî le Planner n'a fourni aucune valeur pour "caracteristiqueSourcePrestation".`;
    } else if(caracVientDeLaFiche(caracNorm, ficheSourceNorm)){
      blockingError = null; // provenance √©tablie : aucune autre condition ne s'applique
    } else if(GENERIC_CARACTERISTIQUE_FORBIDDEN.some(mot => caracNorm.includes(mot))){
      blockingError = `Caract√©ristique de prestation trop g√©n√©rique : "${carac}" ‚Äî formule g√©n√©rique de bien-√™tre introuvable dans la fiche de "${prestation}". Reprends une phrase r√©elle de la Caract√©ristique citable, de la Description ou du D√©roul√© de la s√©ance.`;
    } else {
      blockingError = `Caract√©ristique de prestation non v√©rifiable dans la fiche : "${carac}" n'a pas √©t√© retrouv√©e dans "${prestation}". Aucune correction automatique n'est tent√©e.`;
    }
  }
  return { brief: fixed, corrected, blockingError };
}
async function generateCreativeBrief(mission, prestation, platform, topic, typeCreationImpose, registres, recentEntriesOverride, trace){
  const allowed = computeAllowedArchetypes(mission, prestation, platform, typeCreationImpose, recentEntriesOverride||null);

  const provider = state.apiProviders.find(p=>p.id===state.selectedProviderId) || DEFAULT_OPENAI_PROVIDER;

    throw new Error(`Creative Planner ‚Äî erreur JSON.parse :\n${e.message}\n\nR√©ponse brute :\n${String(data.text||"").slice(0,1500)}`);

const CHARTE_SDZ_SYNTHESE = "Charte SDZ : palette exclusivement noir et or (or noble, m√©tallique, satin√© ‚Äî jamais jaune vif, cuivre ou orange) ; clair-obscur dramatique avec une seule source de lumi√®re chaude ; rendu premium d'affiche de cin√©ma ; aucune imagerie de spa g√©n√©rique, aucun beige, brun ou bois clair dominant ; aucune r√©f√©rence culturelle ou religieuse r√©elle (ni temple, ni Bouddha, ni monument existant) ; visages naturels, intacts et cr√©dibles, cadr√©s de fa√ßon √©ditoriale ; √©motion forte port√©e par la lumi√®re, la composition et la prestation r√©elle, pas par la surcharge symbolique.";

/* ============================================================
   T1 ‚Äî ORCHESTRATEUR + PROMPT VALIDATOR (architecture fig√©e, mode rapport)
   R√®gles appliqu√©es : hi√©rarchie des d√©cisions (2.5 ‚Äî fusionne/refuse, ne r√©√©crit
   jamais une d√©cision m√©tier), transformations immuables (2.6 ‚Äî entr√©e intouch√©e,
   sortie NOUVELLE et gel√©e), ind√©pendance des couches (l'orchestrateur ignore GPT,
   le validator ne conna√Æt que le prompt assembl√© et le paquet).

/* ORCHESTRATEUR ‚Äî re√ßoit brief valid√© + registres + plateforme, retourne un paquet
   de donn√©es fusionn√©es/d√©doublonn√©es, gel√©. Ne r√©dige jamais, ne modifie jamais l'amont. */
function buildOrchestratorPacket(brief, registres, platform, aspectKey){
  const decisions = Object.freeze({
    sujet: brief.sujetPrincipal || "",
    action: brief.action || "",
    emotion: brief.emotion || "",
    symbole: symboleBriefUtile(brief.symbolePrincipal) ? brief.symbolePrincipal : "",
    instantChoisi: brief.pointDeTransformation || "",
    lienCausal: brief.caracteristiquePrestationVisible || "",
    registres: Object.freeze([...(registres||[])]),
    typeCreation: brief.typeCreation || "",
  });
  // Fusion des interdits : negativePrompt + compositions interdites, d√©doublonn√©s (normalis√©s)
  const rawInterdits = [
    ...String(brief.negativePrompt||"").split(/[;,]/),
    ...((brief.compositionInterdite||[])),
  ].map(s=>s.trim()).filter(Boolean);
  const seen = new Set(); const interdits = []; const doublonsInterdits = [];
  rawInterdits.forEach(x=>{
    const k = normalizeForContainmentCheck(x);
    if(seen.has(k)) doublonsInterdits.push(x); else { seen.add(k); interdits.push(x); }
  });
  const contraintesTechniques = Object.freeze({
    platform, aspect: aspectKey || "1:1",
    tailleApi: API_IMAGE_SIZE_BY_PLATFORM[platform] || "1024x1024",
    logoRequis: logoRequiredFor(platform),
  });
  return Object.freeze({
    decisions,
    interdits: Object.freeze(interdits),
    contraintesTechniques,
    rapportFusion: Object.freeze({ interditsAvant: rawInterdits.length, interditsApres: interdits.length, doublonsSupprimes: Object.freeze(doublonsInterdits) }),
  });
}

/* PROMPT VALIDATOR ‚Äî analyse le prompt assembl√© contre le paquet. Peut (√† terme) refuser ;
   en T1 il produit un RAPPORT gel√©, affich√© dans l'Inspector. Il ne corrige jamais rien. */
function validateAssembledPrompt(prompt, packet, brief){
  const normPrompt = normalizeForContainmentCheck(prompt||"");
  const report = { doublons: [], contradictions: [], decisionsAbsentes: [], preparationT3: [], longueur: (prompt||"").length };

  // 1) Doublons charte/narratif : notions de la charte d√©j√† port√©es par le corps du prompt
  //    (d√©tection par paires de mots-cl√©s ‚Äî informatif, jamais correctif)
  const notionsCharte = [
    ["noir", "or"], ["clair-obscur", "lumi√®re"], ["affiche", "cin√©ma"], ["visage", "frontal"],
  ];
  const corps = normalizeForContainmentCheck(String(prompt||"").split("Charte SDZ")[0]);
  notionsCharte.forEach(pair=>{
    if(pair.every(w=> corps.includes(normalizeForContainmentCheck(w)))) report.doublons.push(`Notion de charte d√©j√† exprim√©e dans le narratif : ${pair.join(" + ")}`);
  });

  // 2) Contradictions structurelles connues
  if(/aucun texte n'est incrust√©/i.test(prompt||"") && /texte incrust√©\s*[:‚Äî]/i.test(prompt||""))
    report.contradictions.push("Interdiction de texte ET consigne de texte incrust√© pr√©sentes simultan√©ment.");
  if(/sans jamais le redessiner/i.test(prompt||"") && /zone sobre en bas/i.test(prompt||""))
    report.contradictions.push("Logo en r√©f√©rence ET zone r√©serv√©e simultan√©ment ‚Äî strat√©gies logo m√©lang√©es.");

  // 3) Hi√©rarchie des d√©cisions : chaque d√©cision m√©tier doit survivre dans le prompt
  Object.entries({ sujet: packet.decisions.sujet, symbole: packet.decisions.symbole, "instant choisi": packet.decisions.instantChoisi, √©motion: packet.decisions.emotion }).forEach(([label, val])=>{
    const words = normalizeForContainmentCheck(String(val||"")).split(/\s+/).filter(w=>w.length>=5);
    if(words.length && !words.some(w=> normPrompt.includes(w))) report.decisionsAbsentes.push(label);
  });

  // 4) Pr√©paration T3 (anti-prose) : mesure des champs de d√©cision ‚Äî deviendra bloquant au sch√©ma atomique
  Object.entries(packet.decisions).forEach(([k,v])=>{
    if(typeof v==="string" && v.split(/\s+/).filter(Boolean).length > 15) report.preparationT3.push(`${k} : ${v.split(/\s+/).length} mots (cible T3 : ‚â§ 15, atomique)`);
  });

  return Object.freeze({ ...report, doublons: Object.freeze(report.doublons), contradictions: Object.freeze(report.contradictions), decisionsAbsentes: Object.freeze(report.decisionsAbsentes), preparationT3: Object.freeze(report.preparationT3) });
}

/* Copie int√©grale de rewriteBriefAsNarrative. Seule diff√©rence : pr√©sentation du brief en deux

async function rewriteBriefAsNarrativeGroupe(brief, variante){

  const callOnce = async (extraInstruction)=>{
    const res = await fetch("/.netlify/functions/generate-text", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        kind: "openai-compatible", model: DA_WRITER_MODEL, baseUrl: "https://api.openai.com/v1",

    if(!contentType.includes("application/json")) throw new Error(`R√©dacteur DA (priorites ${variante}) : r√©ponse non-JSON (statut ${res.status}).`);
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || `R√©dacteur DA (priorites ${variante}) : erreur ${res.status}`);

/* ---------- 5. M√âTADONN√âES ET S√âLECTION DES R√âF√âRENCES ---------- */
/* Une image de r√©f√©rence porte d√©sormais des m√©tadonn√©es optionnelles (referenceFamily, luminosite,
   narration, presenceHumaine, sceneSoin, echelle, plateformesCompatibles) ‚Äî r√©trocompatible : une
   image "reference" sans metadata reste s√©lectionnable (comportement par d√©faut : compatible avec tout). */
function selectReferencesForBrief(brief, platform, maxCount){
  maxCount = maxCount || 2;
  const candidates = state.images.filter(i=> i.assetType==="reference" && typeof i.dataUrl==="string" && i.dataUrl);
  const scored = candidates.map(img=>{
    const meta = img.referenceMeta || {};
    let score = 0;
    if(meta.referenceFamily && brief.referenceFamily && meta.referenceFamily===brief.referenceFamily) score += 3;
    if(!meta.referenceFamily) score += 1; // pas de metadata : neutre plut√¥t que p√©nalis√© (retrocompatibilit√©)
    if(meta.plateformesCompatibles && meta.plateformesCompatibles.length && meta.plateformesCompatibles.includes(platform)) score += 2;
    if(!meta.plateformesCompatibles) score += 1;
    if(meta.sceneSoin === (brief.presenceSoin!=="aucune")) score += 1;
    return { img, score };
  });
  scored.sort((a,b)=> b.score - a.score);
  // Forme riche demand√©e : {id, dataUrl, metadata} ‚Äî l'id est indispensable pour l'historique
  // (point 5), jamais le dataUrl complet qui y √©tait stock√© par erreur auparavant.
  return scored.slice(0, maxCount).map(x=>({ id: x.img.id, dataUrl: x.img.dataUrl, metadata: x.img.referenceMeta || null }));
}

/* Analyse l'image R√âELLEMENT obtenue (pas le brief) ‚Äî c'est cette sortie, pas le brief, qui doit
   fonder l'alt text final : le brief d√©crit une intention, l'image peut en diff√©rer. */
/* Copie r√©duite (JPEG, 1024px max) utilis√©e UNIQUEMENT pour l'analyse visuelle ‚Äî l'image d'origine
   (PNG complet en base64) n'est jamais envoy√©e telle quelle √† ce endpoint texte, et reste intacte
   pour la publication r√©elle. Repli sur l'original si le redimensionnement √©choue pour une raison
   quelconque, plut√¥t que de bloquer l'analyse. */
function resizeDataUrlForAnalysis(dataUrl, maxDim, quality){
  maxDim = maxDim || 1024; quality = quality || 0.7;
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height*maxDim/width); width = maxDim; }
          else { width = Math.round(width*maxDim/height); height = maxDim; }
        }
        const c = document.createElement("canvas"); c.width = width; c.height = height;
        c.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = ()=> resolve(dataUrl); // repli : image d'origine si le d√©codage √©choue
      img.src = dataUrl;
    }catch(e){ resolve(dataUrl); }
  });
}
async function buildProductComparisonForAnalysis(generatedDataUrl, referenceDataUrls){
  const refs=(Array.isArray(referenceDataUrls)?referenceDataUrls:[referenceDataUrls]).filter(Boolean).slice(0,3);
  if(!refs.length) return resizeDataUrlForAnalysis(generatedDataUrl,1024,.7);
  try{
    const [generated,...referenceImages]=await Promise.all([loadImage(generatedDataUrl),...refs.map(loadImage)]);
    /* La r√©f√©rence principale port√©e doit rester assez grande pour que l'analyseur voie r√©ellement
       le pont nasal, l'√©cran et les commandes. L'ancien empilement en trois bandes de 256 px
       √©crasait ces d√©tails et transformait des produits conformes en faux n√©gatifs. */
    const canvas=document.createElement("canvas"); canvas.width=1200; canvas.height=900;
    const ctx=canvas.getContext("2d"); ctx.fillStyle="#161616"; ctx.fillRect(0,0,canvas.width,canvas.height);
    const drawContain=(img,x,y,w,h)=>{
      const scale=Math.min(w/img.width,h/img.height);
      const dw=img.width*scale,dh=img.height*scale;
      ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
    };
    drawContain(referenceImages[0],0,0,520,450);
    if(referenceImages[1]) drawContain(referenceImages[1],0,450,260,450);
    if(referenceImages[2]) drawContain(referenceImages[2],260,450,260,450);
    drawContain(generated,520,0,680,canvas.height);
    ctx.strokeStyle="#C9A227"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(520,0); ctx.lineTo(520,900); ctx.stroke();
    return canvas.toDataURL("image/jpeg",.78);
  }catch(e){ return resizeDataUrlForAnalysis(generatedDataUrl,1024,.7); }
}

    const canvas=document.createElement("canvas"); canvas.width=1400; canvas.height=1000;
    const ctx=canvas.getContext("2d"); ctx.fillStyle="#111"; ctx.fillRect(0,0,canvas.width,canvas.height);
    const drawContain=(img,x,y,w,h)=>{

      ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);

  if(evidence){

    /* Un mod√®le de vision peut employer le mot ¬´ g√©n√©rique ¬ª par r√©flexe devant une recoloration.

    const missingSupporting=supporting.filter(([,key])=>evidence[key]==="absent").map(([label])=>label);
    if(missingCritical.length>=2 || (missingCritical.length>=1&&missingSupporting.length>=2) || missingSupporting.length===3){

  return String(analysis.productGeometryMismatch||"la g√©om√©trie du mat√©riel g√©n√©r√© ne correspond pas √† la r√©f√©rence officielle");

      blockingError = blockingError || "R√©f√©rence produit officielle Healy indisponible ‚Äî g√©n√©ration bloqu√©e avant l'appel image pour √©viter d'inventer un autre dispositif.";

  // L'identit√© et le texte font d√©sormais partie du contrat demand√© au mod√®le. Les anciens filtres

  }

     valid√© et le prompt assembl√©, produisent des objets gel√©s pour l'Inspector. Le prompt envoy√©
