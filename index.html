/* ============================================================
   CREATIVE PLANNER V2 — comparaison automatique. Même discipline que les comparaisons
   précédentes : cas en échec technique exclus, jamais comptés comme "0 mismatch". Diagnostics
   propres à V2 (aucuneRaisonDetre, filiationConflitMomentFaible, plannerNetworkRetryUsed) —
   rapportés séparément, jamais fondus avec un taux d'amélioration/dégradation. */
function computePlannerV2Comparison(runV2, runBaseline){
  const byId = new Map((runBaseline.cases||[]).map(c=> [c.result && c.result.caseId, c]));
  const rows = (runV2.cases||[]).map(cV2=>{
    const id = cV2.result && cV2.result.caseId;
    const cBase = byId.get(id);
    const labels = cV2.testCase.labels;
    const analyseV2 = cV2.result?.diagnostics?.image?.analysis || null;
    const analyseBase = cBase?.result?.diagnostics?.image?.analysis || null;
    const echecV2 = !cV2.result || cV2.result.status!=="ok" || !analyseV2;
    const echecBaseline = !cBase || !cBase.result || cBase.result.status!=="ok" || !analyseBase;
    const mismV2 = (analyseV2 && analyseV2.briefMismatch) || [];
    const mismBase = (analyseBase && analyseBase.briefMismatch) || [];
    return {
      caseId: id, prestation: labels.prestation, platform: labels.platform,
      trouveDansBaseline: !!cBase, echecTechnique: echecV2 || echecBaseline,
      echecDetail: echecV2 ? "Planner V2 : "+((cV2.result && cV2.result.errors && cV2.result.errors[0]) || "pas d'analyse visuelle") : (echecBaseline ? "baseline : cas non exploitable" : null),
      baseline: { mismatchCount: mismBase.length, mismatchList: mismBase },
      v2: {
        mismatchCount: mismV2.length, mismatchList: mismV2,
        plannerV2Diag: cV2.result?.diagnostics?.plannerV2 || null,
        archetypeEmotionnel: cV2.result?.artifacts?.brief?.archetypeNarratif || null,
      },
      delta: (echecV2 || echecBaseline) ? null : mismV2.length - mismBase.length,
    };
  });
  const comp = rows.filter(r=> r.trouveDansBaseline && !r.echecTechnique);
  const echecs = rows.filter(r=> r.echecTechnique);
  const ameliores = comp.filter(r=> r.delta<0).length;
  const stables = comp.filter(r=> r.delta===0).length;
  const degrades = comp.filter(r=> r.delta>0).length;
  const aucuneRaisonDetreCount = comp.filter(r=> r.v2.plannerV2Diag && r.v2.plannerV2Diag.aucuneRaisonDetre).length;
  const filiationFaibleCount = comp.filter(r=> r.v2.plannerV2Diag && r.v2.plannerV2Diag.filiationConflitMomentFaible).length;
  const networkRetryCount = comp.filter(r=> r.v2.plannerV2Diag && r.v2.plannerV2Diag.plannerNetworkRetryUsed).length;
  const verdict = echecs.length > 0 ? `non concluant — ${echecs.length}/${rows.length} cas en échec technique, exclus du calcul. Relancer pour obtenir un échantillon complet.`
    : comp.length===0 ? "non concluant — baseline introuvable ou aucun cas commun"
    : ameliores > degrades && ameliores >= Math.ceil(comp.length*0.5) ? "amélioration nette"
    : ameliores > degrades ? "amélioration partielle"
    : ameliores === degrades ? "gain faible ou nul"
    : "dégradation";
  return {
    generatedAt: new Date().toISOString(),
    runV2Id: runV2.runId, runBaselineId: runBaseline.runId,
    nbCasComparables: comp.length, nbCasTotal: rows.length, nbCasEchecTechnique: echecs.length,
    ameliores, stables, degrades,
    aucuneRaisonDetreSur: `${aucuneRaisonDetreCount}/${comp.length}`,
    filiationConflitMomentFaibleSur: `${filiationFaibleCount}/${comp.length}`,
    plannerNetworkRetryUseSur: `${networkRetryCount}/${comp.length}`,
    verdict, rows, echecs,
  };
}

function renderPlannerV2Comparison(zone, comparison){
  zone.innerHTML = "";
  const estNonConcluant = comparison.verdict.startsWith("non concluant");
  const couleurs = { "amélioration nette":"var(--green)", "amélioration partielle":"var(--green)", "gain faible ou nul":"var(--muted2)", "dégradation":"var(--red)" };
  const couleur = estNonConcluant ? "var(--muted2)" : (couleurs[comparison.verdict] || "var(--red)");
  const card = el("div",{class:"card", style:`border-left:4px solid ${couleur};margin-top:10px;`});
  card.appendChild(el("p",{class:"label"},"Comparaison automatique — Creative Planner V2"));
  card.appendChild(el("p",{style:`font-size:16px;font-weight:700;color:${couleur};margin-top:4px;`}, comparison.verdict.toUpperCase()));
  card.appendChild(el("p",{style:"font-size:12px;color:var(--muted2);margin-top:2px;"},
    `Baseline : ${comparison.runBaselineId} · V2 : ${comparison.runV2Id} · ${comparison.nbCasComparables}/${comparison.nbCasTotal} cas exploitables`));
  if(comparison.nbCasEchecTechnique>0){
    card.appendChild(el("p",{style:"font-size:13px;color:var(--red);margin-top:6px;font-weight:600;"},
      `${comparison.nbCasEchecTechnique} cas en échec technique — EXCLUS du calcul.`));
  }
  if(comparison.nbCasComparables>0){
    card.appendChild(el("p",{style:"font-size:13px;margin-top:8px;"}, `briefMismatch : ${comparison.ameliores} amélioré(s) · ${comparison.stables} stable(s) · ${comparison.degrades} dégradé(s).`));
    card.appendChild(el("p",{style:"font-size:12px;color:var(--muted2);"}, `Sortie précoce "aucune raison d'exister" : ${comparison.aucuneRaisonDetreSur} · Filiation conflit→moment faible : ${comparison.filiationConflitMomentFaibleSur} · Relance réseau utilisée : ${comparison.plannerNetworkRetryUseSur}`));
  }
  if(comparison.echecs.length){
    card.appendChild(el("p",{class:"label", style:"margin-top:10px;color:var(--red);"},"Cas en échec technique (exclus)"));
    comparison.echecs.forEach(r=> card.appendChild(el("p",{style:"font-size:12px;border-bottom:1px solid var(--border);padding:4px 0;"}, `${r.prestation} × ${r.platform} — ${r.echecDetail}`)));
  }
  card.appendChild(el("p",{class:"label", style:"margin-top:10px;"},"Détail des cas exploitables"));
  comparison.rows.filter(r=> !r.echecTechnique && r.trouveDansBaseline).forEach(r=>{
    const rowCard = el("div",{style:"border-bottom:1px solid var(--border);padding:6px 0;"});
    rowCard.appendChild(el("p",{style:"font-size:13px;font-weight:600;"}, `${r.prestation} × ${r.platform}`));
    rowCard.appendChild(el("p",{style:"font-size:12px;"}, `briefMismatch : ${r.baseline.mismatchCount} → ${r.v2.mismatchCount} (${r.delta<=0?"":"+"}${r.delta}) · archétype émotionnel : ${r.v2.archetypeEmotionnel||"?"}`));
    if(r.v2.mismatchList.length) rowCard.appendChild(el("p",{style:"font-size:11px;color:var(--muted2);margin-top:2px;"}, "Mismatch restants : "+r.v2.mismatchList.join(" · ")));
    card.appendChild(rowCard);
  });
  const dlBtn = el("button",{class:"btn-ghost", style:"margin-top:8px;", onclick:()=>{
    const blob = new Blob([JSON.stringify(comparison, null, 1)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `comparaison-planner-v2-${comparison.runV2Id}.json`;
    a.click();
    setTimeout(()=> URL.revokeObjectURL(a.href), 5000);
  }}, "Télécharger le rapport comparatif (JSON)");
  card.appendChild(dlBtn);
  zone.appendChild(card);
}

function buildSettingsTab(){
  const frag = el("div",{});

  /* ---- BANC D'ESSAI (B2) — lancement minimal en attendant l'écran complet (B4) ---- */
  frag.appendChild(el("p",{class:"label"},"Banc d'essai (B3)"));
  frag.appendChild(el("p",{class:"sublabel"},`Version ${VF_VERSION} · banque de sujets v${BENCH_TOPIC_BANK.version} · tarifs v${BENCH_PRICE_TABLE.version}. Données totalement isolées de la production. Smoke = Phase A seule (prompts + rapports, coût minime). Standard = 12 cas avec images. Complet = matrice entière avec images — c'est le mode du Golden Run officiel.`));
  const benchModeSel = el("select",{style:"margin:4px 0 8px;"},[
    el("option",{value:"smoke"},"Smoke — matrice complète, Phase A seule (~20-40 min, centimes)"),
    el("option",{value:"standard"},"Standard — 4 prestations × 3 plateformes, images (~15-25 min, ~1-3 $)"),
    el("option",{value:"standard_brief_complet"},"Standard — expérience brief_complet (mêmes 12 cas, plansVisuels réintégré)"),
    el("option",{value:"standard_priorites_a"},"Standard — expérience priorités A (regroupement seul, 0 instruction)"),
    el("option",{value:"standard_priorites_b"},"Standard — expérience priorités B (regroupement + règle de priorité)"),
    el("option",{value:"standard_prompt_direct_d1"},"Standard — expérience prompt direct D1 (sans Rédacteur)"),
    el("option",{value:"standard_planner_v2"},"Standard — Creative Planner V2 (impact émotionnel → mise en scène)"),
    el("option",{value:"complet"},"Complet — matrice entière, images (GOLDEN RUN, ~2-3 h, ~8-20 $)"),
  ]);
  frag.appendChild(benchModeSel);
  const benchStatus = el("p",{style:"font-size:12px;color:var(--muted2);min-height:16px;margin:4px 0 8px;"},"");
  const benchBtn = el("button",{class:"btn-secondary", style:"margin-bottom:6px;"}, [svgIcon(ICONS.sparkles,14), el("span",{},"Lancer un Smoke Run complet")]);
  const benchResumeBtn = el("button",{class:"btn-ghost", style:"margin-bottom:10px;display:none;"}, "Reprendre le run interrompu");
  let resumeCandidate = null;
  (async ()=>{
    try{
      const storage = window.__benchStorage = window.__benchStorage || createBenchStorage();
      const runs = await storage.listRuns();
      resumeCandidate = runs.find(r=> r.status==="en_cours" || r.status==="suspendu_plafond") || null;
      if(resumeCandidate){ benchResumeBtn.style.display=""; benchResumeBtn.textContent = `Reprendre le run interrompu (${resumeCandidate.runId})`; }
    }catch(e){ benchStatus.textContent = "Stockage du Banc indisponible : "+(e.message||e); }
  })();
  /* Service Wake Lock réel — injecté au runner (le framework n'en connaît que le contrat).
     Ré-acquisition sur visibilitychange : Android relâche le verrou à chaque arrière-plan. */
  const makeWakeLockService = ()=>{
    let sentinel = null, wanted = false;
    const acquire = async ()=>{ wanted = true;
      try{ if(navigator.wakeLock && !sentinel){ sentinel = await navigator.wakeLock.request("screen"); sentinel.addEventListener("release", ()=>{ sentinel = null; }); } }catch(e){}
    };
    const onVis = ()=>{ if(wanted && document.visibilityState==="visible") acquire(); };
    document.addEventListener("visibilitychange", onVis);
    return { acquire, async release(){ wanted = false; document.removeEventListener("visibilitychange", onVis); try{ if(sentinel) await sentinel.release(); }catch(e){} sentinel = null; } };
  };
  const STANDARD_PRESET = { prestations: Object.keys(BENCH_TOPIC_BANK.parPrestation), plateformes: ["Instagram","Story","Google Business"] };
  const launchBench = async (resumeRunId)=>{
    benchBtn.disabled = true; benchResumeBtn.disabled = true;
    try{
      const mode = benchModeSel.value;
      const suite = mode==="standard" ? { ...buildSmokeSuite(STANDARD_PRESET), suiteId:"standard_"+BENCH_TOPIC_BANK.version, mode:"standard", label:"Standard — "+STANDARD_PRESET.prestations.length+"×"+STANDARD_PRESET.plateformes.length }
        : mode==="standard_brief_complet" ? { ...buildSmokeSuite({ ...STANDARD_PRESET, executorId:"creative-image-sdz-brief-complet" }), suiteId:"standard-brief-complet_"+BENCH_TOPIC_BANK.version, mode:"standard", label:"Standard — expérience brief_complet" }
        : mode==="standard_priorites_a" ? { ...buildSmokeSuite({ ...STANDARD_PRESET, executorId:"creative-image-sdz-priorites-a" }), suiteId:"standard-priorites-a_"+BENCH_TOPIC_BANK.version, mode:"standard", label:"Standard — expérience priorités A" }
        : mode==="standard_priorites_b" ? { ...buildSmokeSuite({ ...STANDARD_PRESET, executorId:"creative-image-sdz-priorites-b" }), suiteId:"standard-priorites-b_"+BENCH_TOPIC_BANK.version, mode:"standard", label:"Standard — expérience priorités B" }
        : mode==="standard_prompt_direct_d1" ? { ...buildSmokeSuite({ ...STANDARD_PRESET, executorId:"creative-image-sdz-prompt-direct-d1" }), suiteId:"standard-prompt-direct-d1_"+BENCH_TOPIC_BANK.version, mode:"standard", label:"Standard — expérience prompt direct D1" }
        : mode==="standard_planner_v2" ? { ...buildSmokeSuite({ ...STANDARD_PRESET, executorId:"creative-image-sdz-planner-v2" }), suiteId:"standard-planner-v2_"+BENCH_TOPIC_BANK.version, mode:"standard", label:"Standard — Creative Planner V2" }
        : mode==="complet" ? { ...buildSmokeSuite(), suiteId:"complet_"+BENCH_TOPIC_BANK.version, mode:"complet", label:"Complet (Golden Run)" }
        : buildSmokeSuite();
      if(!resumeRunId && mode!=="smoke"){
        const estImage = suite.cases.length * 0.17; // qualité par défaut + analyse + contenu, ordre de grandeur
        const modeLabel = mode==="complet" ? "GOLDEN RUN — matrice entière" : mode==="standard_brief_complet" ? "Run Standard — expérience brief_complet" : mode==="standard_priorites_a" ? "Run Standard — expérience priorités A" : mode==="standard_priorites_b" ? "Run Standard — expérience priorités B" : mode==="standard_prompt_direct_d1" ? "Run Standard — expérience prompt direct D1" : mode==="standard_planner_v2" ? "Run Standard — Creative Planner V2" : "Run Standard";
        if(!confirm(`${modeLabel} : ${suite.cases.length} générations d'images réelles.\nCoût estimé : ~${estImage.toFixed(2)} $ (mesuré précisément pendant le run).\nDurée : ${mode==="complet" ? "~2-3 h" : "~15-25 min"} — l'écran restera allumé (Wake Lock).\nLancer ?`)){ benchBtn.disabled=false; benchResumeBtn.disabled=false; return; }
      }
      const run = await runBenchSuite(suite, {
        resumeRunId: resumeRunId || undefined,
        keepAwake: mode!=="smoke" ? makeWakeLockService() : undefined,
        maxDurationMs: mode==="complet" ? 4*60*60*1000 : 45*60*1000,
        onProgress: (p)=>{
          if(p.finished){ return; }
          if(p.suspended){ benchStatus.textContent = `Run suspendu (${p.suspended}) après ${p.done}/${p.total} — reprise possible.`; return; }
          benchStatus.textContent = `${p.done+1}/${p.total} — ${p.current ? p.current.prestation+" × "+p.current.platform : "..."}`;
        },
      });
      if(run.status==="terminé"){
        const ok = run.cases.filter(c=>c.result && c.result.status==="ok").length;
        const err = run.cases.filter(c=>c.result && c.result.status==="erreur").length;
        const replis = run.cases.filter(c=>c.result && c.result.diagnostics && !c.result.diagnostics.daWriterUsed).length;
        const coutTxt = run.costMeasuredCases>0 ? `${run.costMeasuredTotal.toFixed(4)} $ mesurés (${run.costMeasuredCases}/${run.cases.length} cas)` : `~${run.costEstimatedTotal.toFixed(4)} $ estimés (aucun usage remonté)`;
        benchStatus.textContent = `✓ Run ${run.runId} terminé : ${ok} ok · ${err} erreur(s) · ${replis} repli(s) Rédacteur · ${(run.durationTotal/1000/60).toFixed(1)} min · ${coutTxt}. Run archivé — écran complet en B4.`;
        /* EXPÉRIENCE experience2_brief_complet / experience2_priorites — comparaison automatique
           avec la baseline Standard. Recherche la baseline la plus récente de suiteId
           "standard_"+version parmi les runs archivés (mode==="standard", status==="terminé").
           N'affecte aucun autre mode. */
        if(mode==="standard_brief_complet" || mode==="standard_priorites_a" || mode==="standard_priorites_b" || mode==="standard_prompt_direct_d1" || mode==="standard_planner_v2"){
          try{
            const storageForCompare = benchStorage();
            const candidats = (await storageForCompare.listRuns()).filter(r=> r.mode==="standard" && r.status==="terminé" && r.runId!==run.runId);
            let baseline = null;
            for(const c of candidats.sort((a,b)=> String(b.startedAt).localeCompare(String(a.startedAt)))){
              const full = await storageForCompare.getRun(c.runId);
              if(full && full.suiteId==="standard_"+BENCH_TOPIC_BANK.version){ baseline = full; break; }
            }
            if(baseline){
              if(mode==="standard_brief_complet"){
                renderBriefCompletComparison(benchCompareZone, computeBriefCompletComparison(run, baseline));
              } else if(mode==="standard_planner_v2"){
                renderPlannerV2Comparison(benchCompareZone, computePlannerV2Comparison(run, baseline));
              } else {
                renderPrioritesComparison(benchCompareZone, computePrioritesComparison(run, baseline));
              }
            } else {
              benchCompareZone.innerHTML = "";
              benchCompareZone.appendChild(el("p",{style:"font-size:12px;color:var(--muted2);margin-top:8px;"},
                "Aucune baseline Standard (suiteId standard_"+BENCH_TOPIC_BANK.version+") trouvée dans les runs archivés — comparaison impossible. Épingle ou conserve le run Standard d'origine puis relance."));
            }
          }catch(e){
            benchCompareZone.innerHTML = "";
            benchCompareZone.appendChild(el("p",{style:"color:var(--red);font-size:12px;margin-top:8px;"}, "Comparaison impossible : "+(e.message||e)));
          }
        }
      } else {
        benchStatus.textContent = `Run ${run.runId} : ${run.status}.`;
      }
    }catch(err){
      benchStatus.textContent = "Échec du run : "+(err.message||err);
    }
    benchBtn.disabled = false; benchResumeBtn.disabled = false;
  };
  benchBtn.addEventListener("click", ()=> launchBench(null));
  benchResumeBtn.addEventListener("click", ()=> resumeCandidate && launchBench(resumeCandidate.runId));
  const benchPurgeBtn = el("button",{class:"btn-ghost", style:"margin:0 0 6px;", onclick: async ()=>{
    try{
      const storage = window.__benchStorage = window.__benchStorage || createBenchStorage();
      const runs = (await storage.listRuns()).filter(r=> r.status==="terminé" && !r.pinnedAsReference);
      if(!runs.length){ benchStatus.textContent = "Aucun run purgeable (terminés non épinglés)."; return; }
      const target = runs.sort((a,b)=> String(a.startedAt).localeCompare(String(b.startedAt)))[0];
      if(!confirm(`Purger les images du run ${target.runId} (${target.mode}, ${target.startedAt.slice(0,10)}) ? Les métadonnées, prompts et coûts sont conservés.`)) return;
      const n = await purgeRunImages(storage, target.runId);
      benchStatus.textContent = `✓ ${n} image(s) purgée(s) du run ${target.runId} — métadonnées conservées.`;
    }catch(e){ benchStatus.textContent = "Purge impossible : "+(e.message||e); }
  }}, "🧹 Libérer l'espace (images du plus ancien run non épinglé)");
  const benchExportBtn = el("button",{class:"btn-ghost", style:"margin:0 8px 6px 0;", onclick: async ()=>{
    try{
      const storage = window.__benchStorage = window.__benchStorage || createBenchStorage();
      const runs = await storage.listRuns();
      if(!runs.length){ benchStatus.textContent = "Aucun run à exporter."; return; }
      const latest = runs.sort((a,b)=> String(b.startedAt).localeCompare(String(a.startedAt)))[0];
      const exported = await storage.exportRun(latest.runId); // fonction B1 réutilisée telle quelle
      const blob = new Blob([JSON.stringify(exported, null, 1)], { type:"application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `bench-run-${latest.runId}.json`;
      a.click();
      setTimeout(()=> URL.revokeObjectURL(a.href), 5000);
      benchStatus.textContent = `✓ Run ${latest.runId} exporté (${(blob.size/1024).toFixed(0)} Ko) — fichier JSON complet, partageable pour diagnostic.`;
    }catch(e){ benchStatus.textContent = "Export impossible : "+(e.message||e); }
  }}, [svgIcon(ICONS.download,13), el("span",{},"Exporter le dernier run (JSON)")]);
  frag.appendChild(benchBtn); frag.appendChild(benchResumeBtn); frag.appendChild(benchExportBtn); frag.appendChild(benchPurgeBtn); frag.appendChild(benchStatus);
  /* EXPÉRIENCE experience2_brief_complet — zone additive, vide et invisible tant qu'aucun run
     "standard_brief_complet" ne s'est terminé. N'affecte aucun autre mode du Banc d'essai. */
  const benchCompareZone = el("div",{});
  frag.appendChild(benchCompareZone);
  frag.appendChild(el("div",{style:"border-top:1px solid var(--border);margin:14px 0;"}));

  frag.appendChild(el("p",{class:"label"},"Synchronisation serveur (Netlify Blobs)"));
  frag.appendChild(el("p",{class:"sublabel"},"Le localStorage de ce téléphone reste toujours la copie principale et continue de fonctionner hors-ligne. Le serveur est une sauvegarde supplémentaire qui permet de retrouver tes données sur un autre appareil ou navigateur."));

  const lastServerSync = localStorage.getItem("vf-last-server-sync");
  const syncStatus = el("p",{style:"font-size:12px;color:var(--muted2);min-height:16px;margin:6px 0 10px;"},
    lastServerSync ? `Dernière sauvegarde serveur : ${new Date(Number(lastServerSync)).toLocaleString("fr-FR")}` : "Aucune synchronisation effectuée pour l'instant sur cet appareil.");
  frag.appendChild(syncStatus);

  const syncStateLabel = el("p",{style:"font-size:13px;font-weight:600;margin:0 0 10px;"});
  const retryBtn = el("button",{class:"btn-secondary", style:"margin:0 0 10px 8px;display:none;"}, "Réessayer la synchronisation");
  const renderSyncState = ()=>{
    const label = getSyncStatusLabel();
    syncStateLabel.textContent = label === "Synchronisé" ? "✅ Synchronisé" : label === "Synchronisation en attente" ? "🕓 Synchronisation en attente" : "⚠️ Échec de synchronisation";
    syncStateLabel.style.color = label === "Synchronisé" ? "var(--green)" : label === "Synchronisation en attente" ? "var(--amber)" : "var(--coral)";
    retryBtn.style.display = label === "Échec de synchronisation" ? "inline-block" : "none";
  };
  renderSyncState();
  retryBtn.addEventListener("click", async ()=>{
    retryBtn.disabled = true;
    const ok = await pushToServerSilent();
    retryBtn.disabled = false;
    renderSyncState();
    if(ok) renderMain();
  });
  frag.appendChild(el("div",{style:"display:flex;align-items:center;flex-wrap:wrap;"}, [syncStateLabel, retryBtn]));

  const secretInput = el("input",{type:"text", value: localStorage.getItem("vf-sync-secret")||"", placeholder:"Secret de synchronisation (optionnel, seulement si configuré côté Netlify)"});
  secretInput.addEventListener("input", e=>{
    if(e.target.value) localStorage.setItem("vf-sync-secret", e.target.value);
    else localStorage.removeItem("vf-sync-secret");
  });
  frag.appendChild(el("div",{style:"margin-bottom:10px;"}, secretInput));

  const syncMsg = el("p",{style:"font-size:12px;color:var(--green);min-height:16px;margin:0 0 12px;"},"");

  frag.appendChild(el("button",{class:"btn-primary", style:"margin-bottom:8px;", onclick: async ()=>{
    syncMsg.style.color = "var(--muted2)"; syncMsg.textContent = "Synchronisation en cours...";
    try{
      const res = await fetch("/.netlify/functions/sync-data", {
        method:"POST", headers: syncHeaders(),
        body: JSON.stringify({ data: gatherSyncData(), updatedAt: getLocalUpdatedAt() || Date.now() }),
      });
      const result = await res.json();
      if(!res.ok || result.error) throw new Error(result.error || `Erreur ${res.status}`);
      if(result.action==="pull"){
        if(confirm("Le serveur contient une version plus récente. Remplacer les données de cet appareil par celles du serveur ?")){
          applySyncData(result.data);
          bumpLocalUpdatedAt();
          localStorage.setItem("vf-last-server-sync", String(Date.now()));
          syncMsg.style.color = "var(--green)"; syncMsg.textContent = "Données du serveur chargées, rechargement...";
          setTimeout(()=>location.reload(), 800);
        } else {
          syncMsg.style.color = "var(--muted2)"; syncMsg.textContent = "Synchronisation annulée.";
        }
      } else {
        localStorage.setItem("vf-last-server-sync", String(Date.now()));
        syncMsg.style.color = "var(--green)"; syncMsg.textContent = "Cet appareil est à jour avec le serveur ✓";
        renderMain();
      }
    }catch(err){
      syncMsg.style.color = "var(--coral)"; syncMsg.textContent = `Échec de la synchronisation (${err.message||err}).`;
    }
  }}, [svgIcon(ICONS.sparkles,16), el("span",{},"Synchroniser maintenant")]));

  frag.appendChild(el("button",{class:"btn-secondary", style:"margin-bottom:8px;", onclick: async ()=>{
    syncMsg.style.color = "var(--muted2)"; syncMsg.textContent = "Sauvegarde en cours...";
    try{
      const res = await fetch("/.netlify/functions/save-data", {
        method:"POST", headers: syncHeaders(),
        body: JSON.stringify({ data: gatherSyncData(), updatedAt: getLocalUpdatedAt() || Date.now() }),
      });
      const result = await res.json();
      if(!res.ok || result.error) throw new Error(result.error || `Erreur ${res.status}`);
      localStorage.setItem("vf-last-server-sync", String(Date.now()));
      syncMsg.style.color = "var(--green)"; syncMsg.textContent = "Sauvegardé sur le serveur ✓";

  async function runPackImport(files, isDryRun){
    const reports = [];
    let touchedModules = false, touchedDa = false, touchedStyles = false;

    for(const file of files){
      const preview = await processPackFile(file, true); // toujours un essai à blanc d'abord, pour connaître la version avant d'écrire quoi que ce soit
      if(!preview.ok){ reports.push({...preview, isDryRun}); continue; }

      if(!isDryRun && preview.versionComparison>0){
        const proceed = confirm(`${PACK_LABELS[preview.packType]||preview.packType} : le pack importé (v${preview.version}) est PLUS ANCIEN que celui déjà installé (v${preview.installedVersionBefore}). Importer quand même et écraser avec cette version plus ancienne ?`);
        if(!proceed){
          reports.push({ fileName:file.name, ok:false, packType:preview.packType, isDryRun, structuralErrors:["Import annulé : version plus ancienne que l'installée, refusé par l'utilisateur."], moduleErrors:[] });
          continue;
        }
      }

      if(isDryRun){
        reports.push({...preview, isDryRun:true});
        continue;
      }

      const real = await processPackFile(file, false); // deuxième lecture : commit réel cette fois
      real.isDryRun = false;
      const hasChange = real.added || real.updated;
      if(hasChange){
        if(MODULE_PACK_TYPES.includes(real.packType)) touchedModules = true;
        else if(real.packType==="MASTER_DIRECTION_ARTISTIQUE") touchedDa = true;
        else if(real.packType==="STYLES") touchedStyles = true;
      }
      if(real.daUpdated && MODULE_PACK_TYPES.includes(real.packType)) touchedDa = true; // bonus direction_artistique glissé dans un pack de modules
      reports.push(real);
    }

    if(isDryRun){
      showPackReports(reports);
      packMsg.style.color = "var(--muted2)";
      packMsg.textContent = "Mode test : aucune donnée n'a été modifiée.";
      renderMain();
      return;
    }

    normalizeState();
    if(touchedModules) LS.set("vf-modules", state.modules);
    if(touchedDa) LS.set("vf-da", state.da);
    if(touchedStyles) LS.set("vf-styles", state.styles);
    LS.set("vf-pack-versions", state.packVersions);

    packMsg.style.color = "var(--muted2)";
    packMsg.textContent = "Sauvegarde vers le serveur...";
    renderMain();
    const anyRealChange = touchedModules || touchedDa || touchedStyles;
    const synced = anyRealChange ? await pushToServerSilent() : true;
    const blobsStatus = !anyRealChange ? "skipped" : synced ? "ok" : "failed";
    reports.forEach(r=>{ if(r.ok) r.blobsStatus = blobsStatus; });

    reports.filter(r=>r.ok).forEach(r=>{
      state.packHistory.unshift({
        id: uid(), packType:r.packType, version:r.version, fileName:r.fileName, importedAt: Date.now(),
        modulesRead:r.modulesRead, added:r.added, updated:r.updated, identical:r.identical,
        errors: 0, blobsStatus,
      });
    });
    reports.filter(r=>!r.ok).forEach(r=>{
      state.packHistory.unshift({
        id: uid(), packType:r.packType||"(inconnu)", version:null, fileName:r.fileName, importedAt: Date.now(),
        modulesRead:0, added:0, updated:0, identical:0,
        errors: (r.structuralErrors||[]).length + (r.moduleErrors||[]).length, blobsStatus:"skipped",
      });
    });
    state.packHistory = state.packHistory.slice(0,50);
    LS.set("vf-pack-imports", state.packHistory);

    showPackReports(reports);
    packMsg.style.color = synced ? "var(--green)" : "var(--coral)";
    packMsg.textContent = blobsStatus==="ok" ? "✔ Sauvegarde serveur réussie."
      : blobsStatus==="failed" ? "⚠ Sauvegarde serveur impossible — les données restent enregistrées en local, réessaie depuis \"Sauvegarder sur serveur\" plus haut."
      : "Aucune modification à sauvegarder (fichiers déjà à jour ou rejetés).";
    renderMain();
  }

  });
  frag.appendChild(importInput);
  frag.appendChild(el("button",{class:"btn-secondary"}, [svgIcon(ICONS.upload,14), el("span",{},"Restaurer une sauvegarde")]))
    .addEventListener("click", ()=>importInput.click());
  frag.appendChild(importMsg);

  return frag;
}

/* ============================================================
   ROUTEUR
============================================================ */
function renderMain(){
  vfTrace("7-renderMain", { view: state.view, postImageId: state.postImageId });
  const main = document.getElementById("main");
  main.innerHTML = "";
  const builders = {
    accueil: buildAccueilTab, library: buildLibraryTab, editor: buildEditorTab, knowledge: buildKnowledgeTab,
    da: buildDaTab, styles: buildStylesTab, post: buildPostTab, calendar: buildCalendarTab, audit: buildAuditTab, genaudit: buildGenerationAuditTab, lab: buildLabTab, api: buildApiTab,
    history: buildHistoryTab, settings: buildSettingsTab, bench: buildBenchTab,
  };
  try{
    normalizeState();
    const builder = builders[state.tab] || buildAccueilTab;
    main.appendChild(builder());
  }catch(err){
    console.error("Erreur de rendu :", err);
    main.appendChild(el("div",{class:"card"},[
      el("p",{style:"color:var(--coral);font-weight:600;margin-bottom:6px;"},"Cet onglet a rencontré un problème."),
      el("p",{style:"font-size:12px;color:var(--muted2);margin-bottom:10px;"}, String(err && err.message || err)),
      el("button",{class:"btn-secondary", onclick:()=>{ state.tab="accueil"; renderNav(); renderMain(); }}, "Retour à l'accueil"),
    ]));
  }
}
renderNav();
renderMain();
updateCount();
checkServerOnLoad();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    const reloadKey = "vf-sw-reloaded-version";
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      // Une seule actualisation automatique par version : le nouveau moteur remplace
      // immédiatement la page encore ouverte, sans boucle de rechargement.
      if(sessionStorage.getItem(reloadKey) !== VF_VERSION){
        sessionStorage.setItem(reloadKey, VF_VERSION);
        window.location.reload();
      }
    });
    navigator.serviceWorker
      .register(`./sw.js?v=${encodeURIComponent(VF_VERSION)}`, { updateViaCache: "none" })
      .then((registration) => registration.update())
      .catch((err) => console.error("SW non enregistré :", err));
  });
}
</script>
