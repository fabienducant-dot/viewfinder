/* ---------- PHASE B ‚Äî G√âN√âRATION (PAYANTE, uniquement apr√®s confirmation explicite) ----------
   Prend le r√©sultat EXACT de prepareCreativeBrief (rien n'est recalcul√©) : image -> analyse ->
   texte. Chaque √©tape a son propre repli, jamais de relance automatique d'un appel image payant. */
/* B3.1 ‚Äî POST-TRAITEMENT partag√© : le job serveur renvoie d√©j√† la sc√®ne, le fichier logo exact et
   les textes exacts compos√©s par Sharp/SVG. Canvas ne subsiste que pour les imports manuels
   historiques. Fonction PURE : aucune √©criture ‚Äî le handler de
   production garde ses √©critures (biblioth√®que, postImageId, historique, lab) apr√®s l'appel ;
   l'ex√©cuteur du Banc n'√©crit rien. Une seule impl√©mentation du post-traitement pour les deux. */
async function finalizeGeneratedImage(flow){
  const platform = flow.inputs.platform;
  const isHealyFlow = flow.inputs.prestation==="Bior√©sonance quantique";
  const logoInScene = flow.serverBrandCompositionUsed===true && flow.brandComposited===true;
  /* Une identit√© compos√©e par le serveur provient du fichier logo officiel et de cha√Ænes exactes
     rendues en trac√©s vectoriels. Elle ne peut donc pas √™tre requalifi√©e en overlay IA interdit
     par un contr√¥le vision probabiliste, notamment apr√®s un recontr√¥le manuel. Le contr√¥le des
     overlays reste strict pour les images r√©ellement brutes et les imports historiques. */
  const generatedOverlayViolation=logoInScene ? "" : findGeneratedOverlayViolation(flow.analysis);
  let overlayWarning = null;
  if(generatedOverlayViolation){
    /* Healy : un blocage strict ici s'est r√©v√©l√© peu fiable ‚Äî le mod√®le d'image ne parvient jamais
       de fa√ßon garantie √† laisser la zone du logo fabricant parfaitement vierge, quelle que soit la
       formulation du prompt. Plut√¥t que de faire √©chouer la g√©n√©ration (cr√©dit d√©pens√©, red√©ploiement
       n√©cessaire √† chaque it√©ration de formulation), ce point devient un avertissement √† v√©rifier
       visuellement avant publication, pour cette prestation uniquement. Les autres prestations (PSiO¬Æ
       compris) gardent le blocage strict, qui lui fonctionne de fa√ßon fiable. */
    if(isHealyFlow){
      overlayWarning = `√âl√©ment graphique √† v√©rifier sur le bo√Ætier avant publication : ${generatedOverlayViolation.replace(/^overlay ia interdit\s*:\s*/i,"")}`;
    }else{
      throw new Error(`Image refus√©e par le contr√¥le identit√©/OCR : ${generatedOverlayViolation.replace(/^overlay ia interdit\s*:\s*/i,"")}. Corrige la composition avant publication.`);
    }
  }
  const productViolation=findProductReferenceViolation(flow.analysis);
  if(productViolation){
    throw new Error(`Image refus√©e avant publication : ${productViolation}. Aucune visi√®re g√©n√©rique ne peut remplacer le produit officiel.`);
  }
  const paletteViolation=findPaletteViolation(flow.analysis);
  if(paletteViolation){
    throw new Error(`Image refus√©e avant publication : ${paletteViolation}. Une image hors charte ne peut pas √™tre valid√©e.`);
  }
  /* 1) format officiel de la plateforme */
  let dataUrl = await normalizeToPlatformFormat(flow.dataUrl, platform);
  /* 2) accroche : g√©n√©ralis√©e (demande explicite) √† Instagram/Facebook/Story pour TOUTE prestation,
        sur le m√™me mod√®le structur√© "NOM COURT | sous-ligne" que PSiO/Story ‚Äî plus de contentHeadline
        g√©n√©rique pour Instagram/Facebook. Le texte vient du brief cr√©atif (texteImage), jamais de
        GPT-image. Repli identique si texteImage est vide. */
  const structuredHeadline = flow.v3Plan?.posterStrategy
    ? [flow.v3Plan.posterStrategy.title,flow.v3Plan.posterStrategy.subtitle].filter(Boolean).join(" | ")
    : (flow.brief && typeof flow.brief.texteImage==="string" ? flow.brief.texteImage.trim() : "");
  const headline = (!logoInScene && (PLATFORM_OVERLAY[platform]==="accroche" || PLATFORM_OVERLAY[platform]==="fort"))
    ? structuredHeadline : "";
  /* 3) logo : appliqu√© sauf s'il est d√©j√† dans la sc√®ne (texte et signature compris, dans ce cas ‚Äî
        voir logoInScene ci-dessus). Un seul appel, m√™me fonction pour les deux besoins ‚Äî aucune
        duplication, aucun chemin parall√®le. */
  const needLogo = logoRequiredFor(platform) && !logoInScene;
  let logoApplied = logoInScene;
  let headlineApplied = logoInScene && (PLATFORM_OVERLAY[platform]==="accroche" || PLATFORM_OVERLAY[platform]==="fort");
  let layoutReport = logoInScene
    ? { version:"server-brand-compositor-v1", skipped:true, serverComposited:true }
    : { version:"canvas-layout-v4", skipped:true };
  if(needLogo || headline){
    const composited = await compositeBrandSignature(dataUrl, platform, {
      headline, withLogo:needLogo, brief:flow.brief||null, analysis:flow.analysis||null
    });
    layoutReport = composited.layoutReport || layoutReport;
    if(layoutReport.blockingError) throw new Error(layoutReport.blockingError);
    dataUrl = composited.dataUrl;
    logoApplied = composited.applied && needLogo;
    headlineApplied = composited.headlineApplied===true;
  }
  if(needLogo && !logoApplied) throw new Error("Composition Canvas bloqu√©e : la signature officielle SDZ n'a pas pu √™tre appliqu√©e.");
  if(headline && !headlineApplied) throw new Error("Composition Canvas bloqu√©e : l'accroche n'a pas pu √™tre rendue lisiblement.");
  return { dataUrl, logoApplied, logoInScene, headlineApplied, layoutReport, overlayWarning };
}

/* √âcriture unique d'une image cr√©ative finalis√©e. Utilis√©e par la g√©n√©ration normale et par la
   r√©cup√©ration d'une image brute d√©j√† pay√©e : aucune seconde g√©n√©ration image n'est n√©cessaire. */
function storeFinalizedCreativeFlow(flow, finalized){
  if(flow.imageId && state.images.some(i=>i.id===flow.imageId)){
    return { id:flow.imageId, alreadyStored:true };
  }
  const platform=flow.inputs.platform;
  const id=uid();
  state.images.push({ id, name:`${platform}-${nowStr()}.png`, dataUrl:finalized.dataUrl,
    tags:[platform], favorite:false, logoApplied:finalized.logoApplied,
    usedReference:flow.usedReference, referenceFallbackReason:flow.referenceFallbackReason,
    creativeBrief:flow.brief, creativeContent:flow.content, layoutReport:finalized.layoutReport||null,
    altText:flow.content ? flow.content.altText : (flow.analysis&&flow.analysis.altText),sourceImageJobId:flow.sourceImageJobId||null,
    v3Plan:flow.v3Plan||null,v3Finalization:flow.v3Finalization||null,rawResultAvailable:!!flow.sourceImageJobId,
    costAudit:flow.costAudit||null,artFingerprint:flow.artFingerprint||null });
  LS.set("vf-images",state.images);

  if(flow.content){

    state.textPasted=[flow.content.caption||"",hashtagsText].filter(Boolean).join("\n\n");

  return { id, alreadyStored:false };

/* P1 ‚Äî Applique l'accroche √† une image de campagne D√âJ√Ä finalis√©e (format + logo pos√©s lors de la
   g√©n√©ration). Aucune logique de finalisation ici : simple appel √† finalizeGeneratedImage avec
   logoSentAsReference/usedReference √† true, ce qui neutralise la r√©-incrustation du logo. Le
   recadrage est idempotent (m√™mes dimensions -> retour imm√©diat).
   Garde-fou : une accroche d√©j√† incrust√©e n'est jamais superpos√©e une seconde fois. */
async function applyHeadlineToItem(item){
  if(!item || !item.imageDataUrl || item.headlineApplied) return false;
  const headline = item.creativeBrief && typeof item.creativeBrief.texteImage==="string" ? item.creativeBrief.texteImage.trim() : "";
  const overlayKind = PLATFORM_OVERLAY[item.platform];
  if(!headline || (overlayKind!=="accroche" && overlayKind!=="fort")) return false;
  const composited = await compositeBrandSignature(item.imageDataUrl, item.platform, {
    headline, withLogo:false, brief:item.creativeBrief||null, analysis:item.analysis||null
  });
  if(!composited.headlineApplied || (composited.layoutReport&&composited.layoutReport.blockingError)) return false;
  item.imageDataUrl = composited.dataUrl; item.headlineApplied = true; item.layoutReport = composited.layoutReport||null;
  /* Facebook r√©utilise EXACTEMENT l'image Instagram : la copie est mise √† jour au m√™me instant. */
  if(item.platform==="Instagram"){
    state.scheduled.filter(p=> p.campaignId===item.campaignId && p.platform==="Facebook" && p.reusedFrom==="Instagram")
      .forEach(fb=>{ fb.imageDataUrl = item.imageDataUrl; fb.headlineApplied = true; });
  }
  return true;
}

/* ---------- score qualit√© : mesure automatique + auto-√©valuation guid√©e ---------- */
function textSimilarity(a, b){
  const words = s => new Set(s.toLowerCase().split(/\W+/).filter(w=>w.length>3));
  const wa = words(a), wb = words(b);
  if(!wa.size || !wb.size) return 0;
  let inter = 0; wa.forEach(w=>{ if(wb.has(w)) inter++; });
  return inter / Math.min(wa.size, wb.size);
}
function computeRepetitionRisk(platform, text){
  if(!text || !text.trim()) return 0;
  const recents = state.history.filter(h=>h.platform===platform && h.textResult).slice(-6);
  if(!recents.length) return 0;
  let max = 0;
  recents.forEach(h=>{ const sim = textSimilarity(text, h.textResult); if(sim>max) max=sim; });
  return Math.round(max*100);
}

function hashPrompt(text){
  const t = text || "";
  let h = 5381;
  for(let i=0;i<t.length;i++){ h = ((h*33) ^ t.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}
function findCachedResult(providerLabel, promptText){

  const hash = hashPrompt(promptText);
  return state.lab.find(l=> l.provider===providerLabel && l.promptHash===hash && l.status==="accepted") || null;

/* Tous les appels passent d√©sormais par les fonctions serveur du m√™me site Netlify

   d'environnement Netlify). Le navigateur ne d√©tient plus aucune cl√© et ne contacte jamais le
   fournisseur directement ‚Äî √ßa √©vite le blocage CORS et s√©curise les cl√©s. */
async function callProviderText(provider, systemPrompt, userPrompt){
  const res = await fetch("/.netlify/functions/generate-text", {
    method:"POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify({ kind: provider.kind, model: provider.model, baseUrl: provider.baseUrl, systemPrompt, userPrompt }),
  });
  const data = await res.json();
  if(!res.ok || data.error) throw new Error(data.error || `Erreur ${res.status}`);
  return data.text || "";
}
async function fetchJsonOrThrowRaw(res, contextLabel){
  // Contr√¥le du content-type avant de parser : une r√©ponse HTML (ex: page d'erreur passerelle Netlify)
  // ferait √©chouer res.json() avec un message cryptique ("Unexpected token '<'") qui masque la vraie
  // cause. On affiche ici le statut et le corps brut √† la place.
  const contentType = res.headers.get("content-type") || "";
  if(!contentType.includes("application/json")){
    const rawBody = await res.text();
    throw new Error(`R√©ponse non-JSON du serveur (${contextLabel}, statut ${res.status}). Corps brut : ${rawBody.slice(0, 300)}`);
  }
  return res.json();
}
