    fbRows.forEach(r=>{
      frag.appendChild(el("div",{class:"module-card"},[
        el("div",{class:"module-head"},[el("div",{class:"module-title"}, `${r.source} — ${r.name}`), el("span",{style:"font-size:12px;color:var(--muted2);"}, r.date||"date inconnue")]),
        el("div",{class:"module-content", style:"color:var(--coral);"}, String(r.reason)),
      ]));
    });
  }

  // ---- Qualité des données ----
  frag.appendChild(el("p",{class:"label", style:"margin-top:18px;"},"Qualité des données"));
  const qCard = el("div",{class:"card", style:"margin-bottom:14px;"});
  const withField = rows.filter(r=>r.hasUsedRefField).length;
  const withoutField = rows.length - withField;
  qCard.appendChild(trow(["Générations analysées", rows.length]));
  qCard.appendChild(trow([`Champ usedReference disponible`, `${withField} (${pctTxt(withField, rows.length)})`]));
  qCard.appendChild(trow([`Champ usedReference absent (générations antérieures à son introduction — indistinguables rétroactivement)`, `${withoutField} (${pctTxt(withoutField, rows.length)})`], {cellStyles:{1: withoutField?"color:var(--amber);":""}}));
  qCard.appendChild(el("p",{style:"font-size:13px;margin-top:8px;"}, `Conclusion : le taux de fallback repose sur ${pctTxt(withField, rows.length)} des générations réellement exploitables. Les ${withoutField} génération(s) sans champ sont comptées en "sans référence / donnée absente", jamais dans le taux.`));
  frag.appendChild(qCard);

  // ---- Performance (vf-lab, statistique globale — non joignable image par image) ----
  frag.appendChild(el("p",{class:"label"},"Performance (durées de génération)"));
  const perfCard = el("div",{class:"card", style:"margin-bottom:14px;"});
  const imgLab = state.lab.filter(l=> l.type==="image" && typeof l.durationMs==="number");
  if(!imgLab.length){
    perfCard.appendChild(el("p",{class:"hint"},"Aucun appel image journalisé dans le Laboratoire IA."));
  } else {
    const ds = imgLab.map(l=>l.durationMs).sort((a,b)=>a-b);
    const med = ds[Math.floor(ds.length/2)], avg = ds.reduce((a,b)=>a+b,0)/ds.length;
    perfCard.appendChild(trow(["Appels image journalisés", imgLab.length]));
    perfCard.appendChild(trow(["Temps moyen", (avg/1000).toFixed(1)+" s"]));
    perfCard.appendChild(trow(["Médiane", (med/1000).toFixed(1)+" s"]));
    perfCard.appendChild(trow(["Minimum", (ds[0]/1000).toFixed(1)+" s"]));
    perfCard.appendChild(trow(["Maximum", (ds[ds.length-1]/1000).toFixed(1)+" s"]));
    perfCard.appendChild(el("p",{style:"font-size:11px;color:var(--muted2);margin-top:6px;"},"Durées mesurées côté client (création du job + attente complète), non joignables aux images individuelles — vf-images ne stocke pas le hash de prompt nécessaire à la jointure. Note : le champ \"model\" du Laboratoire vaut \"gpt-image-1-mini\" pour les campagnes alors que le serveur applique toujours gpt-image-1 (étiquetage erroné, confirmé par l'audit du code serveur) — il est ignoré ici."));
  }
  frag.appendChild(perfCard);

  // ---- Export ----
  frag.appendChild(el("button",{class:"btn-secondary", onclick:()=>{
    const report = {
      genere_le: new Date().toISOString(),
      perimetre: { total: rows.length, posts: nPosts, campagnes: nCamp, exclusions_bibliotheque: totalImagesInLibrary-genImagesCount },
      references: { tentees: refAttempted, utilisees: nUsed, fallbacks: nFallback, sans_reference: nNoRef,
        taux_fallback_sur_tentees: refAttempted ? +(100*nFallback/refAttempted).toFixed(1) : null },
      qualite_donnees: { avec_champ_usedReference: withField, sans_champ: withoutField },
      causes: causes,
      detail: rows.map(r=>({ source:r.source, id:r.id, name:r.name, platform:r.platform, date:r.date,
        usedReference:r.used, fallback:r.fallback, reason:r.reason })),
    };
    const blob = new Blob([JSON.stringify(report, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `audit-generations-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }}, [svgIcon(ICONS.download,14), el("span",{},"Exporter le rapport (JSON)")]));

  return frag;
}

  const list = state.lab.filter(l=> state.labFilter==="Toutes" || l.provider===state.labFilter).slice().reverse();
  list.forEach(l=>{
    frag.appendChild(el("div",{class:"history-card"},[

        el("span",{}, `${l.provider} · ${l.model} · ${l.date}`),

      ]),

/* ============================================================
   PACK PRODUCTION SDZ — import définitif, transactionnel, versionné
============================================================ */
const KNOWN_PACK_TYPES = ["MASTER_PRODUCTION_SDZ","MASTER_IMAGE_SDZ","MASTER_CAMPAIGN_SDZ","MASTER_DIRECTION_ARTISTIQUE","STYLES"];
const MODULE_PACK_TYPES = ["MASTER_PRODUCTION_SDZ","MASTER_IMAGE_SDZ","MASTER_CAMPAIGN_SDZ"]; // les 3 packs "164 modules", figés
const PACK_TARGETS = { "MASTER_PRODUCTION_SDZ":48, "MASTER_IMAGE_SDZ":62, "MASTER_CAMPAIGN_SDZ":54 };
const PACK_LABELS = { "MASTER_PRODUCTION_SDZ":"MASTER PRODUCTION", "MASTER_IMAGE_SDZ":"MASTER IMAGE", "MASTER_CAMPAIGN_SDZ":"MASTER CAMPAIGN",
  "MASTER_DIRECTION_ARTISTIQUE":"DIRECTION ARTISTIQUE", "STYLES":"STYLES" };

function compareVersions(a,b){
  const pa = parseFloat(a), pb = parseFloat(b);
  if(isNaN(pa) || isNaN(pb)) return 0;
  if(pa===pb) return 0;
  return pa<pb ? -1 : 1;
}

/* Validation stricte AVANT toute écriture : un fichier structurellement invalide, ou contenant
   ne serait-ce qu'un seul module incomplet, est intégralement rejeté (tout ou rien). */
function validatePackFile(raw){
  const structuralErrors = [];
  if(!raw || typeof raw!=="object") return { valid:false, structuralErrors:["Le fichier ne contient pas un objet JSON valide."], moduleErrors:[] };
  if(!raw.packType) structuralErrors.push('Champ "packType" manquant.');
  else if(!KNOWN_PACK_TYPES.includes(raw.packType)) structuralErrors.push(`packType "${raw.packType}" non reconnu (attendu : ${KNOWN_PACK_TYPES.join(", ")}).`);

  const moduleErrors = [];
  const packType = raw.packType;

  if(packType==="MASTER_DIRECTION_ARTISTIQUE"){
    if(!raw.direction_artistique || typeof raw.direction_artistique!=="object" || Array.isArray(raw.direction_artistique)){
      structuralErrors.push('Champ "direction_artistique" manquant ou n\'est pas un objet.');
    }
  } else if(packType==="STYLES"){
    if(!Array.isArray(raw.styles)) structuralErrors.push('Champ "styles" manquant ou n\'est pas une liste.');
    else raw.styles.forEach((s,i)=>{
      const label = (s && s.name && String(s.name).trim()) || `style #${i+1}`;
      if(!s || typeof s!=="object"){ moduleErrors.push({title:label, reason:"n'est pas un objet valide"}); return; }
      if(!s.name || !String(s.name).trim()) moduleErrors.push({title:label, reason:"nom manquant"});
    });
  } else {
    // MASTER_PRODUCTION_SDZ / MASTER_IMAGE_SDZ / MASTER_CAMPAIGN_SDZ : liste de modules
    if(!Array.isArray(raw.modules)) structuralErrors.push('Champ "modules" manquant ou n\'est pas une liste.');
    else raw.modules.forEach((m,i)=>{
      const label = (m && m.title && String(m.title).trim()) || `module #${i+1}`;
      if(!m || typeof m!=="object"){ moduleErrors.push({title:label, reason:"n'est pas un objet valide"}); return; }
      if(!m.category || !String(m.category).trim()) moduleErrors.push({title:label, reason:"catégorie manquante"});
      if(!m.title || !String(m.title).trim()) moduleErrors.push({title:label, reason:"titre manquant"});
      if(!m.content || !String(m.content).trim()) moduleErrors.push({title:label, reason:"contenu manquant"});
    });
  }
  return { valid: structuralErrors.length===0 && moduleErrors.length===0, structuralErrors, moduleErrors };
}

/* Analyse un fichier déjà validé. dryRun=true (Mode Test) ne touche jamais à state.modules/state.da/state.styles. */
function analyzePackFile(raw, dryRun){
  const packType = raw.packType;
  const incomingVersion = String(raw.version || "1.0");
  const installedVersionBefore = state.packVersions[packType] || null;
  const versionComparison = installedVersionBefore ? compareVersions(installedVersionBefore, incomingVersion) : null;

  if(packType==="MASTER_DIRECTION_ARTISTIQUE"){
    let added=0, updated=0, identical=0;
    const moduleResults = [];
    Object.keys(raw.direction_artistique).forEach(k=>{
      const incomingVal = raw.direction_artistique[k];
      if(incomingVal==null || incomingVal==="") return;
      const currentVal = state.da[k];
      const wasEmpty = currentVal===undefined || currentVal===null || currentVal==="";
      const changed = JSON.stringify(currentVal) !== JSON.stringify(incomingVal);
      if(!changed){ identical++; moduleResults.push({title:k, status:"identical"}); return; }
      if(!dryRun) state.da[k] = incomingVal;
      if(wasEmpty){ added++; moduleResults.push({title:k, status:"added"}); }
      else { updated++; moduleResults.push({title:k, status:"updated"}); }
    });
    if(!dryRun) state.packVersions[packType] = incomingVersion;
    return {
      packType, version:incomingVersion, installedVersionBefore, versionComparison,
      modulesRead: Object.keys(raw.direction_artistique).length, added, updated, identical, ignored:0,
      moduleResults, unknownCategories:[], daUpdated: added+updated,
    };
  }

  if(packType==="STYLES"){
    let added=0, updated=0, identical=0;
    const moduleResults = [];
    const META_FIELDS = ["id","createdAt","updatedAt","sourcePack","packVersion"];
    const stripMeta = (obj)=>{ const c={...obj}; META_FIELDS.forEach(f=>delete c[f]); return c; };
    raw.styles.forEach(s=>{
      const name = String(s.name).trim();
      const incoming = stripMeta({ ...s, name });
      const existing = state.styles.find(x=>(x.name||"").trim().toLowerCase()===name.toLowerCase());
      if(existing){
        const existingComparable = stripMeta(existing);
        if(JSON.stringify(existingComparable) !== JSON.stringify(incoming)){
          if(!dryRun){ Object.assign(existing, incoming); existing.updatedAt = Date.now(); existing.sourcePack = packType; existing.packVersion = incomingVersion; }
          updated++; moduleResults.push({title:name, status:"updated"});
        } else {
          identical++; moduleResults.push({title:name, status:"identical"});
        }
      } else {
        if(!dryRun) state.styles.push({ id: uid(), ...incoming, createdAt:Date.now(), sourcePack:packType, packVersion:incomingVersion });
        added++; moduleResults.push({title:name, status:"added"});
      }
    });
    if(!dryRun) state.packVersions[packType] = incomingVersion;
    return {
      packType, version:incomingVersion, installedVersionBefore, versionComparison,
      modulesRead: raw.styles.length, added, updated, identical, ignored:0,
      moduleResults, unknownCategories:[], daUpdated:0,
    };
  }

  // MASTER_PRODUCTION_SDZ / MASTER_IMAGE_SDZ / MASTER_CAMPAIGN_SDZ : liste de modules (comportement historique,
  // conservé à l'identique pour title/content/category/dédoublonnage — seul ajout : préservation des métadonnées
  // MASTER_IMAGE V2 (criteres/tags/status/updatedAt/id) quand le module entrant les porte, et dérivation d'un
  // registre explicite depuis le packId du fichier importé (ex: "noir_or_v2_04" → "noir_or").
  let added=0, updated=0, identical=0;
  const moduleResults = [];
  const unknownCategories = new Set();
  const packIdMatch = String(raw.packId||"").match(/^(.*)_v2_\d+$/);
  const packRegistre = packIdMatch ? packIdMatch[1] : null;

  raw.modules.forEach(m=>{
    const title = String(m.title).trim(), content = String(m.content).trim(), category = String(m.category).trim();
    if(!CATEGORIES.includes(category)) unknownCategories.add(category);
    // Un module V2 porte un id stable et propre : deux modules de registres différents peuvent légitimement
    // partager un même titre (ex: "Adaptation Portrait" en Cinématographie et en Fantastique) sans être le
    // même module. On les identifie donc par id quand il existe, et on ne retombe sur title+category — le
    // mécanisme historique — que pour les modules qui n'en fournissent aucun (anciens packs, inchangé).
    const incomingId = (typeof m.id==="string" && m.id.trim()) ? m.id.trim() : null;
    const existing = incomingId
      ? state.modules.find(x=> x.id===incomingId)
      : state.modules.find(x=>x.title.trim().toLowerCase()===title.toLowerCase() && x.category===category);
    const incomingCriteres = (m.criteres && typeof m.criteres==="object" && !Array.isArray(m.criteres)) ? m.criteres : undefined;
    const incomingTags = Array.isArray(m.tags) ? m.tags : undefined;
    const incomingStatus = (typeof m.status==="string" && m.status.trim()) ? m.status.trim() : undefined;
    const incomingRegistre = (typeof m.registre==="string" && m.registre.trim()) ? m.registre.trim() : (packRegistre || undefined);
    if(existing){
      const contentChanged = existing.content.trim() !== content;
      const metaChanged = JSON.stringify(existing.criteres||null)!==JSON.stringify(incomingCriteres||null)
        || JSON.stringify(existing.tags||null)!==JSON.stringify(incomingTags||null)
        || (existing.status||undefined)!==incomingStatus
        || (existing.registre||undefined)!==incomingRegistre;
      if(contentChanged || metaChanged){
        if(!dryRun){
          existing.content = content; existing.updatedAt = Date.now();
          existing.sourcePack = packType; existing.packVersion = incomingVersion;
          if(incomingCriteres!==undefined) existing.criteres = incomingCriteres;
          if(incomingTags!==undefined) existing.tags = incomingTags;
          if(incomingStatus!==undefined) existing.status = incomingStatus;
          if(incomingRegistre!==undefined) existing.registre = incomingRegistre;
        }
        updated++; moduleResults.push({title, status:"updated"});
      } else {
        identical++; moduleResults.push({title, status:"identical"});
      }
    } else {
      if(!dryRun){
        const newModule = {
          id: (typeof m.id==="string" && m.id.trim()) ? m.id.trim() : uid(),
          category, title, content, enabled:true,
          createdAt: Date.now(),
          updatedAt: m.updatedAt || Date.now(),
          sourcePack: packType, packVersion: incomingVersion,
        };
        if(incomingCriteres!==undefined) newModule.criteres = incomingCriteres;
        if(incomingTags!==undefined) newModule.tags = incomingTags;
        if(incomingStatus!==undefined) newModule.status = incomingStatus;
        if(incomingRegistre!==undefined) newModule.registre = incomingRegistre;
        state.modules.push(newModule);
      }
      added++; moduleResults.push({title, status:"added"});
    }
  });

  let daUpdated = 0;
  if(!dryRun && raw.direction_artistique && typeof raw.direction_artistique==="object"){
    Object.keys(raw.direction_artistique).forEach(k=>{
      if(raw.direction_artistique[k]!=null && raw.direction_artistique[k]!==""){ state.da[k]=raw.direction_artistique[k]; daUpdated++; }
    });
  }
  if(!dryRun) state.packVersions[packType] = incomingVersion;

  return {
    packType, version:incomingVersion, installedVersionBefore, versionComparison,
    modulesRead: raw.modules.length, added, updated, identical, ignored:0,
    moduleResults, unknownCategories:[...unknownCategories], daUpdated,
  };
}

/* Traite un fichier de bout en bout : parsing → validation stricte (tout ou rien) → analyse. */
async function processPackFile(file, dryRun){
  let raw;
  try{ raw = JSON.parse(await file.text()); }
  catch(err){ return { fileName:file.name, ok:false, packType:null, structuralErrors:[`JSON invalide : ${err.message}`], moduleErrors:[] }; }

  const validation = validatePackFile(raw);
  if(!validation.valid){
    return { fileName:file.name, ok:false, packType:raw.packType||null, structuralErrors:validation.structuralErrors, moduleErrors:validation.moduleErrors };
  }
  const result = analyzePackFile(raw, dryRun);
  return { fileName:file.name, ok:true, ...result };
}

function formatPackReportText(r){
  const lines = [];
  lines.push("==================================================");
  lines.push(dryRun_marker(r));
  lines.push("");
  lines.push(`Fichier : ${r.fileName}`);
  if(!r.ok){
    lines.push(`Statut : ✖ REJETÉ (aucune modification appliquée)`);
    if(r.structuralErrors && r.structuralErrors.length){
      lines.push("");
      lines.push("Erreurs de structure :");
      r.structuralErrors.forEach(e=> lines.push(`✖ ${e}`));
    }
    if(r.moduleErrors && r.moduleErrors.length){
      lines.push("");
      lines.push("Modules invalides :");
      r.moduleErrors.forEach(e=> lines.push(`✖ ${e.title} — ${e.reason}`));
    }
    lines.push("==================================================");
    return lines.join("\n");
  }
  lines.push(`Pack : ${r.packType}  (v${r.version})`);
  if(r.installedVersionBefore){
    if(r.versionComparison===0) lines.push(`Version : identique à celle déjà installée (v${r.installedVersionBefore}) — déjà à jour.`);
    else if(r.versionComparison<0) lines.push(`Version : mise à jour v${r.installedVersionBefore} → v${r.version}.`);
    else lines.push(`⚠ Version : le pack importé (v${r.version}) est PLUS ANCIEN que celui déjà installé (v${r.installedVersionBefore}).`);
  } else {
    lines.push(`Version : première installation de ce pack (v${r.version}).`);
  }
  lines.push(`Date : ${new Date().toLocaleString("fr-FR")}`);
  lines.push("");
  lines.push(`Modules lus : ${r.modulesRead}`);
  lines.push(`Ajoutés : ${r.added}`);
  lines.push(`Mis à jour : ${r.updated}`);
  lines.push(`Déjà identiques : ${r.identical}`);
  lines.push(`Ignorés : ${r.ignored}`);
  lines.push(`Erreurs : 0`);
  if(r.unknownCategories && r.unknownCategories.length) lines.push(`⚠ Catégories non reconnues : ${r.unknownCategories.join(", ")}`);
  if(!dryRunFlagFromReport(r)) lines.push(`Synchronisation serveur : ${r.blobsStatus==="ok"?"✔ OK":r.blobsStatus==="failed"?"⚠ échec (local conservé)":"—"}`);
  lines.push("==================================================");
  lines.push("");
  r.moduleResults.forEach(mr=>{
    const mark = mr.status==="added" ? "✔ (ajouté)" : mr.status==="updated" ? "✔ (mis à jour)" : "✔ (déjà identique)";
    lines.push(`${mark} ${mr.title}`);
  });
  return lines.join("\n");
}
function dryRun_marker(r){ return r.isDryRun ? `TEST PACK SDZ (aucune donnée modifiée)` : `IMPORT PACK SDZ`; }
function dryRunFlagFromReport(r){ return !!r.isDryRun; }

function buildModulesReportText(){
  const lines = [];
  lines.push("RAPPORT DES MODULES SDZ APP");
  lines.push(`Généré le ${new Date().toLocaleString("fr-FR")}`);
  lines.push("");
  lines.push("=== PROGRESSION ===");
  let totalOfficial = 0, totalTarget = 0;
  MODULE_PACK_TYPES.forEach(pt=>{
    const count = state.modules.filter(m=>m.sourcePack===pt).length;
    const target = PACK_TARGETS[pt];
    totalOfficial += count; totalTarget += target;
    lines.push(`${PACK_LABELS[pt]} : ${count} / ${target}${state.packVersions[pt] ? ` (v${state.packVersions[pt]})` : ""}`);
  });
  lines.push(`TOTAL OFFICIEL : ${totalOfficial} / ${totalTarget}`);
  const autresCount = state.modules.length - totalOfficial;
  if(autresCount>0) lines.push(`Autres modules (hors des 3 packs officiels) : ${autresCount}`);
  lines.push("");

  lines.push("=== RÉPARTITION PAR CATÉGORIE (tous modules confondus) ===");
  const byCategory = {};
  state.modules.forEach(m=>{ const c=m.category||"(sans catégorie)"; byCategory[c]=(byCategory[c]||0)+1; });
  CATEGORIES.forEach(cat=>{ lines.push(`${cat} : ${byCategory[cat]||0} module(s)`); });
  const unknownCats = Object.keys(byCategory).filter(c=>!CATEGORIES.includes(c));
  unknownCats.forEach(cat=> lines.push(`${cat} (catégorie non standard) : ${byCategory[cat]} module(s)`));
  lines.push("");

  const groups = {};
  state.modules.forEach(m=>{
    const pack = (m.sourcePack && MODULE_PACK_TYPES.includes(m.sourcePack)) ? m.sourcePack : "AUTRES";
    groups[pack] = groups[pack] || {};
    const cat = m.category || "(sans catégorie)";
    groups[pack][cat] = groups[pack][cat] || [];
    groups[pack][cat].push(m);
  });

  [...MODULE_PACK_TYPES, "AUTRES"].forEach(pack=>{
    if(!groups[pack]) return;
    lines.push(`\n========================================`);
    lines.push(pack==="AUTRES" ? "AUTRES MODULES (hors pack officiel)" : `${PACK_LABELS[pack]} (${pack})`);
    lines.push(`========================================`);
    Object.keys(groups[pack]).sort().forEach(cat=>{
      lines.push(`\n--- ${cat} ---`);
      groups[pack][cat].forEach(m=>{
        lines.push(`\n[${m.title}]`);
        lines.push(m.content);
      });
    });
  });

  lines.push("\n========================================");
  lines.push("FIN DU RAPPORT");
  lines.push("========================================");
  return lines.join("\n");
}

/* ============================================================
   IMPORT DE LA BASE DE CONNAISSANCES — deux entrées, une seule logique d'écriture.
   1) importKnowledgeJson  : fichier d'export complet (format sdz-knowledge-export).
   2) importPrestationsText: document texte de fiches, met à jour les modules Prestations.
   Règles communes : validation intégrale AVANT toute écriture, résumé soumis à l'utilisateur,
   application ATOMIQUE (la base n'est remplacée qu'après succès complet, rollback sinon),
   identifiants existants toujours conservés, suppression désactivée par défaut.
============================================================ */

/* ---------- 1. Validation d'un export JSON ---------- */
function validateKnowledgeImport(payload){
  const errors = [], warnings = [];
  const plan = { toCreate:[], toUpdate:[], ignored:[], toDelete:[] };
  if(!payload || typeof payload!=="object") { errors.push("Fichier illisible : ce n'est pas un objet JSON."); return { valid:false, errors, warnings, plan }; }
  if(payload.schema !== "sdz-knowledge-export")
    errors.push(`Type de fichier incompatible : "schema" vaut ${JSON.stringify(payload.schema)} au lieu de "sdz-knowledge-export". (Un export de Banc d'essai ou une sauvegarde ne peuvent pas être importés ici.)`);
  if(!Array.isArray(payload.modules)) errors.push("Champ \"modules\" absent ou invalide : un tableau est attendu.");
  if(errors.length) return { valid:false, errors, warnings, plan };

  const existingById = new Map((state.modules||[]).map(m=>[m.id, m]));
  const seenIds = new Set();
  payload.modules.forEach((m, i)=>{
    const ref = `module #${i+1}${m && m.title ? ` (« ${m.title} »)` : ""}`;
    if(!m || typeof m!=="object"){ errors.push(`${ref} : entrée invalide.`); return; }
    if(typeof m.title!=="string" || !m.title.trim()){ errors.push(`${ref} : champ "title" obligatoire manquant.`); return; }
    if(typeof m.content!=="string" || !m.content.trim()){ errors.push(`${ref} : champ "content" obligatoire manquant.`); return; }
    if(typeof m.category!=="string" || !m.category.trim()){ errors.push(`${ref} : champ "category" obligatoire manquant.`); return; }
    if(!CATEGORIES.includes(m.category)) warnings.push(`${ref} : catégorie « ${m.category} » inconnue — le module sera importé tel quel.`);
    const id = m.id || null;
    if(id){
      if(seenIds.has(id)){ errors.push(`${ref} : identifiant en double dans le fichier (${id}).`); return; }
      seenIds.add(id);
    }
    if(id && existingById.has(id)){
      const cur = existingById.get(id);
      const identique = cur.title===m.title && cur.content===m.content && cur.category===m.category && !!cur.enabled===(m.enabled!==false);
      (identique ? plan.ignored : plan.toUpdate).push(m);
    } else {
      plan.toCreate.push(m);
    }
  });
  const importedIds = new Set(payload.modules.filter(m=>m && m.id).map(m=>m.id));
  plan.toDelete = (state.modules||[]).filter(m=> !importedIds.has(m.id));
  return { valid: errors.length===0, errors, warnings, plan };
}

/* ---------- Application ATOMIQUE (commune aux deux imports) ---------- */
function applyKnowledgeImport(plan, options){
  const opts = options || {};
  const backup = JSON.parse(JSON.stringify(state.modules || []));   // rollback complet
  const backupPacks = JSON.parse(JSON.stringify(state.packVersions || {}));
  try{
    const byId = new Map((state.modules||[]).map(m=>[m.id, m]));
    plan.toUpdate.forEach(m=>{
      const cur = byId.get(m.id);
      const merged = normalizeModule({ ...cur, ...m, id: cur.id, createdAt: cur.createdAt, updatedAt: Date.now() });
      if(!merged) throw new Error(`Module « ${m.title} » : normalisation impossible.`);
      byId.set(cur.id, merged);
    });
    plan.toCreate.forEach(m=>{
      const created = normalizeModule({ ...m, id: m.id || uid(), createdAt: Date.now(), updatedAt: Date.now() });
      if(!created) throw new Error(`Module « ${m.title} » : normalisation impossible.`);
      byId.set(created.id, created);
    });
    if(opts.deleteMissing) (plan.toDelete||[]).forEach(m=> byId.delete(m.id));
    const next = [...byId.values()];
    if(!next.length) throw new Error("L'import produirait une base vide — opération annulée.");
    state.modules = next;
    if(!LS.set("vf-modules", state.modules)) throw new Error("Écriture impossible (stockage saturé ?).");
    return { ok:true, total: next.length };
  }catch(e){
    state.modules = backup; state.packVersions = backupPacks;   // ROLLBACK
    LS.set("vf-modules", state.modules);
    return { ok:false, error: String(e.message||e) };
  }
}

/* ---------- 2. Import de fiches prestation depuis un texte ---------- */
const PRESTATION_TEXT_SECTIONS = ["description","déroulé de la séance","déroulé","caractéristique citable",
  "concept central","promesse unique","émotion dominante","signature narrative","codes visuels","interdits visuels",
  "bienfaits","public concerné","précautions","durée","tarif"];
const PRESTATION_SECTION_CANON = { "déroulé":"déroulé de la séance" };

/* Découpe un document en fiches (séparateur : une ligne "Nom :" ou un titre de prestation connu),
   puis en sections "Libellé : valeur". Seules les sections présentes seront remplacées. */
function parsePrestationsText(text){
  const fiches = [];
  const lines = String(text||"").split(/\r?\n/);
  let current = null;
  const flush = ()=>{ if(current && current.nom) fiches.push(current); current = null; };
  const sectionRe = new RegExp(`^\\s*(${PRESTATION_TEXT_SECTIONS.join("|")})\\s*:\\s*(.*)$`, "i");
  let lastSection = null;
  lines.forEach(raw=>{
    const line = raw.trim();
    const nomMatch = line.match(/^\s*(?:nom|prestation)\s*:\s*(.+)$/i);
    if(nomMatch){ flush(); current = { nom: nomMatch[1].trim(), sections:{} }; lastSection = null; return; }
    if(!current){ return; }
    const sm = line.match(sectionRe);
    if(sm){
      const key = PRESTATION_SECTION_CANON[sm[1].toLowerCase()] || sm[1].toLowerCase();
      current.sections[key] = sm[2].trim();
      lastSection = key;
      return;
    }
    if(lastSection && line){ current.sections[lastSection] += " " + line; } // continuation multi-lignes
  });
  flush();
  return fiches;
}

/* Retrouve le module Prestations correspondant à un nom, via les alias officiels puis par
   correspondance normalisée du titre. Retourne null si aucune correspondance certaine. */
function findPrestationModule(nom){
  const mods = (state.modules||[]).filter(m=> m.category==="Prestations");
  const n = normalizeForContainmentCheck(nom);
  let hit = mods.find(m=> normalizeForContainmentCheck(m.title) === n);
  if(hit) return hit;
  for(const canon of KNOWN_PRESTATIONS){
    const aliases = PRESTATION_ALIASES[canon] || [canon];
    if(aliases.some(a=> normalizeForContainmentCheck(a) === n)){
      hit = mods.find(m=> normalizeForContainmentCheck(m.title) === normalizeForContainmentCheck(canon)
                       || aliases.some(a=> normalizeForContainmentCheck(m.title) === normalizeForContainmentCheck(a)));
      if(hit) return hit;
    }
  }
  return mods.find(m=> normalizeForContainmentCheck(m.title).includes(n) || n.includes(normalizeForContainmentCheck(m.title))) || null;
}

/* Reconstruit le contenu d'une fiche en ne remplaçant QUE les sections fournies.
   Le format de sortie reste celui que le parseur du moteur sait lire ("Libellé : valeur"). */
/* Découpe un contenu "Libellé : valeur" en sections. Utilisé par la fusion ET par le diff —
   une seule implémentation, aucun risque de divergence entre ce qui est affiché et ce qui est écrit. */
function parseSectionedContent(content){
  const lines = String(content||"").split(/\r?\n/);
  const titre = lines.length && !/^\s*\w[^:]*:/.test(lines[0]) ? lines[0].trim() : "";
  const sections = {}; let last = null;
  lines.forEach(l=>{
    const m = l.match(/^\s*([^:]{2,40})\s*:\s*(.*)$/);
    if(m){ const k = m[1].trim().toLowerCase(); sections[k] = m[2].trim(); last = k; }
    else if(last && l.trim()){ sections[last] += " " + l.trim(); }
  });
  return { titre, sections };
}

function mergePrestationContent(currentContent, sections){
  const ORDER = ["caractéristique citable","concept central","promesse unique","émotion dominante","signature narrative",
    "codes visuels","interdits visuels","description","déroulé de la séance","bienfaits","public concerné","précautions","durée","tarif"];
  const LABEL = { "description":"Description", "déroulé de la séance":"Déroulé de la séance",
    "caractéristique citable":"Caractéristique citable", "concept central":"Concept central", "promesse unique":"Promesse unique",
    "émotion dominante":"Émotion dominante", "signature narrative":"Signature narrative",
    "codes visuels":"Codes visuels", "interdits visuels":"Interdits visuels", "bienfaits":"Bienfaits",
    "public concerné":"Public concerné", "précautions":"Précautions", "durée":"Durée", "tarif":"Tarif" };
  const parsed = parseSectionedContent(currentContent);
  const titre = parsed.titre;
  const existing = parsed.sections;
  Object.entries(sections).forEach(([k,v])=>{ if(v && v.trim()) existing[k] = v.trim(); });
  const out = [];
  if(titre) out.push(titre);
  ORDER.forEach(k=>{ if(existing[k]) out.push(`${LABEL[k]} : ${existing[k]}`); });
  Object.keys(existing).forEach(k=>{ if(!ORDER.includes(k)) out.push(`${k.charAt(0).toUpperCase()+k.slice(1)} : ${existing[k]}`); });
  return out.join("\n");
}

/* ---------- DIFF avant import : ce qui va réellement changer, section par section ----------
   Statuts : cree | modifie | inchange | supprime. Pour un contenu structuré ("Libellé : valeur"),
   le diff est calculé PAR SECTION via le même parseur que la fusion ; sinon, comparaison du texte
   entier. Aucune écriture, aucun effet de bord : cette fonction ne fait que décrire. */
function computeImportDiff(plan, options){
  const opts = options || {};
  const byId = new Map((state.modules||[]).map(m=>[m.id, m]));
  const entries = [];
  const champDiff = (avant, apres)=>{
    const a = parseSectionedContent(avant), b = parseSectionedContent(apres);
    const keys = [...new Set([...Object.keys(a.sections), ...Object.keys(b.sections)])];
    if(!keys.length){ // contenu non structuré : comparaison globale
      return avant===apres ? [] : [{ champ:"contenu", statut:"modifie", avant, apres }];
    }
    const out = [];
    if(a.titre !== b.titre) out.push({ champ:"titre du bloc", statut:"modifie", avant:a.titre, apres:b.titre });
    keys.forEach(k=>{
      const av = a.sections[k] || "", ap = b.sections[k] || "";
      if(av === ap) out.push({ champ:k, statut:"inchange", avant:av, apres:ap });
      else if(!av) out.push({ champ:k, statut:"cree", avant:"", apres:ap });
      else if(!ap) out.push({ champ:k, statut:"supprime", avant:av, apres:"" });
      else out.push({ champ:k, statut:"modifie", avant:av, apres:ap });
    });
    return out;
  };
  (plan.toUpdate||[]).forEach(m=>{
    const cur = byId.get(m.id) || {};
    const champs = [];
    if(m.title!==undefined && m.title!==cur.title) champs.push({ champ:"titre", statut:"modifie", avant:cur.title||"", apres:m.title });
    if(m.category!==undefined && m.category!==cur.category) champs.push({ champ:"catégorie", statut:"modifie", avant:cur.category||"", apres:m.category });
    if(m.enabled!==undefined && !!m.enabled!==!!cur.enabled) champs.push({ champ:"actif", statut:"modifie", avant:String(!!cur.enabled), apres:String(!!m.enabled) });
    if(m.content!==undefined && m.content!==cur.content) champs.push(...champDiff(cur.content||"", m.content));
    entries.push({ statut:"modifie", id:m.id, titre:m.title||cur.title||m.id, champs });
  });
  (plan.toCreate||[]).forEach(m=> entries.push({ statut:"cree", id:m.id||"(nouvel identifiant)", titre:m.title,
    champs:[{ champ:"contenu", statut:"cree", avant:"", apres:m.content||"" }] }));
  (plan.ignored||[]).forEach(m=> entries.push({ statut:"inchange", id:m.id, titre:m.title, champs:[] }));
  if(opts.deleteMissing) (plan.toDelete||[]).forEach(m=> entries.push({ statut:"supprime", id:m.id, titre:m.title,
    champs:[{ champ:"contenu", statut:"supprime", avant:m.content||"", apres:"" }] }));
  const compte = { cree:0, modifie:0, inchange:0, supprime:0 };
  entries.forEach(e=> compte[e.statut]++);
  return { entries, compte };
}

/* Prépare le plan d'import à partir d'un texte : aucune écriture ici. */
function planPrestationsImport(text){
  const fiches = parsePrestationsText(text);
  const errors = [], plan = { toCreate:[], toUpdate:[], ignored:[], toDelete:[] }, details = [];
  if(!fiches.length) errors.push("Aucune fiche détectée. Chaque fiche doit commencer par une ligne « Nom : … ».");
  fiches.forEach(f=>{
    const mod = findPrestationModule(f.nom);
    const sectionsFournies = Object.keys(f.sections).filter(k=> f.sections[k]);
    if(!mod){ errors.push(`« ${f.nom} » : aucun module Prestations correspondant (aucune création automatique pour éviter les doublons).`); return; }
    if(!sectionsFournies.length){ plan.ignored.push(mod); details.push(`${f.nom} : aucune section exploitable`); return; }
    const content = mergePrestationContent(mod.content, f.sections);
    if(content === mod.content){ plan.ignored.push(mod); details.push(`${f.nom} : contenu identique`); return; }
    plan.toUpdate.push({ ...mod, content });
    details.push(`${f.nom} → ${sectionsFournies.join(", ")}`);
  });
  return { valid: errors.length===0 && plan.toUpdate.length>0, errors, warnings:[], plan, details, fiches };
}

/* ============================================================
   B4 — ÉCRAN BANC D'ESSAI : décision en moins d'une minute.
   Niveau 1 verdict + 4 métriques · Niveau 2 le pourquoi · Niveau 3 le détail d'un cas.
   Lecture seule sur les runs (seules la notation et l'épinglage sont écrits, conformément au gel).
============================================================ */
function benchStorage(){ return window.__benchStorage = window.__benchStorage || createBenchStorage(); }
function pct(x){ return x==null ? "—" : (x*100).toFixed(0)+" %"; }
function deltaLabel(cur, ref, unit, inverse){
  if(cur==null || ref==null) return "";
  const d = cur-ref; if(Math.abs(d) < 1e-9) return " (=)";
  const better = inverse ? d<0 : d>0;
  const val = unit==="%" ? (Math.abs(d)*100).toFixed(1)+" pt" : unit==="$" ? Math.abs(d).toFixed(4)+" $" : Math.round(Math.abs(d)/1000)+" s";
  return ` (${d>0?"+":"−"}${val} ${better?"✅":"⚠️"})`;
}

function buildBenchTab(){
  const frag = el("div",{});
  frag.appendChild(el("p",{class:"label"},"Banc d'essai — validation officielle de Viewfinder"));
  if(!benchUI.runId){ buildBenchRunList(frag); return frag; }
  if(benchUI.caseId){ buildBenchCaseDetail(frag); return frag; }
  buildBenchDashboard(frag);
  return frag;
}

/* ---------- Liste des runs ---------- */
function buildBenchRunList(frag){
  const msg = el("p",{style:"font-size:12px;color:var(--muted2);min-height:16px;"},"Chargement des runs...");
  frag.appendChild(msg);
  const list = el("div",{}); frag.appendChild(list);
  (async ()=>{
    try{
      const runs = (await benchStorage().listRuns()).sort((a,b)=> String(b.startedAt).localeCompare(String(a.startedAt)));
      msg.textContent = runs.length ? `${runs.length} run(s) archivé(s).` : "Aucun run archivé. Lance un run depuis Réglages.";
      runs.forEach(r=>{
        const card = el("div",{class:"card", style:"margin-bottom:8px;"});
        card.appendChild(el("p",{style:"font-weight:600;"}, `${r.pinnedAsReference?"📌 ":""}${r.mode.toUpperCase()} — ${String(r.startedAt).slice(0,16).replace("T"," ")}`));
        card.appendChild(el("p",{style:"font-size:12px;color:var(--muted2);"}, `${r.nbCases} cas · ${r.status} · ${r.appVersion} · ${r.runId}`));
        const row = el("div",{style:"display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;"});
        row.appendChild(el("button",{class:"btn-primary", onclick:()=>{ benchUI.runId=r.runId; benchUI.caseId=null; benchUI.runCache=null; renderMain(); }}, "Ouvrir"));
        row.appendChild(el("button",{class:"btn-ghost", onclick: async ()=>{
          const run = await benchStorage().getRun(r.runId);
          const runs2 = await benchStorage().listRuns();
          for(const other of runs2.filter(x=>x.pinnedAsReference && x.runId!==r.runId)){
            const o = await benchStorage().getRun(other.runId); o.pinnedAsReference=false; await benchStorage().saveRun(o);
          }
          run.pinnedAsReference = !r.pinnedAsReference; await benchStorage().saveRun(run); renderMain();
        }}, r.pinnedAsReference ? "Retirer la référence" : "Épingler comme référence"));
        row.appendChild(el("button",{class:"btn-ghost", onclick:()=> benchExport(r.runId, false, msg)}, "Exporter (JSON)"));
        row.appendChild(el("button",{class:"btn-ghost", onclick:()=> benchExport(r.runId, true, msg)}, "Exporter avec images"));
        card.appendChild(row);
        list.appendChild(card);
      });
    }catch(e){ msg.textContent = "Erreur de lecture : "+(e.message||e); }
  })();
}

async function benchExport(runId, withImages, msgEl){
  try{
    msgEl.textContent = withImages ? "Préparation de l'export (images incluses)..." : "Préparation de l'export...";
    const data = await benchStorage().exportRun(runId, { withImages });
    const blob = new Blob([JSON.stringify(data, null, 1)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `bench-run-${runId}${withImages?"-images":""}.json`; a.click();
    setTimeout(()=> URL.revokeObjectURL(a.href), 8000);
    msgEl.textContent = `✓ Export ${withImages?"avec images ":""}(${(blob.size/1048576).toFixed(1)} Mo)`;
  }catch(e){ msgEl.textContent = "Export impossible : "+(e.message||e); }
}

/* ---------- Niveau 1 + 2 : tableau de bord de décision ---------- */
function buildBenchDashboard(frag){
  frag.appendChild(el("button",{class:"btn-ghost", style:"margin-bottom:8px;", onclick:()=>{ benchUI.runId=null; benchUI.runCache=null; renderMain(); }}, "← Tous les runs"));
  const zone = el("div",{}); frag.appendChild(zone);
  zone.appendChild(el("p",{style:"font-size:12px;color:var(--muted2);"},"Chargement..."));
  (async ()=>{
    try{
      const run = benchUI.runCache && benchUI.runCache.runId===benchUI.runId ? benchUI.runCache : await benchStorage().getRun(benchUI.runId);
      benchUI.runCache = run;
      const list = await benchStorage().listRuns();
      const refMeta = list.find(x=> x.pinnedAsReference && x.runId!==run.runId);
      const refRun = refMeta ? await benchStorage().getRun(refMeta.runId) : null;
      benchUI.refCache = refRun;
      const v = computeRunVerdict(run, refRun);
      const exp = computeRunExplanation(run, refRun);
      zone.innerHTML = "";

      /* NIVEAU 1 — verdict + 4 métriques */
      const couleur = { "amélioration":"var(--green)", "régression":"var(--red)", "stabilité":"var(--muted2)", "non concluant":"var(--muted2)" }[v.verdict];
      const banner = el("div",{class:"card", style:`border-left:4px solid ${couleur};margin-bottom:10px;`});
      banner.appendChild(el("p",{style:`font-size:20px;font-weight:700;color:${couleur};`}, v.verdict.toUpperCase()));
      banner.appendChild(el("p",{style:"font-size:13px;margin-top:4px;"}, v.raison));
      banner.appendChild(el("p",{style:"font-size:11px;color:var(--muted2);margin-top:4px;"},
        refRun ? `Comparé à la référence épinglée ${String(refRun.startedAt).slice(0,10)} (${refRun.appVersion})` : "Aucune référence épinglée"));
      zone.appendChild(banner);

      const s=v.stats, r=v.ref;
      const grid = el("div",{class:"card", style:"margin-bottom:10px;"});
      [["Taux de publiables", pct(s.tauxPubliables)+deltaLabel(s.tauxPubliables, r&&r.tauxPubliables, "%"), `${s.notes}/${s.ok} cas notés`],
       ["Échecs techniques", pct(s.tauxEchecTechnique)+deltaLabel(s.tauxEchecTechnique, r&&r.tauxEchecTechnique, "%", true), `${s.erreurs}/${s.total} cas`],
       ["Coût moyen / cas", (s.coutMoyen!=null? s.coutMoyen.toFixed(4)+" $":"—")+deltaLabel(s.coutMoyen, r&&r.coutMoyen, "$", true), `total ${run.costMeasuredTotal.toFixed(4)} $`],
       ["Durée moyenne / cas", (s.dureeMoyenneMs!=null? (s.dureeMoyenneMs/1000).toFixed(1)+" s":"—")+deltaLabel(s.dureeMoyenneMs, r&&r.dureeMoyenneMs, "s", true), `total ${(run.durationTotal/60000).toFixed(1)} min`],
      ].forEach(([k,val,sub])=>{
        grid.appendChild(el("div",{style:"display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--border);"},[
          el("span",{style:"font-size:13px;"},k), el("span",{style:"font-size:14px;font-weight:600;text-align:right;"}, val)]));
        grid.appendChild(el("p",{style:"font-size:11px;color:var(--muted2);margin:0 0 4px;"}, sub));
      });
      zone.appendChild(grid);

      /* NIVEAU 2 — pourquoi */
      const why = el("div",{class:"card", style:"margin-bottom:10px;"});
      why.appendChild(el("p",{class:"label"},"Pourquoi"));
      if(exp.motifsDelta.length){
        why.appendChild(el("p",{style:"font-size:12px;font-weight:600;margin-top:6px;"},"Motifs de refus qui varient le plus"));
        exp.motifsDelta.slice(0,5).forEach(m=> why.appendChild(el("p",{style:"font-size:12px;color:var(--muted2);"},
          `${m.delta>0?"▲":"▼"} ${m.motif} : ${m.reference} → ${m.actuel}`)));
      }
      if(exp.prestations.length){
        why.appendChild(el("p",{style:"font-size:12px;font-weight:600;margin-top:8px;"},"Prestations qui bougent (≥ 20 pt)"));
        exp.prestations.forEach(p=> why.appendChild(el("p",{style:"font-size:12px;color:var(--muted2);"},
          `${p.delta>0?"▲":"▼"} ${p.prestation} : ${(p.delta*100).toFixed(0)} pt`)));
      }
      if(exp.composants.length){
        why.appendChild(el("p",{style:"font-size:12px;font-weight:600;margin-top:8px;"},"Composants modifiés depuis la référence"));
        exp.composants.forEach(c=> why.appendChild(el("p",{style:"font-size:12px;color:var(--muted2);"}, "• "+c)));
      }
      const mu = exp.moduleUsage;
      if(mu.casAvecModules){
        const ids = Object.keys(mu.usage).sort((a,b)=> mu.usage[b]-mu.usage[a]);
        const toujours = ids.filter(id=> mu.usage[id]===mu.casAvecModules);
        const actifs = new Set(ids);
        const jamais = (state.modules||[]).filter(m=> m.enabled && m.category==="MASTER_IMAGE" && !actifs.has(m.id));
        why.appendChild(el("p",{style:"font-size:12px;font-weight:600;margin-top:8px;"},"Modules MASTER_IMAGE"));
        why.appendChild(el("p",{style:"font-size:12px;color:var(--muted2);"}, `${toujours.length} toujours injecté(s) · ${ids.length} utilisé(s) au moins une fois · ${jamais.length} jamais utilisé(s)`));
        if(jamais.length) why.appendChild(el("p",{style:"font-size:11px;color:var(--muted2);"}, "Jamais utilisés : "+jamais.map(m=>m.title).join(", ")));
      }
      if(!exp.motifsDelta.length && !exp.composants.length && !mu.casAvecModules)
        why.appendChild(el("p",{style:"font-size:12px;color:var(--muted2);"},"Notation en cours : les explications apparaîtront dès que les cas seront notés."));
      zone.appendChild(why);

      /* Notation : liste des cas */
      const head = el("div",{style:"display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px;"},[
        el("p",{class:"label", style:"margin:0;"}, `Cas (${run.cases.length})`),
        el("button",{class:"btn-ghost", onclick:()=>{ benchUI.expert=!benchUI.expert; renderMain(); }}, benchUI.expert?"Mode expert ✓":"Mode expert"),
      ]);
      zone.appendChild(head);
      run.cases.forEach(slot=>{
        if(!slot.result) return;
        const l=slot.testCase.labels, res=slot.result;
        const note = (run.scores||{})[res.caseId];
        const card = el("div",{class:"card", style:"margin-bottom:6px;padding:8px;"});
        card.appendChild(el("p",{style:"font-size:13px;font-weight:600;"}, `${l.prestation} × ${l.platform}`));
        card.appendChild(el("p",{style:"font-size:11px;color:var(--muted2);"},
          `${res.status}${res.errors&&res.errors.length?" — "+String(res.errors[0]).slice(0,70):""} · ${(res.durationMs/1000).toFixed(1)} s${res.metrics&&res.metrics.totalCostUsd!=null?" · "+res.metrics.totalCostUsd.toFixed(4)+" $":""}`));
        if(res.status==="ok"){
          const noteRow = el("div",{style:"display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;"});
          Object.entries(BENCH_SCORE_STATUTS).forEach(([k,label])=>{
            const active = note && note.statut===k;
            noteRow.appendChild(el("button",{class: active?"btn-primary":"btn-ghost", style:"font-size:12px;padding:4px 8px;",
              onclick: ()=> benchSetNote(run, res.caseId, k)}, label));
          });
          card.appendChild(noteRow);
          if(note && note.statut!=="publiable"){
            const motifsRow = el("div",{style:"display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;"});
            BENCH_REFUS_MOTIFS.forEach(m=>{
              const on = (note.motifs||[]).includes(m);
              motifsRow.appendChild(el("button",{class: on?"btn-secondary":"btn-ghost", style:"font-size:11px;padding:3px 6px;",
                onclick: ()=> benchToggleMotif(run, res.caseId, m)}, m));
            });
            card.appendChild(motifsRow);
          }
        }
        card.appendChild(el("button",{class:"btn-ghost", style:"margin-top:6px;font-size:12px;", onclick:()=>{ benchUI.caseId=res.caseId; renderMain(); }}, "Détail →"));
        zone.appendChild(card);
      });
    }catch(e){ zone.innerHTML=""; zone.appendChild(el("p",{style:"color:var(--red);"},"Erreur : "+(e.message||e))); }
  })();
}

async function benchSetNote(run, caseId, statut){
  run.scores = run.scores || {};
  const prev = run.scores[caseId] || {};
  run.scores[caseId] = { statut, motifs: statut==="publiable" ? [] : (prev.motifs||[]), expert: prev.expert||null, scorerId:"human-rapide", notedAt:new Date().toISOString() };
  await benchStorage().saveRun(run); benchUI.runCache = run; renderMain();
}
async function benchToggleMotif(run, caseId, motif){
  run.scores = run.scores || {};
  const s = run.scores[caseId]; if(!s) return;
  const set = new Set(s.motifs||[]); set.has(motif) ? set.delete(motif) : set.add(motif);
  s.motifs = [...set]; s.notedAt = new Date().toISOString();
  await benchStorage().saveRun(run); benchUI.runCache = run; renderMain();
}

/* ---------- Niveau 3 : détail d'un cas (+ comparaison avec la référence) ---------- */
function buildBenchCaseDetail(frag){
  frag.appendChild(el("button",{class:"btn-ghost", style:"margin-bottom:8px;", onclick:()=>{ benchUI.caseId=null; renderMain(); }}, "← Tableau de bord"));
  const zone = el("div",{}); frag.appendChild(zone);
  (async ()=>{
    try{
      const run = benchUI.runCache || await benchStorage().getRun(benchUI.runId);
      const slot = run.cases.find(c=> c.result && c.result.caseId===benchUI.caseId);
      if(!slot){ zone.appendChild(el("p",{},"Cas introuvable.")); return; }
      const res = slot.result, l = slot.testCase.labels;
      zone.appendChild(el("p",{class:"label"}, `${l.prestation} × ${l.platform}`));

      const showImage = async (container, storage, imageId, legende)=>{
        if(!imageId){ container.appendChild(el("p",{style:"font-size:12px;color:var(--muted2);"}, legende+" : aucune image (mode Smoke)")); return; }
        try{
          const blob = await storage.getCaseImage(imageId);
          if(!blob){ container.appendChild(el("p",{style:"font-size:12px;color:var(--muted2);"}, legende+" : image purgée")); return; }
          const url = URL.createObjectURL(blob);
          container.appendChild(el("p",{style:"font-size:11px;color:var(--muted2);margin-top:6px;"}, legende));
          container.appendChild(el("img",{src:url, style:"width:100%;border-radius:8px;"}));
        }catch(e){ container.appendChild(el("p",{style:"font-size:12px;color:var(--red);"}, legende+" : "+(e.message||e))); }
      };

      /* Comparaison A/B avec la même cellule du run de référence */
      const ref = benchUI.refCache;
      const refSlot = ref ? (ref.cases||[]).find(c=> c.result && c.testCase.labels.prestation===l.prestation && c.testCase.labels.platform===l.platform) : null;
      const imgs = el("div",{}); zone.appendChild(imgs);
      await showImage(imgs, benchStorage(), res.outputs && res.outputs.imageId, "Image A — ce run");
      if(refSlot) await showImage(imgs, benchStorage(), refSlot.result.outputs && refSlot.result.outputs.imageId, "Image B — référence");

      const bloc = (titre, contenu)=>{
        const c = el("div",{class:"card", style:"margin-top:8px;"});
        c.appendChild(el("p",{class:"label"}, titre));
        c.appendChild(vfWrap(el("pre",{style:"font-size:11px;white-space:pre-wrap;"}, contenu)));
        return c;
      };
      zone.appendChild(bloc("Prompt final envoyé à OpenAI (A)", (res.outputs && res.outputs.imagePrompt) || "—"));
      if(refSlot) zone.appendChild(bloc("Prompt de la référence (B)", (refSlot.result.outputs && refSlot.result.outputs.imagePrompt) || "—"));
      zone.appendChild(bloc("Brief", JSON.stringify(res.artifacts && res.artifacts.brief || {}, null, 1)));
      zone.appendChild(bloc("Modules injectés", ((res.artifacts && res.artifacts.moduleIds) || []).join("\n") || "non archivé (run antérieur à B4)"));
      zone.appendChild(bloc("Diagnostics", JSON.stringify(res.diagnostics || {}, null, 1)));
      zone.appendChild(bloc("Métriques", JSON.stringify(res.metrics || {}, null, 1)));
      if((res.errors||[]).length) zone.appendChild(bloc("Erreurs", res.errors.join("\n")));

      /* Mode expert : grille détaillée facultative */
      if(benchUI.expert && res.status==="ok"){
        const note = (run.scores||{})[res.caseId] || {};
        const card = el("div",{class:"card", style:"margin-top:8px;"});
        card.appendChild(el("p",{class:"label"},"Mode expert — grille détaillée (facultative)"));
        BENCH_EXPERT_CRITERES.forEach(crit=>{
          const val = (note.expert && note.expert[crit]) || 5;
          const row = el("div",{style:"display:flex;align-items:center;gap:8px;margin:4px 0;"});
          row.appendChild(el("span",{style:"font-size:12px;flex:1;"}, crit.replace(/_/g," ")));
          const input = el("input",{type:"range", min:"0", max:"10", value:String(val), style:"flex:2;"});
          const out = el("span",{style:"font-size:12px;width:24px;"}, String(val));
          input.addEventListener("input", e=>{ out.textContent = e.target.value; });
          input.addEventListener("change", async e=>{
            run.scores = run.scores || {}; run.scores[res.caseId] = run.scores[res.caseId] || { statut:"retravailler", motifs:[], scorerId:"human-rapide" };
            const s = run.scores[res.caseId]; s.expert = s.expert || {}; s.expert[crit] = Number(e.target.value); s.notedAt = new Date().toISOString();
            await benchStorage().saveRun(run); benchUI.runCache = run;
          });
          row.appendChild(input); row.appendChild(out);
          card.appendChild(row);
        });
        zone.appendChild(card);
      }
    }catch(e){ zone.appendChild(el("p",{style:"color:var(--red);"},"Erreur : "+(e.message||e))); }
  })();
}

/* ============================================================
   EXPÉRIENCE experience2_priorites (A/B) — comparaison automatique, même discipline que
   computeBriefCompletComparison : les cas en échec technique sont EXCLUS du calcul, jamais
   comptés comme "0 mismatch". Preuve de transmission : regroupementApplique (A et B) et
   instructionPrioriteIncluse (B uniquement). */
function computePrioritesComparison(runExp, runBaseline){
  const kw = (list, words) => (list||[]).some(m => words.some(w=> String(m||"").toLowerCase().includes(w)));
  const byId = new Map((runBaseline.cases||[]).map(c=> [c.result && c.result.caseId, c]));
  const rows = (runExp.cases||[]).map(cExp=>{
    const id = cExp.result && cExp.result.caseId;
    const cBase = byId.get(id);
    const labels = cExp.testCase.labels;
    const analyseExp = cExp.result?.diagnostics?.image?.analysis || null;
    const analyseBase = cBase?.result?.diagnostics?.image?.analysis || null;
    const echecExp = !cExp.result || cExp.result.status!=="ok" || !analyseExp;
    const echecBaseline = !cBase || !cBase.result || cBase.result.status!=="ok" || !analyseBase;
    const mismExp = (analyseExp && analyseExp.briefMismatch) || [];
    const mismBase = (analyseBase && analyseBase.briefMismatch) || [];
    return {
      caseId: id, prestation: labels.prestation, platform: labels.platform,
      trouveDansBaseline: !!cBase, echecTechnique: echecExp || echecBaseline,
      echecDetail: echecExp ? "expérience : "+((cExp.result && cExp.result.errors && cExp.result.errors[0]) || "pas d'analyse visuelle") : (echecBaseline ? "baseline : cas non exploitable" : null),
      baseline: {
        mismatchCount: mismBase.length, mismatchList: mismBase,
        seuilMismatch: kw(mismBase, ["seuil","monument"]),
        profondeurMismatch: kw(mismBase, ["plan ","profondeur","arrière-plan","premier plan","flou"]),
      },
      experience: {
        mismatchCount: mismExp.length, mismatchList: mismExp,
        seuilMismatch: kw(mismExp, ["seuil","monument"]),
        profondeurMismatch: kw(mismExp, ["plan ","profondeur","arrière-plan","premier plan","flou"]),
        instrumentation: cExp.result?.diagnostics?.instrumentation || null,
      },
      delta: (echecExp || echecBaseline) ? null : mismExp.length - mismBase.length,
    };
  });
  const comp = rows.filter(r=> r.trouveDansBaseline && !r.echecTechnique);
  const echecs = rows.filter(r=> r.echecTechnique);
  const ameliores = comp.filter(r=> r.delta<0).length;
  const stables = comp.filter(r=> r.delta===0).length;
  const degrades = comp.filter(r=> r.delta>0).length;
  const seuilBaseCount = comp.filter(r=> r.baseline.seuilMismatch).length;
  const seuilCorrige = comp.filter(r=> r.baseline.seuilMismatch && !r.experience.seuilMismatch).length;
  const profBaseCount = comp.filter(r=> r.baseline.profondeurMismatch).length;
  const profCorrige = comp.filter(r=> r.baseline.profondeurMismatch && !r.experience.profondeurMismatch).length;
  const variante = comp.length ? (comp.find(r=> r.experience.instrumentation)?.experience.instrumentation?.variante || "?") : "?";
  const regroupementOk = comp.filter(r=> r.experience.instrumentation && r.experience.instrumentation.regroupementApplique).length;
  const instructionOk = comp.filter(r=> r.experience.instrumentation && r.experience.instrumentation.instructionPrioriteIncluse).length;
  const verdict = echecs.length > 0 ? `non concluant — ${echecs.length}/${rows.length} cas en échec technique, exclus du calcul. Relancer pour obtenir un échantillon complet.`
    : comp.length===0 ? "non concluant — baseline introuvable ou aucun cas commun"
    : regroupementOk < comp.length ? "invalide — regroupement non appliqué sur au moins un cas exploitable (vérifier avant d'interpréter)"
    : ameliores > degrades && ameliores >= Math.ceil(comp.length*0.5) ? "amélioration nette"
    : ameliores > degrades ? "amélioration partielle"
    : ameliores === degrades ? "gain faible ou nul"
    : "dégradation";
  return {
    generatedAt: new Date().toISOString(), variante,
    runExpId: runExp.runId, runBaselineId: runBaseline.runId,
    nbCasComparables: comp.length, nbCasTotal: rows.length, nbCasEchecTechnique: echecs.length,
    regroupementConfirmeSur: `${regroupementOk}/${comp.length}`,
    instructionConfirmeeSur: variante==="B" ? `${instructionOk}/${comp.length}` : "n/a (aucune instruction de priorité dans cette variante)",
    ameliores, stables, degrades,
    seuilMonumentalCorrigeSur: `${seuilCorrige}/${seuilBaseCount}`,
    profondeurCorrigeeSur: `${profCorrige}/${profBaseCount}`,
    verdict, rows, echecs,
  };
}
