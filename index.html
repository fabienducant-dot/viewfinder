    typeCreation: typeCreationImpose || "luxe_silencieux",
    // Volontairement vide : un repli local ne peut pas déduire fidèlement une caractéristique de la
    // fiche sans l'inventer — cela déclenchera un blockingError via validateAndFixBrief, jamais une
    // caractéristique inventée localement.
    caracteristiqueSourcePrestation: "",
    structureNarrative: {
      etatInitial: "tension légère", tension: "attente",
      transformation: "apaisement progressif", etatFinal: "calme retrouvé",
    },
    plansVisuels: {
      premierPlan: "sujet principal seul", planPrincipal: "sujet principal seul",
      planSecondaire: "aucun plan secondaire", arrierePlan: "espace noir & or épuré",
    },
    symbolePrincipal: "aucun symbole monumental",
    oppositionVisuelle: "aucune opposition marquée",
    pointDeTransformation: "aucun",
    zoneTexte: "aucune zone de texte prévue",
    zoneLogo: "zone sobre réservée en bas de l'image",
  };
}

/* ---------- PHASE A — PRÉPARATION (GRATUITE, aucun appel image) ----------
   Diversité déterministe -> Creative Planner -> validation locale -> sélection des références ->
   prompt image compact. Rien ici ne consomme de crédit image. Le résultat est ce qui doit être
   affiché dans le Prompt Inspector AVANT toute confirmation. */
/* ============================================================
   T2 — CONSTRUCTEUR DU PROMPT (unique).
   SEUL composant autorisé à produire le texte envoyé à OpenAI.
   Deux modes internes, une seule sortie :
   - Rédacteur DA (chemin nominal) : décisions -> langage naturel ;
   - sérialiseur neutre (repli/désactivation) : décisions -> phrases factuelles minimales,
     AUCUNE créativité (le repli n'est pas un second rédacteur).
   En-tête et garde-fous : helpers déterministes partagés, hors de portée du Rédacteur.
============================================================ */
async function buildFinalImagePrompt(brief, platform, aspectKey, isCampaign, opts){
  const blockingError = !!(opts && opts.blockingError);
  /* EXPÉRIENCE experience2_prompt_direct (D1 uniquement pour l'instant, D2 non implémentée) —
     branche additive, jamais empruntée par la production. Hypothèse testée : la reformulation
     en prose par le Rédacteur DA fait-elle perdre une partie de la structure utile au modèle
     d'image ? Ici, AUCUN Rédacteur n'est appelé — le prompt part directement du sérialiseur
     déterministe groupé vers gpt-image-1. Réutilise serializeBriefToPromptFallbackGroupe (corrigé :
     ideeVisuelle ajoutée) EXACTEMENT comme chemin principal — mêmes champs que ceux envoyés au
     Rédacteur en variante A, aucune information en plus ni en moins, pour isoler une seule
     variable : la présence ou non du Rédacteur. */
  if(opts && opts.experimentalMode === "prompt_direct_D1" && !blockingError){
    const direct = serializeBriefToPromptFallbackGroupe(brief, platform, aspectKey, isCampaign, "A");
    return {
      prompt: direct.prompt, daWriterUsed: false, daWriterFallbackReason: null,
      instrumentation: { ...direct.instrumentation, variante: "D1", redacteurCourtCircuite: true },
    };
  }
  /* EXPÉRIENCE experience2_priorites (A/B) — branche additive, jamais empruntée par la production.
     "priorites_A" : regroupement visuel seul, 0 instruction ajoutée.
     "priorites_B" : même regroupement + une unique phrase de règle de priorité. */
  if(opts && (opts.experimentalMode === "priorites_A" || opts.experimentalMode === "priorites_B") && !blockingError){
    const variante = opts.experimentalMode === "priorites_B" ? "B" : "A";
    if(USE_DA_WRITER){
      try{
        const narrative = await rewriteBriefAsNarrativeGroupe(brief, variante);
        return {
          prompt: cleanPrompt(`${buildPromptHeader(brief, platform, aspectKey, isCampaign)}

${narrative.text}

${buildFixedGuardrailBlocks(brief, platform)}`),
          daWriterUsed: true, daWriterFallbackReason: null, redacteurUsage: narrative.usage || null,
          instrumentation: narrative.instrumentation,
        };
      }catch(err){
        const fb = serializeBriefToPromptFallbackGroupe(brief, platform, aspectKey, isCampaign, variante);
        return { prompt: fb.prompt, daWriterUsed: false, daWriterFallbackReason: String(err.message||err), instrumentation: fb.instrumentation };
      }
    }
    const fb = serializeBriefToPromptFallbackGroupe(brief, platform, aspectKey, isCampaign, variante);
    return { prompt: fb.prompt, daWriterUsed: false, daWriterFallbackReason: null, instrumentation: fb.instrumentation };
  }
  /* EXPÉRIENCE experience2_brief_complet — branche additive, jamais empruntée par la production
     (aucun appelant de production ne fixe opts.experimentalMode). Les branches USE_DA_WRITER /
     repli ci-dessous restent strictement inchangées et inatteignables depuis cette branche. */
  if(opts && opts.experimentalMode === "brief_complet" && !blockingError){
    if(USE_DA_WRITER){
      try{
        const narrative = await rewriteBriefAsNarrativeComplet(brief);
        return {
          prompt: cleanPrompt(`${buildPromptHeader(brief, platform, aspectKey, isCampaign)}

${narrative.text}

${buildFixedGuardrailBlocks(brief, platform)}`),
          daWriterUsed: true, daWriterFallbackReason: null, redacteurUsage: narrative.usage || null,
          transmissionCheck: narrative.transmissionCheck,
        };
      }catch(err){
        const fb = serializeBriefToPromptFallbackComplet(brief, platform, aspectKey, isCampaign);
        return { prompt: fb.prompt, daWriterUsed: false, daWriterFallbackReason: String(err.message||err), transmissionCheck: fb.transmissionCheck };
      }
    }
    const fb = serializeBriefToPromptFallbackComplet(brief, platform, aspectKey, isCampaign);
    return { prompt: fb.prompt, daWriterUsed: false, daWriterFallbackReason: null, transmissionCheck: fb.transmissionCheck };
  }
  if(USE_DA_WRITER && !blockingError){
    try{
      const narrative = await rewriteBriefAsNarrative(brief);
      return {
        prompt: cleanPrompt(`${buildPromptHeader(brief, platform, aspectKey, isCampaign)}

${narrative.text}

${buildFixedGuardrailBlocks(brief, platform)}`),
        daWriterUsed: true, daWriterFallbackReason: null, redacteurUsage: narrative.usage || null,
      };
    }catch(err){
      return { prompt: serializeBriefToPromptFallback(brief, platform, aspectKey, isCampaign), daWriterUsed: false, daWriterFallbackReason: String(err.message||err) };
    }
  }
  return { prompt: serializeBriefToPromptFallback(brief, platform, aspectKey, isCampaign), daWriterUsed: false, daWriterFallbackReason: null };
}

/* Le nom commercial est indispensable dans le brief, l'Inspector et le contrôle produit, mais sa
   répétition dans le prompt image incite le modèle à le dessiner. Pour PSiO®, le générateur ne
   reçoit donc qu'un alias descriptif neutre ; les trois images restent la source de vérité pour la
   géométrie. Le vrai nom et le vrai logo ne réapparaissent qu'ensuite, via Canvas. */
function stripPsioBrandFromImagePrompt(prompt){
  return String(prompt||"")
    .replace(/PSiO(?:®)?/gi, "dispositif officiel de luminothérapie");
}
function stripHealyBrandFromImagePrompt(prompt){
  return String(prompt||"")
    .replace(/Healy/gi, "dispositif officiel de biorésonance");
}

/* ---------- CREATIVE PLANNER V2 — fonction charnière ----------
   Traduit un brief V2 (validé par validateAndFixBriefV2) vers la forme exacte attendue par tout
   le reste du pipeline (extractExportableBriefFields, serializeBriefToPromptFallback,
   buildOrchestratorPacket, validateAssembledPrompt...). C'est la SEULE fonction qui a besoin de
   connaître à la fois les noms V2 et les noms V1 — voir IMPLEMENTATION.md §3.5/§4. */
function mapBriefV2ToV1Shape(briefV2){
  const ms = briefV2.miseEnScene || {};
  return {
    caracteristiqueSourcePrestation: briefV2.ancrageReel,
    ideeVisuelle: briefV2.momentCinematographique,
    pointDeTransformation: briefV2.momentCinematographique,
    archetypeNarratif: briefV2.archetypeEmotionnel,
    sujetPrincipal: ms.sujetPrincipal, action: ms.action, cadrage: ms.cadrage, pointDeVue: ms.pointDeVue,
    emotion: deriveEmotionFromChaine(briefV2),
    decor: briefV2.decor, lumiere: briefV2.lumiere, elementOr: briefV2.elementOr,
    niveauLuminosite: briefV2.niveauLuminosite, symbolePrincipal: briefV2.symbolePrincipal,
    caracteristiquePrestationVisible: briefV2.caracteristiquePrestationVisible,
    typeCreation: briefV2.typeCreation, presenceSoin: briefV2.presenceSoin,
    compositionInterdite: briefV2.compositionInterdite, negativePrompt: briefV2.negativePrompt,
    referenceFamily: briefV2.referenceFamily, texteImage: briefV2.texteImage,
    zoneTexte: briefV2.zoneTexte, zoneLogo: briefV2.zoneLogo, messageCentral: briefV2.messageCentral,
    raisonDifferenceAvecHistorique: briefV2.raisonDetre,
    registresActifs: Array.isArray(briefV2.registresActifs) ? [...briefV2.registresActifs] : [],
  };
}

async function prepareCreativeBrief(inputs){
  const { mission, platform, prestation, topic, aspectKey, isCampaign, registres } = inputs;
  const steps = {};
  const plannerVersion = inputs.plannerVersion || "v2";

  // typeCreation figé ICI, depuis la copie des registres transmise dans inputs (jamais depuis
  // state.registres directement) : le flux préparé reste indépendant de l'état courant de l'interface.
  // Calculé AVANT computeAllowedArchetypes, qui a besoin de cette valeur pour choisir le bon catalogue.
  const typeCreationImpose = (Array.isArray(registres) && registres.includes("fantastique"))
    ? "affiche_fantastique" : "luxe_silencieux";

  /* benchNeutralHistory (Banc d'essai) : la SOURCE de l'historique est paramétrée — la logique du
     pipeline est strictement identique. Production : pas d'override -> comportement inchangé. */
  const neutralHist = inputs.benchNeutralHistory ? [] : null;
  const moduleTrace = {}; // B4 : identifiants des modules injectés (contenu jamais archivé)
  const allowed = computeAllowedArchetypes(mission, prestation, platform, typeCreationImpose, neutralHist);
  const exclusions = computeRecentCompositionExclusions(platform, neutralHist);
  steps.allowed = allowed.map(a=>a.id); steps.exclusions = exclusions;
  steps.moduleIds = null; // renseigné après l'appel du Planner

  let brief, briefCorrected = false, plannerError = null, usedLocalBriefFallback = false, blockingError = null, plannerUsage = null;
  let aucuneRaisonDetre = false, filiationConflitMomentFaible = false, plannerNetworkRetryUsed = false;

  if(plannerVersion === "v2"){
    try{
      const plannerResult = await generateCreativeBriefV2(mission, prestation, platform, topic, typeCreationImpose, registres, neutralHist, moduleTrace);
      briefCorrected = plannerResult.corrected; blockingError = plannerResult.blockingError;
      aucuneRaisonDetre = !!plannerResult.aucuneRaisonDetre;
      filiationConflitMomentFaible = !!plannerResult.filiationConflitMomentFaible;
      plannerNetworkRetryUsed = !!plannerResult.plannerNetworkRetryUsed;
      plannerUsage = plannerResult.usage || null;
      steps.moduleIds = moduleTrace.moduleIds || null;
      brief = mapBriefV2ToV1Shape(plannerResult.brief);
    }catch(err){
      plannerError = `Échec du Creative Planner V2 : ${String(err.message||err)}`;
      brief = mapBriefV2ToV1Shape(localFallbackBriefV2(mission, prestation, platform, topic, allowed, typeCreationImpose));
      usedLocalBriefFallback = true;
    }
  } else {
    try{
      const plannerResult = await generateCreativeBrief(mission, prestation, platform, topic, typeCreationImpose, registres, neutralHist, moduleTrace);
      brief = plannerResult.brief; briefCorrected = plannerResult.corrected; blockingError = plannerResult.blockingError;
      plannerUsage = plannerResult.usage || null;
      steps.moduleIds = moduleTrace.moduleIds || null;
    }catch(err){
      plannerError = `Échec du Creative Planner : ${String(err.message||err)}`;
      brief = localFallbackBrief(mission, prestation, platform, topic, allowed, typeCreationImpose);
      usedLocalBriefFallback = true;
    }
  }
  if(!brief || !brief.archetypeNarratif){
    plannerError = plannerError || "Brief invalide : archétype manquant.";
    brief = plannerVersion==="v2"
      ? mapBriefV2ToV1Shape(localFallbackBriefV2(mission, prestation, platform, topic, allowed, typeCreationImpose))
      : localFallbackBrief(mission, prestation, platform, topic, allowed, typeCreationImpose);
    usedLocalBriefFallback = true;
  }
  if(usedLocalBriefFallback){
    // Le repli local n'a pas de caractéristique fidèle déductible sans invention — la validation
    // tourne quand même, pour produire un blockingError cohérent plutôt qu'une erreur JavaScript
    // ou une caractéristique inventée. Le Prompt Inspector reste exploitable dans tous les cas.
    const fallbackValidation = validateAndFixBrief(brief, allowed, exclusions, typeCreationImpose, prestation);
    brief = fallbackValidation.brief;
    blockingError = fallbackValidation.blockingError;
  }

  let referenceSelections = [], referenceError = null;
  if(prestation==="Luminothérapie PSIO®"){
    try{
      // Seules les trois vues produit PSiO® sont autorisées : aucune référence artistique ou
      // ancienne génération ne doit influencer la forme du dispositif officiel.
      referenceSelections = await getOfficialPsioReferenceSelections();
    }catch(err){
      referenceError = `Référence officielle PSiO® indisponible : ${String(err.message||err)}`;
      blockingError = blockingError || "Référence produit officielle PSiO® indisponible — génération bloquée avant l'appel image pour éviter d'inventer d'autres lunettes.";
      referenceSelections = [];
    }
  }else if(prestation==="Biorésonance quantique"){
    try{
      // Seules les deux vues produit Healy sont autorisées : aucune référence artistique ou
      // ancienne génération ne doit influencer la forme du dispositif officiel.
      referenceSelections = await getOfficialHealyReferenceSelections();
    }catch(err){
      referenceError = `Référence officielle Healy indisponible : ${String(err.message||err)}`;
      blockingError = blockingError || "Référence produit officielle Healy indisponible — génération bloquée avant l'appel image pour éviter d'inventer un autre dispositif.";
      referenceSelections = [];
    }
  }else{
    try{ referenceSelections = selectReferencesForBrief(brief, platform, 2) || []; }
    catch(err){ referenceError = `Sélection de référence impossible, génération sans référence : ${String(err.message||err)}`; referenceSelections = []; }
  }

  /* T2 — CONSTRUCTEUR UNIQUE : toute production du prompt image passe par buildFinalImagePrompt.
     prepareCreativeBrief ne construit plus rien lui-même. */
  const built = await buildFinalImagePrompt(brief, platform, aspectKey, !!isCampaign, { blockingError, experimentalMode: inputs.experimentalMode || null });
  const imagePrompt = prestation==="Luminothérapie PSIO®"
    ? stripPsioBrandFromImagePrompt(built.prompt)
    : prestation==="Biorésonance quantique"
    ? stripHealyBrandFromImagePrompt(built.prompt)
    : built.prompt;
  const daWriterUsed = built.daWriterUsed;
  const daWriterFallbackReason = built.daWriterFallbackReason;
  const transmissionCheck = built.transmissionCheck || null; // EXPÉRIENCE brief_complet uniquement — null en production
  const instrumentation = built.instrumentation || null; // EXPÉRIENCE priorites A/B uniquement — null en production
  /* usage : tokens RÉELS remontés par le serveur (null si le provider ne les expose pas) —
     jamais confondus avec une estimation. */
  const usage = Object.freeze({ planner: plannerUsage || null, redacteur: built.redacteurUsage || null });

  /* T1 (architecture figée) — Orchestrateur + Validator en mode RAPPORT : ils observent le brief
     validé et le prompt assemblé, produisent des objets gelés pour l'Inspector. Le prompt envoyé
     n'est PAS modifié en T1 ; le passage en mode bloquant est la bascule prévue en fin de tranche. */
  let paquetOrchestrateur = null, validatorReport = null;
  try{
    paquetOrchestrateur = buildOrchestratorPacket(brief, registres, platform, aspectKey);
    validatorReport = validateAssembledPrompt(imagePrompt, paquetOrchestrateur, brief);
  }catch(e){ validatorReport = Object.freeze({ erreurInterne: String(e.message||e) }); }

  return {
    phase: "prepared", inputs, allowed, exclusions, brief, briefCorrected, plannerError,
    usedLocalBriefFallback, referenceSelections, referenceError, imagePrompt, steps, blockingError,
    daWriterUsed, daWriterFallbackReason, usage, transmissionCheck, instrumentation,
    paquetOrchestrateur, validatorReport,
    appVersion: VF_VERSION,
    plannerVersion, aucuneRaisonDetre, filiationConflitMomentFaible, plannerNetworkRetryUsed, // EXPÉRIENCE Planner V2 — null/false en V1
  };
}

/* ---------- PHASE B — GÉNÉRATION (PAYANTE, uniquement après confirmation explicite) ----------
   Prend le résultat EXACT de prepareCreativeBrief (rien n'est recalculé) : image -> analyse ->
   texte. Chaque étape a son propre repli, jamais de relance automatique d'un appel image payant. */
/* B3.1 — POST-TRAITEMENT partagé (extraction validée) : calcule logoInScene et applique le Canvas
   si le logo n'est pas déjà dans la scène. Fonction PURE : aucune écriture — le handler de
   production garde ses écritures (bibliothèque, postImageId, historique, lab) après l'appel ;
   l'exécuteur du Banc n'écrit rien. Une seule implémentation du post-traitement pour les deux. */
async function finalizeGeneratedImage(flow){
  const platform = flow.inputs.platform;
  const generatedOverlayViolation=findGeneratedOverlayViolation(flow.analysis);
  if(generatedOverlayViolation){
    throw new Error(`Image brute refusée avant Canvas : ${generatedOverlayViolation.replace(/^overlay ia interdit\s*:\s*/i,"")}. Le texte et le logo officiels doivent être ajoutés uniquement par Canvas.`);
  }
  const productViolation=findProductReferenceViolation(flow.analysis);
  if(productViolation){
    throw new Error(`Image brute refusée avant Canvas : ${productViolation}. Aucune visière générique ne peut remplacer le produit officiel.`);
  }
  const paletteViolation=findPaletteViolation(flow.analysis);
  if(paletteViolation){
    throw new Error(`Image brute refusée avant Canvas : ${paletteViolation}. Canvas n'ajoute jamais sa signature sur une image hors charte.`);
  }
  /* Une référence utilisée ne prouve jamais que le logo officiel est présent et exact.
     Seule la signature ajoutée par Canvas est considérée comme valide. */
  const logoInScene = false;
  /* 1) format officiel de la plateforme */
  let dataUrl = await normalizeToPlatformFormat(flow.dataUrl, platform);
  /* 2) accroche : généralisée (demande explicite) à Instagram/Facebook/Story pour TOUTE prestation,
        sur le même modèle structuré "NOM COURT | sous-ligne" que PSiO/Story — plus de contentHeadline
        générique pour Instagram/Facebook. Le texte vient du brief créatif (texteImage), jamais de
        GPT-image. Repli identique si texteImage est vide. */
  const structuredHeadline = flow.brief && typeof flow.brief.texteImage==="string"
    ? (flow.brief.texteImage.trim() || `${String(flow.brief.messageCentral||"RÉVÉLEZ-VOUS").split(/\s+/).slice(0,5).join(" ")} | UNE EXPÉRIENCE TRANSFORMATRICE`) : "";
  const headline = (PLATFORM_OVERLAY[platform]==="accroche" || PLATFORM_OVERLAY[platform]==="fort")
    ? structuredHeadline : "";
  /* 3) logo : appliqué sauf s'il est déjà dans la scène. Un seul appel, même fonction pour les
        deux besoins — aucune duplication, aucun chemin parallèle. */
  const needLogo = logoRequiredFor(platform) && !logoInScene;
  let logoApplied = false;
  let headlineApplied = false;
  let layoutReport = { version:"canvas-layout-v4", skipped:true };
  if(needLogo || headline){
    const composited = await compositeBrandSignature(dataUrl, platform, {
      headline, withLogo:needLogo, brief:flow.brief||null, analysis:flow.analysis||null
    });
    layoutReport = composited.layoutReport || layoutReport;
    if(layoutReport.blockingError) throw new Error(layoutReport.blockingError);
    dataUrl = composited.dataUrl;
    logoApplied = composited.applied && needLogo;
    headlineApplied = composited.headlineApplied===true;
  }
  if(needLogo && !logoApplied) throw new Error("Composition Canvas bloquée : la signature officielle SDZ n'a pas pu être appliquée.");
  if(headline && !headlineApplied) throw new Error("Composition Canvas bloquée : l'accroche n'a pas pu être rendue lisiblement.");
  return { dataUrl, logoApplied, logoInScene, headlineApplied, layoutReport };
}

/* Écriture unique d'une image créative finalisée. Utilisée par la génération normale et par la
   récupération d'une image brute déjà payée : aucune seconde génération image n'est nécessaire. */
function storeFinalizedCreativeFlow(flow, finalized){
  if(flow.imageId && state.images.some(i=>i.id===flow.imageId)){
    return { id:flow.imageId, alreadyStored:true };
  }
  const platform=flow.inputs.platform;
  const id=uid();
  state.images.push({ id, name:`${platform}-${nowStr()}.png`, dataUrl:finalized.dataUrl,
    tags:[platform], favorite:false, logoApplied:finalized.logoApplied,
    usedReference:flow.usedReference, referenceFallbackReason:flow.referenceFallbackReason,
    creativeBrief:flow.brief, creativeContent:flow.content, layoutReport:finalized.layoutReport||null,
    altText:flow.content ? flow.content.altText : (flow.analysis&&flow.analysis.altText) });
  LS.set("vf-images",state.images);
  updateCount();
  state.selectedId=id;
  setPostImageId(id);
  flow.imageId=id;
  recordStructuredImageEntry(flow.inputs,flow.brief,(flow.referenceSelections||[]).map(r=>r.id),
    flow.imagePrompt,id);
  if(flow.content){
    const hashtagsText=(flow.content.hashtags||[]).map(h=>h.startsWith("#")?h:"#"+h).slice(0,5).join(" ");
    state.textPasted=[flow.content.caption||"",hashtagsText].filter(Boolean).join("\n\n");
    state.pendingAltText=flow.content.altText||"";
  }
  return { id, alreadyStored:false };
}

/* P1 — Applique l'accroche à une image de campagne DÉJÀ finalisée (format + logo posés lors de la
   génération). Aucune logique de finalisation ici : simple appel à finalizeGeneratedImage avec
   logoSentAsReference/usedReference à true, ce qui neutralise la ré-incrustation du logo. Le
   recadrage est idempotent (mêmes dimensions -> retour immédiat).
   Garde-fou : une accroche déjà incrustée n'est jamais superposée une seconde fois. */
async function applyHeadlineToItem(item){
  if(!item || !item.imageDataUrl || item.headlineApplied) return false;
  const headline = item.creativeBrief && typeof item.creativeBrief.texteImage==="string" ? item.creativeBrief.texteImage.trim() : "";
  const overlayKind = PLATFORM_OVERLAY[item.platform];
  if(!headline || (overlayKind!=="accroche" && overlayKind!=="fort")) return false;
  const composited = await compositeBrandSignature(item.imageDataUrl, item.platform, {
    headline, withLogo:false, brief:item.creativeBrief||null, analysis:item.analysis||null
  });
  if(!composited.headlineApplied || (composited.layoutReport&&composited.layoutReport.blockingError)) return false;
  item.imageDataUrl = composited.dataUrl; item.headlineApplied = true; item.layoutReport = composited.layoutReport||null;
  /* Facebook réutilise EXACTEMENT l'image Instagram : la copie est mise à jour au même instant. */
  if(item.platform==="Instagram"){
    state.scheduled.filter(p=> p.campaignId===item.campaignId && p.platform==="Facebook" && p.reusedFrom==="Instagram")
      .forEach(fb=>{ fb.imageDataUrl = item.imageDataUrl; fb.headlineApplied = true; });
  }
  return true;
}

async function confirmAndGenerateImage(prepared, onStatus, cancelToken){
  const { inputs, brief, referenceSelections } = prepared;
  const { platform, mission, size } = inputs;
  const psioReferenceRequired = inputs.prestation==="Luminothérapie PSIO®";
  const healyReferenceRequired = inputs.prestation==="Biorésonance quantique";
  const productReferenceRequired = psioReferenceRequired || healyReferenceRequired;

  if(prepared.blockingError){
    return {
      ...prepared, phase:"image_failed", ok:false, stage:"preflight",
      error:`Génération bloquée avant l'appel image : ${prepared.blockingError} Aucun crédit image n'a été consommé.`,
    };
  }
  const psioReferenceCount=(referenceSelections||[]).filter(r=>OFFICIAL_PSIO_REFERENCE_IDS.has(r.id)&&r.dataUrl).length;
  if(psioReferenceRequired && psioReferenceCount!==OFFICIAL_PSIO_REFERENCES.length){
    return {
      ...prepared, phase:"image_failed", ok:false, stage:"preflight",
      error:"Référence produit officielle PSiO® absente : génération bloquée avant l'appel image. Aucun crédit image n'a été consommé.",
    };
  }
  const healyReferenceCount=(referenceSelections||[]).filter(r=>OFFICIAL_HEALY_REFERENCE_IDS.has(r.id)&&r.dataUrl).length;
  if(healyReferenceRequired && healyReferenceCount!==OFFICIAL_HEALY_REFERENCES.length){
    return {
      ...prepared, phase:"image_failed", ok:false, stage:"preflight",
      error:"Référence produit officielle Healy absente : génération bloquée avant l'appel image. Aucun crédit image n'a été consommé.",
    };
  }

  if(logoRequiredFor(platform)){
    onStatus && onStatus("Vérification du logo officiel...");
    const officialLogo = await getOfficialLogoAsset();
    if(!officialLogo){
      return {
        ...prepared, phase:"image_failed", ok:false, stage:"preflight",
        error:"Logo officiel indisponible : génération bloquée avant l'appel image. Aucun crédit image n'a été consommé. Définis d'abord le logo officiel dans la Bibliothèque.",
      };
    }
  }

  onStatus && onStatus("Génération de l'image...");
  const smartReferenceDataUrls = (referenceSelections||[]).map(r=>r.dataUrl).filter(Boolean);
  let dataUrl, usedReference = false, referenceFallbackReason = null, logoSentAsReference = false, imageUsage = null;
  try{
    const genResult = await callProviderImage(prepared.imagePrompt, size, undefined, onStatus, cancelToken, {
      smartReferenceDataUrls,
      referenceRequired: productReferenceRequired,
      model: productReferenceRequired ? "gpt-image-2" : undefined,
      quality: productReferenceRequired ? "high" : undefined,
      onJobCreated: prepared.onImageJobCreated,
    });
    dataUrl = genResult.dataUrl; usedReference = genResult.usedReference; referenceFallbackReason = genResult.referenceFallbackReason; logoSentAsReference = !!genResult.logoSentAsReference; imageUsage = genResult.imageUsage || null;
  }catch(err){
    // Échec image : aucun historique visuel créé, aucune analyse ni texte lancés (jamais de relance
    // automatique d'un appel image payant).
    return { ...prepared, phase:"image_failed", ok:false, stage:"image", error:`Échec de la génération d'image : ${String(err.message||err)}` };
  }
  if(productReferenceRequired && !usedReference){
    return {
      ...prepared, phase:"image_failed", ok:false, stage:"image",
      error:`Image refusée : la référence produit officielle (${psioReferenceRequired ? "PSiO®" : "Healy"}) n'a pas été utilisée${referenceFallbackReason ? ` (${referenceFallbackReason})` : ""}.`,
    };
  }

  onStatus && onStatus("Analyse de l'image obtenue...");
  let analysis, analysisError = null;
  try{
    const productReferences=(referenceSelections||[]).filter(r=>(OFFICIAL_PSIO_REFERENCE_IDS.has(r.id)||OFFICIAL_HEALY_REFERENCE_IDS.has(r.id))&&r.dataUrl);
    analysis = await analyzeGeneratedImage(dataUrl, brief, {
      productReferenceDataUrls:productReferences.map(r=>r.dataUrl),
      deviceIconsAllowed: healyReferenceRequired,
    });
  }catch(err){
    analysisError = `Échec de l'analyse d'image : ${String(err.message||err)} — image conservée, alt text prudent utilisé.`;
    analysis = { visibleSubjects:[], visibleAction:"", visibleSetting:"", visibleObjects:[], lighting:"",
      altText:"Image générée pour La Santé des Zèbres.", briefMismatch:[], protectedZones:[],
      dominantColorCast:"other", productGeometryConformity:"incertain", productGeometryMismatch:"Analyse indisponible.",
      productGeometryEvidence:{ curvedOpticalShield:"not_visible", deepNoseCutout:"not_visible",
        lateralControlHousing:"not_visible", rectangularScreen:"not_visible", multipleRoundControls:"not_visible",
        deviceCabling:"not_visible", genericVisorOrVrHeadset:false } };
    analysis.rawOverlayDetected=true;
    analysis.rawOverlayDescription="Contrôle du texte et du logo indisponible : validation impossible.";
  }

  onStatus && onStatus("Rédaction du texte...");
  let content = null, textError = null;
  try{
    content = await generateContentFromBrief(brief, analysis, platform, mission);
  }catch(err){
    textError = `Échec de la génération de texte : ${String(err.message||err)} — image conservée, relance du texte seul possible.`;
  }

  return { ...prepared, phase:"completed", ok:true, dataUrl, usedReference, referenceFallbackReason, logoSentAsReference, imageUsage,
    analysis, analysisError, content, textError };
}

/* ---------- score qualité : mesure automatique + auto-évaluation guidée ---------- */
function textSimilarity(a, b){
  const words = s => new Set(s.toLowerCase().split(/\W+/).filter(w=>w.length>3));
  const wa = words(a), wb = words(b);
  if(!wa.size || !wb.size) return 0;
  let inter = 0; wa.forEach(w=>{ if(wb.has(w)) inter++; });
  return inter / Math.min(wa.size, wb.size);
}
function computeRepetitionRisk(platform, text){
  if(!text || !text.trim()) return 0;
  const recents = state.history.filter(h=>h.platform===platform && h.textResult).slice(-6);
  if(!recents.length) return 0;
  let max = 0;
  recents.forEach(h=>{ const sim = textSimilarity(text, h.textResult); if(sim>max) max=sim; });
  return Math.round(max*100);
}

/* Empreinte simple (djb2) pour détecter un prompt identique déjà généré — évite un appel API inutile. */
function hashPrompt(text){
  const t = text || "";
  let h = 5381;
  for(let i=0;i<t.length;i++){ h = ((h*33) ^ t.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}
function findCachedResult(providerLabel, promptText){
  if(!promptText) return null;
  const hash = hashPrompt(promptText);
  return state.lab.find(l=> l.provider===providerLabel && l.promptHash===hash && l.status==="accepted") || null;
}

/* Tous les appels passent désormais par les fonctions serveur du même site Netlify
   (/.netlify/functions/generate-text pour le texte ; /.netlify/functions/create-image-job +
   process-image-job-background + get-image-job pour l'image, en flux asynchrone — voir plus bas),
   qui contactent elles-mêmes le fournisseur avec la clé API stockée côté serveur (variables
   d'environnement Netlify). Le navigateur ne détient plus aucune clé et ne contacte jamais le
   fournisseur directement — ça évite le blocage CORS et sécurise les clés. */
async function callProviderText(provider, systemPrompt, userPrompt){
  const res = await fetch("/.netlify/functions/generate-text", {
    method:"POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify({ kind: provider.kind, model: provider.model, baseUrl: provider.baseUrl, systemPrompt, userPrompt }),
  });
  const data = await res.json();
  if(!res.ok || data.error) throw new Error(data.error || `Erreur ${res.status}`);
  return data.text || "";
}
async function fetchJsonOrThrowRaw(res, contextLabel){
  // Contrôle du content-type avant de parser : une réponse HTML (ex: page d'erreur passerelle Netlify)
  // ferait échouer res.json() avec un message cryptique ("Unexpected token '<'") qui masque la vraie
  // cause. On affiche ici le statut et le corps brut à la place.
  const contentType = res.headers.get("content-type") || "";
  if(!contentType.includes("application/json")){
    const rawBody = await res.text();
    throw new Error(`Réponse non-JSON du serveur (${contextLabel}, statut ${res.status}). Corps brut : ${rawBody.slice(0, 300)}`);
  }
  return res.json();
}

const IMAGE_JOB_POLL_INTERVAL_MS = 2500;
const IMAGE_JOB_MAX_WAIT_MS = 17 * 60 * 1000; // 17 minutes — au-delà des 15 min max d'une Background
                                                // Function et des 16 min de seuil de get-image-job.js,
                                                // pour laisser le temps au statut "failed" calculé
                                                // côté serveur d'être lu avant que le client n'abandonne
const IMAGE_JOB_SESSION_KEY = "vf-active-image-job";

/* Génération d'image en flux asynchrone (job + polling) — la connexion HTTP synchrone d'origine
   pouvait dépasser la limite d'exécution Netlify (10-26s) pour gpt-image-1, en particulier avec
   une image de référence (/v1/images/edits, plus lente). Ici : create-image-job répond en quelques
   centaines de ms, puis on interroge get-image-job toutes les 2,5s jusqu'à completed/failed.
   `onStatus(label)` est optionnel (mise à jour de l'UI) ; `cancelToken` est un objet { cancelled }
   optionnel que l'appelant peut faire passer à true pour arrêter le suivi (le job continue côté
   serveur, seul le suivi côté client s'arrête — cf. cahier des charges, l'annulation réelle du job
   n'est pas requise en V1). */
async function callProviderImage(prompt, size, extraReferenceDataUrls, onStatus, cancelToken, options){
  options = options || {};
  const referenceImageUrls = getBrandReferenceImages();
  // Références visuelles validées en premier (assetType "reference"), puis l'éventuelle image de
  // cohérence de campagne déjà existante (siblingImage) — combinées, plafonnées à 3 (repris côté
  // serveur). SAUF si options.smartReferenceDataUrls est explicitement fourni (Creative Planner) :
  // dans ce cas elle est utilisée telle quelle, MÊME VIDE — un tableau vide signifie "zéro référence
  // choisie", jamais un signal pour retomber sur les 3 premières références génériques de la
  // Bibliothèque. On teste donc la présence du tableau (Array.isArray), pas sa longueur.
  const referenceImageData = Array.isArray(options.smartReferenceDataUrls)
    ? [...options.smartReferenceDataUrls, ...(extraReferenceDataUrls||[])].filter(Boolean).slice(0,3)
    : [...getValidatedReferenceImageData(), ...(extraReferenceDataUrls||[])].filter(Boolean).slice(0,3);

  if(onStatus) onStatus("Génération lancée…");
  const createRes = await fetch("/.netlify/functions/create-image-job", {
    method:"POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify({
      prompt, size,
      model: options.model || undefined,
      quality: options.quality || undefined,
      referenceImageUrls: referenceImageUrls.length ? referenceImageUrls : undefined,
      referenceImageData: referenceImageData.length ? referenceImageData : undefined,
      referenceRequired: options.referenceRequired===true,
    }),
  });
  const createData = await fetchJsonOrThrowRaw(createRes, "création du travail");
  vfTrace("2-create-image-job", { httpStatus: createRes.status, jobId: createData.jobId || null, error: createData.error || null });
  if(!createRes.ok || createData.error) throw new Error(createData.error || `Erreur ${createRes.status}`);
  const jobId = createData.jobId;
  // Hook additif (Banc d'essai B3) : permet à l'appelant de persister le jobId AVANT le polling,
  // pour reprendre un job payant déjà lancé après interruption — jamais de double facturation.
  if(options && typeof options.onJobCreated === "function"){ try{ options.onJobCreated(jobId); }catch(e){} }
  try{ sessionStorage.setItem(IMAGE_JOB_SESSION_KEY, jobId); }catch(e){ /* stockage indisponible : tant pis, pas bloquant */ }

  try{
    const result = await pollImageJob(jobId, onStatus, cancelToken);
    // logoSentAsReference est déterminé ICI, dans la portée où referenceImageUrls existe :
    // getBrandReferenceImages() ne contient que le logo officiel — sa présence signifie exactement
    // "le logo faisait partie des références envoyées à OpenAI". pollImageJob, fonction séparée
    // (réutilisée par la reprise de job après rechargement), n'a pas accès à cette variable.
    return { ...result, logoSentAsReference: referenceImageUrls.length > 0 };
  } finally {
    try{
      if(sessionStorage.getItem(IMAGE_JOB_SESSION_KEY) === jobId) sessionStorage.removeItem(IMAGE_JOB_SESSION_KEY);
    }catch(e){}
  }
}

/* Interroge get-image-job jusqu'à completed/failed/annulation/délai dépassé. Séparée de
   callProviderImage pour pouvoir reprendre le suivi d'un job existant après un rechargement
   de page (cf. IMAGE_JOB_SESSION_KEY), sans en recréer un nouveau. */
async function pollImageJob(jobId, onStatus, cancelToken){
  const startTime = Date.now();
  if(onStatus) onStatus("Préparation de l'image…");
  while(true){
    if(cancelToken && cancelToken.cancelled) throw new Error("__CANCELLED__");
    if(Date.now() - startTime > IMAGE_JOB_MAX_WAIT_MS) throw new Error("Délai d'attente dépassé (17 minutes) — le travail continue peut-être côté serveur, mais le suivi s'arrête ici.");
    await new Promise(r=> setTimeout(r, IMAGE_JOB_POLL_INTERVAL_MS));
    if(cancelToken && cancelToken.cancelled) throw new Error("__CANCELLED__");

    const statusRes = await fetch(`/.netlify/functions/get-image-job?jobId=${encodeURIComponent(jobId)}`);
    if(statusRes.status===404){
      const body = await fetchJsonOrThrowRaw(statusRes, "suivi du travail");
      throw new Error(body.error || "Travail introuvable ou expiré.");
    }
    const statusData = await fetchJsonOrThrowRaw(statusRes, "suivi du travail");

    if(statusData.status==="failed") throw new Error((statusData.error && statusData.error.message) || "Échec de la génération.");
    if(statusData.status==="completed"){
      if(onStatus) onStatus("Finalisation…");
      if(!statusData.result || !statusData.result.resultUrl) throw new Error("Aucune image reçue du fournisseur.");
      vfTrace("3-job-termine", { status: statusData.status, hasResultUrl: !!(statusData.result && statusData.result.resultUrl), usedReference: statusData.result && statusData.result.usedReference, fallbackReason: statusData.result && statusData.result.referenceFallbackReason || null });
      const dataUrl = await fetchImageAsDataUrl(statusData.result.resultUrl);
      vfTrace("4-dataUrl-recupere", { dataUrlLength: dataUrl ? dataUrl.length : 0, prefix: dataUrl ? dataUrl.slice(0,30) : null });
      // logoSentAsReference est ajouté par callProviderImage (seule portée où les URLs de référence existent).
      return { dataUrl, usedReference: !!statusData.result.usedReference, referenceFallbackReason: statusData.result.referenceFallbackReason || null, imageUsage: statusData.result.usage || null };
    }
    if(onStatus) onStatus(statusData.status==="processing" ? "Génération OpenAI en cours…" : "Préparation de l'image…");
  }
}

/* Récupère l'image finale depuis get-image-result (renvoyée en binaire, pas en JSON) et la convertit
   en data URL exploitable par le reste du flux (compositeBrandSignature, Bibliothèque, campagne). */
async function fetchImageAsDataUrl(url){
  const res = await fetch(url);
  if(!res.ok){
    let rawBody = "";
    try{ rawBody = await res.text(); }catch(e){}
    throw new Error(`Impossible de récupérer l'image générée (statut ${res.status}). ${rawBody.slice(0, 200)}`);
  }
  const blob = await res.blob();
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);

/* Estimation grossière (≈4 caractères/token) — précision dépendante des tarifs que l'utilisateur renseigne. */
function estimateCost(provider, promptText){
  if(!provider || (!provider.priceIn && !provider.priceOut)) return null;
  const inTokens = Math.ceil(promptText.length / 4);
  const outTokens = 400; // estimation forfaitaire de la réponse
  const cost = (inTokens/1000)*(provider.priceIn||0) + (outTokens/1000)*(provider.priceOut||0);
  return cost;
}

/* ============================================================
   SYNCHRONISATION SERVEUR (Netlify Blobs) — le localStorage reste la source
   de vérité locale et le cache principal ; le serveur n'est qu'une sauvegarde
   accessible depuis un autre appareil. Aucune fonctionnalité existante n'est
   modifiée : ce module lit/écrit les mêmes clés, il ne fait qu'ajouter un aller-retour réseau.
============================================================ */
function syncHeaders(){
  const headers = { "Content-Type":"application/json" };
  const secret = localStorage.getItem("vf-sync-secret");
  if(secret) headers["x-sync-secret"] = secret;
  return headers;
}
function gatherSyncData(){
  const data = {};
  SYNC_KEYS.forEach(k=>{ const v = LS.get(k, null); if(v!==null) data[k] = v; });
  return data;
}
function applySyncData(data){
  if(!data || typeof data!=="object") return;
  Object.entries(data).forEach(([k,v])=>{
    if(SYNC_KEYS.includes(k) && v!==undefined && v!==null){
      // écriture directe dans localStorage : on ne veut pas redéclencher une synchro auto ici
      try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
    }
  });
}
async function pushToServerSilent(){
  try{
    const controller = new AbortController();
    const timeoutId = setTimeout(()=>controller.abort(), 12000);
    const res = await fetch("/.netlify/functions/save-data", {
      method:"POST", headers: syncHeaders(), signal: controller.signal,
      body: JSON.stringify({ data: gatherSyncData(), updatedAt: getLocalUpdatedAt() || Date.now() }),
    });
    clearTimeout(timeoutId);
    if(res.ok){ localStorage.setItem("vf-last-server-sync", String(Date.now())); localStorage.setItem("vf-last-sync-failed","0"); return true; }
    localStorage.setItem("vf-last-sync-failed","1");
    return false;
  }catch(e){
    // pas de connexion, timeout, ou serveur indisponible : le local reste intact (rien n'est perdu),
    // mais l'échec doit rester visible plutôt qu'avalé silencieusement — voir getSyncStatusLabel().
    localStorage.setItem("vf-last-sync-failed","1");
    return false;
  }
}
/* Statut de synchronisation affichable dans Réglages — dérivé de signaux déjà existants
   (horodatage de dernière modification locale, horodatage de dernière synchro réussie, indicateur
   d'échec explicite ci-dessus) sans nouvelle structure de données lourde. */
function getSyncStatusLabel(){
  const failed = localStorage.getItem("vf-last-sync-failed")==="1";
  if(failed) return "Échec de synchronisation";
  const lastUpdate = getLocalUpdatedAt();
  const lastSync = Number(localStorage.getItem("vf-last-server-sync")||0);
  if(lastUpdate && lastSync < lastUpdate) return "Synchronisation en attente";
  return "Synchronisé";
}
async function checkServerOnLoad(){
  try{
    const res = await fetch("/.netlify/functions/load-data", { method:"GET", headers: syncHeaders() });
    if(!res.ok) return;
    const remote = await res.json();
    if(remote && remote.updatedAt && remote.updatedAt > getLocalUpdatedAt()){
      state.serverHasNewerData = remote;
      renderMain();
    }
  }catch(e){ /* pas de réseau au démarrage : on continue avec le localStorage, comme avant */ }
}

/* ---------- SCORE QUALITÉ (avant génération) ----------
   Heuristique locale basée sur des signaux structurels disponibles (présence de modules,
   longueur, budget de contexte, risques détectés, historique récent). Ce n'est PAS un jugement
   sémantique — pour une vraie évaluation qualitative, utiliser l'onglet Audit IA (ChatGPT). */
function computeQualityScore({ platform, textPrompt, textMods, imageMods, totalTextAvailable, missionKey }){
  const dims = {};
  const hasMasterCodex = state.modules.some(m=>m.enabled && (m.category==="MASTER SDZ"||m.category==="CODEX SDZ"));
  dims["Respect SDZ"] = hasMasterCodex ? 100 : 60;
  dims["Respect plateforme"] = textMods.some(m=>[platform,"Instagram","Facebook","Google Business","Blog Wix"].includes(m.category)) ? 100 : 75;
  const needsSEO = platform==="Google Business" || platform==="Article Blog Wix";
  dims["Respect SEO"] = !needsSEO ? 100 : (textMods.some(m=>m.category==="SEO") ? 100 : 45);
  dims["Respect conversion"] = (missionKey && MISSIONS[missionKey]) || textMods.some(m=>m.category==="CTA") ? 100 : 65;
  dims["Respect DA"] = daLinesText().length > 40 ? 100 : 55;
  const len = textPrompt.length;
  dims["Longueur"] = len<300 ? 50 : len>7000 ? 55 : 100;
  dims["Doublons"] = 100; // la fusion sans doublons est déjà appliquée en amont
  const risks = currentRiskFlags();
  dims["Risque API"] = Math.max(30, 100 - risks.length*20);
  dims["Lisibilité"] = len>0 && len<6000 ? 90 : 65;
  dims["Clarté"] = (missionKey ? 15 : 0) + (state.prestationName ? 15 : 0) + 70;
  const recentSame = state.history.filter(h=>h.platform===platform).slice(-5);
  dims["Originalité"] = recentSame.length>3 ? 70 : 95;

  const values = Object.values(dims).map(v=>Math.min(100,v));
  const global = Math.round(values.reduce((a,b)=>a+b,0) / values.length);
  const weakPoints = Object.entries(dims).filter(([,v])=>v<75).map(([k])=>k);
  return { global, dims, weakPoints };
}

function parseAuditReport(text){
  const num = (key)=>{ const m = text.match(new RegExp(key+"\\s*:\\s*([0-9.]+)")); return m ? parseFloat(m[1]) : null; };
  const section = (label, stops)=>{
    const re = new RegExp(label+"\\s*:\\s*([\\s\\S]*?)(?="+stops.join("|")+"|$)", "i");
    const m = text.match(re);
    if(!m) return [];
    return m[1].split("\n").map(l=>l.trim()).filter(l=>l.startsWith("-")).map(l=>l.replace(/^-+\s*/,"").trim()).filter(Boolean);
  };
  return {
    charte:num("RESPECT_CHARTE"), coherence:num("COHERENCE_MARQUE"), plateforme:num("RESPECT_PLATEFORME"),
    seo:num("SEO"), conversion:num("CONVERSION"), clarte:num("CLARTE"), redaction:num("QUALITE_REDACTIONNELLE"),
    da:num("QUALITE_DA"), originalite:num("ORIGINALITE"), repetition:num("RISQUE_REPETITION"), global:num("SCORE_GLOBAL"),
    pointsForts: section("POINTS_FORTS", ["POINTS_FAIBLES","RECOMMANDATIONS"]),
    pointsFaibles: section("POINTS_FAIBLES", ["RECOMMANDATIONS","POINTS_FORTS"]),
    recommandations: section("RECOMMANDATIONS", ["POINTS_FORTS","POINTS_FAIBLES"]),
    raw: text,
  };
}

        soinSelect.value = meta.sceneSoin===true ? "oui" : meta.sceneSoin===false ? "non" : "";

          const active = (meta.plateformesCompatibles||[]).includes(p);
          const chip = el("button",{class:"btn-small"+(active?" active":""), style:"font-size:10px;padding:3px 6px;"}, p);
          chip.addEventListener("click", (e)=>{

            LS.set("vf-images", state.images);
            renderLibraryGrid();
          });
          platWrap.appendChild(chip);

        refBox.appendChild(familySelect);

        refBox.appendChild(platLabel);

        wrap.appendChild(refBox);
      }

      grid.appendChild(wrap);

    gridHolder.appendChild(grid);
  }
  renderLibraryGrid();
  return frag;
}

/* Vérification légère (coins de l'image) pour avertir si un logo semble ne pas avoir de fond
   transparent — un PNG transparent est recommandé pour un rendu propre en surimpression. */
async function checkImageHasTransparency(dataUrl){
  try{
    const img = await loadImage(dataUrl);
    const canvas = document.createElement("canvas");
    canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const corners = [[0,0],[canvas.width-1,0],[0,canvas.height-1],[canvas.width-1,canvas.height-1]];
    for(const [x,y] of corners){
      const [,,,a] = ctx.getImageData(x, y, 1, 1).data;
      if(a < 250) return true; // au moins un coin transparent ou semi-transparent détecté
    }
    return false;
  }catch(e){
    return true; // en cas de doute (erreur de lecture), ne pas afficher un faux avertissement
  }
}

let canvasEl = null;
function drawCanvas(){
  if(!canvasEl) return;
  const img = state.images.find(i=>i.id===state.selectedId);
  if(!img) return;
  const {w,h} = ASPECTS[state.aspect];
  canvasEl.width = w; canvasEl.height = h;
  const ctx = canvasEl.getContext("2d");
  ctx.clearRect(0,0,w,h);
  loadImage(img.dataUrl).then(async image=>{
    const srcRatio = image.width/image.height, dstRatio = w/h;
    let sx,sy,sw,sh;
    if(srcRatio>dstRatio){ sh=image.height; sw=sh*dstRatio; sx=(image.width-sw)/2; sy=0; }
    else { sw=image.width; sh=sw/dstRatio; sx=0; sy=(image.height-sh)/2; }
    ctx.filter = `brightness(${state.filters.brightness}%) contrast(${state.filters.contrast}%) saturate(${state.filters.saturate}%) grayscale(${state.filters.grayscale}%)`;
    ctx.drawImage(image, sx,sy,sw,sh, 0,0,w,h);
    ctx.filter = "none";
    if(state.overlay.text.trim()){
      const fontSize = (state.overlay.size/100)*(w/10);
      ctx.font = `700 ${fontSize}px Georgia, serif`;
      ctx.fillStyle = state.overlay.color;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = fontSize*0.15;
      ctx.fillText(state.overlay.text, (state.overlay.x/100)*w, (state.overlay.y/100)*h);
      ctx.shadowBlur = 0;
    }
    if(state.logoOverlay.assetId){
      const asset = state.images.find(i=>i.id===state.logoOverlay.assetId);
      if(asset){
        try{
          const logoImg = await loadImage(asset.dataUrl);
          const logoW = w * (state.logoOverlay.size/100);
          const logoH = logoW * (logoImg.height/logoImg.width);
          const lx = (state.logoOverlay.x/100)*w - logoW/2;
          const ly = (state.logoOverlay.y/100)*h - logoH/2;
          ctx.drawImage(logoImg, lx, ly, logoW, logoH);
        }catch(e){}
      }
    }
  });
}

function importModulesFromText(text){
  const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
  let count = 0;
  lines.forEach(line=>{
    const parts = line.split("|").map(p=>p.trim());
    if(parts.length>=3 && CATEGORIES.includes(parts[0])){
      state.modules.push({ id: uid(), category:parts[0], title:parts[1], content:parts.slice(2).join(" | "), enabled:true });
      count++;
    }
  });
  LS.set("vf-modules", state.modules);
  return count;
}
/* Rendu du diff — partagé par l'import JSON et l'import de fiches (aucune duplication).
   Pastilles : 🟢 créé · 🟡 modifié · ⚪ inchangé · 🔴 supprimé. Détail dépliable par module. */
const DIFF_PUCE = { cree:"🟢", modifie:"🟡", inchange:"⚪", supprime:"🔴" };
const DIFF_LABEL = { cree:"créé", modifie:"modifié", inchange:"inchangé", supprime:"supprimé" };
function renderImportDiff(diff, container){
  container.innerHTML = "";
  container.appendChild(el("p",{style:"font-size:13px;font-weight:600;margin-bottom:6px;"},
    `${DIFF_PUCE.cree} ${diff.compte.cree} créé(s) · ${DIFF_PUCE.modifie} ${diff.compte.modifie} modifié(s) · ${DIFF_PUCE.inchange} ${diff.compte.inchange} inchangé(s) · ${DIFF_PUCE.supprime} ${diff.compte.supprime} supprimé(s)`));
  const ordre = { modifie:0, cree:1, supprime:2, inchange:3 };
  [...diff.entries].sort((a,b)=> ordre[a.statut]-ordre[b.statut] || String(a.titre).localeCompare(String(b.titre))).forEach(entry=>{
    const ligne = el("div",{style:"border-bottom:1px solid var(--border);padding:6px 0;"});
    const head = el("div",{style:"display:flex;align-items:center;gap:8px;cursor:pointer;"});
    const chevron = el("span",{style:"font-size:11px;color:var(--muted2);width:12px;"}, entry.champs.length ? "▸" : " ");
    head.appendChild(chevron);
    head.appendChild(el("span",{style:"font-size:14px;"}, DIFF_PUCE[entry.statut]));
    head.appendChild(el("span",{style:"font-size:13px;flex:1;"}, entry.titre));
    head.appendChild(el("span",{style:"font-size:11px;color:var(--muted2);"}, DIFF_LABEL[entry.statut]));
    const detail = el("div",{style:"display:none;padding:6px 0 6px 20px;"});
    entry.champs.forEach(c=>{
      const bloc = el("div",{style:"margin-bottom:6px;"});
      bloc.appendChild(el("p",{style:"font-size:12px;font-weight:600;"}, `${DIFF_PUCE[c.statut]} ${c.champ}`));
      if(c.statut==="inchange"){
        bloc.appendChild(el("p",{style:"font-size:11px;color:var(--muted2);"}, "= inchangé"));
      } else {
        if(c.avant) bloc.appendChild(el("p",{style:"font-size:11px;color:var(--red);white-space:pre-wrap;"}, "− "+c.avant));
        if(c.apres) bloc.appendChild(el("p",{style:"font-size:11px;color:var(--green);white-space:pre-wrap;"}, "+ "+c.apres));
      }
      detail.appendChild(bloc);
    });
    if(entry.champs.length){
      head.addEventListener("click", ()=>{
        const open = detail.style.display!=="none";
        detail.style.display = open ? "none" : "block";
        chevron.textContent = open ? "▸" : "▾";
      });
    }
    ligne.appendChild(head); ligne.appendChild(detail);
    container.appendChild(ligne);
  });
}

      const diffBox = el("div",{style:"margin-top:10px;max-height:340px;overflow:auto;"});

  frag.appendChild(el("h2",{class:"section"},"Importer depuis ChatGPT"));

    frag.appendChild(el("button",{class:"btn-primary", style:"margin-bottom:10px;", onclick: ()=>{

/* ---------- bloc de retour + score qualité, réutilisé pour post simple et campagne ---------- */
function hasLikelyCTA(text, missionKey){
  const t = (text||"").toLowerCase();
  const genericCtas = ["réserve","réservez","contacte","contactez","découvre","découvrez","profite","profitez",
    "appelle","appelez","offre","offrez","réservation","rendez-vous","inscri","clique","cliquez","visite","visitez"];
  if(genericCtas.some(w=>t.includes(w))) return true;
  const missionCta = missionKey && MISSIONS[missionKey] && MISSIONS[missionKey].cta;
  if(missionCta){
    const ctaWords = missionCta.toLowerCase().split(/\W+/).filter(w=>w.length>3);
    if(ctaWords.some(w=>t.includes(w))) return true;
  }
  return false;
}

function buildValidationChecklist(ctx){
  const platform = ctx.platform;
  const text = (ctx.getTextResult ? ctx.getTextResult() : "") || "";
  const requiresText = !!ctx.textPrompt;
  const checks = [];

  checks.push({ label:`Format plateforme correct (${PLATFORM_ASPECT[platform]})`, ok: true });
  checks.push({ label: requiresText ? "Texte requis pour cette plateforme : rédigé" : "Texte non requis pour cette plateforme (normal, rien à faire)",
    ok: requiresText ? text.trim().length>0 : true });
  checks.push({ label:"Image sélectionnée pour ce post", ok: !!ctx.hasImage });
  checks.push({ label:"Logo IA interdit dans le prompt (consigne appliquée automatiquement)", ok: true });
  checks.push({ label: wantsRealLogoLabel(platform), ok: !logoRequiredFor(platform) || !!ctx.logoApplied });

  if(requiresText && ctx.prestationName){
    checks.push({ label:`Nom de la prestation repris exactement ("${ctx.prestationName}")`, ok: text.includes(ctx.prestationName) });
  }
  if(requiresText){
    checks.push({ label:"CTA (appel à l'action) présent dans le texte", ok: hasLikelyCTA(text, ctx.missionKey) });
  }
  if(requiresText && platform==="Google Business"){
    checks.push({ label:"Pas de hashtags (non recommandé pour Google Business)", ok: !text.includes("#") });
    const gbWords = text.split(/\s+/).filter(Boolean).length;
    checks.push({ label:`Longueur Google Business : 100 à 150 mots (actuel : ${gbWords})`, ok: gbWords>=100 && gbWords<=150 });
  }
  if(requiresText && (platform==="Instagram" || platform==="Facebook")){
    checks.push({ label:"Longueur raisonnable pour un réseau social (moins de 2200 caractères)", ok: text.length>0 && text.length<2200 });
  }
  if(requiresText && platform==="Article Blog Wix"){
    checks.push({ label:"Article suffisamment développé pour le SEO (plus de 500 caractères)", ok: text.length>500 });
  }
  if(ctx.schedulable !== false && platform!=="Article Blog Wix" && platform!=="Story"){
    checks.push({ label:"Image compatible avec l'envoi automatique à Make (servie via image_url)", ok: !!ctx.hasImage });
  }

  const passed = checks.filter(c=>c.ok).length;
  return { checks, passed, total: checks.length, allOk: checks.length>0 && checks.every(c=>c.ok) };
}
function wantsRealLogoLabel(platform){
  return logoRequiredFor(platform) ? "Vrai logo prévu en surimpression (pas un logo dessiné par l'IA)" : "Logo non requis pour ce format (normal)";
}

function buildFeedbackBlock(ctx){
  const frag = el("div",{});
  const risk = computeRepetitionRisk(ctx.platform, ctx.getTextResult());
  const checklist = buildValidationChecklist(ctx);
  frag.appendChild(el("h2",{class:"section"},"Checklist de validation"));
  const riskColor = risk>50 ? "var(--coral)" : risk>25 ? "var(--amber)" : "var(--green)";
  frag.appendChild(el("p",{style:`font-size:13px;margin-bottom:10px;`},[
    "Risque de répétition détecté (calcul automatique vs historique) : ",
    el("strong",{style:`color:${riskColor};`}, `${risk}%`),
  ]));
  checklist.checks.forEach(c=>{
    frag.appendChild(el("div",{class:"learning-row", style:`color:${c.ok?"var(--green)":"var(--coral)"};`}, `${c.ok?"✅":"⚠️"} ${c.label}`));
  });
  if(checklist.total>0){
    frag.appendChild(el("p",{style:`font-size:13px;font-weight:600;margin:10px 0;color:${checklist.allOk?"var(--green)":"var(--amber)"};`},
      checklist.allOk ? "Tout est en ordre, prêt à valider." : `${checklist.passed}/${checklist.total} points validés — vérifie les points signalés ci-dessus avant de publier.`));
  }

  frag.appendChild(el("h2",{class:"section"},"Retour sur ce contenu"));
  frag.appendChild(el("p",{class:"sublabel"},"Ton retour devient une nouvelle règle réinjectée dans les prochaines générations."));
  const commentArea = el("textarea",{rows:"2", placeholder:"Pourquoi ? (optionnel mais utile pour que l'IA apprenne)"}, state.feedbackComment);
  commentArea.addEventListener("input", e=>{ state.feedbackComment = e.target.value; });
  frag.appendChild(el("div",{style:"margin-bottom:10px;"}, commentArea));

  const rateRow = el("div",{style:"display:flex;gap:8px;margin-bottom:24px;"});
  const doRate = (rating)=>{
    const entry = {
      id: uid(), date: nowStr(), platform: ctx.platform, topic: ctx.topic,
      imagePrompt: ctx.imagePrompt, textPrompt: ctx.textPrompt,
      textResult: ctx.getTextResult(), rating, comment: state.feedbackComment, favorite:false,
      quality: { checklistPassed: checklist.passed, checklistTotal: checklist.total, checklistOk: checklist.allOk, repetitionRisk: risk },
      campaignLabel: ctx.campaignLabel || null,
    };
    state.history.push(entry);
    LS.set("vf-history", state.history);
    if(rating==="down" || state.feedbackComment.trim()){
      state.modules.push({ id: uid(), category:"Erreurs fréquentes",
        title: `Retour ${ctx.platform} — ${nowStr()}`,
        content: state.feedbackComment.trim() || `Contenu jugé à revoir pour ${ctx.platform} : "${(ctx.getTextResult()||"").slice(0,120)}"`,
        enabled:true, platform: ctx.platform, createdAt: Date.now() });
    }
    if(rating==="up" && ctx.getTextResult().trim()){
      state.modules.push({ id: uid(), category:"Exemples excellents",
        title: `Exemple validé ${ctx.platform} — ${nowStr()}`,
        content: ctx.getTextResult().trim(), enabled:true, platform: ctx.platform, createdAt: Date.now() });
    }
    LS.set("vf-modules", state.modules);
    state.feedbackComment = "";
    ctx.onSaved && ctx.onSaved();
    renderMain();
  };
  rateRow.appendChild(el("button",{class:"btn-ghost", onclick:()=>doRate("up")}, "👍 Excellent"));
  rateRow.appendChild(el("button",{class:"btn-ghost", onclick:()=>doRate("mid")}, "👌 Moyen"));
  rateRow.appendChild(el("button",{class:"btn-ghost", onclick:()=>doRate("down")}, "👎 À revoir"));
  frag.appendChild(rateRow);
  return frag;
}

  state.styles.forEach(s=>{

  });
  frag.appendChild(modesRow);
  const saveModeBtn = el("button",{class:"btn-small", style:"margin-bottom:16px;"}, "+ Enregistrer ce mode (plateforme + style + créativité/sobriété)");
  saveModeBtn.addEventListener("click", ()=>{
    const name = prompt("Nom de ce mode (ex : Instagram Premium, Article SEO...)");
    if(!name || !name.trim()) return;
    state.productionModes.push({ id: uid(), name: name.trim(), network: state.network, styleId: state.styleId,
      missionKey: state.mission, creativite: state.da.creativite, sobriete: state.da.sobriete });

  frag.appendChild(saveModeBtn);

  frag.appendChild(el("p",{class:"label"},"Sujet du post"));
  const topicArea = el("textarea",{rows:"3", placeholder:"Ex : lancement du Massage Zébré, offre vacances, nouveauté..."}, state.topic);
  topicArea.addEventListener("input", e=>{ state.topic = e.target.value; });
  frag.appendChild(el("div",{style:"margin-bottom:6px;"}, topicArea));
  const topicWarn = el("p",{style:"font-size:12px;color:var(--coral);margin:0 0 12px;min-height:14px;"}, "");
  frag.appendChild(topicWarn);

  if(isCampaign){
    frag.appendChild(el("button",{class:"btn-primary", style:"margin-bottom:14px;", onclick: async (e)=>{
      if(!state.topic.trim()){ topicWarn.textContent = "Décris d'abord le sujet du post avant de générer."; return; }
      topicWarn.textContent = "";
      const btn = e.currentTarget; const oldLabel = btn.textContent; btn.disabled = true;
      try{
        const newPosts = await generateCampaignPosts(state.topic, state.mission, (p)=>{ btn.textContent = "Préparation " + p; });

        topicWarn.textContent = "Création de campagne interrompue : " + (err.message||err);

      }
    }}, [svgIcon(ICONS.sparkles,16), el("span",{},"Générer la campagne complète (5 formats)")]));
    frag.appendChild(el("p",{class:"hint"}, "Chaque déclinaison (Instagram, Facebook, Google Business, Story, Article Blog Wix) est créée en brouillon, regroupée sous une même campagne dans l'onglet Calendrier — c'est là que tu génères texte et image, valides, puis programmes (ou copies/télécharges, pour la Story et l'article de blog) chaque contenu."));
    return frag;
  }

  /* ---------- MOTEUR CRÉATIF — action principale, en deux phases ----------
     Phase A (aucun appel image, coût texte minime) : diversité déterministe, Creative Planner, validation
     locale, sélection des références, prompt image compact — tout ça est affiché dans le Prompt
     Inspector AVANT toute confirmation. Phase B (payante) ne part qu'après un clic explicite sur
     "Confirmer et générer l'image". Volontairement indépendant de state.imagePrompt (qui n'est
     rempli que par l'ancien mode manuel, plus bas) — c'est ce découplage qui manquait : ce bloc
     n'était visible qu'après avoir cliqué l'ancien bouton "Générer image + texte", ce qui donnait
     l'impression d'un flux à une seule étape. */
  const creativeEngineAvailable = !!(state.apiProviders.find(p=>p.kind==="openai-compatible" && (p.baseUrl||"").includes("api.openai.com")) || DEFAULT_OPENAI_PROVIDER);
  if(creativeEngineAvailable){
    const imgApiStatus = el("p",{style:"font-size:12px;color:var(--muted2);min-height:16px;margin:4px 0 8px;"},"");
    const prepareBtn = el("button",{class:"btn-primary", style:"margin-bottom:10px;"}, [svgIcon(ICONS.sparkles,14), el("span",{},"Préparer la création (sans image)")]);
    const confirmBtn = el("button",{class:"btn-secondary", style:"margin:0 0 10px 8px;display:none;"}, [svgIcon(ICONS.wand,14), el("span",{},"Confirmer et générer l'image")]);
    const imgCancelBtn = el("button",{class:"btn-secondary", style:"margin:0 0 10px 8px;display:none;"}, "Annuler le suivi");
    const regenTextBtn = el("button",{class:"btn-secondary", style:"margin:0 0 10px 8px;display:none;"}, "Régénérer uniquement le texte");
    const relaunchAnalysisBtn = el("button",{class:"btn-secondary", style:"margin:0 0 10px 8px;display:none;"}, "Relancer l'analyse de l'image");
    const recoverRawBtn = el("button",{class:"btn-secondary", style:"margin:0 0 10px 8px;display:none;"},
      "Finaliser une image brute déjà téléchargée");
    const recoverRawInput = el("input",{type:"file",accept:"image/png,image/jpeg,image/webp",style:"display:none;"});
    const inspectorHost = el("div",{});
    let activeCancelToken = null;

    // Helper clipboard réutilisé par les 4 boutons de l'inspecteur (Tout copier / Copier le Prompt /
    // Copier le JSON) — factorisation pure de l'UI, aucun impact sur le pipeline ou l'état métier.
    // navigator.clipboard.writeText avec repli textarea+execCommand pour contextes non sécurisés.
    async function copyInspectorText(text, btn, defaultLabel){
      const restoreLabel = ()=>{ setTimeout(()=>{ btn.textContent = defaultLabel; }, 1500); };
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(text);
        } else {
          throw new Error("clipboard API indisponible");
        }
        btn.textContent = "✓ Copié"; restoreLabel();
      }catch(err){
        try{
          const ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.focus(); ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          btn.textContent = "✓ Copié"; restoreLabel();
        }catch(err2){
          btn.textContent = "⚠ Échec — copie manuelle requise";
          setTimeout(()=>{ btn.textContent = defaultLabel; }, 2500);
        }
      }
    }
    // Formate DD/MM/YYYY HH:MM sans dépendance externe.
    function formatInspectorDate(d){
      const p2 = n => String(n).padStart(2,"0");
      return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
    }

    // Reconstruit l'Inspector et les boutons DEPUIS state.lastCreativeFlow (persistant) plutôt que
    // depuis une variable locale — c'est ce qui les fait survivre à renderMain().
    function renderCreativeInspector(){
      const flow = state.lastCreativeFlow;
      inspectorHost.innerHTML = "";
      confirmBtn.style.display = "none"; regenTextBtn.style.display = "none";
      relaunchAnalysisBtn.style.display = "none"; recoverRawBtn.style.display = "none";
      if(!flow) return;
      if(flow.phase==="prepared" && !flow.blockingError){
        confirmBtn.style.display = "inline-block";
        recoverRawBtn.style.display = "inline-block";
      }
      if(flow.phase==="completed"){
        regenTextBtn.style.display = "inline-block";
        relaunchAnalysisBtn.style.display = "inline-block";
        relaunchAnalysisBtn.textContent = flow.finalizationError
          ? "Recontrôler puis appliquer Canvas (sans nouvelle image)"
          : "Relancer l'analyse de l'image";
      }
      const details = el("details",{open:true, style:"margin:10px 0;"});
      details.appendChild(el("summary",{style:"cursor:pointer;font-size:13px;color:var(--muted);"}, "Prompt Inspector — moteur créatif"));

      // ---- Textes bruts nécessaires aux boutons de copie (calculés une seule fois) ----
      const promptText = flow.imagePrompt || "";
      const jsonText = JSON.stringify(flow.brief, null, 2);
      const engineVersion = flow.appVersion || "ancienne/non identifiée";
      const combinedText = `========================\nVERSION MOTEUR\n========================\n\n${engineVersion}\n\n========================\nPROMPT OPENAI\n========================\n\n${promptText}\n\n========================\nSTRUCTURED OUTPUT\n========================\n\n${jsonText}`;

      // ---- Bandeau récapitulatif (lecture seule de flow.inputs/flow.brief/state.modules — aucune invention) ----
      const safe = v => (v===undefined || v===null || v==="") ? "—" : v;
      const prestationLabel = safe(flow.inputs && flow.inputs.prestation);
      const missionLabel = safe(flow.inputs && flow.inputs.mission);
      const platformLabel = safe(flow.inputs && flow.inputs.platform);
      const registresArr = (flow.inputs && Array.isArray(flow.inputs.registres)) ? flow.inputs.registres : [];
      const registresLabel = registresArr.length ? registresArr.join(", ") : "—";
      const typeCreationVal = flow.brief && flow.brief.typeCreation;
      const styleLabel = typeCreationVal==="affiche_fantastique" ? "Affiche fantastique" : typeCreationVal==="luxe_silencieux" ? "Luxe silencieux" : "—";
      const universCount = buildUniversSDZBlock(flow.allowed||[]).split("\n").filter(Boolean).length;
      // Reproduction EN LECTURE SEULE de la sélection réelle de buildCompactMasterImageSocle(registres)
      // (permanents + noirOrHaute.slice(0,3) + registreHaute.slice(0,2) par registre actif) — uniquement
      // pour affichage de statistiques ; buildCompactMasterImageSocle elle-même n'est ni appelée en
      // double ni modifiée. Ces compteurs représentent donc exactement ce qui a été injecté dans le
      // socle envoyé à OpenAI pour cette génération, jamais la taille totale de la bibliothèque.
      const allImageModules = state.modules.filter(m=> m.enabled && m.category==="MASTER_IMAGE");
      const permanentsInjected = allImageModules.filter(m=> m.criteres && m.criteres.portee==="permanent");
      const constitutionInjectedCount = permanentsInjected.filter(m=> moduleRegistre(m)==="constitution_generale").length;
      const noirOrPermanentInjectedCount = permanentsInjected.filter(m=> moduleRegistre(m)==="noir_or").length;
      const noirOrHauteInjectedCount = allImageModules.filter(m=> m.criteres && m.criteres.portee==="contextuel" && m.criteres.priorite==="haute" && moduleRegistre(m)==="noir_or").slice(0,3).length;
      const noirOrInjectedCount = noirOrPermanentInjectedCount + noirOrHauteInjectedCount;
      const registreInjectedCounts = {};
      KNOWN_REGISTRES.forEach(r=>{
        if(registresArr.includes(r)){
          registreInjectedCounts[r] = allImageModules.filter(m=> m.criteres && m.criteres.priorite==="haute" && moduleRegistre(m)===r).slice(0,2).length;
        }
      });
      const totalImageModulesInjected = constitutionInjectedCount + noirOrInjectedCount + Object.values(registreInjectedCounts).reduce((a,b)=>a+b,0);
      const summaryBox = el("div",{class:"card", style:"margin-top:8px;font-size:12px;"});
      const srow = (label,val)=> el("div",{style:"padding:2px 0;"}, [el("span",{style:"color:var(--muted2);"}, label+" : "), el("span",{}, String(val))]);
      summaryBox.appendChild(srow("Version moteur", engineVersion));
      summaryBox.appendChild(srow("Prestation", prestationLabel));
      summaryBox.appendChild(srow("Mission", missionLabel));
      summaryBox.appendChild(srow("Plateforme", platformLabel));
      summaryBox.appendChild(srow("Registre(s)", registresLabel));
      summaryBox.appendChild(srow("Style", styleLabel));
      summaryBox.appendChild(srow("Modules Constitution injectés", constitutionInjectedCount));
      summaryBox.appendChild(srow("Modules Noir & Or injectés", noirOrInjectedCount));
      summaryBox.appendChild(srow("Modules Univers SDZ injectés", universCount));
      KNOWN_REGISTRES.forEach(r=>{
        if(registresArr.includes(r)) summaryBox.appendChild(srow(`Modules ${REGISTRE_LABELS[r]} injectés`, registreInjectedCounts[r]));
      });
      summaryBox.appendChild(srow("Total modules image injectés", totalImageModulesInjected));
      summaryBox.appendChild(srow("Date", formatInspectorDate(new Date())));
      details.appendChild(summaryBox);

      // ---- Toolbar : 4 boutons de confort (Tout copier conservé + 3 nouveaux) ----
      const toolbar = el("div",{style:"display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;"});
      const mkBtn = (label)=> el("button",{type:"button", class:"btn-secondary", style:"padding:4px 10px;font-size:12px;cursor:pointer;"}, label);
      const copyAllBtn = mkBtn("📋 Tout copier");
      copyAllBtn.addEventListener("click", ()=> copyInspectorText(combinedText, copyAllBtn, "📋 Tout copier"));
      const copyPromptBtn = mkBtn("📄 Copier le Prompt");
      copyPromptBtn.addEventListener("click", ()=> copyInspectorText(promptText, copyPromptBtn, "📄 Copier le Prompt"));
      const copyJsonBtn = mkBtn("📦 Copier le JSON");
      copyJsonBtn.addEventListener("click", ()=> copyInspectorText(jsonText, copyJsonBtn, "📦 Copier le JSON"));
      const clearBtn = mkBtn("🧹 Effacer");
      clearBtn.addEventListener("click", ()=>{ state.lastCreativeFlow = null; renderCreativeInspector(); });
      toolbar.appendChild(copyAllBtn); toolbar.appendChild(copyPromptBtn); toolbar.appendChild(copyJsonBtn); toolbar.appendChild(clearBtn);
      details.appendChild(toolbar);

      const body = el("div",{class:"card", style:"margin-top:8px;font-size:12px;"});
      const row = (label,val)=> el("div",{style:"padding:4px 0;border-bottom:1px solid var(--border);"}, [el("span",{style:"color:var(--muted2);"}, label+" : "), el("span",{}, val||"—")]);
      row.call && body.appendChild(row("Phase", flow.phase==="prepared" ? "A — préparée, en attente de confirmation (aucune image générée ; coût texte minime)" : flow.phase==="image_failed" ? "B — échec avant obtention de l'image" : "B — terminée"));
      body.appendChild(row("Type de création (figé)", flow.brief && flow.brief.typeCreation));
      body.appendChild(row("Archétype choisi", flow.brief && flow.brief.archetypeNarratif));
      body.appendChild(row("Archétypes interdits (récents)", (flow.exclusions||[]).join(", ") || "aucun"));
      body.appendChild(row("Raison de différenciation", flow.brief && flow.brief.raisonDifferenceAvecHistorique));
      body.appendChild(row("Références sélectionnées", String((flow.referenceSelections||[]).length)));
      if(flow.inputs && flow.inputs.prestation==="Luminothérapie PSIO®"){
        body.appendChild(row("Référence produit PSiO® officielle",
          (flow.referenceSelections||[]).filter(r=>OFFICIAL_PSIO_REFERENCE_IDS.has(r.id)).length===OFFICIAL_PSIO_REFERENCES.length
            ? "3 vues chargées et obligatoires ✓" : "Jeu incomplet — génération bloquée"));
      }
      if(flow.inputs && flow.inputs.prestation==="Biorésonance quantique"){
        body.appendChild(row("Référence produit Healy officielle",
          (flow.referenceSelections||[]).filter(r=>OFFICIAL_HEALY_REFERENCE_IDS.has(r.id)).length===OFFICIAL_HEALY_REFERENCES.length
            ? "2 vues chargées et obligatoires ✓" : "Jeu incomplet — génération bloquée"));
      }
      if(flow.phase!=="prepared") body.appendChild(row("Référence réellement utilisée", flow.usedReference ? "Oui ✓" : (flow.referenceFallbackReason ? "Non — repli : "+flow.referenceFallbackReason : "Non demandée")));
      body.appendChild(row("Modèle", (flow.inputs?.prestation==="Luminothérapie PSIO®"||flow.inputs?.prestation==="Biorésonance quantique")
        ? "gpt-image-2 · retouche produit verrouillée · qualité haute"
        : "gpt-image-1"));
      body.appendChild(row("Rédacteur DA", flow.daWriterUsed ? "Utilisé ✓ (prompt narratif)" : (flow.daWriterFallbackReason ? "Repli sur l'assemblage classique — "+flow.daWriterFallbackReason : "Désactivé")));
      if(flow.validatorReport){
        const vr = flow.validatorReport;
        const parts = [];
        parts.push(`longueur ${vr.longueur||0}c`);
        parts.push((vr.contradictions&&vr.contradictions.length ? `⚠ ${vr.contradictions.length} contradiction(s)` : "0 contradiction"));
        parts.push((vr.doublons&&vr.doublons.length ? `${vr.doublons.length} doublon(s) charte/narratif` : "0 doublon"));
        parts.push((vr.decisionsAbsentes&&vr.decisionsAbsentes.length ? `⚠ décisions absentes : ${vr.decisionsAbsentes.join(", ")}` : "toutes décisions présentes"));
        if(vr.preparationT3&&vr.preparationT3.length) parts.push(`${vr.preparationT3.length} champ(s) hors cible atomique (info T3)`);
        if(vr.erreurInterne) parts.push("erreur interne : "+vr.erreurInterne);
        body.appendChild(row("Validator (T1, rapport)", parts.join(" · ")));
        const detail = [];
        (vr.contradictions||[]).forEach(c=> detail.push("CONTRADICTION — "+c));
        (vr.doublons||[]).forEach(d=> detail.push("DOUBLON — "+d));
        (vr.preparationT3||[]).forEach(p=> detail.push("T3 — "+p));
        if(detail.length) body.appendChild(row("Validator (détail)", detail.join(" | ")));
      }
      if(flow.paquetOrchestrateur && flow.paquetOrchestrateur.rapportFusion){
        const rf = flow.paquetOrchestrateur.rapportFusion;
        body.appendChild(row("Orchestrateur (T1)", `interdits ${rf.interditsAvant}→${rf.interditsApres}${rf.doublonsSupprimes.length?` (doublons retirés : ${rf.doublonsSupprimes.join(", ")})`:""}`));
      }
      body.appendChild(row("Taille prévue", API_IMAGE_SIZE_BY_PLATFORM[flow.inputs.platform] || "1024x1024"));
      if(flow.blockingError) body.appendChild(row("⛔ Bloquant — aucune image possible", flow.blockingError));
      if(flow.plannerError) body.appendChild(row("⚠ Creative Planner", flow.plannerError));
      if(flow.referenceError) body.appendChild(row("⚠ Références", flow.referenceError));
      if(flow.error) body.appendChild(row("⚠ Image", flow.error));
      if(flow.finalizationError) body.appendChild(row("⛔ Image brute mise en quarantaine", flow.finalizationError));
      if(flow.analysisError) body.appendChild(row("⚠ Analyse d'image", flow.analysisError));
      if(flow.textError) body.appendChild(row("⚠ Génération texte", flow.textError));
      if(flow.finalizationError && flow.dataUrl){
        body.appendChild(el("p",{style:"font-weight:600;margin:12px 0 6px;color:var(--red);"},
          "Image brute refusée — contrôle uniquement, publication bloquée"));
        body.appendChild(el("img",{src:flow.dataUrl,alt:"Image brute refusée avant Canvas",
          style:"width:100%;display:block;border:1px solid var(--red);border-radius:12px;"}));
        body.appendChild(el("a",{href:flow.dataUrl,download:`image-brute-refusee-${Date.now()}.png`,
          class:"btn-secondary",style:"display:flex;text-decoration:none;margin-top:8px;justify-content:center;"},
          "Télécharger l’image brute refusée"));

    async function runTextApiGeneration(statusEl, opts){
