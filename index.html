function buildCreativePlannerSystemPromptV2(){
  return `Tu es le directeur artistique interne de La Santé des Zèbres (SDZ).

PRINCIPE FONDATEUR : tu ne construis jamais une image à partir d'éléments visuels. Tu construis d'abord une intention émotionnelle, puis tu en déduis une mise en scène. Le décor, le cadrage, la lumière, le symbole ne sont JAMAIS choisis indépendamment — ce sont des conséquences de ce qui les précède dans ton raisonnement.

Tu raisonnes STRICTEMENT dans cet ordre, chaque champ étant une conséquence du précédent, jamais un choix parallèle ou indépendant :
1. ancrageReel — le fait réel de la prestation, non négociable.
2. raisonDetre — pourquoi cette image mérite-t-elle d'exister ? Pourquoi quelqu'un s'arrêterait dessus dans son fil ? Si tu ne peux pas y répondre avec spécificité (pas une généralité applicable à n'importe quelle prestation de bien-être), ne continue pas sur une généralité : cherche ce qui est vraiment spécifique à CETTE prestation.
3. impactEmotionnelRecherche — ce que le spectateur doit ressentir avant même de comprendre la scène. Vocabulaire guide : révélation, immensité, vertige, mystère, renaissance, passage, destin, silence, attente, interrogation, promesse, découverte, confrontation, paix retrouvée.
   INTERDIT ABSOLU, jamais comme point de départ, quelle que soit la formulation : ${VOCABULAIRE_INTERDIT_ABSOLU.join(", ")}.
   TOLÉRÉ UNIQUEMENT COMME CONSÉQUENCE d'un conflit déjà posé (jamais comme intention de départ) : ${VOCABULAIRE_TOLERE_CONSEQUENCE.join(", ")}.
4. transformation — un avant/après n'est nécessaire que si la scène le justifie réellement. Une image qui montre une promesse, un mystère, une attente, une invitation, une révélation ou une présence n'a besoin d'AUCUNE transformation explicite : mets alors presente=false, avant="" et apres="". C'est un état normal et attendu, pas une exception — vise environ 30 à 40% des cas.
5. conflit — la résistance ou la tension, présente même sans transformation explicite (une interrogation ou une attente porte déjà sa propre tension). Doit découler de l'ancrage réel, jamais d'un répertoire générique de problèmes humains.
6. momentCinematographique — si ce film n'avait qu'une seule image d'affiche, laquelle ? Ce n'est pas "quel plan filmer", c'est "quel instant unique mérite d'exister". Doit se rattacher explicitement au conflit que tu viens de poser.
7. archetypeEmotionnel — tu CLASSES le moment que tu viens d'imaginer dans un archétype fermé, tu n'en inventes jamais un nouveau. Choisis-le PARMI les options fournies, jamais en dehors.
8. miseEnScene (sujet, action, cadrage, point de vue) — le cadrage et le point de vue doivent être choisis PARMI l'ensemble associé à l'archétype retenu à l'étape 7, jamais librement.
9. decor — doit correspondre aux scènes compatibles de l'archétype retenu.
10. lumiere, elementOr, niveauLuminosite — doivent correspondre à la signature lumineuse propre à l'archétype retenu. N'utilise JAMAIS un connecteur ou un dispositif universel identique quel que soit l'archétype : chaque archétype a sa propre lumière. Le noir sert d'écrin à un sujet lisible ; il ne doit jamais produire une image sous-exposée, lugubre ou étouffante.

/* Socle compact extrait des packs MASTER_IMAGE (Constitution générale + Noir & Or + registre actif)
   — jamais les 83 modules complets. Ne prend que : les modules permanents (Constitution + Noir & Or
   Bloc 1), les modules "haute priorité" de Noir & Or (Bloc 2), et jusqu'à 2 modules "haute priorité"
   par registre actif. Budget cible : ~2500 caractères max. `registres` doit être une copie figée
   transmise explicitement par l'appelant — jamais lu directement depuis state.registres ici, pour
   que le flux préparé reste indépendant de l'état courant de l'interface. */
/* B4 — retourne { text, ids } : les identifiants des modules réellement injectés sont tracés
   (jamais leur contenu) pour l'analyse d'usage et de conflit au Banc d'essai. */
function buildCompactMasterImageSocle(registres){
  const BUDGET = 2500;
  const all = state.modules.filter(m=> m.enabled && m.category==="MASTER_IMAGE");
  const permanents = all.filter(m=> m.criteres && m.criteres.portee==="permanent");
  const noirOrHaute = all.filter(m=> m.criteres && m.criteres.portee==="contextuel" && m.criteres.priorite==="haute" && moduleRegistre(m)==="noir_or");
  const registresActifs = Array.isArray(registres) ? registres : [];
  const registreHaute = registresActifs.flatMap(r=>
    all.filter(m=> m.criteres && m.criteres.priorite==="haute" && moduleRegistre(m)===r).slice(0,2)
  );
  const picked = [...permanents, ...noirOrHaute.slice(0,3), ...registreHaute];
  let text = picked.map(m=>m.content).join(" ");
  if(text.length > BUDGET) text = text.slice(0, BUDGET) + "…";
  return { text, ids: picked.map(m=>m.id) };
}

/* Plafond global du bloc fiche prestation dans le prompt du Creative Planner — entre 1400 et 1600
   caractères demandés, 1500 retenu. En cas de dépassement, dégradation dans l'ordre exact demandé :
   Tarif -> Durée -> Public concerné -> raccourcissement de Précautions -> jamais Description ni
   Déroulé de la séance, prioritaires. Utilise l'argument `prestation` explicitement transmis au
   flux (jamais state.prestationName directement) — indépendant de l'état global de l'interface. */
const PRESTATION_FICHE_PROMPT_BUDGET = 1500;
/* Budget du bloc fiche : ordre de dégradation inchangé (Tarif → Durée → Public → Précautions
   raccourcies). L'ADN (citable, émotion, promesse, signature, codes visuels) et la Description /
   le Déroulé ne sont JAMAIS retirés : ce sont eux qui rendent la prestation reconnaissable. */
function buildPrestationFicheBlock(prestation){
  const info = getSelectedPrestationInfo(prestation);
  if(!info) return `Prestation : ${prestation||"non précisée"}`;
  if(info.generic) return `Prestation : sujet général — ne force pas la mention d'une prestation précise, ne cite aucun nom de prestation sauf si le sujet l'exige naturellement.`;
  if(!info.block) return `Prestation : ${info.name} (non documentée dans la base de connaissances — utilise uniquement ce nom, n'invente aucun détail).`;

  const f = info.fiche || {};
  const fields = {
    citable: f["caractéristique citable"] || "",
    concept: f["concept central"] || "",
    promesse: f["promesse unique"] || "",
    emotion: f["émotion dominante"] || "",
    signature: f["signature narrative"] || "",
    codesVisuels: f["codes visuels"] || "",
    interditsVisuels: f["interdits visuels"] || "",
    description: f["description"] || "",
    deroule: f["déroulé de la séance"] || "",
    bienfaits: f["bienfaits"] || "",
    publicConcerne: f["public concerné"] || "",
    precautions: f["précautions"] || "",
    duree: info.duree || "",
    tarif: info.tarif || "",
  };
  function assemble(includeTarif, includeDuree, includePublic, precautionsMaxLen){
    let out = `FICHE DE LA PRESTATION :\nNom : ${info.name}\n`;
    /* Rubrique prioritaire : si la fiche désigne une caractéristique citable, le Planner la reprend
       telle quelle — il ne choisit plus lui-même quelle phrase citer. Jamais tronquée. */
    if(fields.citable) out += `Caractéristique citable (à reprendre TELLE QUELLE dans "caracteristiqueSourcePrestation") : ${fields.citable}\n`;
    /* ADN de la prestation : ce qui la rend reconnaissable entre toutes. Placé avant la description
       car c'est ce qui doit guider la scène — la description ne sert qu'à vérifier les faits. */
    if(fields.concept) out += `Concept central (l'idée unique autour de laquelle toute la scène se construit) : ${fields.concept}\n`;
    if(fields.emotion) out += `Émotion dominante (une seule, propre à cette prestation) : ${fields.emotion}\n`;
    if(fields.promesse) out += `Promesse unique : ${fields.promesse}\n`;
    if(fields.signature) out += `Signature narrative : ${fields.signature}\n`;
    if(fields.codesVisuels) out += `Codes visuels propres à cette prestation : ${fields.codesVisuels}\n`;
    if(fields.interditsVisuels) out += `À ne jamais montrer pour cette prestation : ${fields.interditsVisuels}\n`;
    if(fields.description) out += `Description : ${fields.description}\n`;
    if(fields.deroule) out += `Déroulé de la séance : ${fields.deroule}\n`;
    if(fields.bienfaits) out += `Bienfaits : ${fields.bienfaits}\n`;
    if(includePublic && fields.publicConcerne) out += `Public concerné : ${fields.publicConcerne}\n`;
    if(fields.precautions){
      const p = precautionsMaxLen && fields.precautions.length > precautionsMaxLen
        ? fields.precautions.slice(0, precautionsMaxLen) + "…"
        : fields.precautions;
      out += `Précautions : ${p}\n`;
    }
    if(includeDuree && fields.duree) out += `Durée : ${fields.duree}\n`;
    if(includeTarif && fields.tarif) out += `Tarif : ${fields.tarif}\n`;
    return out;
  }
  // Dégradation progressive, dans l'ordre exact demandé — Description et Déroulé jamais retirés.
  let out = assemble(true, true, true, null);
  if(out.length > PRESTATION_FICHE_PROMPT_BUDGET) out = assemble(false, true, true, null);       // retire Tarif
  if(out.length > PRESTATION_FICHE_PROMPT_BUDGET) out = assemble(false, false, true, null);      // puis Durée
  if(out.length > PRESTATION_FICHE_PROMPT_BUDGET) out = assemble(false, false, false, null);     // puis Public concerné
  if(out.length > PRESTATION_FICHE_PROMPT_BUDGET) out = assemble(false, false, false, 150);      // puis raccourcit Précautions
  if(out.length > PRESTATION_FICHE_PROMPT_BUDGET) out = out.slice(0, PRESTATION_FICHE_PROMPT_BUDGET) + "…"; // filet de sécurité ultime
  return out;
}

/* Normalisation utilisée uniquement pour vérifier qu'une formulation est réellement contenue dans
   la fiche — minuscules, accents neutralisés, ponctuation neutralisée, espaces normalisés. Sert
   uniquement à une comparaison de contenu (pas de recherche positionnelle), la décomposition

function normalizeForContainmentCheck(str){
  return String(str||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[.,;:!?«»""''()\-–—…]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

   CARAC_NGRAM_MIN mots consécutifs de la caractéristique figure dans la fiche. Seuil calibré sur le
   run run_mrxy42vl : accepte les citations fidèles, rejette une phrase étrangère à la fiche. */
const CARAC_NGRAM_MIN = 8;
function caracVientDeLaFiche(caracNorm, ficheSourceNorm){
  if(!caracNorm || !ficheSourceNorm) return false;
  if(ficheSourceNorm.includes(caracNorm)) return true;
  const mots = caracNorm.split(" ").filter(Boolean);
  if(mots.length < CARAC_NGRAM_MIN) return false; // trop courte pour être vérifiée autrement
  for(let i=0; i+CARAC_NGRAM_MIN <= mots.length; i++){
    if(ficheSourceNorm.includes(mots.slice(i, i+CARAC_NGRAM_MIN).join(" "))) return true;
  }
  return false;
}

/* ---------- CREATIVE PLANNER V2 — validation, dérivation, repli, génération ----------
   Point de clarification par rapport à IMPLEMENTATION.md §3.2 : comme validateAndFixBrief (V1)
   le montre ci-dessous, le Planner actuel n'a JAMAIS de boucle de relance LLM à ce niveau — les
   échecs sont soit corrigés silencieusement en code (archétype hors liste, typeCreation forcé),
   soit bloquants sans tentative de réparation automatique (caracteristiqueSourcePrestation).
   validateAndFixBriefV2 suit STRICTEMENT ce même principe déjà en place, plutôt que d'introduire
   un nouvel appel LLM correctif qui n'existe nulle part ailleurs dans le Planner. */

/* Composition déterministe du champ "emotion" exposé en aval (spec §3.3) — aucun appel LLM,
   simple lecture de la chaîne déjà validée. */
function deriveEmotionFromChaine(briefV2){
  const parts = [briefV2.impactEmotionnelRecherche];
  if(briefV2.transformation && briefV2.transformation.presente && briefV2.transformation.apres){
    parts.push(briefV2.transformation.apres);
  }
  return parts.filter(Boolean).join(" — ");
}

function validateAndFixBriefV2(brief, allowed, exclusions, typeCreationImpose, prestation, platform, registres){
  const allowedIds = allowed.map(a=>a.id);
  const fixed = { ...brief };
  fixed.registresActifs = [...new Set((Array.isArray(registres) ? registres : [])
    .filter(r=>KNOWN_REGISTRES.includes(r)))];
  let corrected = false;

  // 5. Confinement archétype — correction silencieuse, même mécanique que l'archétype narratif V1.
  if(!allowedIds.includes(fixed.archetypeEmotionnel)){
    fixed.archetypeEmotionnel = allowedIds[0];
    corrected = true;
  }
  const archetypeRetenu = allowed.find(a=>a.id===fixed.archetypeEmotionnel) || allowed[0];
  if(archetypeRetenu){
    fixed.miseEnScene = fixed.miseEnScene || {};
    if(archetypeRetenu.cadrages && archetypeRetenu.cadrages.length && !archetypeRetenu.cadrages.includes(fixed.miseEnScene.cadrage)){
      fixed.miseEnScene.cadrage = archetypeRetenu.cadrages[0]; corrected = true;
    }
    if(archetypeRetenu.lumieres && archetypeRetenu.lumieres.length && !archetypeRetenu.lumieres.includes(fixed.lumiere)){
      fixed.lumiere = archetypeRetenu.lumieres[0]; corrected = true;
    }
  }

  const collides = exclusions.some(ex => ex && fixed.decor && fixed.decor.toLowerCase().includes(String(ex).toLowerCase().slice(0,20)));
  if(collides){
    fixed.decor = `${fixed.decor} — variante imposée localement : un décor concrètement différent des générations récentes est requis.`;
    corrected = true;
  }
  if(!Array.isArray(fixed.compositionInterdite)) fixed.compositionInterdite = [];
  /* Les exclusions d'historique servent uniquement à demander de la diversité au Planner.
     Elles décrivent souvent une ancienne scène complète et peuvent contenir des invariants de la
     prestation (posture PSiO, cadrage Story, geste réel). Elles ne doivent donc jamais devenir un
     negative prompt final. On retire aussi les copies que le Planner aurait recopiées telles quelles. */
  const exclusionHistoriqueKeys = new Set((exclusions||[]).map(normalizeForContainmentCheck).filter(Boolean));
  const compositionSansHistorique = fixed.compositionInterdite.filter(item=>
    !exclusionHistoriqueKeys.has(normalizeForContainmentCheck(item))
  );
  if(compositionSansHistorique.length!==fixed.compositionInterdite.length) corrected = true;
  fixed.compositionInterdite = [...new Set(compositionSansHistorique)];
  if(fixed.typeCreation !== typeCreationImpose){ fixed.typeCreation = typeCreationImpose; corrected = true; }

  // Le matériel produit (PSiO®, Healy...) doit rester exact quel que soit le registre choisi. Cette
  // normalisation ne dépend donc pas du type "affiche_fantastique" : Luxe silencieux et tous les
  // futurs styles bénéficient du même verrou produit, de la même posture de séance et des mêmes
  // exclusions. Chaque prestation à verrou produit ajoute sa propre liste d'interdits.
  const isPsio = prestation==="Luminothérapie PSIO®";
  const isHealy = prestation==="Biorésonance quantique";
  fixed.miseEnScene = fixed.miseEnScene || {};
  if(isPsio || isHealy){
    const sujetProduit = getServiceHeroSubject(prestation);
    const actionProduit = getServiceHeroAction(prestation);
    const momentProduit = getServiceVisualMoment(prestation);
    const orProduit = getServiceGoldAccent(prestation);
    const caracteristiqueProduit = getServiceVisibleCharacteristic(prestation);
    const listeInterdits = isPsio ? PSIO_COMPOSITION_INTERDITE : HEALY_COMPOSITION_INTERDITE;
    fixed.compositionInterdite = [...new Set([...fixed.compositionInterdite, ...listeInterdits])];
    if(fixed.miseEnScene.sujetPrincipal!==sujetProduit){ fixed.miseEnScene.sujetPrincipal = sujetProduit; corrected = true; }
    if(fixed.miseEnScene.action!==actionProduit){ fixed.miseEnScene.action = actionProduit; corrected = true; }
    if(fixed.momentCinematographique!==momentProduit){ fixed.momentCinematographique = momentProduit; corrected = true; }
    if(fixed.elementOr!==orProduit){ fixed.elementOr = orProduit; corrected = true; }
    if(fixed.caracteristiquePrestationVisible!==caracteristiqueProduit){
      fixed.caracteristiquePrestationVisible = caracteristiqueProduit;
      corrected = true;
    }
    if(fixed.presenceSoin!=="visible_editoriale"){ fixed.presenceSoin = "visible_editoriale"; corrected = true; }
    if(platform==="Story" && pointDeVueRabatLeSujet(fixed.miseEnScene.pointDeVue)){
      fixed.miseEnScene.pointDeVue = "angle trois-quarts à hauteur du regard, posture valorisante";
      corrected = true;
    }
    if(platform==="Story" && fixed.niveauLuminosite!=="lumineux_eclatant"){
      fixed.niveauLuminosite = "lumineux_eclatant";
      corrected = true;
    }
  }

  // Pause déterministe des automatismes observés pendant les runs officiels. Le brief V2 place
  // désormais la prestation réelle au centre et n'impose aucun symbole de substitution.
  if(typeCreationImpose==="affiche_fantastique"){
    fixed.compositionInterdite = [...new Set([...fixed.compositionInterdite, ...V2_MOTIFS_EN_PAUSE])];
    const symboleNorm = normalizeForContainmentCheck(fixed.symbolePrincipal);
    if(symboleNorm && symboleNorm!=="aucun"){
      fixed.symbolePrincipal = "aucun";
      corrected = true;
    }
    if(contientMotifV2EnPause(fixed.decor)){
      fixed.decor = "espace noir profond abstrait, composé en plusieurs plans autour du sujet, du geste et du matériel distinctif";
      corrected = true;
    }
    if(contientMotifV2EnPause(fixed.lumiere) || /symbole monumental|halo|cercle|axe|rayon vertical/i.test(String(fixed.lumiere||""))){
      fixed.lumiere = (archetypeRetenu && archetypeRetenu.lumieres && archetypeRetenu.lumieres[0])
        || "source chaude unique latérale révélant le sujet, le geste et le matériel distinctif";
      corrected = true;
    }
    if(contientMotifV2EnPause(fixed.elementOr) || /particul|debris|débris|etincell|étincell/i.test(String(fixed.elementOr||""))){
      fixed.elementOr = "reflets d'or métallique noble sur le geste et le matériel distinctif";
      corrected = true;
    }
    if(contientMotifV2EnPause(fixed.momentCinematographique)){
      fixed.momentCinematographique = getServiceVisualMoment(prestation);
      corrected = true;
    }
    if(contientMotifV2EnPause(fixed.miseEnScene.action)
      || /particul|debris|débris|etincell|étincell|effet visuel|transformation physique/i.test(String(fixed.miseEnScene.action||""))){
      fixed.miseEnScene.action = getServiceHeroAction(prestation);
      corrected = true;
    }
    if(/^une adulte\b/i.test(String(fixed.miseEnScene.sujetPrincipal||""))){
      fixed.miseEnScene.sujetPrincipal = String(fixed.miseEnScene.sujetPrincipal)
        .replace(/^une adulte\b/i, "une personne adulte");
      corrected = true;
    }
    if(platform==="Story" && pointDeVueRabatLeSujet(fixed.miseEnScene.pointDeVue)){
      fixed.miseEnScene.pointDeVue = "angle trois-quarts à hauteur du regard, posture valorisante";
      corrected = true;
    }
    if(platform==="Story" && fixed.niveauLuminosite!=="lumineux_eclatant"){
      fixed.niveauLuminosite = "lumineux_eclatant";
      corrected = true;
    }
    const registryDecorContract = buildActiveRegistryDecorContract(fixed.registresActifs);
    if(registryDecorContract){
      const plannerDecor = String(fixed.decor||"").trim();
      const plannerDecorUtile = plannerDecor
        && !contientMotifV2EnPause(plannerDecor)
        && !/^(?:espace|fond) noir profond abstrait\b/i.test(plannerDecor);
      const decorAvecRegistres = plannerDecorUtile
        ? `${registryDecorContract}. Détail spécifique du brief : ${plannerDecor}`
        : registryDecorContract;
      if(fixed.decor!==decorAvecRegistres){ fixed.decor = decorAvecRegistres; corrected = true; }
    }
    const negative = [String(fixed.negativePrompt||"").trim(),
      "mutation physique, transfiguration du visage, corps fragmenté, ambiance d'horreur, symboles occultes, faux logo, zèbre décoratif"]
      .filter(Boolean).join(", ");
    if(negative !== fixed.negativePrompt){ fixed.negativePrompt = negative; corrected = true; }
  }

  if(/transfigur/i.test(String(fixed.momentCinematographique||""))){
    fixed.momentCinematographique = String(fixed.momentCinematographique)
      .replace(/transfigur(?:é|ée|és|ées|ation)/gi, "révélé par la lumière sans altération physique");
    corrected = true;
  }
  if(platform==="Story"){
    const headline = ensureStoryHeadline(fixed.texteImage, prestation);
    if(headline !== fixed.texteImage){ fixed.texteImage = headline; corrected = true; }
  }

  // 1. Interdits absolus : correction locale déterministe pour ne pas condamner tout un item
  //    de campagne sur un seul mot générique ("harmonie" avait bloqué Abhyanga au run 2).
  const impactNorm = normalizeForContainmentCheck(fixed.impactEmotionnelRecherche);
  const violationInterdite = VOCABULAIRE_INTERDIT_ABSOLU.find(mot => impactNorm.includes(normalizeForContainmentCheck(mot)));
  if(violationInterdite){
    fixed.impactEmotionnelRecherche = "renaissance lumineuse";
    corrected = true;
  }

  // 2. Ancrage réel — même contrôle que caracteristiqueSourcePrestation en V1, champ renommé.
  const info = getSelectedPrestationInfo(prestation);
  const prestationDocumentee = !!(info && !info.generic && info.block);
  let blockingError = null;
  let aucuneRaisonDetre = false;

  if(!prestationDocumentee){
    if(!fixed.ancrageReel) fixed.ancrageReel = "aucune prestation précise";
  } else {
    const carac = (fixed.ancrageReel || "").trim();
    const caracNorm = normalizeForContainmentCheck(carac);
    const ficheSource = `${(info.fiche && info.fiche["caractéristique citable"]) || ""} ${(info.fiche && info.fiche["description"]) || ""} ${(info.fiche && info.fiche["déroulé de la séance"]) || ""}`;
    const ficheSourceNorm = normalizeForContainmentCheck(ficheSource);
    if(!carac){
      blockingError = `Ancrage réel manquant — le Planner V2 n'a fourni aucune valeur pour "ancrageReel".`;
    } else if(caracVientDeLaFiche(caracNorm, ficheSourceNorm)){
      blockingError = null;
    } else if(GENERIC_CARACTERISTIQUE_FORBIDDEN.some(mot => caracNorm.includes(mot))){
      blockingError = `Ancrage réel trop générique : "${carac}" — formule générique introuvable dans la fiche de "${prestation}".`;
    } else {
      blockingError = `Ancrage réel non vérifiable dans la fiche : "${carac}" n'a pas été retrouvé dans "${prestation}".`;
    }
  }

  // 3. raisonDetre — marqueur distinct de blockingError (spec §3bis), jamais fondu dans les mêmes
  //    statistiques qu'un échec réseau ou un échec d'ancrage. Non bloquant pour la génération
  //    d'image (elle continue), mais tracé séparément pour audit.
  const raisonNorm = normalizeForContainmentCheck(fixed.raisonDetre);
  const ancrageNorm = normalizeForContainmentCheck(fixed.ancrageReel);
  if(!raisonNorm || (ancrageNorm && raisonNorm === ancrageNorm)){
    aucuneRaisonDetre = true;
  }

  // 4. Filiation conflit → momentCinematographique — diagnostic non bloquant (pas de boucle de
  //    relance LLM au niveau Planner, voir note en tête de section). Tracé pour audit uniquement.
  const conflitNorm = normalizeForContainmentCheck(fixed.conflit);
  const momentNorm = normalizeForContainmentCheck(fixed.momentCinematographique);
  const motsConflit = conflitNorm.split(" ").filter(w=>w.length>=5);
  const filiationFaible = motsConflit.length>0 && !motsConflit.some(w=>momentNorm.includes(w));

  return { brief: fixed, corrected, blockingError, aucuneRaisonDetre, filiationConflitMomentFaible: !!filiationFaible };
}

/* Relance réseau UNIQUE, distincte de tout contrôle de contenu — voir note en tête de section.
   Ne couvre que l'échec brut de la requête (ex. "Failed to fetch"), jamais un contenu invalide. */
async function generateCreativeBriefV2(mission, prestation, platform, topic, typeCreationImpose, registres, recentEntriesOverride, trace){
  const allowed = computeAllowedArchetypes(mission, prestation, platform, typeCreationImpose, recentEntriesOverride||null);
  const exclusions = computeRecentCompositionExclusions(platform, recentEntriesOverride||null);
  const systemPrompt = buildCreativePlannerSystemPromptV2();
  const userPrompt = buildCreativePlannerUserPromptV2(allowed, exclusions, mission, prestation, platform, topic, typeCreationImpose, registres, trace);
  const provider = state.apiProviders.find(p=>p.id===state.selectedProviderId) || DEFAULT_OPENAI_PROVIDER;

  const callOnce = async ()=>{
    const res = await fetch("/.netlify/functions/generate-text", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ kind: provider.kind, model: provider.model, baseUrl: provider.baseUrl, systemPrompt, userPrompt, responseSchema: CREATIVE_BRIEF_SCHEMA_V2 }),
    });
    const contentType = res.headers.get("content-type")||"";
    if(!contentType.includes("application/json")) throw new Error(`Réponse non-JSON du Creative Planner V2 (statut ${res.status}).`);
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || `Erreur ${res.status}`);
    return data;
  };

  let data, plannerNetworkRetryUsed = false;
  try{
    data = await callOnce();
  }catch(err){
    const estUneErreurReseau = /failed to fetch|network|timeout/i.test(String(err.message||err));
    if(!estUneErreurReseau) throw err;
    plannerNetworkRetryUsed = true;
    data = await callOnce(); // si la seconde tentative échoue aussi, l'erreur remonte telle quelle
  }

  let rawBrief;
  try{ rawBrief = JSON.parse(data.text); }
  catch(e){
    console.error("[Creative Planner V2] JSON.parse a échoué — contenu brut reçu :", data.text);
    throw new Error(`Creative Planner V2 — erreur JSON.parse :\n${e.message}\n\nRéponse brute :\n${String(data.text||"").slice(0,1500)}`);
  }
  const { brief, corrected, blockingError, aucuneRaisonDetre, filiationConflitMomentFaible } = validateAndFixBriefV2(rawBrief, allowed, exclusions, typeCreationImpose, prestation, platform, registres);
  const usage = data.usage ? { promptTokens: data.usage.prompt_tokens ?? null, completionTokens: data.usage.completion_tokens ?? null, model: provider.model } : null;
  return { brief, corrected, blockingError, aucuneRaisonDetre, filiationConflitMomentFaible, allowed, exclusions, usage, plannerNetworkRetryUsed };
}

/* ---------- CREATIVE PLANNER V1 (inchangé ci-dessous) ---------- */
function validateAndFixBrief(brief, allowed, exclusions, typeCreationImpose, prestation){
  const allowedIds = allowed.map(a=>a.id);
  const fixed = { ...brief };
  let corrected = false;
  if(!allowedIds.includes(fixed.archetypeNarratif)){
    fixed.archetypeNarratif = allowedIds[0];
    corrected = true;
  }
  const collides = exclusions.some(ex => ex && fixed.decor && fixed.decor.toLowerCase().includes(String(ex).toLowerCase().slice(0,20)));
  if(collides){
    fixed.decor = `${fixed.decor} — variante imposée localement : un décor concrètement différent des générations récentes est requis, sans nouvel appel au concepteur.`;
    corrected = true;
  }
  if(!Array.isArray(fixed.compositionInterdite)) fixed.compositionInterdite = [];
  fixed.compositionInterdite = [...new Set([...fixed.compositionInterdite, ...exclusions])];

  // Type de création : correction locale silencieuse (comme pour l'archétype), jamais un choix du modèle.
  if(fixed.typeCreation !== typeCreationImpose){
    fixed.typeCreation = typeCreationImpose;
    corrected = true;
  }

  const info = getSelectedPrestationInfo(prestation);
  const prestationDocumentee = !!(info && !info.generic && info.block);

  let blockingError = null;
  if(!prestationDocumentee){
    // Pas de prestation précise/documentée : aucun contrôle métier, une chaîne vide est acceptée.
    if(!fixed.caracteristiqueSourcePrestation) fixed.caracteristiqueSourcePrestation = "aucune prestation précise";
  } else {
    // Provenance réelle vérifiée contre la fiche, jamais réparée en inventant une phrase — un échec
    // ici bloque l'image (voir prepareCreativeBrief).
    const carac = (fixed.caracteristiqueSourcePrestation || "").trim();
    const caracNorm = normalizeForContainmentCheck(carac);
    /* V1.0 — ORDRE CORRIGÉ (bug démontré par le Smoke Run run_mrxy42vl) : la vérification de
       provenance passe AVANT la liste noire. Une phrase réellement issue de la fiche est par
       définition spécifique à cette prestation : la liste noire ne doit attraper que les formules
       que le Planner invente, jamais censurer les fiches elles-mêmes (« massage bien-être sur
       table » EST le texte officiel de Prestations en entreprise).
       La rubrique « Caractéristique citable » de la fiche, si elle existe, fait partie des sources
       vérifiables au même titre que Description et Déroulé. */
    const ficheSource = `${(info.fiche && info.fiche["caractéristique citable"]) || ""} ${(info.fiche && info.fiche["description"]) || ""} ${(info.fiche && info.fiche["déroulé de la séance"]) || ""}`;
    const ficheSourceNorm = normalizeForContainmentCheck(ficheSource);
    if(!carac){
      blockingError = `Caractéristique de prestation manquante — le Planner n'a fourni aucune valeur pour "caracteristiqueSourcePrestation".`;
    } else if(caracVientDeLaFiche(caracNorm, ficheSourceNorm)){
      blockingError = null; // provenance établie : aucune autre condition ne s'applique
    } else if(GENERIC_CARACTERISTIQUE_FORBIDDEN.some(mot => caracNorm.includes(mot))){
      blockingError = `Caractéristique de prestation trop générique : "${carac}" — formule générique de bien-être introuvable dans la fiche de "${prestation}". Reprends une phrase réelle de la Caractéristique citable, de la Description ou du Déroulé de la séance.`;
    } else {
      blockingError = `Caractéristique de prestation non vérifiable dans la fiche : "${carac}" n'a pas été retrouvée dans "${prestation}". Aucune correction automatique n'est tentée.`;
    }
  }
  return { brief: fixed, corrected, blockingError };
}
async function generateCreativeBrief(mission, prestation, platform, topic, typeCreationImpose, registres, recentEntriesOverride, trace){
  const allowed = computeAllowedArchetypes(mission, prestation, platform, typeCreationImpose, recentEntriesOverride||null);
  const exclusions = computeRecentCompositionExclusions(platform, recentEntriesOverride||null);
  const systemPrompt = buildCreativePlannerSystemPrompt();
  const userPrompt = buildCreativePlannerUserPrompt(allowed, exclusions, mission, prestation, platform, topic, typeCreationImpose, registres, trace);
  const provider = state.apiProviders.find(p=>p.id===state.selectedProviderId) || DEFAULT_OPENAI_PROVIDER;
  const res = await fetch("/.netlify/functions/generate-text", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ kind: provider.kind, model: provider.model, baseUrl: provider.baseUrl, systemPrompt, userPrompt, responseSchema: CREATIVE_BRIEF_SCHEMA }),
  });
  const contentType = res.headers.get("content-type")||"";
  if(!contentType.includes("application/json")){
    throw new Error(`Réponse non-JSON du Creative Planner (statut ${res.status}).`);
  }
  const data = await res.json();
  if(!res.ok || data.error) throw new Error(data.error || `Erreur ${res.status}`);
  let rawBrief;
  try{ rawBrief = JSON.parse(data.text); }
  catch(e){
    console.error("[Creative Planner] JSON.parse a échoué — contenu brut reçu :", data.text);
    console.error("[Creative Planner] Erreur JSON.parse réelle :", e.message);
    throw new Error(`Creative Planner — erreur JSON.parse :\n${e.message}\n\nRéponse brute :\n${String(data.text||"").slice(0,1500)}`);
  }
  const { brief, corrected, blockingError } = validateAndFixBrief(rawBrief, allowed, exclusions, typeCreationImpose, prestation);
  const usage = data.usage ? { promptTokens: data.usage.prompt_tokens ?? null, completionTokens: data.usage.completion_tokens ?? null, model: provider.model } : null;
  return { brief, corrected, blockingError, allowed, exclusions, usage };
}

/* ---------- 4. PROMPT IMAGE COMPACT (12 sections dans l'ordre demandé) ---------- */
/* Synthèse fixe de la charte SDZ, distillée UNE FOIS depuis les modules permanents
   (Constitution + Noir & Or + Direction Artistique). Les modules complets restent la mémoire
   artistique du Creative Planner (buildCreativePlannerUserPrompt, inchangé) : c'est là qu'ils
   façonnent le brief. Ici, dans le prompt image final, ils n'apparaissent plus en concaténation
   de 2500 caractères mais en une charte condensée — même rôle qu'une mémoire implicite. */
const CHARTE_SDZ_SYNTHESE = "Charte SDZ : palette exclusivement noir et or (or noble, métallique, satiné — jamais jaune vif, cuivre ou orange) ; clair-obscur dramatique avec une seule source de lumière chaude ; rendu premium d'affiche de cinéma ; aucune imagerie de spa générique, aucun beige, brun ou bois clair dominant ; aucune référence culturelle ou religieuse réelle (ni temple, ni Bouddha, ni monument existant) ; visages naturels, intacts et crédibles, cadrés de façon éditoriale ; émotion forte portée par la lumière, la composition et la prestation réelle, pas par la surcharge symbolique.";

/* ============================================================
   T1 — ORCHESTRATEUR + PROMPT VALIDATOR (architecture figée, mode rapport)
   Règles appliquées : hiérarchie des décisions (2.5 — fusionne/refuse, ne réécrit
   jamais une décision métier), transformations immuables (2.6 — entrée intouchée,
   sortie NOUVELLE et gelée), indépendance des couches (l'orchestrateur ignore GPT,
   le validator ne connaît que le prompt assemblé et le paquet).
   En T1, ces couches OBSERVENT et RAPPORTENT : le prompt envoyé n'est pas modifié.
============================================================ */

/* ORCHESTRATEUR — reçoit brief validé + registres + plateforme, retourne un paquet
   de données fusionnées/dédoublonnées, gelé. Ne rédige jamais, ne modifie jamais l'amont. */
function buildOrchestratorPacket(brief, registres, platform, aspectKey){
  const decisions = Object.freeze({
    sujet: brief.sujetPrincipal || "",
    action: brief.action || "",
    emotion: brief.emotion || "",
    symbole: symboleBriefUtile(brief.symbolePrincipal) ? brief.symbolePrincipal : "",
    instantChoisi: brief.pointDeTransformation || "",
    lienCausal: brief.caracteristiquePrestationVisible || "",
    registres: Object.freeze([...(registres||[])]),
    typeCreation: brief.typeCreation || "",
  });
  // Fusion des interdits : negativePrompt + compositions interdites, dédoublonnés (normalisés)
  const rawInterdits = [
    ...String(brief.negativePrompt||"").split(/[;,]/),
    ...((brief.compositionInterdite||[])),
  ].map(s=>s.trim()).filter(Boolean);
  const seen = new Set(); const interdits = []; const doublonsInterdits = [];
  rawInterdits.forEach(x=>{
    const k = normalizeForContainmentCheck(x);
    if(seen.has(k)) doublonsInterdits.push(x); else { seen.add(k); interdits.push(x); }
  });
  const contraintesTechniques = Object.freeze({
    platform, aspect: aspectKey || "1:1",
    tailleApi: API_IMAGE_SIZE_BY_PLATFORM[platform] || "1024x1024",
    logoRequis: logoRequiredFor(platform),
  });
  return Object.freeze({
    decisions,
    interdits: Object.freeze(interdits),
    contraintesTechniques,
    rapportFusion: Object.freeze({ interditsAvant: rawInterdits.length, interditsApres: interdits.length, doublonsSupprimes: Object.freeze(doublonsInterdits) }),
  });
}

/* PROMPT VALIDATOR — analyse le prompt assemblé contre le paquet. Peut (à terme) refuser ;
   en T1 il produit un RAPPORT gelé, affiché dans l'Inspector. Il ne corrige jamais rien. */
function validateAssembledPrompt(prompt, packet, brief){
  const normPrompt = normalizeForContainmentCheck(prompt||"");
  const report = { doublons: [], contradictions: [], decisionsAbsentes: [], preparationT3: [], longueur: (prompt||"").length };

  // 1) Doublons charte/narratif : notions de la charte déjà portées par le corps du prompt
  //    (détection par paires de mots-clés — informatif, jamais correctif)
  const notionsCharte = [
    ["noir", "or"], ["clair-obscur", "lumière"], ["affiche", "cinéma"], ["visage", "frontal"],
  ];
  const corps = normalizeForContainmentCheck(String(prompt||"").split("Charte SDZ")[0]);
  notionsCharte.forEach(pair=>{
    if(pair.every(w=> corps.includes(normalizeForContainmentCheck(w)))) report.doublons.push(`Notion de charte déjà exprimée dans le narratif : ${pair.join(" + ")}`);
  });

  // 2) Contradictions structurelles connues
  if(/aucun texte n'est incrusté/i.test(prompt||"") && /texte incrusté\s*[:—]/i.test(prompt||""))
    report.contradictions.push("Interdiction de texte ET consigne de texte incrusté présentes simultanément.");
  if(/sans jamais le redessiner/i.test(prompt||"") && /zone sobre en bas/i.test(prompt||""))
    report.contradictions.push("Logo en référence ET zone réservée simultanément — stratégies logo mélangées.");

  // 3) Hiérarchie des décisions : chaque décision métier doit survivre dans le prompt
  Object.entries({ sujet: packet.decisions.sujet, symbole: packet.decisions.symbole, "instant choisi": packet.decisions.instantChoisi, émotion: packet.decisions.emotion }).forEach(([label, val])=>{
    const words = normalizeForContainmentCheck(String(val||"")).split(/\s+/).filter(w=>w.length>=5);
    if(words.length && !words.some(w=> normPrompt.includes(w))) report.decisionsAbsentes.push(label);
  });

  // 4) Préparation T3 (anti-prose) : mesure des champs de décision — deviendra bloquant au schéma atomique
  Object.entries(packet.decisions).forEach(([k,v])=>{
    if(typeof v==="string" && v.split(/\s+/).filter(Boolean).length > 15) report.preparationT3.push(`${k} : ${v.split(/\s+/).length} mots (cible T3 : ≤ 15, atomique)`);
  });

  return Object.freeze({ ...report, doublons: Object.freeze(report.doublons), contradictions: Object.freeze(report.contradictions), decisionsAbsentes: Object.freeze(report.decisionsAbsentes), preparationT3: Object.freeze(report.preparationT3) });
}


/* ============================================================
   RÉDACTEUR DA — couche de traduction linguistique, jamais de décision.
   Le Planner pense (modules, archétypes, brief) ; le Rédacteur écrit.
   Interrupteur unique : USE_DA_WRITER. À false, le pipeline actuel est
   strictement inchangé (buildCompactImagePromptFromBrief).
============================================================ */
const USE_DA_WRITER = true;
const DA_WRITER_MODEL = "gpt-5-mini"; // reformulation pure : mini + reasoning_effort minimal suffit
const DA_WRITER_MAX_WORDS = 320;      // rejet au-delà (cible demandée : 180-250 mots)

function symboleBriefUtile(value){
  const symbole = String(value||"").trim();
  return !!symbole && !/^aucun(?:\b|\s|—|-)/i.test(symbole);
}

/* Extrait UNIQUEMENT les champs exportables du brief (tri validé). Les champs de raisonnement
   (plansVisuels, structureNarrative, oppositionVisuelle, archetypeNarratif, messageCentral,
   referenceFamily, raisonDifference, zoneLogo, zoneTexte, texteImage...) et les sentinelles
   ne sont jamais transmis : le Rédacteur ne peut pas fuiter ce qu'il ne voit pas. */
function extractExportableBriefFields(brief){
  const carac = String(brief.caracteristiquePrestationVisible||"").trim();
  const caracUtile = carac && !/^aucune prestation précise\.?$/i.test(carac);
  const symboleUtile = symboleBriefUtile(brief.symbolePrincipal);
  return {
    typeCreation: brief.typeCreation,
    ideeVisuelle: brief.ideeVisuelle,
    sujetPrincipal: brief.sujetPrincipal,
    action: brief.action,
    decor: brief.decor,
    cadrage: brief.cadrage,
    pointDeVue: brief.pointDeVue,
    lumiere: brief.lumiere,
    niveauLuminosite: brief.niveauLuminosite,
    elementOr: brief.elementOr,
    emotion: brief.emotion,
    pointDeTransformation: brief.pointDeTransformation,
    ...(symboleUtile ? { symbolePrincipal: brief.symbolePrincipal } : {}),
    ...(caracUtile ? { caracteristiquePrestationVisible: carac } : {}),
  };
}

   EXPÉRIENCE experience2_brief_complet — NE JAMAIS APPELER DEPUIS LA PRODUCTION.

/* Indicateur de preuve de transmission (demande explicite : "oui/non" vérifiable), calculé
   AVANT tout appel LLM — ne dépend d'aucune réponse du Rédacteur, uniquement des données
   effectivement incluses dans l'objet exportable envoyé. */
function computeCompletTransmissionFlags(exportable){
  const nonEmpty = v => typeof v==="string" ? !!v.trim() : !!v;
  const pv = (exportable && exportable.plansVisuels) || {};
  const plansVisuelsTransmis = ["premierPlan","planPrincipal","planSecondaire","arrierePlan"].some(k=> nonEmpty(pv[k]));
  return {
    plansVisuelsTransmis,
    ideeVisuelleTransmise: nonEmpty(exportable && exportable.ideeVisuelle),
    niveauLuminositeTransmis: nonEmpty(exportable && exportable.niveauLuminosite),
  };
}

/* ============================================================
   EXPÉRIENCE experience2_priorites (variantes A et B) — NE JAMAIS APPELER DEPUIS LA PRODUCTION.
   Hypothèse testée : le simple REGROUPEMENT visuel des champs déjà transmis (aucune donnée
   nouvelle, aucun mot changé) en deux blocs OBLIGATOIRE / CONTEXTE change-t-il le comportement
   du modèle (variante A) ? Et si non, une unique phrase de règle de priorité le fait-elle
   (variante B) ? Les 5 champs "OBLIGATOIRE" ne sont PAS un jugement arbitraire : ce sont
   exactement les 5 champs déjà considérés comme critiques par narrativeMissingElements()
   (L2375) — une hiérarchie qui existe déjà dans le moteur, simplement rendue explicite ici.
   AUCUN champ n'est ajouté ou retiré par rapport à extractExportableBriefFields (donc
   plansVisuels reste absent — cette piste a été testée et invalidée séparément). */
function extractExportableBriefFieldsGroupe(brief){
  const carac = String(brief.caracteristiquePrestationVisible||"").trim();
  const caracUtile = carac && !/^aucune prestation précise\.?$/i.test(carac);
  const symboleUtile = symboleBriefUtile(brief.symbolePrincipal);
  const obligatoire = {
    sujetPrincipal: brief.sujetPrincipal,
    ...(symboleUtile ? { symbolePrincipal: brief.symbolePrincipal } : {}),
    emotion: brief.emotion,
    pointDeTransformation: brief.pointDeTransformation,
    ...(caracUtile ? { caracteristiquePrestationVisible: carac } : {}),
  };
  const contexte = {
    typeCreation: brief.typeCreation,
    ideeVisuelle: brief.ideeVisuelle,
    action: brief.action,
    decor: brief.decor,
    cadrage: brief.cadrage,
    pointDeVue: brief.pointDeVue,
    lumiere: brief.lumiere,
    niveauLuminosite: brief.niveauLuminosite,
    elementOr: brief.elementOr,
  };
  return { obligatoire, contexte };
}

/* Copie intégrale de rewriteBriefAsNarrative. Seule différence : présentation du brief en deux
   blocs étiquetés (voir extractExportableBriefFieldsGroupe). variante==="B" ajoute UNE phrase de
   règle de priorité, en plus, jamais en remplacement — variante "A" n'ajoute STRICTEMENT rien.
   narrativeMissingElements reste inchangée, appliquée sur les mêmes 5 champs "obligatoire".
   NE JAMAIS APPELER DEPUIS LA PRODUCTION. */
async function rewriteBriefAsNarrativeGroupe(brief, variante){
  const groupe = extractExportableBriefFieldsGroupe(brief);
  const exportableFlat = { ...groupe.obligatoire, ...groupe.contexte };
  const reglePriorite = "\n\nRÈGLE DE PRIORITÉ : les éléments du groupe OBLIGATOIRE doivent toujours être présents dans l'image. Si un compromis est nécessaire, réduis le CONTEXTE avant de sacrifier un élément OBLIGATOIRE.";
  const systemPrompt = DA_WRITER_SYSTEM_PROMPT;
  const basePrompt = `Brief structuré à transformer en note de direction artistique. Les champs sont organisés en deux groupes :\nOBLIGATOIRE :\n${JSON.stringify(groupe.obligatoire, null, 2)}\n\nCONTEXTE :\n${JSON.stringify(groupe.contexte, null, 2)}`;
  const userPrompt = basePrompt + (variante==="B" ? reglePriorite : "");
  const instructionPrioriteIncluse = variante==="B";

  const callOnce = async (extraInstruction)=>{
    const res = await fetch("/.netlify/functions/generate-text", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        kind: "openai-compatible", model: DA_WRITER_MODEL, baseUrl: "https://api.openai.com/v1",
        systemPrompt, userPrompt: extraInstruction ? `${userPrompt}\n\n${extraInstruction}` : userPrompt,
        reasoning_effort: "minimal",
      }),
    });
    const contentType = res.headers.get("content-type")||"";
    if(!contentType.includes("application/json")) throw new Error(`Rédacteur DA (priorites ${variante}) : réponse non-JSON (statut ${res.status}).`);
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || `Rédacteur DA (priorites ${variante}) : erreur ${res.status}`);
    return { text: String(data.text||"").trim(), usage: data.usage || null };
  };

  const sumUsage = (a,b)=> (!a && !b) ? null : ({ promptTokens: (a?.prompt_tokens??a?.promptTokens??0)+(b?.prompt_tokens??b?.promptTokens??0), completionTokens: (a?.completion_tokens??a?.completionTokens??0)+(b?.completion_tokens??b?.completionTokens??0), model: DA_WRITER_MODEL });
  let call1 = await callOnce();
  let text = call1.text; let usageAcc = call1.usage;
  let missing = narrativeMissingElements(text, exportableFlat);
  const tooLong = text.split(/\s+/).length > DA_WRITER_MAX_WORDS;
  if(missing.length || tooLong){
    const correction = `CORRECTION OBLIGATOIRE : ta précédente version ${tooLong?`dépassait ${DA_WRITER_MAX_WORDS} mots`:""}${tooLong&&missing.length?" et ":""}${missing.length?`omettait ces éléments du brief : ${missing.join(", ")}`:""}. Réécris la note en respectant strictement toutes les règles, en 180 à 250 mots, sans rien inventer.`;
    const call2 = await callOnce(correction);
    text = call2.text; usageAcc = sumUsage(usageAcc, call2.usage) || usageAcc;
    missing = narrativeMissingElements(text, exportableFlat);
    if(missing.length) throw new Error(`Éléments du brief absents après relance : ${missing.join(", ")}`);
    if(text.split(/\s+/).length > DA_WRITER_MAX_WORDS) throw new Error(`Texte trop long après relance (> ${DA_WRITER_MAX_WORDS} mots)`);
  }
  return {
    text,
    usage: usageAcc ? { promptTokens: usageAcc.prompt_tokens ?? usageAcc.promptTokens ?? null, completionTokens: usageAcc.completion_tokens ?? usageAcc.completionTokens ?? null, model: DA_WRITER_MODEL } : null,
    instrumentation: { variante, regroupementApplique: true, instructionPrioriteIncluse },
  };
}

/* Copie intégrale de serializeBriefToPromptFallback, présentation en deux blocs (repli, en cas
   d'échec du Rédacteur). NE JAMAIS APPELER DEPUIS LA PRODUCTION. */
function serializeBriefToPromptFallbackGroupe(brief, platform, aspectKey, isCampaign, variante){
  const s = v => { const t = String(v||"").trim(); return t ? (/[.!?…]$/.test(t) ? t : t+".") : ""; };
  const groupe = extractExportableBriefFieldsGroupe(brief);
  const g = { ...groupe.obligatoire, ...groupe.contexte };
  const ligneObligatoire = [
    ["Sujet", g.sujetPrincipal],
    ["Symbole éventuel explicitement demandé par le brief", g.symbolePrincipal],
    ["Instant unique de la scène", g.pointDeTransformation],
    ...(g.caracteristiquePrestationVisible ? [["Caractéristique visible de la prestation", g.caracteristiquePrestationVisible]] : []),
    ["Émotion", g.emotion],
  ].filter(([,v])=> String(v||"").trim()).map(([k,v])=> `${k} : ${s(v)}`).join(" ");
  const ligneContexte = [
    ["Idée visuelle", g.ideeVisuelle], ["Action", g.action], ["Décor", g.decor],
    ["Cadrage", [g.cadrage, g.pointDeVue].filter(Boolean).join(", ")],
    ["Lumière", [g.lumiere, g.elementOr].filter(Boolean).join(" ")],
    ["Niveau de luminosité", g.niveauLuminosite],

${corps}

/* Contrôle de fidélité déterministe : pour chaque élément critique, au moins un mot significatif
   (≥5 caractères, normalisé) doit survivre dans le texte du Rédacteur. Retourne la liste des
   éléments manquants (vide = texte fidèle). Réutilise la normalisation éprouvée des prestations. */
function narrativeMissingElements(text, exportable){
  const normText = normalizeForContainmentCheck(text);
  const critical = {
    "sujet": exportable.sujetPrincipal,
    ...(symboleBriefUtile(exportable.symbolePrincipal) ? { "symbole": exportable.symbolePrincipal } : {}),
    "émotion": exportable.emotion,
    "instant de transformation": exportable.pointDeTransformation,
    ...(exportable.caracteristiquePrestationVisible ? { "caractéristique de la prestation": exportable.caracteristiquePrestationVisible } : {}),
  };
  const missing = [];
  Object.entries(critical).forEach(([label, value])=>{
    const words = normalizeForContainmentCheck(String(value||"")).split(/\s+/).filter(w=>w.length>=5);
    if(!words.length) return; // rien de vérifiable — ne pas bloquer
    if(!words.some(w=> normText.includes(w))) missing.push(label);
  });
  return missing;
}

/* Un appel texte, une relance corrective maximum, puis échec — le repli est géré par l'appelant.
   Retourne { text } ou lève une erreur avec la raison exacte (traçée dans le flow). */
/* System prompt du Rédacteur — CONSTANTE CANONIQUE (sert aussi au Knowledge Fingerprint :
   la logique métier du constructeur est représentée par ses données, jamais par toString()). */
const DA_WRITER_SYSTEM_PROMPT = `Tu es le rédacteur d'un directeur artistique. Ta seule mission : transformer un brief structuré en une note de direction artistique fluide, en français, destinée à un générateur d'images.

RÈGLES ABSOLUES — tu reformules, tu n'inventes JAMAIS :
- Interdiction d'inventer un symbole, une émotion, un décor, un cadrage, une lumière, un personnage, ou d'enrichir librement la scène. Chaque idée de ton texte doit provenir du brief fourni.
- Décris le sujet humain UNE seule fois, complètement, puis désigne-le par un pronom.
- Décris chaque symbole UNE seule fois. Aucun doublon, aucune répétition de concept.
- Raconte UN seul instant : la scène est figée à l'instant de transformation indiqué — jamais une séquence d'états (pas de "d'abord... puis...").
- Une seule lumière dominante, une seule ambiance, une seule idée centrale.
- La prestation réelle prime : son geste, sa zone du corps ou son matériel doit rester lisible. Si le brief ne contient aucun "symbolePrincipal", n'en invente pas. S'il en contient un, décris-le une seule fois sans inventer d'axe, de portail, de halo ou de lien lumineux absent du brief.
- N'ajoute aucun geste secondaire, aucune main ni aucun accessoire absent du brief. N'ajoute aucun halo, faisceau, rayon, cercle, axe ou particule si le brief ne les demande pas explicitement. Évite toute formulation incertaine comme "peut-être".
- Le corps et le visage restent humains, naturels et intacts. Ne transforme jamais une évolution émotionnelle en mutation physique.
- Ignore toute valeur technique ou interne qui semblerait être une donnée de contrôle.
- Longueur : 180 à 250 mots. Un texte continu en 2 ou 3 paragraphes, sans titres, sans listes, sans étiquettes.
- N'écris RIEN d'autre que la note elle-même : pas de préambule, pas de commentaire.`;

async function rewriteBriefAsNarrative(brief){
  const exportable = extractExportableBriefFields(brief);
  const systemPrompt = DA_WRITER_SYSTEM_PROMPT;
  const userPrompt = `Brief structuré à transformer en note de direction artistique :\n${JSON.stringify(exportable, null, 2)}`;

  const callOnce = async (extraInstruction)=>{
    const res = await fetch("/.netlify/functions/generate-text", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        kind: "openai-compatible", model: DA_WRITER_MODEL, baseUrl: "https://api.openai.com/v1",
        systemPrompt, userPrompt: extraInstruction ? `${userPrompt}\n\n${extraInstruction}` : userPrompt,
        reasoning_effort: "minimal",
      }),
    });
    const contentType = res.headers.get("content-type")||"";
    if(!contentType.includes("application/json")) throw new Error(`Rédacteur DA : réponse non-JSON (statut ${res.status}).`);
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || `Rédacteur DA : erreur ${res.status}`);
    return { text: String(data.text||"").trim(), usage: data.usage || null };
  };

  const sumUsage = (a,b)=> (!a && !b) ? null : ({ promptTokens: (a?.prompt_tokens??a?.promptTokens??0)+(b?.prompt_tokens??b?.promptTokens??0), completionTokens: (a?.completion_tokens??a?.completionTokens??0)+(b?.completion_tokens??b?.completionTokens??0), model: DA_WRITER_MODEL });
  let call1 = await callOnce();
  let text = call1.text; let usageAcc = call1.usage;
  let missing = narrativeMissingElements(text, exportable);
  const tooLong = text.split(/\s+/).length > DA_WRITER_MAX_WORDS;
  if(missing.length || tooLong){
    const correction = `CORRECTION OBLIGATOIRE : ta précédente version ${tooLong?`dépassait ${DA_WRITER_MAX_WORDS} mots`:""}${tooLong&&missing.length?" et ":""}${missing.length?`omettait ces éléments du brief : ${missing.join(", ")}`:""}. Réécris la note en respectant strictement toutes les règles, en 180 à 250 mots, sans rien inventer.`;
    const call2 = await callOnce(correction);
    text = call2.text; usageAcc = sumUsage(usageAcc, call2.usage) || usageAcc;
    missing = narrativeMissingElements(text, exportable);
    if(missing.length) throw new Error(`Éléments du brief absents après relance : ${missing.join(", ")}`);
    if(text.split(/\s+/).length > DA_WRITER_MAX_WORDS) throw new Error(`Texte trop long après relance (> ${DA_WRITER_MAX_WORDS} mots)`);
  }
  return { text, usage: usageAcc ? { promptTokens: usageAcc.prompt_tokens ?? usageAcc.promptTokens ?? null, completionTokens: usageAcc.completion_tokens ?? usageAcc.completionTokens ?? null, model: DA_WRITER_MODEL } : null };
}

  const s = v => { const t = String(v||"").trim(); return t ? (/[.!?…]$/.test(t) ? t : t+".") : ""; };

${corps}

/* ---------- 5. MÉTADONNÉES ET SÉLECTION DES RÉFÉRENCES ---------- */
/* Une image de référence porte désormais des métadonnées optionnelles (referenceFamily, luminosite,
   narration, presenceHumaine, sceneSoin, echelle, plateformesCompatibles) — rétrocompatible : une
   image "reference" sans metadata reste sélectionnable (comportement par défaut : compatible avec tout). */
function selectReferencesForBrief(brief, platform, maxCount){
  maxCount = maxCount || 2;
  const candidates = state.images.filter(i=> i.assetType==="reference" && typeof i.dataUrl==="string" && i.dataUrl);
  const scored = candidates.map(img=>{
    const meta = img.referenceMeta || {};
    let score = 0;
    if(meta.referenceFamily && brief.referenceFamily && meta.referenceFamily===brief.referenceFamily) score += 3;
    if(!meta.referenceFamily) score += 1; // pas de metadata : neutre plutôt que pénalisé (retrocompatibilité)
    if(meta.plateformesCompatibles && meta.plateformesCompatibles.length && meta.plateformesCompatibles.includes(platform)) score += 2;
    if(!meta.plateformesCompatibles) score += 1;
    if(meta.sceneSoin === (brief.presenceSoin!=="aucune")) score += 1;
    return { img, score };
  });
  scored.sort((a,b)=> b.score - a.score);
  // Forme riche demandée : {id, dataUrl, metadata} — l'id est indispensable pour l'historique
  // (point 5), jamais le dataUrl complet qui y était stocké par erreur auparavant.
  return scored.slice(0, maxCount).map(x=>({ id: x.img.id, dataUrl: x.img.dataUrl, metadata: x.img.referenceMeta || null }));
}

/* Analyse l'image RÉELLEMENT obtenue (pas le brief) — c'est cette sortie, pas le brief, qui doit
   fonder l'alt text final : le brief décrit une intention, l'image peut en différer. */
/* Copie réduite (JPEG, 1024px max) utilisée UNIQUEMENT pour l'analyse visuelle — l'image d'origine
   (PNG complet en base64) n'est jamais envoyée telle quelle à ce endpoint texte, et reste intacte
   pour la publication réelle. Repli sur l'original si le redimensionnement échoue pour une raison
   quelconque, plutôt que de bloquer l'analyse. */
function resizeDataUrlForAnalysis(dataUrl, maxDim, quality){
  maxDim = maxDim || 1024; quality = quality || 0.7;
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height*maxDim/width); width = maxDim; }
          else { width = Math.round(width*maxDim/height); height = maxDim; }
        }
        const c = document.createElement("canvas"); c.width = width; c.height = height;
        c.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = ()=> resolve(dataUrl); // repli : image d'origine si le décodage échoue
      img.src = dataUrl;
    }catch(e){ resolve(dataUrl); }
  });
}
async function buildProductComparisonForAnalysis(generatedDataUrl, referenceDataUrls){
  const refs=(Array.isArray(referenceDataUrls)?referenceDataUrls:[referenceDataUrls]).filter(Boolean).slice(0,3);
  if(!refs.length) return resizeDataUrlForAnalysis(generatedDataUrl,1024,.7);
  try{
    const [generated,...referenceImages]=await Promise.all([loadImage(generatedDataUrl),...refs.map(loadImage)]);
    /* La référence principale portée doit rester assez grande pour que l'analyseur voie réellement
       le pont nasal, l'écran et les commandes. L'ancien empilement en trois bandes de 256 px
       écrasait ces détails et transformait des produits conformes en faux négatifs. */
    const canvas=document.createElement("canvas"); canvas.width=1200; canvas.height=900;
    const ctx=canvas.getContext("2d"); ctx.fillStyle="#161616"; ctx.fillRect(0,0,canvas.width,canvas.height);
    const drawContain=(img,x,y,w,h)=>{
      const scale=Math.min(w/img.width,h/img.height);
      const dw=img.width*scale,dh=img.height*scale;
      ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
    };
    drawContain(referenceImages[0],0,0,520,450);
    if(referenceImages[1]) drawContain(referenceImages[1],0,450,260,450);
    if(referenceImages[2]) drawContain(referenceImages[2],260,450,260,450);
    drawContain(generated,520,0,680,canvas.height);
    ctx.strokeStyle="#C9A227"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(520,0); ctx.lineTo(520,900); ctx.stroke();
    return canvas.toDataURL("image/jpeg",.78);
  }catch(e){ return resizeDataUrlForAnalysis(generatedDataUrl,1024,.7); }
}

  const userPrompt = `Analyse précisément l'image générée et compare-la au brief :\nScène prévue : ${brief.ideeVisuelle}\nSujet prévu : ${brief.sujetPrincipal}\nAction prévue : ${brief.action}\nMatériel distinctif attendu : ${brief.caracteristiquePrestationVisible||"aucun"}`;
  const rawImage=await resizeDataUrlForAnalysis(dataUrl,1024,.82);

  const [res,overlayRes] = await Promise.all([
    fetch("/.netlify/functions/generate-text", {

        responseSchema:RAW_OVERLAY_ANALYSIS_SCHEMA,imageDataUrl:rawImage }),

  for(const response of [res,overlayRes]){

    if(!contentType.includes("application/json")) throw new Error(`Réponse non-JSON d'un contrôle d'image (statut ${response.status}).`);
  }
  const [data,overlayData]=await Promise.all([res.json(),overlayRes.json()]);
  if(!res.ok||data.error) throw new Error(data.error||`Erreur analyse ${res.status}`);
  if(!overlayRes.ok||overlayData.error) throw new Error(overlayData.error||`Erreur contrôle overlay ${overlayRes.status}`);
  try{
    return {...JSON.parse(data.text),...JSON.parse(overlayData.text)};
  }catch(e){ throw new Error("Un contrôleur d'image n'a pas renvoyé un JSON exploitable."); }
}

function findGeneratedOverlayViolation(analysis){
  if(!analysis) return "";
  if(analysis.rawOverlayDetected){
    return `Overlay IA interdit : ${String(analysis.rawOverlayDescription||"texte ou identité graphique détecté dans l'image brute")}`;
  }
  const mismatches=Array.isArray(analysis.briefMismatch)?analysis.briefMismatch:[];
  const explicit=mismatches.find(x=>/^overlay ia interdit\s*:/i.test(String(x||"").trim()));
  if(explicit) return String(explicit);
  return "";
}
function findProductReferenceViolation(analysis){
  if(!analysis) return "";
  const evidence=analysis.productGeometryEvidence;
  /* Le verdict du modèle n'est jamais utilisé seul : on bloque sur des faits visuels précis.
     Cela conserve le verrou anti-visière générique tout en évitant qu'une recoloration, un angle
     différent ou un détail masqué fasse rejeter un produit qui porte tous les marqueurs PSiO®. */
  if(evidence){
    const critical=[
      ["grande surface optique incurvée","curvedOpticalShield"],
      ["découpe nasale profonde","deepNoseCutout"],
      ["boîtier de commande latéral","lateralControlHousing"],
    ];
    const supporting=[
      ["petit écran rectangulaire","rectangularScreen"],
      ["commandes rondes","multipleRoundControls"],
      ["câblage du dispositif","deviceCabling"],
    ];
    const allMarkers=[...critical,...supporting];
    const presentCount=allMarkers.filter(([,key])=>evidence[key]==="present").length;
    /* Un modèle de vision peut employer le mot « générique » par réflexe devant une recoloration.
       Ce qualificatif ne l'emporte pas sur quatre marqueurs officiels ou plus effectivement vus. */
    if(evidence.genericVisorOrVrHeadset===true&&presentCount<4){
      return String(analysis.productGeometryMismatch||"le produit ressemble clairement à une visière générique ou à un casque VR");
    }
    const missingCritical=critical.filter(([,key])=>evidence[key]==="absent").map(([label])=>label);
    const missingSupporting=supporting.filter(([,key])=>evidence[key]==="absent").map(([label])=>label);
    if(missingCritical.length>=2 || (missingCritical.length>=1&&missingSupporting.length>=2) || missingSupporting.length===3){
      const missing=[...missingCritical,...missingSupporting];
      return `éléments structurels officiels absents ou contradictoires : ${missing.join(", ")}`;
    }
    return "";
  }
  /* Compatibilité avec une ancienne analyse mise en mémoire avant cette version. */
  if(analysis.productGeometryConformity!=="non_conforme") return "";
  return String(analysis.productGeometryMismatch||"la géométrie du matériel généré ne correspond pas à la référence officielle");
}
function findPaletteViolation(analysis){
  const cast=analysis&&analysis.dominantColorCast;
  if(!["orange_amber","yellow","copper"].includes(cast)) return "";
  const labels={orange_amber:"orange ou ambre",yellow:"jaune vif",copper:"cuivre"};
  return `dominante ${labels[cast]} incompatible avec l'or officiel SDZ`;
}
