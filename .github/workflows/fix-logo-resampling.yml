name: Fix high-quality logo resampling

on:
  push:
    branches:
      - audit/finalize-viewfinder-v3
    paths:
      - .github/workflows/fix-logo-resampling.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/finalize-viewfinder-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch compositor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/_shared/brand-compositor.js')
          s=p.read_text()
          s=s.replace('const COMPOSITOR_VERSION="3.3.0-full-official-medallion";','const COMPOSITOR_VERSION="3.4.0-high-quality-logo-resampling";',1)
          s=s.replace('async function auditLogoTransparency(buffer){','async function auditLogoTransparency(buffer,{allowAntialias=false}={}){',1)
          s=s.replace('let transparent=0,opaque=0,semiDark=0,darkOpaque=0,edgeOpaque=0;const total=info.width*info.height;','let transparent=0,opaque=0,semiAlpha=0,semiDark=0,darkOpaque=0,edgeOpaque=0;const total=info.width*info.height;',1)
          s=s.replace('if(a<=8)transparent++;if(a>=245){opaque++;if(max<75)darkOpaque++;}if(a>8&&a<245&&max<105)semiDark++;if((x===0||y===0||x===info.width-1||y===info.height-1)&&a>8)edgeOpaque++;','if(a<=8)transparent++;if(a>=245){opaque++;if(max<75)darkOpaque++;}if(a>8&&a<245){semiAlpha++;if(max<105)semiDark++;}if((x===0||y===0||x===info.width-1||y===info.height-1)&&a>8)edgeOpaque++;',1)
          s=s.replace('const transparentRatio=transparent/total,opaqueRatio=opaque/total,darkInteriorRatio=darkOpaque/Math.max(1,opaque),aspectRatio=info.width/info.height,fringeDetected=semiDark>0||edgeOpaque>0,integrity=transparentRatio>.20&&transparentRatio<.50&&opaqueRatio>.50&&opaqueRatio<.80&&darkInteriorRatio>.50&&aspectRatio>.86&&aspectRatio<.97&&!fringeDetected;','const transparentRatio=transparent/total,opaqueRatio=opaque/total,semiAlphaRatio=semiAlpha/total,semiDarkRatio=semiDark/total,darkInteriorRatio=darkOpaque/Math.max(1,opaque),aspectRatio=info.width/info.height,fringeDetected=edgeOpaque>0||(allowAntialias?semiDarkRatio>.08:semiDark>0),alphaQuality=allowAntialias?semiAlphaRatio<.18:semiAlpha===0,integrity=transparentRatio>.18&&transparentRatio<.52&&opaqueRatio>.45&&opaqueRatio<.82&&darkInteriorRatio>.48&&aspectRatio>.86&&aspectRatio<.97&&alphaQuality&&!fringeDetected;',1)
          s=s.replace('return Object.freeze({width:info.width,height:info.height,aspectRatio,transparentRatio,opaqueRatio,darkInteriorRatio,semiDark,edgeOpaque,fringeDetected,integrity});','return Object.freeze({width:info.width,height:info.height,aspectRatio,transparentRatio,opaqueRatio,semiAlpha,semiAlphaRatio,darkInteriorRatio,semiDark,semiDarkRatio,edgeOpaque,fringeDetected,integrity});',1)
          s=s.replace('kernel:sharp.kernel.nearest','kernel:sharp.kernel.lanczos3',1)
          s=s.replace('resizedAudit=await auditLogoTransparency(resizedLogo);','resizedAudit=await auditLogoTransparency(resizedLogo,{allowAntialias:true});',1)
          s=s.replace('logoAssetSource:"assets/sdz-logo-compositor.png",logoAssetIntegrity:official.audit.integrity&&resizedAudit.integrity,logoFringeDetected:official.audit.fringeDetected||resizedAudit.fringeDetected,','logoAssetSource:"assets/sdz-logo-compositor.png",logoResampling:"lanczos3",logoAntialiasRatio:resizedAudit.semiAlphaRatio,logoDarkAntialiasRatio:resizedAudit.semiDarkRatio,logoAssetIntegrity:official.audit.integrity&&resizedAudit.integrity,logoFringeDetected:official.audit.fringeDetected||resizedAudit.fringeDetected,',1)
          p.write_text(s)
          p=Path('tests/v3-compositor-server-stability.test.js')
          s=p.read_text()
          s=s.replace('assert.equal(body.compositorVersion,"3.3.0-full-official-medallion")','assert.equal(body.compositorVersion,"3.4.0-high-quality-logo-resampling")',1)
          s=s.replace('assert.equal(m.logoFringeDetected,false);assert.equal(m.logoRectangleOpaque,false);assert.ok(m.logoMedallionWidthRatio>=BRAND_TOKENS.logoMinimumScale-.005&&m.logoMedallionWidthRatio<=.205);','assert.equal(m.logoFringeDetected,false);assert.equal(m.logoRectangleOpaque,false);assert.equal(m.logoResampling,"lanczos3");assert.ok(m.logoAntialiasRatio>0&&m.logoAntialiasRatio<.18);assert.ok(m.logoDarkAntialiasRatio<.08);assert.ok(m.logoMedallionWidthRatio>=BRAND_TOKENS.logoMinimumScale-.005&&m.logoMedallionWidthRatio<=.205);',1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm run verify
          npm audit --omit=dev --audit-level=high
          git diff --check
      - name: Commit and clean temporary workflow
        run: |
          git config user.name 'viewfinder-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-logo-resampling.yml
          git add netlify/functions/_shared/brand-compositor.js tests/v3-compositor-server-stability.test.js
          git commit -m 'Render official logo with high-quality antialiasing'
          git push origin HEAD:audit/finalize-viewfinder-v3
