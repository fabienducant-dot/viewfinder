name: Fix high-quality logo resampling

on:
  push:
    branches:
      - audit/finalize-viewfinder-v3
    paths:
      - .github/workflows/fix-logo-resampling.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/finalize-viewfinder-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Replace nearest-neighbour logo scaling with quality resampling
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('netlify/functions/_shared/brand-compositor.js')
          s=p.read_text()
          s=s.replace('const COMPOSITOR_VERSION="3.3.0-full-official-medallion";','const COMPOSITOR_VERSION="3.4.0-high-quality-logo-resampling";',1)

          old='''async function auditLogoTransparency(buffer){
 const {data,info}=await sharp(buffer,{failOn:"none"}).ensureAlpha().raw().toBuffer({resolveWithObject:true});
 if(!info.width||!info.height||info.channels<4)throw new Error("Actif logo statique invalide : raster RGBA requis.");
 let transparent=0,opaque=0,semiDark=0,darkOpaque=0,edgeOpaque=0;const total=info.width*info.height;
 for(let y=0;y<info.height;y++)for(let x=0;x<info.width;x++){
  const o=(y*info.width+x)*info.channels,a=data[o+3],max=Math.max(data[o],data[o+1],data[o+2]);
  if(a<=8)transparent++;if(a>=245){opaque++;if(max<75)darkOpaque++;}if(a>8&&a<245&&max<105)semiDark++;if((x===0||y===0||x===info.width-1||y===info.height-1)&&a>8)edgeOpaque++;
 }
 const transparentRatio=transparent/total,opaqueRatio=opaque/total,darkInteriorRatio=darkOpaque/Math.max(1,opaque),aspectRatio=info.width/info.height,fringeDetected=semiDark>0||edgeOpaque>0,integrity=transparentRatio>.20&&transparentRatio<.50&&opaqueRatio>.50&&opaqueRatio<.80&&darkInteriorRatio>.50&&aspectRatio>.86&&aspectRatio<.97&&!fringeDetected;
 return Object.freeze({width:info.width,height:info.height,aspectRatio,transparentRatio,opaqueRatio,darkInteriorRatio,semiDark,edgeOpaque,fringeDetected,integrity});
}'''
          new='''async function auditLogoTransparency(buffer,{allowAntialias=false}={}){
 const {data,info}=await sharp(buffer,{failOn:"none"}).ensureAlpha().raw().toBuffer({resolveWithObject:true});
 if(!info.width||!info.height||info.channels<4)throw new Error("Actif logo statique invalide : raster RGBA requis.");
 let transparent=0,opaque=0,semiAlpha=0,semiDark=0,darkOpaque=0,edgeOpaque=0;const total=info.width*info.height;
 for(let y=0;y<info.height;y++)for(let x=0;x<info.width;x++){
  const o=(y*info.width+x)*info.channels,a=data[o+3],max=Math.max(data[o],data[o+1],data[o+2]);
  if(a<=8)transparent++;
  if(a>=245){opaque++;if(max<75)darkOpaque++;}
  if(a>8&&a<245){semiAlpha++;if(max<105)semiDark++;}
  if((x===0||y===0||x===info.width-1||y===info.height-1)&&a>8)edgeOpaque++;
 }
 const transparentRatio=transparent/total,opaqueRatio=opaque/total,semiAlphaRatio=semiAlpha/total,semiDarkRatio=semiDark/total,darkInteriorRatio=darkOpaque/Math.max(1,opaque),aspectRatio=info.width/info.height;
 const fringeDetected=edgeOpaque>0||(allowAntialias?semiDarkRatio>.08:semiDark>0);
 const alphaQuality=allowAntialias?semiAlphaRatio<.18:semiAlpha===0;
 const integrity=transparentRatio>.18&&transparentRatio<.52&&opaqueRatio>.45&&opaqueRatio<.82&&darkInteriorRatio>.48&&aspectRatio>.86&&aspectRatio<.97&&alphaQuality&&!fringeDetected;
 return Object.freeze({width:info.width,height:info.height,aspectRatio,transparentRatio,opaqueRatio,semiAlpha,semiAlphaRatio,darkInteriorRatio,semiDark,semiDarkRatio,edgeOpaque,fringeDetected,integrity});
}'''
          assert old in s, 'audit function marker not found'
          s=s.replace(old,new,1)

          old='''/* Le master a un alpha binaire validé au build. Un redimensionnement interpolé recréait des pixels
    noirs semi-transparents — le voile constaté en production. Le noyau nearest conserve strictement
    l'alpha binaire et les noirs internes officiels. */
 const resizedLogo=await sharp(official.buffer,{failOn:"none"}).resize({width:logoWidth,withoutEnlargement:false,fit:"inside",kernel:sharp.kernel.nearest}).png({compressionLevel:9}).toBuffer(),resizedMeta=await sharp(resizedLogo).metadata(),finalLogoWidth=resizedMeta.width||logoWidth,finalLogoHeight=resizedMeta.height||logoHeight,resizedAudit=await auditLogoTransparency(resizedLogo);'''
          new='''/* Le master reste binaire au build, mais un downscale nearest-neighbour détruit les courbes et
    les détails fins du médaillon. Lanczos3 produit l'antialiasing nécessaire à une signature premium.
    L'audit distingue désormais cet antialiasing local et normal d'un vrai voile/halo étendu. */
 const resizedLogo=await sharp(official.buffer,{failOn:"none"}).resize({width:logoWidth,withoutEnlargement:false,fit:"inside",kernel:sharp.kernel.lanczos3}).png({compressionLevel:9}).toBuffer(),resizedMeta=await sharp(resizedLogo).metadata(),finalLogoWidth=resizedMeta.width||logoWidth,finalLogoHeight=resizedMeta.height||logoHeight,resizedAudit=await auditLogoTransparency(resizedLogo,{allowAntialias:true});'''
          assert old in s, 'nearest-neighbour resize marker not found'
          s=s.replace(old,new,1)

          marker='logoAssetSource:"assets/sdz-logo-compositor.png",logoAssetIntegrity:official.audit.integrity&&resizedAudit.integrity,logoFringeDetected:official.audit.fringeDetected||resizedAudit.fringeDetected,'
          repl='logoAssetSource:"assets/sdz-logo-compositor.png",logoResampling:"lanczos3",logoAntialiasRatio:resizedAudit.semiAlphaRatio,logoDarkAntialiasRatio:resizedAudit.semiDarkRatio,logoAssetIntegrity:official.audit.integrity&&resizedAudit.integrity,logoFringeDetected:official.audit.fringeDetected||resizedAudit.fringeDetected,'
          assert marker in s, 'manifest logo marker not found'
          s=s.replace(marker,repl,1)
          p.write_text(s)

          p=Path('tests/v3-compositor-server-stability.test.js')
          s=p.read_text()
          s=s.replace('assert.equal(body.compositorVersion,"3.3.0-full-official-medallion")','assert.equal(body.compositorVersion,"3.4.0-high-quality-logo-resampling")',1)
          old='''  assert.equal(m.logoFringeDetected,false);assert.equal(m.logoRectangleOpaque,false);assert.ok(m.logoMedallionWidthRatio>=BRAND_TOKENS.logoMinimumScale-.005&&m.logoMedallionWidthRatio<=.205);assert.ok(m.brandLockup.top>m.logoBounds.bottom);assert.ok(m.brandLockup.bottom<=m.height-m.brandLockup.minimumBottomMargin);'''
          new='''  assert.equal(m.logoFringeDetected,false);assert.equal(m.logoRectangleOpaque,false);assert.equal(m.logoResampling,"lanczos3");assert.ok(m.logoAntialiasRatio>0&&m.logoAntialiasRatio<.18,`antialias ${m.logoAntialiasRatio}`);assert.ok(m.logoDarkAntialiasRatio<.08,`dark antialias ${m.logoDarkAntialiasRatio}`);assert.ok(m.logoMedallionWidthRatio>=BRAND_TOKENS.logoMinimumScale-.005&&m.logoMedallionWidthRatio<=.205);assert.ok(m.brandLockup.top>m.logoBounds.bottom);assert.ok(m.brandLockup.bottom<=m.height-m.brandLockup.minimumBottomMargin);'''
          assert old in s, 'Story manifest assertion marker not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate full deterministic suite
        run: |
          npm run verify
          npm audit --omit=dev --audit-level=high
          git diff --check
      - name: Commit validated fix and remove this one-shot workflow
        run: |
          git config user.name 'viewfinder-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-logo-resampling.yml
          git add netlify/functions/_shared/brand-compositor.js tests/v3-compositor-server-stability.test.js
          git commit -m 'Render official logo with high-quality antialiasing'
          git push origin HEAD:audit/finalize-viewfinder-v3
