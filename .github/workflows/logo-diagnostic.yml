name: Logo diagnostic

on:
  push:
    branches:
      - audit/finalize-viewfinder-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build current compositor logo
        run: npm run build:logo
      - name: Fetch official logo currently stored by Viewfinder
        run: |
          mkdir -p artifacts/logo-diagnostic
          curl -fsSL --max-time 30 'https://deploy-preview-14--fascinating-kashata-73134d.netlify.app/logo.png' -o artifacts/logo-diagnostic/stored-official-logo.png
      - name: Generate diagnostic boards
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const sharp=require('sharp');
          (async()=>{
            fs.mkdirSync('artifacts/logo-diagnostic',{recursive:true});
            const src='icons/icon-512.png';
            const built='assets/sdz-logo-compositor.png';
            const stored='artifacts/logo-diagnostic/stored-official-logo.png';
            await fs.promises.copyFile(src,'artifacts/logo-diagnostic/source-icon-512.png');
            await fs.promises.copyFile(built,'artifacts/logo-diagnostic/built-logo.png');
            const meta=await sharp(built).metadata();
            const storedMeta=await sharp(stored).metadata();
            const makeBg=async(source,name,bg)=>{
              const canvas=await sharp({create:{width:900,height:900,channels:4,background:bg}})
                .composite([{input:await sharp(source).resize({width:600,height:600,fit:'inside',background:{r:0,g:0,b:0,alpha:0}}).png().toBuffer(),gravity:'centre'}])
                .png().toBuffer();
              fs.writeFileSync(`artifacts/logo-diagnostic/${name}.png`,canvas);
            };
            await makeBg(built,'built-on-white',{r:245,g:245,b:245,alpha:1});
            await makeBg(built,'built-on-midgray',{r:110,g:110,b:110,alpha:1});
            await makeBg(built,'built-on-black',{r:5,g:5,b:5,alpha:1});
            await makeBg(stored,'stored-on-white',{r:245,g:245,b:245,alpha:1});
            await makeBg(stored,'stored-on-midgray',{r:110,g:110,b:110,alpha:1});
            await makeBg(stored,'stored-on-black',{r:5,g:5,b:5,alpha:1});
            const analyze=async(file)=>{
              const {data,info}=await sharp(file).ensureAlpha().raw().toBuffer({resolveWithObject:true});
              let minX=info.width,minY=info.height,maxX=-1,maxY=-1,opaque=0,semi=0,transparent=0,edgeOpaque=0;
              for(let y=0;y<info.height;y++)for(let x=0;x<info.width;x++){
                const i=(y*info.width+x)*info.channels,a=data[i+3];
                if(a<=8)transparent++;
                if(a>8){opaque++;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
                if(a>8&&a<245)semi++;
                if((x===0||y===0||x===info.width-1||y===info.height-1)&&a>8)edgeOpaque++;
              }
              return {meta:await sharp(file).metadata(),bounds:maxX>=minX?{minX,minY,maxX,maxY,width:maxX-minX+1,height:maxY-minY+1}:null,opaque,semi,transparent,edgeOpaque};
            };
            fs.writeFileSync('artifacts/logo-diagnostic/report.json',JSON.stringify({sourceIcon:await analyze(src),built:await analyze(built),storedOfficial:await analyze(stored),builtMeta:meta,storedMeta},null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: logo-diagnostic
          path: artifacts/logo-diagnostic
