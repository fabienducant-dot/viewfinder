name: Materialize official SDZ logo

on:
  push:
    branches:
      - audit/finalize-viewfinder-v3

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'Materialize full official SDZ logo asset'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/finalize-viewfinder-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch full official master from Viewfinder storage
        run: |
          mkdir -p assets artifacts
          curl -fsSL --max-time 30 'https://deploy-preview-14--fascinating-kashata-73134d.netlify.app/logo.png' -o assets/sdz-logo-master.jpg
      - name: Build full medallion with transparent exterior and preserved black interior
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const sharp=require('sharp');
          (async()=>{
            const input='assets/sdz-logo-master.jpg';
            const output='assets/sdz-logo-compositor.png';
            const src=sharp(input,{failOn:'none'}).rotate();
            const {data,info}=await src.raw().toBuffer({resolveWithObject:true});
            if(info.width!==1024||info.height!==1536)throw new Error(`Master officiel inattendu: ${info.width}x${info.height}`);
            const w=info.width,h=info.height,c=info.channels;
            const alpha=Buffer.alloc(w*h,0);
            const insideCircle=(x,y)=>{const dx=x-508,dy=y-742;return dx*dx+dy*dy<=451*451;};
            const sign=(px,py,ax,ay,bx,by)=>(px-bx)*(ay-by)-(ax-bx)*(py-by);
            const insideTriangle=(x,y)=>{const a=[507,210],b=[670,415],d=[342,415];const s1=sign(x,y,...a,...b),s2=sign(x,y,...b,...d),s3=sign(x,y,...d,...a);const neg=s1<0||s2<0||s3<0,pos=s1>0||s2>0||s3>0;return !(neg&&pos);};
            const gold=new Uint8Array(w*h);
            for(let y=0;y<h;y++)for(let x=0;x<w;x++){
              const i=y*w+x,o=i*c,r=data[o],g=data[o+1],b=data[o+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),chroma=mx-mn;
              if((r>95&&g>55&&r>b*1.12&&g>b*1.02)||(mx>120&&chroma>30))gold[i]=1;
            }
            const expanded=new Uint8Array(gold);
            for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(gold[y*w+x])for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<w&&yy<h)expanded[yy*w+xx]=1;}
            let minX=w,minY=h,maxX=-1,maxY=-1;
            const rgba=Buffer.alloc(w*h*4);
            for(let y=0;y<h;y++)for(let x=0;x<w;x++){
              const i=y*w+x,o=i*c,p=i*4,keep=insideCircle(x,y)||insideTriangle(x,y)||expanded[i];
              rgba[p]=data[o];rgba[p+1]=data[o+1];rgba[p+2]=data[o+2];rgba[p+3]=keep?255:0;
              if(keep){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
            }
            const pad=16,left=Math.max(0,minX-pad),top=Math.max(0,minY-pad),right=Math.min(w-1,maxX+pad),bottom=Math.min(h-1,maxY+pad);
            const clean=await sharp(rgba,{raw:{width:w,height:h,channels:4}}).extract({left,top,width:right-left+1,height:bottom-top+1}).png({compressionLevel:9,adaptiveFiltering:true}).toBuffer();
            await sharp(clean).toFile(output);
            const {data:check,info:ci}=await sharp(clean).ensureAlpha().raw().toBuffer({resolveWithObject:true});
            let transparent=0,opaque=0,dark=0,semi=0,edgeOpaque=0;
            for(let y=0;y<ci.height;y++)for(let x=0;x<ci.width;x++){
              const o=(y*ci.width+x)*ci.channels,a=check[o+3],mx=Math.max(check[o],check[o+1],check[o+2]);
              if(a<=8)transparent++;if(a>=245){opaque++;if(mx<75)dark++;}if(a>8&&a<245)semi++;
              if((x===0||y===0||x===ci.width-1||y===ci.height-1)&&a>8)edgeOpaque++;
            }
            const total=ci.width*ci.height,darkRatio=dark/Math.max(1,opaque),transparentRatio=transparent/total;
            if(ci.width<850||ci.height<950)throw new Error(`Logo recadré ou incomplet: ${ci.width}x${ci.height}`);
            if(darkRatio<.55)throw new Error(`Noir intérieur officiel insuffisant: ${darkRatio}`);
            if(transparentRatio<.20)throw new Error(`Extérieur transparent insuffisant: ${transparentRatio}`);
            if(semi!==0||edgeOpaque!==0)throw new Error(`Alpha non déterministe: semi=${semi}, edge=${edgeOpaque}`);
            const center=((Math.floor(ci.height*.52)*ci.width)+Math.floor(ci.width*.50))*ci.channels;
            if(check[center+3]<245)throw new Error('Centre du médaillon devenu transparent');
            const checker=await sharp({create:{width:ci.width,height:ci.height,channels:4,background:'#d0d0d0'}}).composite([{input:Buffer.from(`<svg width="${ci.width}" height="${ci.height}" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="c" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#d8d8d8"/><rect width="16" height="16" fill="#8b8b8b"/><rect x="16" y="16" width="16" height="16" fill="#8b8b8b"/></pattern></defs><rect width="100%" height="100%" fill="url(#c)"/></svg>`)},{input:clean}]).png().toBuffer();
            fs.writeFileSync('artifacts/sdz-logo-compositor-checkerboard.png',checker);
            console.log(JSON.stringify({width:ci.width,height:ci.height,darkRatio,transparentRatio,semi,edgeOpaque},null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit the actual full official logo assets
        run: |
          git config user.name 'viewfinder-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-official-logo.yml
          git add assets/sdz-logo-master.jpg assets/sdz-logo-compositor.png artifacts/sdz-logo-compositor-checkerboard.png
          git commit -m 'Commit full official SDZ logo master and compositor asset'
          git push origin HEAD:audit/finalize-viewfinder-v3
