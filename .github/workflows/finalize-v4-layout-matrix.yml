name: Finalize V4 layout matrix

on:
  push:
    branches:
      - audit/finalize-viewfinder-v3
    paths:
      - .github/workflows/finalize-v4-layout-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/finalize-viewfinder-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-v4-typography.cjs
      - name: Diagnose long-copy layout on all formats
        run: |
          node - <<'NODE'
          const sharp=require('sharp');
          const {PLATFORM_TEMPLATES}=require('./netlify/functions/_shared/v3-layout-engine');
          const {composeBrandPoster}=require('./netlify/functions/_shared/brand-compositor');
          (async()=>{
            const source=await sharp({create:{width:1024,height:1024,channels:4,background:{r:18,g:18,b:18,alpha:1}}}).png().toBuffer();
            const subtitle='BESOIN DE SOUFFLER, DE DÉCHARGER LES TENSIONS MENTALES ET PHYSIQUES, DE RETROUVER DE L’ESPACE ET DE LA LÉGÈRETÉ';
            let failed=0;
            for(const platform of Object.keys(PLATFORM_TEMPLATES)){
              try{
                const output=await composeBrandPoster({imageBuffer:source,platform,posterStrategy:{textMode:platform==='Google Business'?'TEXT_MODE_MINIMAL':'TEXT_MODE_EDITORIAL',title:'RÉFLEXOLOGIE PLANTAIRE THAÏLANDAISE',subtitle:platform==='Google Business'?'':subtitle,logoScale:'prominent'}});
                const m=output.compositionManifest;
                console.log('OK',platform,{logo:m.logoWidthRatio,title:m.titleLines,subtitle:m.subtitleLines,titleSize:m.titleSize,subtitleSize:m.subtitleSize,safeWidth:m.safeWidth,safeHeight:m.safeHeight,usedHeight:m.usedHeight});
              }catch(e){failed++;console.error('FAIL',platform,e.message);}
            }
            if(failed)process.exit(1);
          })();
          NODE
# diagnostic 1
