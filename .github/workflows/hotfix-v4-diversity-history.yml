name: Hotfix V4 diversity history

on:
  push:
    branches:
      - audit/finalize-viewfinder-v3
    paths:
      - .github/workflows/hotfix-v4-diversity-history.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/finalize-viewfinder-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Persist attempted worlds and recover recent V4 history
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='async function prepareAuthoritativeV3(inputs){'
          helper=r'''function v4ArtHistory(){
  const candidates=[];
  const add=fp=>{ if(fp&&typeof fp==="object") candidates.push(fp); };
  for(const entry of (state.imageHistory||[])) add(entry&&entry.artFingerprint);
  for(const img of (state.images||[])){
    if(img&&img.artFingerprint){ add(img.artFingerprint); continue; }
    const plan=img&&img.v3Plan, selection=plan&&plan.artSelection, art=plan&&plan.artDirection;
    if(!selection||!art) continue;
    add({
      createdAt:Number(img.createdAt)||0,status:"legacy-recovered",service:plan.contract&&plan.contract.name,
      platform:art.platform,creativeSeed:art.creativeSeed||selection.creativeSeed||null,
      artWorld:selection.artWorldFamily,artWorldFamily:selection.artWorldFamily,sceneKey:selection.sceneKey,
      locationFamily:selection.locationFamily,narrativeSignature:selection.narrativeVariant,
      architectureType:selection.architectureDescription,lightType:selection.lightingNarrative,
      cameraAngle:art.cameraAngle||selection.cameraAngle,cameraHeight:art.cameraHeight||selection.cameraHeight,
      cameraDistance:art.cameraDistance||selection.cameraDistance,focalLength:art.focalLength||selection.focalLength,
      composition:selection.cinematicTreatment
    });
  }
  const seen=new Set(),deduped=[];
  for(const fp of candidates){
    const key=String(fp.fingerprint||[fp.sceneKey,fp.locationFamily,fp.narrativeSignature,fp.cameraAngle,fp.focalLength].filter(Boolean).join("|"));
    if(!key||seen.has(key)) continue;
    seen.add(key);deduped.push(fp);
  }
  return deduped.slice(-12);
}
function rememberV4ArtAttempt(plan,clientRequestId){
  if(!plan||!plan.artSelection||!plan.artDirection||!clientRequestId)return;
  const attemptKey=`v4-attempt:${clientRequestId}`;
  if((state.imageHistory||[]).some(entry=>entry&&entry.v4AttemptKey===attemptKey))return;
  const selection=plan.artSelection,art=plan.artDirection;
  const artFingerprint={createdAt:Date.now(),status:"attempted",service:plan.contract&&plan.contract.name,platform:art.platform,
    creativeSeed:art.creativeSeed||selection.creativeSeed||null,artWorld:selection.artWorldFamily,artWorldFamily:selection.artWorldFamily,
    sceneKey:selection.sceneKey,locationFamily:selection.locationFamily,narrativeSignature:selection.narrativeVariant,
    architectureType:selection.architectureDescription,primarySymbol:selection.symbolicAmplifiers&&selection.symbolicAmplifiers[0],
    secondarySymbol:selection.symbolicAmplifiers&&selection.symbolicAmplifiers[1],dominantMaterial:(selection.dominantMaterials||[]).join(", "),
    lightType:selection.lightingNarrative,cameraAngle:art.cameraAngle||selection.cameraAngle,cameraHeight:art.cameraHeight||selection.cameraHeight,
    cameraDistance:art.cameraDistance||selection.cameraDistance,focalLength:art.focalLength||selection.focalLength,
    composition:selection.cinematicTreatment,depth:selection.spatialDepth,narrativeSignature:selection.narrativeVariant};
  state.imageHistory.push({id:uid(),createdAt:Date.now(),platform:art.platform,mission:art.marketingObjective||null,
    prestation:plan.contract&&plan.contract.name,topic:plan.subjectBrief&&plan.subjectBrief.rawSubject||"",imageId:null,
    promptImage:plan.photoBrief&&plan.photoBrief.prompt||"",attemptOnly:true,v4AttemptKey:attemptKey,artFingerprint});
  if(state.imageHistory.length>80)state.imageHistory=state.imageHistory.slice(-80);
  LS.set("vf-image-history",state.imageHistory);
}

'''+marker
          if marker not in s: raise SystemExit('prepareAuthoritativeV3 marker missing')
          s=s.replace(marker,helper,1)
          old='artHistory:(state.imageHistory||[]).map(x=>x.artFingerprint).filter(Boolean).slice(-10)'
          count=s.count(old)
          if count<2: raise SystemExit(f'expected >=2 old artHistory paths, found {count}')
          s=s.replace(old,'artHistory:v4ArtHistory()')
          call_marker='  while(true){\n    try{\n      const genResult = await callProviderImage('
          replacement='  rememberV4ArtAttempt(prepared.v3Plan,prepared.clientRequestId);\n  while(true){\n    try{\n      const genResult = await callProviderImage('
          if call_marker not in s: raise SystemExit('provider call marker missing')
          s=s.replace(call_marker,replacement,1)
          p.write_text(s)

          t=Path('tests/v4-visual-diversity.test.js')
          ts=t.read_text()
          old_test='''test("l\'historique réel de l\'application utilise un seed neuf par création puis mémorise l\'empreinte artistique",()=>{\n  const html=fs.readFileSync(path.join(__dirname,"../index.html"),"utf8");\n  assert.match(html,/artHistory:\\(state\\.imageHistory\\|\\|\\[\\]\\)\\.map\\(x=>x\\.artFingerprint\\)\\.filter\\(Boolean\\)\\.slice\\(-10\\)/);\n  assert.match(html,/creativeSeed:`\\$\\{prestation\\}-\\$\\{topic\\}-\\$\\{Date\\.now\\(\\)\\}`/);\n  assert.match(html,/historyEntry\\.artFingerprint=flow\\.artFingerprint\\|\\|null/);\n});'''
          new_test='''test("l\'historique réel inclut aussi les tentatives refusées et récupère les plans V4 récents",()=>{\n  const html=fs.readFileSync(path.join(__dirname,"../index.html"),"utf8");\n  assert.match(html,/function v4ArtHistory\\(\\)/);\n  assert.match(html,/for\\(const img of \\(state\\.images\\|\\|\\[\\]\\)\\)/);\n  assert.match(html,/rememberV4ArtAttempt\\(prepared\\.v3Plan,prepared\\.clientRequestId\\)/);\n  assert.match(html,/artHistory:v4ArtHistory\\(\\)/);\n  assert.doesNotMatch(html,/artHistory:\\(state\\.imageHistory\\|\\|\\[\\]\\)\\.map\\(x=>x\\.artFingerprint\\)/);\n  assert.match(html,/creativeSeed:`\\$\\{prestation\\}-\\$\\{topic\\}-\\$\\{Date\\.now\\(\\)\\}`/);\n  assert.match(html,/historyEntry\\.artFingerprint=flow\\.artFingerprint\\|\\|null/);\n});'''
          if old_test not in ts: raise SystemExit('old diversity history test marker missing')
          t.write_text(ts.replace(old_test,new_test,1))
          PY
      - name: Targeted diversity regression
        run: node --test tests/v4-visual-diversity.test.js tests/v4-server-brand-authority.test.js tests/v3-pipeline.test.js
      - name: Full deterministic verification
        run: npm run verify
      - name: Syntax checks
        run: |
          node scripts/verify-index-integrity.js
          git diff --check
      - name: Commit validated diversity history fix
        run: |
          git config user.name viewfinder-ci
          git config user.email actions@users.noreply.github.com
          git add index.html tests/v4-visual-diversity.test.js
          git commit -m "Remember V4 art attempts to prevent repeated worlds"
          git push origin HEAD:audit/finalize-viewfinder-v3
