name: Finalize V4 visual diversity

on:
  push:
    branches:
      - audit/finalize-viewfinder-v3
    paths:
      - .github/workflows/finalize-v4-diversity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/finalize-viewfinder-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-v4-diversity-final.cjs
      - name: Prevent exact-request duplication and align diversified Gold regression
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('netlify/functions/_shared/v3-scene-intent.js')
          s=p.read_text()
          s=s.replace('function visualVariationDirective(artDirection={}){','function visualVariationDirective(artDirection={},exactUserRequest=""){',1)
          s=s.replace(' const art=artDirection?.artistic||{};\n const axes=[',' const art=artDirection?.artistic||{},exact=normalized(exactUserRequest);\n const axes=[',1)
          s=s.replace(' ].filter(Boolean);\n const continuity=art.campaignContinuity?', ' ].filter(value=>value&&(!exact||!normalized(value).includes(exact)));\n const continuity=art.campaignContinuity?',1)
          s=s.replace('variation=visualVariationDirective(artDirection);','variation=visualVariationDirective(artDirection,exact);',1)
          p.write_text(s)

          p=Path('tests/v3-pipeline.test.js')
          s=p.read_text()
          s=s.replace(',/pierre architecturale.*roche naturelle.*obsidienne/i','',1)
          marker='])assert.match(photo.prompt,pattern);assert.doesNotMatch(photo.prompt,/Nombre obligatoire de personnes\\s*:\\s*2/i);});'
          replacement='])assert.match(photo.prompt,pattern);for(const material of art.artistic.dominantMaterials)assert.ok(photo.prompt.includes(material),`matière sélectionnée absente: ${material}`);assert.doesNotMatch(photo.prompt,/Nombre obligatoire de personnes\\s*:\\s*2/i);});'
          if marker not in s: raise SystemExit('Gold regression marker missing')
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
      - name: Validate diversity and SceneIntent propagation
        run: node --test tests/v4-visual-diversity.test.js tests/v4-scene-intent.test.js tests/v3-stabilization.test.js tests/v3-menu-coverage.test.js tests/v3-pipeline.test.js
      - name: Full deterministic verification
        run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: node --check netlify/functions/_shared/v3-art-worlds.js
      - run: node --check netlify/functions/_shared/v3-art-direction.js
      - run: node --check netlify/functions/_shared/v3-scene-intent.js
      - run: node --check netlify/functions/_shared/v3-pipeline.js
      - run: git diff --check
      - name: Commit validated visual diversity engine
        run: |
          git config user.name viewfinder-ci
          git config user.email actions@users.noreply.github.com
          git add netlify/functions/_shared/v3-art-worlds.js netlify/functions/_shared/v3-art-direction.js netlify/functions/_shared/v3-scene-intent.js netlify/functions/_shared/v3-pipeline.js tests/v3-stabilization.test.js tests/v4-visual-diversity.test.js tests/v3-pipeline.test.js
          if git diff --cached --quiet; then
            echo 'No staged diversity changes to commit.'
          else
            git commit -m "Enforce campaign-aware visual diversity in SceneIntent V4"
            git push origin HEAD:audit/finalize-viewfinder-v3
          fi
# final hardened retry
