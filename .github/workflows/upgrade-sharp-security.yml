name: Upgrade Sharp security

on:
  push:
    branches:
      - audit/finalize-viewfinder-v3
    paths:
      - .github/workflows/upgrade-sharp-security.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: contains(github.event.head_commit.message, 'Add Sharp security upgrade helper')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/finalize-viewfinder-v3

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore locked dependencies
        run: npm ci

      - name: Upgrade Sharp explicitly
        run: npm install sharp@0.35.4 --save-exact

      - name: Verify production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Run full deterministic verification
        run: npm run verify

      - name: Commit audited dependency upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "Upgrade Sharp to 0.35.4 for libvips security fixes"
            git push origin HEAD:audit/finalize-viewfinder-v3
          fi
