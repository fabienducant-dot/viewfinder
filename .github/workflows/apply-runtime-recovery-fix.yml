name: Apply runtime recovery fix

on:
  push:
    branches:
      - audit/finalize-viewfinder-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/finalize-viewfinder-v3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fix bundled logo path
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='netlify/functions/_shared/brand-compositor.js';
          let s=fs.readFileSync(file,'utf8');
          const old='const OFFICIAL_LOGO_PATH=path.resolve(__dirname,"../../../assets/sdz-logo-compositor.png");';
          const replacement=`const OFFICIAL_LOGO_CANDIDATES=Object.freeze([\n process.env.LAMBDA_TASK_ROOT&&path.join(process.env.LAMBDA_TASK_ROOT,"assets/sdz-logo-compositor.png"),\n path.join(process.cwd(),"assets/sdz-logo-compositor.png"),\n path.resolve(__dirname,"../../assets/sdz-logo-compositor.png"),\n path.resolve(__dirname,"../../../assets/sdz-logo-compositor.png"),\n].filter(Boolean));\nconst OFFICIAL_LOGO_PATH=OFFICIAL_LOGO_CANDIDATES.find(candidate=>{try{return fs.existsSync(candidate);}catch(error){return false;}})||OFFICIAL_LOGO_CANDIDATES[0];`;
          if(!s.includes(old))throw new Error('OFFICIAL_LOGO_PATH marker missing');
          s=s.replace(old,replacement);
          fs.writeFileSync(file,s);
          NODE

      - name: Validate deterministic suite
        run: |
          npm run verify
          node --check netlify/functions/_shared/brand-compositor.js
          git diff --check

      - name: Commit validated runtime fix
        run: |
          git config user.name 'viewfinder-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-runtime-recovery-fix.yml
          git add netlify/functions/_shared/brand-compositor.js
          git commit -m 'Fix bundled SDZ logo path on Netlify runtime'
          git push origin HEAD:audit/finalize-viewfinder-v3
