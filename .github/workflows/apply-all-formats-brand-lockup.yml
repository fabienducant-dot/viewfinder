name: Apply premium SDZ lockup to all formats except Google

on:
  push:
    branches:
      - codex/stabiliser-le-compositor-sharp
    paths:
      - .github/workflows/apply-all-formats-brand-lockup.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V3 compositor branch
        uses: actions/checkout@v4
        with:
          ref: codex/stabiliser-le-compositor-sharp
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Extend premium lockup to every non-Google format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('netlify/functions/_shared/brand-compositor.js')
          s = p.read_text()

          s = s.replace(
              'const COMPOSITOR_VERSION="2.2.2-precise-emblem-silhouette";',
              'const COMPOSITOR_VERSION="2.3.0-premium-lockup-all-non-google";'
          )

          old = 'function targetStoryLogoWidth(width){return Math.round(Number(width)*.33);}'
          new = '''const PREMIUM_LOCKUP_BY_PLATFORM=Object.freeze({
            "Instagram Square":Object.freeze({family:"premium-square",textTop:.38,textBottom:.62,logoLeft:.25,logoRight:.75,logoWidthRatio:.26,brandSize:38,citySize:22}),
            "Instagram Portrait":Object.freeze({family:"premium-portrait",textTop:.40,textBottom:.64,logoLeft:.22,logoRight:.78,logoWidthRatio:.26,brandSize:42,citySize:24}),
            Facebook:Object.freeze({family:"premium-social",textTop:.40,textBottom:.64,logoLeft:.23,logoRight:.77,logoWidthRatio:.26,brandSize:42,citySize:24}),
            Story:Object.freeze({family:"premium-story",textTop:.60,textBottom:.70,logoLeft:.18,logoRight:.82,logoWidthRatio:.33,brandSize:50,citySize:30}),
            Blog:Object.freeze({family:"premium-editorial",textTop:.35,textBottom:.60,logoLeft:.34,logoRight:.66,logoWidthRatio:.13,brandSize:32,citySize:18}),
            "Bannière":Object.freeze({family:"premium-banner",textTop:.10,textBottom:.50,logoLeft:.40,logoRight:.60,logoWidthRatio:.10,brandSize:24,citySize:14}),
          });
          function premiumBrandLockupFor(platform){
            const normalized=normalizePlatform(platform);
            return normalized==="Google Business"?null:(PREMIUM_LOCKUP_BY_PLATFORM[normalized]||null);
          }
          function targetPremiumLogoWidth(width,lockup){return Math.round(Number(width)*Number(lockup?.logoWidthRatio||0));}
          function targetStoryLogoWidth(width){return targetPremiumLogoWidth(width,PREMIUM_LOCKUP_BY_PLATFORM.Story);}'''
          if old not in s:
              raise SystemExit('targetStoryLogoWidth marker not found')
          s = s.replace(old, new)

          old = '    const logoSafe=posterStrategy?.logoSafeArea;\n    const x=textSafe?Math.max(margin,Math.round(width*textSafe.left)):Math.max(margin,Math.round(width*spec.x));'
          new = '    const logoSafe=posterStrategy?.logoSafeArea;\n    const premiumLockup=premiumBrandLockupFor(normalized);\n    const x=textSafe?Math.max(margin,Math.round(width*textSafe.left)):Math.max(margin,Math.round(width*spec.x));'
          if old not in s:
              raise SystemExit('layout premium marker not found')
          s = s.replace(old, new)

          old = '    if(normalized==="Story"){\n      if(!textSafe)y=Math.round(height*.60);\n      textBottom=Math.min(textBottom,Math.round(height*.70));\n    }'
          new = '    if(premiumLockup){\n      y=Math.max(margin,Math.round(height*premiumLockup.textTop));\n      textBottom=Math.min(height-margin,Math.round(height*premiumLockup.textBottom));\n    }'
          if old not in s:
              raise SystemExit('Story text-zone marker not found')
          s = s.replace(old, new)

          old = '    if(normalized==="Story"){\n      logoArea.left=Math.round(width*.18);logoArea.right=Math.round(width*.82);\n      logoArea.top=textBottom+Math.round(height*.006);\n      logoArea.bottom=Math.min(height-margin,height-Math.max(24,Math.round(height*.035)));\n    }'
          new = '    if(premiumLockup){\n      logoArea.left=Math.round(width*premiumLockup.logoLeft);logoArea.right=Math.round(width*premiumLockup.logoRight);\n      logoArea.top=textBottom+Math.round(height*.006);\n      logoArea.bottom=Math.min(height-margin,height-Math.max(24,Math.round(height*.035)));\n    }'
          if old not in s:
              raise SystemExit('Story logo-zone marker not found')
          s = s.replace(old, new)

          marker = 'async function composeBrandPoster('
          if marker not in s:
              raise SystemExit('composeBrandPoster marker not found')
          head, tail = s.split(marker, 1)
          old = '  const story=normalizePlatform(platform)==="Story";\n  const scale = Math.max(0.78, Math.min(1.55, width / 1088));'
          new = '  const normalizedPlatform=normalizePlatform(platform);\n  const story=normalizedPlatform==="Story";\n  const premiumLockup=premiumBrandLockupFor(normalizedPlatform);\n  const scale = Math.max(0.78, Math.min(1.55, width / 1088));'
          if old not in tail:
              raise SystemExit('compose platform marker not found')
          tail = tail.replace(old, new, 1)
          s = head + marker + tail

          old = '  const desiredLogoWidth=story?targetStoryLogoWidth(width):Math.round(logoAreaWidth*logoFraction/.21);\n  const brandSize=Math.round((story?50:(layout.portrait?29:27))*scale);\n  const citySize=Math.round((story?30:15)*scale);'
          new = '  const desiredLogoWidth=premiumLockup?targetPremiumLogoWidth(width,premiumLockup):Math.round(logoAreaWidth*logoFraction/.21);\n  const brandSize=Math.round((premiumLockup?premiumLockup.brandSize:(layout.portrait?29:27))*scale);\n  const citySize=Math.round((premiumLockup?premiumLockup.citySize:15)*scale);'
          if old not in s:
              raise SystemExit('logo sizing marker not found')
          s = s.replace(old, new)

          old = '    version:COMPOSITOR_VERSION,\n    platform:normalizePlatform(platform),'
          new = '    version:COMPOSITOR_VERSION,\n    platform:normalizedPlatform,\n    premiumBrandLockup:Boolean(premiumLockup),\n    premiumBrandLockupFamily:premiumLockup?.family||"google-legacy",'
          if old not in s:
              raise SystemExit('manifest platform marker not found')
          s = s.replace(old, new)

          old = 'module.exports = { BRAND_TOKENS, COMPOSITOR_VERSION, FONT_PATHS,'
          new = 'module.exports = { BRAND_TOKENS, COMPOSITOR_VERSION, FONT_PATHS, PREMIUM_LOCKUP_BY_PLATFORM, premiumBrandLockupFor, targetPremiumLogoWidth,'
          if old not in s:
              raise SystemExit('exports marker not found')
          s = s.replace(old, new)

          p.write_text(s)

          test_file = Path('tests/v3-compositor-server-stability.test.js')
          test_file.write_text(test_file.read_text().replace(
              '2.2.2-precise-emblem-silhouette',
              '2.3.0-premium-lockup-all-non-google'
          ))
          PY

      - name: Run targeted compositor and platform regression tests
        run: node --test tests/v3-compositor-server-stability.test.js tests/v3-golden-target.test.js tests/v3-pipeline.test.js tests/v3-product-stability.test.js tests/v3-stabilization.test.js

      - name: Validate format coverage explicitly
        shell: bash
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {premiumBrandLockupFor,targetPremiumLogoWidth,targetStoryLogoWidth}=require('./netlify/functions/_shared/brand-compositor');
          const expected={
            'Instagram Square':.26,
            'Instagram Portrait':.26,
            Facebook:.26,
            Story:.33,
            Blog:.13,
            'Bannière':.10,
          };
          for(const [platform,ratio] of Object.entries(expected)){
            const lockup=premiumBrandLockupFor(platform);
            assert.ok(lockup,platform);
            assert.equal(lockup.logoWidthRatio,ratio,platform);
            assert.ok(lockup.textTop<lockup.textBottom,platform);
            assert.ok(lockup.logoLeft<lockup.logoRight,platform);
            assert.equal(targetPremiumLogoWidth(1000,lockup),Math.round(1000*ratio),platform);
          }
          assert.equal(targetStoryLogoWidth(1000),330);
          assert.equal(premiumBrandLockupFor('Instagram').family,'premium-portrait');
          assert.equal(premiumBrandLockupFor('Article Blog Wix').family,'premium-editorial');
          assert.equal(premiumBrandLockupFor('Google Business'),null);
          console.log('Premium lockup coverage OK; Google Business excluded.');
          NODE

      - name: Verify no dependency drift or secrets
        shell: bash
        run: |
          git diff --check
          if ! git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files changed unexpectedly" >&2
            exit 1
          fi
          if git grep -I -n -E '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|PRIVATE KEY)' -- ':!package-lock.json'; then
            echo "Potential secret detected" >&2
            exit 1
          fi

      - name: Commit validated non-Google format rollout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/_shared/brand-compositor.js tests/v3-compositor-server-stability.test.js
          git commit -m "Apply premium SDZ lockup to all formats except Google"
          git push origin HEAD:codex/stabiliser-le-compositor-sharp
